<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<link href="/styles.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script type="module">
  (async () => {
    try {
      const React = (await import('https://esm.sh/react@19.2.3')).default;
      const { createRoot } = await import('https://esm.sh/react-dom@19.2.3/client');
      const { File: PierreFile, MultiFileDiff, PatchDiff } = await import('https://esm.sh/@pierre/diffs@1.0.8/react?deps=react@19.2.3,react-dom@19.2.3');
      window.pierreDiff = {
        h: React.createElement,
        render(el, props) {
          if (!el.__pierreRoot) el.__pierreRoot = createRoot(el);
          el.__pierreRoot.render(React.createElement(MultiFileDiff, props));
        },
        renderFile(el, props) {
          if (!el.__pierreRoot) el.__pierreRoot = createRoot(el);
          el.__pierreRoot.render(React.createElement(PierreFile, props));
        },
        renderPatch(el, props) {
          if (!el.__pierreRoot) el.__pierreRoot = createRoot(el);
          const { patches, patch, ...rest } = props;
          const items = Array.isArray(patches) && patches.length ? patches : patch ? [patch] : [];
          el.__pierreRoot.render(React.createElement(
            React.Fragment,
            null,
            items.map((item, index) => React.createElement(PatchDiff, { ...rest, patch: item, key: `${index}-${item.length}` })),
          ));
        },
        unmount(el) {
          if (el.__pierreRoot) {
            el.__pierreRoot.unmount();
            el.__pierreRoot = null;
          }
        },
      };
      window.dispatchEvent(new Event('pierre-diff-ready'));
    } catch (e) {
      window.pierreDiffError = e;
      console.warn('Pierre diff viewer unavailable; falling back to patch view.', e);
    }
  })();
</script>
</head>
<body>
<div class="app">
  <div class="topbar" data-tauri-drag-region>
    <button class="brand" id="brand" type="button">
      <span>rlm-wiki</span><span class="brand-dot">·</span><span id="brand-sub">github repository wikis, generated by agents</span>
    </button>

      <!-- Execution settings panel still exists in JS; top nav entry is hidden until the surface is useful again. -->
      <button class="topbar-link topbar-button" id="execution-settings-btn" type="button" hidden>Execution</button>
      <button class="topbar-link topbar-button" id="provider-keys-btn" type="button">Keys</button>
      <div class="topbar-model-control" id="topbar-model-control">
        <button class="topbar-runtime" id="topbar-model-trigger" type="button" aria-label="Switch model" aria-haspopup="listbox" aria-expanded="false">
          <span class="topbar-runtime-dot" aria-hidden="true"></span>
          <span id="topbar-status">idle</span>
          <span class="topbar-runtime-sep">·</span>
          <span id="topbar-model">model</span>
          <span class="topbar-runtime-chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="channel-menu topbar-model-menu" id="topbar-model-menu" role="listbox" aria-label="Global model"></div>
      </div>
    </div>
  </div>
  <div id="view-root"></div>
</div>

<script>
  // ── marked + mermaid setup ─────────────────────────────────
  const BEAUTIFUL_MERMAID_URL = 'https://esm.sh/beautiful-mermaid@1.1.3/es2022/beautiful-mermaid.bundle.mjs';
  let beautifulMermaidPromise = null;

  function loadBeautifulMermaid() {
    if (!beautifulMermaidPromise) {
      beautifulMermaidPromise = import(BEAUTIFUL_MERMAID_URL)
        .then((mod) => {
          const api = mod?.renderMermaidSVG ? mod : mod?.default;
          window.beautifulMermaid = api;
          return api;
        })
        .catch((error) => {
          console.warn('beautiful-mermaid unavailable; falling back to mermaid.js.', error);
          return null;
        });
    }
    return beautifulMermaidPromise;
  }

  const BEAUTIFUL_MERMAID_ZINC_DARK = {
    bg: '#18181B',
    fg: '#FAFAFA',
    transparent: true,
  };

  mermaid.initialize({ startOnLoad: false, theme: 'dark', themeVariables: {
    darkMode: true,
    background: '#0d0d0d',
    primaryColor: '#1a1a1a',
    primaryTextColor: '#ededed',
    primaryBorderColor: '#2a2a2a',
    lineColor: '#555',
    secondaryColor: '#111',
    tertiaryColor: '#0a0a0a',
  }});
  marked.setOptions({ gfm: true, breaks: false });

  // Detect mermaid diagrams even when the LLM forgot the `mermaid` lang tag.
  const MERMAID_KEYWORDS = /^\s*(graph|flowchart|sequenceDiagram|classDiagram|stateDiagram(?:-v2)?|erDiagram|journey|gantt|pie|gitGraph|mindmap|timeline|quadrantChart|requirementDiagram|C4Context|C4Container|C4Component|C4Dynamic|C4Deployment)\b/;

  function looksLikeMermaid(lang, text) {
    if (!text) return false;
    const l = (lang || '').toLowerCase().trim();
    if (l === 'mermaid' || l === 'mmd') return true;
    if (l && l !== '') return false;   // other languages: not mermaid
    return MERMAID_KEYWORDS.test(text);
  }

  function collectMermaidNodes(target) {
    if (!target) return [];
    if (target.nodeType === 1 && target.matches?.('.mermaid')) return [target];
    if (target.nodeType === 1) return Array.from(target.querySelectorAll('.mermaid'));
    return Array.from(target).filter(Boolean);
  }

  function getMermaidSource(node) {
    const encoded = node.dataset?.mermaidSource;
    if (encoded) {
      try {
        return decodeURIComponent(encoded);
      } catch {
        return encoded;
      }
    }
    return node.textContent || '';
  }

  async function renderMermaidDiagrams(target, options = {}) {
    const nodes = collectMermaidNodes(target);
    if (!nodes.length) {
      options.afterRender?.();
      return;
    }

    const mod = await loadBeautifulMermaid();
    const fallbackNodes = [];

    if (mod?.renderMermaidSVG) {
      const baseTheme = mod.THEMES?.['zinc-dark'] || BEAUTIFUL_MERMAID_ZINC_DARK;
      const theme = { ...baseTheme, ...BEAUTIFUL_MERMAID_ZINC_DARK };
      for (const node of nodes) {
        const source = getMermaidSource(node);
        if (!source.trim()) continue;
        try {
          const svg = mod.renderMermaidSVG(source, theme);
          node.innerHTML = svg;
          node.dataset.mermaidRenderer = 'beautiful-mermaid';
          node.classList.add('beautiful-mermaid');
        } catch (error) {
          node.textContent = source;
          fallbackNodes.push(node);
        }
      }
    } else {
      fallbackNodes.push(...nodes);
    }

    if (fallbackNodes.length) {
      try {
        await Promise.resolve(mermaid.run({ nodes: fallbackNodes }));
      } catch (error) {
        console.warn('mermaid render failed:', error);
      }
    }

    options.afterRender?.();
  }

  const renderer = new marked.Renderer();
  const origCode = renderer.code.bind(renderer);
  // marked v12+ passes a token object; older versions pass (code, lang). Handle both.
  renderer.code = function (codeOrToken, lang) {
    const text = typeof codeOrToken === 'object' && codeOrToken !== null
      ? (codeOrToken.text ?? '')
      : codeOrToken;
    const language = typeof codeOrToken === 'object' && codeOrToken !== null
      ? (codeOrToken.lang ?? '')
      : (lang ?? '');
    if (looksLikeMermaid(language, text)) {
      return `<div class="mermaid" data-mermaid-source="${encodeURIComponent(text)}">${escapeHtml(text)}</div>`;
    }
    return origCode.call(renderer, codeOrToken, lang);
  };
  marked.use({ renderer });

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function folderOpenIcon() {
    return `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h4l2 2h7A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z"></path>
        <path d="M3 10h18"></path>
      </svg>
    `;
  }

  function pencilIcon() {
    return `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 20h9"></path>
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"></path>
      </svg>
    `;
  }

  function localRepoPathAvailable() {
    const host = window.location.hostname;
    return window.__RLM_DESKTOP__?.enabled === true
      || host === 'localhost'
      || host === '127.0.0.1'
      || host === '::1';
  }

  function splitLocalPathRefInput(value) {
    const trimmed = String(value || '').trim();
    const marker = trimmed.lastIndexOf('#');
    if (marker > 0 && marker < trimmed.length - 1) {
      return {
        path: trimmed.slice(0, marker).trim(),
        branch: trimmed.slice(marker + 1).trim() || null,
      };
    }
    return { path: trimmed, branch: null };
  }

  function looksLikeExplicitLocalPath(path) {
    return path.startsWith('/') ||
      path.startsWith('~') ||
      path.startsWith('./') ||
      path.startsWith('../') ||
      path.toLowerCase().startsWith('file://') ||
      /^[A-Za-z]:[\\/]/.test(path);
  }

  function looksLikeRelativeLocalPath(path) {
    return path.includes('/') || path.includes('\\');
  }

  function parseLocalRepoInput(input, options = {}) {
    const trimmed = (input || '').trim().replace(/\/$/, '');
    if (!trimmed || !localRepoPathAvailable()) return null;
    const parsed = splitLocalPathRefInput(trimmed);
    const rawPath = parsed.path;
    const path = rawPath.replace(/^file:\/\//i, '');
    if (!looksLikeExplicitLocalPath(rawPath) && !(options.preferLocal && looksLikeRelativeLocalPath(path))) {
      return null;
    }
    const repo = path.split(/[\\/]+/).filter(Boolean).pop() || 'repo';
    const inputForServer = looksLikeExplicitLocalPath(rawPath) ? trimmed : `file://${trimmed}`;
    return {
      owner: 'local',
      repo,
      url: path,
      branch: parsed.branch,
      input: inputForServer,
      local: true,
    };
  }

  function parseGithubInput(input, options = {}) {
    const trimmed = (input || '').trim().replace(/\/$/, '');
    const local = parseLocalRepoInput(trimmed, options);
    if (local) {
      return {
        ...local,
        input: local.input,
      };
    }
    const gh = trimmed.match(/^(?:https?:\/\/)?(?:www\.)?github\.com\/([^\/\s]+)\/([^\/\s]+?)(?:\.git)?(?:\/(.*))?$/i);
    if (gh) {
      const rest = gh[3] || '';
      const parts = rest.split('/').filter(Boolean);
      let branch = null;
      if (parts[0] === 'tree' && parts[1]) {
        const rawBranch = parts.slice(1).join('/');
        try { branch = decodeURIComponent(rawBranch); } catch { branch = rawBranch; }
      } else if (parts[0] === 'blob' && parts[1]) {
        try { branch = decodeURIComponent(parts[1]); } catch { branch = parts[1]; }
      }
      return {
        owner: gh[1],
        repo: gh[2],
        url: `https://github.com/${gh[1]}/${gh[2]}`,
        branch,
        input: trimmed,
      };
    }
    const short = trimmed.match(/^([A-Za-z0-9](?:[A-Za-z0-9-]{0,38}[A-Za-z0-9])?)\/([A-Za-z0-9._-]+)$/);
    if (short) {
      return {
        owner: short[1],
        repo: short[2],
        url: `https://github.com/${short[1]}/${short[2]}`,
        branch: null,
        input: trimmed,
      };
    }
    return null;
  }

  function desktopInvoke(command, args = {}) {
    const invoke = window.__TAURI__?.core?.invoke || window.__TAURI__?.invoke;
    if (!invoke) return Promise.reject(new Error('Desktop bridge is not available.'));
    return invoke(command, args);
  }

  function splitGithubRepoEntries(input) {
    return String(input || '')
      .split(/[\n,]+/)
      .map((item) => item.trim())
      .filter(Boolean);
  }

  function parseGithubRepoSet(primaryInput, extraInput) {
    const primary = parseGithubInput(primaryInput);
    if (!primary) {
      return { error: 'Could not parse the primary repo as a GitHub URL or owner/repo shorthand.' };
    }
    const refs = [primary];
    for (const entry of splitGithubRepoEntries(extraInput)) {
      const parsed = parseGithubInput(entry);
      if (!parsed) {
        return { error: `Could not parse additional repo: ${entry}` };
      }
      refs.push(parsed);
    }
    const seen = new Set();
    const unique = [];
    for (const ref of refs) {
      const key = `${ref.owner}/${ref.repo}@${ref.branch || ''}`.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      unique.push(ref);
    }
    return { refs: unique };
  }

  function describeRepoSet(refs) {
    if (!refs || refs.length === 0) return 'idle';
    if (refs.length === 1) return `${refs[0].owner}/${refs[0].repo}`;
    return `${refs.length} repos · ${refs.slice(0, 2).map((r) => `${r.owner}/${r.repo}`).join(', ')}${refs.length > 2 ? ', ...' : ''}`;
  }

  function sessionPath(surface, runId) {
    return `/${surface}/${encodeURIComponent(runId)}`;
  }

  function pushSessionUrl(surface, runId) {
    if (!runId) return;
    const next = sessionPath(surface, runId);
    if (location.pathname + location.search !== next) history.pushState(null, '', next);
  }

  // ── router (hash-based) ────────────────────────────────────
  function parseHash() {
    const path = location.pathname.replace(/\/+$/, '') || '/';
    const pathParts = path.split('/').filter(Boolean);
    if (pathParts[0] === 'public' && pathParts[1] === 'wiki' && pathParts[2]) {
      return { route: 'public-wiki', publicId: decodeURIComponent(pathParts[2]) };
    }
    if (pathParts[0] === 'ask') {
      const params = new URLSearchParams(location.search);
      return {
        route: 'ask',
        sessionId: pathParts[1] ? decodeURIComponent(pathParts[1]) : params.get('session') || '',
        repoInput: params.get('repo') || '',
        extraReposInput: params.get('repos') || '',
        workspaceGoal: params.get('goal') || 'custom',
        initialQuestion: params.get('q') || '',
      };
    }
    if (pathParts[0] === 'review') {
      const params = new URLSearchParams(location.search);
      return {
        route: 'review',
        sessionId: pathParts[1] ? decodeURIComponent(pathParts[1]) : params.get('session') || '',
        prInput: params.get('pr') || params.get('url') || '',
        initialQuestion: params.get('q') || '',
        handoff: params.get('handoff') || '',
        handoffKey: params.get('handoffKey') || '',
        sourceCodeRunId: params.get('sourceCodeRunId') || '',
      };
    }
    if (pathParts[0] === 'code') {
      const params = new URLSearchParams(location.search);
      return {
        route: 'code',
        sessionId: pathParts[1] ? decodeURIComponent(pathParts[1]) : params.get('session') || '',
        repoInput: params.get('repo') || '',
        initialTask: params.get('task') || params.get('q') || '',
        handoff: params.get('handoff') || '',
        handoffKey: params.get('handoffKey') || '',
        followupKey: params.get('followupKey') || '',
      };
    }
    if (pathParts[0] === 'capabilities') {
      return { route: 'capabilities' };
    }
    if (pathParts[0] === 'wiki') {
      const params = new URLSearchParams(location.search);
      const sourceFromPath = pathParts.slice(1).map((part) => decodeURIComponent(part)).join('/');
      const sourceFromQuery = params.get('path') || params.get('repo') || '';
      return {
        route: 'wikis',
        repoInput: sourceFromPath || sourceFromQuery,
        preferLocalRepoInput: Boolean(sourceFromPath || params.get('path')),
      };
    }
    if (pathParts[0] === 'wikis') {
      return { route: 'wikis' };
    }
    if (pathParts.length >= 2) {
      return { route: 'wiki', owner: decodeURIComponent(pathParts[0]), repo: decodeURIComponent(pathParts[1]) };
    }

    const h = (location.hash || '#/').slice(1); // drop '#'
    const [hashPath, hashQuery = ''] = h.split('?');
    const parts = hashPath.split('/').filter(Boolean);
    if (parts[0] === 'public' && parts[1] === 'wiki' && parts[2]) {
      return { route: 'public-wiki', publicId: decodeURIComponent(parts[2]) };
    }
    if (parts[0] === 'ask') {
      const params = new URLSearchParams(hashQuery);
      return {
        route: 'ask',
        sessionId: parts[1] ? decodeURIComponent(parts[1]) : params.get('session') || '',
        repoInput: params.get('repo') || '',
        extraReposInput: params.get('repos') || '',
        workspaceGoal: params.get('goal') || 'custom',
        initialQuestion: params.get('q') || '',
      };
    }
    if (parts[0] === 'review') {
      const params = new URLSearchParams(hashQuery);
      return {
        route: 'review',
        sessionId: parts[1] ? decodeURIComponent(parts[1]) : params.get('session') || '',
        prInput: params.get('pr') || params.get('url') || '',
        initialQuestion: params.get('q') || '',
        handoff: params.get('handoff') || '',
        handoffKey: params.get('handoffKey') || '',
        sourceCodeRunId: params.get('sourceCodeRunId') || '',
      };
    }
    if (parts[0] === 'code') {
      const params = new URLSearchParams(hashQuery);
      return {
        route: 'code',
        sessionId: parts[1] ? decodeURIComponent(parts[1]) : params.get('session') || '',
        repoInput: params.get('repo') || '',
        initialTask: params.get('task') || params.get('q') || '',
        handoff: params.get('handoff') || '',
        handoffKey: params.get('handoffKey') || '',
        followupKey: params.get('followupKey') || '',
      };
    }
    if (parts[0] === 'capabilities') {
      return { route: 'capabilities' };
    }
    if (parts[0] === 'wiki') {
      const params = new URLSearchParams(hashQuery);
      const sourceFromPath = parts.slice(1).map((part) => decodeURIComponent(part)).join('/');
      const sourceFromQuery = params.get('path') || params.get('repo') || '';
      return {
        route: 'wikis',
        repoInput: sourceFromPath || sourceFromQuery,
        preferLocalRepoInput: Boolean(sourceFromPath || params.get('path')),
      };
    }
    if (parts[0] === 'wikis') {
      return { route: 'wikis' };
    }
    if (parts.length >= 2) {
      return { route: 'wiki', owner: decodeURIComponent(parts[0]), repo: decodeURIComponent(parts[1]) };
    }
    return { route: 'home' };
  }

  const APP_ROUTE_ROOTS = new Set(['ask', 'review', 'code', 'capabilities', 'wiki', 'wikis', 'public']);
  let hasRenderedRoute = false;
  let routeFallbackTimer = 0;

  function routeMotionReduced() {
    return Boolean(window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches);
  }

  function appRoutePath(url) {
    return `${url.pathname}${url.search}${url.hash}`;
  }

  function isAppRouteUrl(url) {
    if (url.origin !== location.origin) return false;
    const path = url.pathname.replace(/\/+$/, '') || '/';
    if (path === '/') return true;
    const parts = path.split('/').filter(Boolean);
    if (APP_ROUTE_ROOTS.has(parts[0])) return true;
    return parts.length >= 2 && !parts[0].includes('.') && !parts[1].includes('.');
  }

  function navigateTo(next, options = {}) {
    const url = new URL(next, location.href);
    if (!isAppRouteUrl(url)) {
      location.href = url.href;
      return;
    }

    const target = appRoutePath(url);
    const current = `${location.pathname}${location.search}${location.hash}`;
    if (target === current) return;

    history.pushState(null, '', target);
    render({ transition: options.transition !== false });
  }

  document.addEventListener('click', (event) => {
    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const link = event.target?.closest?.('a[href]');
    if (!link || link.target && link.target !== '_self' || link.hasAttribute('download') || link.dataset.noRouter === 'true') return;

    const rawHref = link.getAttribute('href') || '';
    if (!rawHref || rawHref.startsWith('#') || /^(mailto|tel|javascript):/i.test(rawHref)) return;

    const url = new URL(rawHref, location.href);
    if (!isAppRouteUrl(url)) return;
    if (url.pathname === location.pathname && url.search === location.search && url.hash) return;

    event.preventDefault();
    navigateTo(appRoutePath(url), { transition: event.detail !== 0 });
  });

  window.addEventListener('hashchange', () => render());
  window.addEventListener('popstate', () => render());

  // ── API helpers ────────────────────────────────────────────
  async function fetchJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  }

  async function postJSON(url, body) {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    const text = await r.text();
    let data = {};
    if (text) {
      try { data = JSON.parse(text); } catch { data = { error: text }; }
    }
    if (!r.ok) {
      const error = new Error(data.error || `${r.status} ${r.statusText}`);
      error.status = r.status;
      error.needsGitHubConnection = Boolean(data.needsGitHubConnection) || r.status === 428;
      error.code = data.code;
      error.provider = data.provider;
      throw error;
    }
    return data;
  }

  const HISTORY_KIND_OPTIONS = [
    { id: 'all', label: 'All' },
    { id: 'ask', label: 'Ask' },
    { id: 'code', label: 'Code' },
    { id: 'review', label: 'Review' },
  ];
  let historyDrawerEl = null;
  let historyDrawerState = {
    kind: 'all',
    query: '',
    runs: [],
    busyActionId: '',
    lastLoadedAt: '',
    error: '',
    restoreFocusTo: null,
  };

  function canonicalHistoryKind(kind) {
    return kind === 'investigate' ? 'review' : kind;
  }

  function lastHistoryTurn(run, key = 'turns') {
    const resultTurns = Array.isArray(run.result?.[key]) ? run.result[key] : [];
    const inputTurns = Array.isArray(run.input?.[key]) ? run.input[key] : [];
    const turns = resultTurns.length ? resultTurns : inputTurns;
    return turns.length ? turns[turns.length - 1] : null;
  }

  function compactGithubUrl(value) {
    return String(value || '').replace(/^https?:\/\/(www\.)?github\.com\//i, '').replace(/\/$/, '');
  }

  function historyUrlForRun(run) {
    const kind = canonicalHistoryKind(run.kind);
    if (kind === 'ask') return `/ask/${encodeURIComponent(run.id)}`;
    if (kind === 'code') return `/code/${encodeURIComponent(run.id)}`;
    return `/review/${encodeURIComponent(run.id)}`;
  }

  function historyKindMeta(run) {
    if (run.kind === 'ask') return { label: 'Ask', sub: 'anything', token: 'A', tone: 'ask' };
    if (run.kind === 'code') return { label: 'Code', sub: 'anything', token: 'C', tone: 'code' };
    if (run.kind === 'investigate') return { label: 'Investigate', sub: 'review', token: 'I', tone: 'review' };
    return { label: 'Review', sub: 'anything', token: 'R', tone: 'review' };
  }

  function historyRunTitle(run) {
    if (run.kind === 'ask') {
      const turn = lastHistoryTurn(run);
      return summarizeAskTitle(turn?.question || run.input?.question || run.title || 'Ask session');
    }
    if (run.kind === 'code') {
      const turn = lastHistoryTurn(run);
      return summarizeAskTitle(turn?.displayTask || turn?.task || run.input?.displayTask || run.input?.task || run.title || 'Code session');
    }
    if (run.kind === 'investigate') {
      const review = run.input?.review;
      const label = review?.owner && review?.repo && review?.number
        ? `${review.owner}/${review.repo}#${review.number}`
        : compactGithubUrl(run.input?.url);
      return label ? `Investigate ${label}` : run.title || 'Investigation';
    }
    return run.input?.question ? summarizeAskTitle(run.input.question) : run.title || 'Review session';
  }

  function historyRunContext(run) {
    if (run.kind === 'ask') {
      const turn = lastHistoryTurn(run);
      const refs = turn?.refs || run.input?.refs || [];
      return Array.isArray(refs) && refs.length ? describeRepoSet(refs) : 'Ask workspace';
    }
    if (run.kind === 'code') {
      const ref = run.input?.ref;
      if (ref?.owner && ref?.repo) return `${ref.owner}/${ref.repo}`;
      return compactGithubUrl(run.input?.url) || 'Code workspace';
    }
    const review = run.input?.review;
    if (review?.owner && review?.repo && review?.number) return `${review.owner}/${review.repo}#${review.number}`;
    return compactGithubUrl(run.input?.url) || 'Review workspace';
  }

  function historyRunDetail(run) {
    if (run.kind === 'ask') {
      const turns = Array.isArray(run.result?.turns) ? run.result.turns : Array.isArray(run.input?.turns) ? run.input.turns : [];
      const count = turns.length || 1;
      const latest = lastHistoryTurn(run);
      const sources = latest?.sources?.length || run.result?.sources?.length || 0;
      return `${count} question${count === 1 ? '' : 's'}${sources ? ` · ${sources} source${sources === 1 ? '' : 's'}` : ''}`;
    }
    if (run.kind === 'code') {
      const turns = Array.isArray(run.result?.turns) ? run.result.turns : [];
      const latest = lastHistoryTurn(run);
      const files = latest?.changedFiles?.length || run.result?.changedFiles?.length || 0;
      return `${turns.length || 1} turn${(turns.length || 1) === 1 ? '' : 's'}${files ? ` · ${files} changed file${files === 1 ? '' : 's'}` : ''}`;
    }
    if (run.kind === 'investigate') {
      const bugs = Array.isArray(run.result?.bugs) ? run.result.bugs.length : 0;
      const flags = Array.isArray(run.result?.flags) ? run.result.flags.length : 0;
      return bugs || flags ? `${bugs} bug${bugs === 1 ? '' : 's'} · ${flags} flag${flags === 1 ? '' : 's'}` : 'Bug and flag analysis';
    }
    const sources = Array.isArray(run.result?.sources) ? run.result.sources.length : 0;
    return sources ? `${sources} source${sources === 1 ? '' : 's'}` : 'PR review';
  }

  function normalizedHistoryStatus(run) {
    return String(run.status || 'done').trim().toLowerCase() || 'done';
  }

  function historyStatusLabel(status) {
    if (status === 'canceling') return 'stopping';

  }

  function historyStatusClass(status) {
    return String(status || 'done').replace(/[^a-z0-9_-]/gi, '-').toLowerCase();
  }

  function historySearchText(run) {
    return [

  function historyRelativeTime(value) {
    const then = Date.parse(value || '');
    if (!Number.isFinite(then)) return 'unknown';
    const seconds = Math.max(0, Math.floor((Date.now() - then) / 1000));
    if (seconds < 45) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    if (days < 30) return `${days}d ago`;
    return new Date(then).toLocaleDateString();
  }

      if (closeTarget) {

      const kindButton = event.target.closest('[data-history-kind]');
      if (kindButton) {

      const stopButton = event.target.closest('[data-history-stop]');
      const deleteButton = event.target.closest('[data-history-delete]');
      if (!stopButton && !deleteButton) return;
      const id = stopButton?.dataset.historyStop || deleteButton?.dataset.historyDelete || '';
      if (!id || historyDrawerState.busyActionId) return;
      if (deleteButton && !window.confirm('Delete this session history?')) return;
      historyDrawerState.busyActionId = id;
      renderHistoryDrawer();
      try {
        if (stopButton) await postJSON('/api/run/cancel', { id });
        if (deleteButton) await postJSON('/api/run/delete', { id });

      } catch (error) {
        const list = document.getElementById('history-drawer-list');

      } finally {
        historyDrawerState.busyActionId = '';
        renderHistoryDrawer();
      }
    });

    historyDrawerEl.addEventListener('input', (event) => {
      if (event.target?.id !== 'history-drawer-search') return;
      historyDrawerState.query = event.target.value || '';
      renderHistoryDrawer();
    });

    historyDrawerEl.querySelector('#history-drawer-refresh')?.addEventListener('click', loadHistoryDrawerRuns);
    historyDrawerEl.querySelector('.history-drawer-panel')?.addEventListener('keydown', trapHistoryDrawerFocus);
    return historyDrawerEl;
  }

  function focusableHistoryDrawerElements() {
    if (!historyDrawerEl || historyDrawerEl.hidden) return [];
    return Array.from(historyDrawerEl.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])'))
      .filter((el) => el.offsetParent !== null || el === document.activeElement);
  }

  function trapHistoryDrawerFocus(event) {
    if (event.key === 'Escape') {
      event.preventDefault();
      closeHistoryDrawer();
      return;
    }
    if (event.key !== 'Tab') return;
    const focusables = focusableHistoryDrawerElements();
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function openHistoryDrawer() {
    const drawer = ensureHistoryDrawer();
    historyDrawerState.restoreFocusTo = document.activeElement instanceof HTMLElement ? document.activeElement : null;
    drawer.hidden = false;
    document.body.classList.add('history-drawer-open');
    requestAnimationFrame(() => drawer.classList.add('open'));

    const panel = drawer.querySelector('.history-drawer-panel');
    (search || panel)?.focus();

  function closeHistoryDrawer() {
    if (!historyDrawerEl || historyDrawerEl.hidden) return;
    historyDrawerEl.classList.remove('open');
    document.body.classList.remove('history-drawer-open');
    const restore = historyDrawerState.restoreFocusTo;
    window.setTimeout(() => {

  async function loadHistoryDrawerRuns() {
    ensureHistoryDrawer();
    const refresh = document.getElementById('history-drawer-refresh');

      historyDrawerState.error = '';

  function renderHistoryDrawer() {
    ensureHistoryDrawer();
    const tabs = document.getElementById('history-drawer-tabs');

          <span>${escapeHtml(option.label)}</span>

    count.textContent = historyDrawerState.lastLoadedAt
      ? `${runs.length} session${runs.length === 1 ? '' : 's'} · ${historyDrawerState.lastLoadedAt}`
      : `${runs.length} session${runs.length === 1 ? '' : 's'}`;

    if (historyDrawerState.error) {
      list.innerHTML = `<div class="error-banner">Could not load history: ${escapeHtml(historyDrawerState.error)}</div>`;

    if (!historyDrawerState.runs.length) {
      list.innerHTML = `

          <div class="history-empty-title">No sessions yet.</div>
          <p>Start with Ask, Code, or Review. Your runs will appear here.</p>

        </div>

    }

    list.innerHTML = runs.map((run) => {
      const meta = historyKindMeta(run);
      const status = normalizedHistoryStatus(run);
      const statusClass = historyStatusClass(status);
      const statusLabel = historyStatusLabel(status);
      const busy = historyDrawerState.busyActionId === run.id;
      const updated = historyRelativeTime(run.updatedAt || run.createdAt);
      const exactDate = run.updatedAt ? new Date(run.updatedAt).toLocaleString() : '';
      const title = historyRunTitle(run);
      const context = historyRunContext(run);
      const detail = historyRunDetail(run);
      return `
        <article class="history-row ${escapeHtml(meta.tone)} ${escapeHtml(statusClass)}">
          <a class="history-row-main" href="${escapeHtml(historyUrlForRun(run))}" aria-label="Open ${escapeHtml(meta.label)} session: ${escapeHtml(title)}">

              </span>
              <span class="history-row-title" title="${escapeHtml(title)}">${escapeHtml(title)}</span>
              <span class="history-row-meta">
                <span>${escapeHtml(context)}</span>

              </span>
            </span>
          </a>
          <div class="history-row-actions">
            ${status === 'running'
              ? `<button class="history-action" type="button" data-history-stop="${escapeHtml(run.id)}" ${busy ? 'disabled' : ''}>${busy ? 'Stopping' : 'Stop'}</button>`
              : `<button class="history-action danger" type="button" data-history-delete="${escapeHtml(run.id)}" ${busy ? 'disabled' : ''} aria-label="Delete ${escapeHtml(meta.label)} session: ${escapeHtml(title)}">${busy ? 'Deleting' : 'Delete'}</button>`}

  const PROVIDER_SECRET_KEYS = PROVIDER_ACCESS_SPECS.flatMap((spec) => spec.fields.map((field) => field.key));
  const PROVIDER_ACCESS_BY_PROVIDER = new Map(PROVIDER_ACCESS_SPECS.map((spec) => [spec.provider, spec]));

  const PROVIDER_SECRET_PREFIX = 'rlm-wiki:provider-secret:';

  function providerSecretStorageKey(key) {
    return `${PROVIDER_SECRET_PREFIX}${key}`;
  }

  function storageGet(storage, key) {
    try {
      return storage.getItem(key) || '';
    } catch {
      return '';
    }
  }

  function storageSet(storage, key, value) {
    try {
      storage.setItem(key, value);
      return true;
    } catch {
      return false;
    }
  }

  function storageRemove(storage, key) {
    try {
      storage.removeItem(key);
      return true;
    } catch {
      return false;
    }
  }

  function getProviderSessionSecret(key) {
    // Legacy: older UI could store session-only keys here.
    return storageGet(sessionStorage, providerSecretStorageKey(key));
  }

  function getProviderDeviceSecret(key) {
    return storageGet(localStorage, providerSecretStorageKey(key));
  }

  function getProviderSecret(key) {
    // Prefer durable browser storage; fall back to any legacy session key.
    return getProviderDeviceSecret(key) || getProviderSessionSecret(key);
  }

  function setProviderSecret(key, value) {
    const storageKey = providerSecretStorageKey(key);
    // Single model: keys live in this browser only (localStorage).
    // Mirror into sessionStorage so same-tab reads stay consistent.
    const localSaved = storageSet(localStorage, storageKey, value);
    const sessionSaved = storageSet(sessionStorage, storageKey, value);
    try { localStorage.removeItem(PROVIDER_SECRET_SCOPE_KEY); } catch { /* ignore */ }
    return localSaved && sessionSaved;
  }

  function removeProviderSecret(key) {
    const storageKey = providerSecretStorageKey(key);
    const sessionCleared = storageRemove(sessionStorage, storageKey);
    const deviceCleared = storageRemove(localStorage, storageKey);
    return sessionCleared && deviceCleared;
  }

  function normalizeProviderId(provider) {
    const key = String(provider || '').trim().toLowerCase();
    if (key === 'claude') return 'anthropic';
    return KNOWN_PROVIDER_IDS.has(key) ? key : '';
  }

  function providerSecretsPayload() {
    const providerSecrets = {};
    for (const key of PROVIDER_SECRET_KEYS) {
      const value = getProviderSecret(key);
      if (value && value.trim()) providerSecrets[key] = value.trim();
    }
    return providerSecrets;
  }

  function providerHasLocalCredentials(provider) {
    const spec = PROVIDER_ACCESS_BY_PROVIDER.get(normalizeProviderId(provider));
    if (!spec || !spec.fields.length) return false;
    return spec.fields.every((field) => Boolean(getProviderSecret(field.key).trim()));
  }

  function providerHasAnyLocalField(provider) {
    const spec = PROVIDER_ACCESS_BY_PROVIDER.get(normalizeProviderId(provider));
    return Boolean(spec?.fields.some((field) => getProviderSecret(field.key).trim()));

  function providerFieldStorageLabel(key) {

    return PROVIDER_ACCESS_SPECS.filter((spec) => providerHasLocalCredentials(spec.provider)).length;

  function providerChannels(provider) {

  function providerSetupForProvider(provider) {

  function withProviderSecrets(body) {
    const providerSecrets = providerSecretsPayload();
    return Object.keys(providerSecrets).length

    const specs = normalizeProviderId(provider)
      ? [PROVIDER_ACCESS_BY_PROVIDER.get(normalizeProviderId(provider))]
      : PROVIDER_ACCESS_SPECS;
    let saved = 0;
    let failed = false;
    for (const spec of specs.filter(Boolean)) {
      for (const field of spec.fields) {

    providerKeysStatus = failed
      ? { message: 'Could not save in this browser (storage may be blocked).', tone: 'error' }

  function sseRequest(url, body, handlers, options = {}) {
    const controller = new AbortController();
    const method = options.method || 'POST';
    const request = {
      method,
      headers: method === 'POST' ? { 'content-type': 'application/json' } : {},
      signal: controller.signal,
    };
    if (method === 'POST') request.body = JSON.stringify(withProviderSecrets(body));
    fetch(url, request).then(async (r) => {
      if (!r.ok || !r.body) {
        const t = await r.text();
        let data = {};
        if (t) {
          try { data = JSON.parse(t); } catch { data = { error: t }; }
        }
        handlers.onError?.({
          ...data,
          message: data.message || data.error || `${r.status}: ${t}`,
          status: r.status,
        });
        return;
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const chunks = buf.split('\n\n');
        buf = chunks.pop() || '';
        for (const chunk of chunks) {
          const lines = chunk.split('\n');
          let ev = 'message', data = '';
          for (const line of lines) {
            if (line.startsWith('event:')) ev = line.slice(6).trim();
            else if (line.startsWith('data:')) data += line.slice(5).trim();
          }
          if (!data) continue;
          try {
            const parsed = JSON.parse(data);
            handlers.onEvent?.(ev, parsed);
          } catch { /* ignore */ }
        }
      }
      handlers.onDone?.();
    }).catch((e) => {
      if (e.name !== 'AbortError') handlers.onError?.({ message: e.message });
    });
    return () => controller.abort();
  }

  function sseStream(url, body, handlers) {
    return sseRequest(url, body, handlers, { method: 'POST' });
  }

  function sseGetStream(url, handlers) {
    return sseRequest(url, null, handlers, { method: 'GET' });
  }

  function ensureExecutionSettingsDialog() {
    if (executionSettingsDialog) return executionSettingsDialog;
    executionSettingsDialog = document.createElement('div');
    executionSettingsDialog.id = 'execution-settings-dialog';
    executionSettingsDialog.className = 'provider-keys-dialog execution-settings-dialog';
    executionSettingsDialog.hidden = true;
    document.body.appendChild(executionSettingsDialog);
    executionSettingsDialog.addEventListener('click', async (event) => {
      const target = event.target;
      if (target?.closest?.('[data-execution-close]')) {
        closeExecutionSettings();
        return;
      }
      const agentButton = target?.closest?.('[data-local-cli-agent]');
      if (agentButton && !agentButton.disabled) {
        selectedLocalCliAgent = normalizeLocalCliAgent(agentButton.dataset.localCliAgent);
        const agent = selectedLocalCliStatus();
        selectedLocalCliModel = '';
        selectedLocalCliReasoning = agent?.reasoningOptions?.[0] || 'default';
        persistLocalCliConfig();
        renderExecutionSettingsPanel();
        return;
      }
      if (target?.closest?.('[data-local-cli-rescan]')) {
        await loadLocalCliAgents({ rescan: true });
      }
    });
    executionSettingsDialog.addEventListener('change', (event) => {
      const model = event.target?.closest?.('[data-local-cli-model]');
      if (model) {
        selectedLocalCliModel = model.value || '';
        persistLocalCliConfig();
        renderExecutionSettingsPanel();
        return;
      }
      const reasoning = event.target?.closest?.('[data-local-cli-reasoning]');
      if (reasoning) {
        selectedLocalCliReasoning = reasoning.value || 'default';
        persistLocalCliConfig();
        renderExecutionSettingsPanel();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && executionSettingsDialog && !executionSettingsDialog.hidden) closeExecutionSettings();
    });
    return executionSettingsDialog;
  }

  function openExecutionSettings() {
    const dialog = ensureExecutionSettingsDialog();
    dialog.hidden = false;
    document.body.classList.add('provider-keys-open');
    renderExecutionSettingsPanel();
    loadLocalCliAgents();
  }

  function closeExecutionSettings() {
    if (!executionSettingsDialog) return;
    executionSettingsDialog.hidden = true;
    document.body.classList.remove('provider-keys-open');
  }

  document.getElementById('execution-settings-btn')?.addEventListener('click', openExecutionSettings);

  function normalizeWikiDepth(value) {
    return value === 'fast' || value === 'regular' || value === 'deep' ? value : 'regular';
  }

  function normalizeWikiPageCount(value, fallback = 18) {
    const raw = Number(value);
    const rounded = Number.isFinite(raw) ? Math.round(raw) : fallback;
    return Math.max(6, Math.min(30, rounded));
  }

  function wikiDepthForPageCount(pageCount) {
    const count = normalizeWikiPageCount(pageCount);
    if (count <= 12) return 'fast';
    if (count <= 24) return 'regular';
    return 'deep';
  }

  function defaultWikiPageCountForDepth(depth) {
    const normalized = normalizeWikiDepth(depth);
    if (normalized === 'fast') return 10;
    if (normalized === 'deep') return 30;
    return 18;
  }

  function normalizeWikiStyle(value) {
    return value === 'basic' || value === 'functional' || value === 'wlog' || value === 'design' || value === 'technical' || value === 'custom' ? value : 'basic';
  }

  function normalizeWikiStylePrompt(value) {
    return String(value || '').trim().slice(0, 2400);
  }

  function renderWikiOptionToggle(container, options, selected, attr, onSelect) {
    if (!container) return;
    const datasetKey = attr.replace(/-([a-z])/g, (_, letter) => letter.toUpperCase());
    const selectedIndex = Math.max(0, options.findIndex((option) => option.id === selected));
    container.style.setProperty('--wiki-option-count', String(options.length));
    container.style.setProperty('--wiki-option-index', String(selectedIndex));
    if (container.dataset.optionAttr !== attr || container.dataset.optionCount !== String(options.length)) {
      container.dataset.optionAttr = attr;
      container.dataset.optionCount = String(options.length);
      container.innerHTML = `
        <span class="wiki-option-thumb" aria-hidden="true"></span>
        ${options.map((option) => `
          <button
            class="wiki-option-button"
            type="button"
            data-${attr}="${escapeHtml(option.id)}"
          >
            <span class="wiki-option-label">${escapeHtml(option.label)}</span>
            <span class="wiki-option-sub">${escapeHtml(option.sub)}</span>
          </button>
        `).join('')}
      `;
      container.querySelectorAll(`[data-${attr}]`).forEach((button) => {
        button.addEventListener('click', () => {
          onSelect?.(button.dataset[datasetKey]);
        });
      });
    }
    container.querySelectorAll(`[data-${attr}]`).forEach((button) => {
      const active = button.dataset[datasetKey] === selected;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }

  function renderRuntimeToggle(container, selected, onSelect, disabled = false) {
    if (!container) return;
    const active = normalizeRuntime(selected, 'agent');
    container.innerHTML = RUNTIME_OPTIONS.map((mode) => {
      const localCliUnavailable = mode.id === 'local-cli' && !localCliRuntimeAvailable();
      return `
      <button
        class="ask-mode-button runtime-mode-button${mode.id === active ? ' active' : ''}${localCliUnavailable ? ' unavailable' : ''}"
        type="button"
        data-runtime="${escapeHtml(mode.id)}"
        ${localCliUnavailable ? 'data-runtime-unavailable="desktop-or-localhost" aria-disabled="true"' : ''}
        aria-pressed="${mode.id === active ? 'true' : 'false'}"
        title="${localCliUnavailable ? 'Local CLI is only available in the desktop app or on localhost.' : `${escapeHtml(mode.label)} mode: ${escapeHtml(mode.sub)}`}"
        ${disabled ? 'disabled' : ''}
      >
        <span class="ask-mode-label">${escapeHtml(mode.label)}</span>
        <span class="ask-mode-sub">${escapeHtml(localCliUnavailable ? 'Desktop/local' : mode.sub)}</span>
      </button>
    `;
    }).join('');
    container.querySelectorAll('[data-runtime]').forEach((button) => {
      button.addEventListener('click', () => {
        if (button.disabled || button.dataset.runtimeUnavailable) return;
        onSelect?.(normalizeRuntime(button.dataset.runtime, active));

  function localCliAgentChoices() {
    const fallback = [
      { id: 'codex', name: 'Codex', runnable: false, installed: false, setupHint: 'not installed' },
      { id: 'claude', name: 'Claude', runnable: false, installed: false, setupHint: 'not installed' },
      { id: 'hermes', name: 'Hermes', runnable: false, installed: false, setupHint: 'not installed' },
    ];
    const byId = new Map(fallback.map((agent) => [agent.id, agent]));
    localCliAgents.forEach((agent) => {
      byId.set(agent.id, {
        ...agent,
        name: agent.id === 'claude' ? 'Claude' : agent.id === 'hermes' ? 'Hermes' : 'Codex',
      });
    });
    return ['codex', 'claude', 'hermes'].map((id) => byId.get(id));
  }

  function renderLocalCliAgentPicker(container, runtime, opts = {}) {
    if (!container) return;
    const show = normalizeRuntime(runtime, 'agent') === 'local-cli';
    container.hidden = !show;
    container.classList.toggle('is-runtime-collapsed', !show);
    container.setAttribute('aria-hidden', show ? 'false' : 'true');
    if ('inert' in container) container.inert = !show;
    if (!show) return;
    const selected = normalizeLocalCliAgent(selectedLocalCliAgent);
    const choices = localCliAgentChoices();
    const selectedStatus = choices.find((agent) => agent.id === selected);
    container.innerHTML = `
      <span class="channel-label">Agent</span>
      <div class="local-cli-agent-options" role="group" aria-label="Local CLI agent">
        ${choices.map((agent) => {
          const active = agent.id === selected;
          const disabled = !agent.runnable;
          const status = agent.runnable ? (agent.version || 'ready') : (agent.installed ? 'auth needed' : 'missing');
          return `
            <button
              class="local-cli-agent-option${active ? ' active' : ''}"
              type="button"
              data-local-cli-inline-agent="${escapeHtml(agent.id)}"
              aria-pressed="${active ? 'true' : 'false'}"
              title="${escapeHtml(agent.setupHint || `${agent.name} ${status}`)}"
              ${disabled ? 'disabled' : ''}
            >
              <span>${escapeHtml(agent.name)}</span>
              <small>${escapeHtml(status)}</small>
            </button>
          `;
        }).join('')}
      </div>
      <span class="channel-hint">${escapeHtml(selectedStatus?.runnable ? `${selectedStatus.name} will use its local auth.` : selectedStatus?.setupHint || 'Install and authenticate the selected CLI.')}</span>

      button.addEventListener('click', () => {

        selectedLocalCliModel = '';
        selectedLocalCliReasoning = 'default';

  function setRuntimeModelBarVisibility(modelBar, runtime, opts = {}) {
    if (!modelBar) return;
    const forceHidden = Boolean(opts.hidden);
    const showModel = !forceHidden && normalizeRuntime(runtime, 'agent') !== 'local-cli';
    modelBar.hidden = forceHidden;
    modelBar.classList.toggle('is-runtime-collapsed', !showModel);
    modelBar.setAttribute('aria-hidden', showModel ? 'false' : 'true');
    if ('inert' in modelBar) modelBar.inert = !showModel;
  }

  function providerSetupForDetails(details = {}, message = '') {
    if (details?.setup) return details.setup;
    const rawProvider = details?.provider || (
      /\bGemini\b/i.test(message) ? 'gemini' :
      /\bOpenRouter\b/i.test(message) ? 'openrouter' :
      /\bDeepSeek\b/i.test(message) ? 'deepseek' :
      /\bMiniMax\b/i.test(message) ? 'minimax' :
      /\bClaude\b|\bAnthropic\b/i.test(message) ? 'anthropic' :
      /\bOpenAI\b|\bGPT\b/i.test(message) ? 'openai' :
      ''
    );
    const provider = rawProvider === 'claude' ? 'anthropic' : rawProvider;
    if (!provider) return null;
    return availableChannels.find((c) => c.provider === provider && c.setup)?.setup || null;
  }

  function renderProviderAccessNotice(provider, setup = null, message = '') {
    const normalizedProvider = normalizeProviderId(provider || setup?.provider);
    const spec = PROVIDER_ACCESS_BY_PROVIDER.get(normalizedProvider);
    const title = setup?.message || message || `${spec?.shortLabel || 'This model'} needs access before it can run.`;
    const detail = setup?.detail || (providerAcceptsKeys(normalizedProvider)
      ? 'Use a session key or connect the provider, then retry.'
      : 'This provider is not available with browser API keys.');
    return `
      <div class="provider-setup-notice">
        <div class="provider-setup-copy">
          <strong>${escapeHtml(title)}</strong>
          <span>${escapeHtml(detail)}</span>
        </div>
        <div class="provider-access-actions">
          ${providerAcceptsKeys(normalizedProvider) ? `<button class="provider-setup-btn" type="button" data-provider-keys-open="${escapeHtml(normalizedProvider)}">Enter key</button>` : ''}
          ${setup ? `<button class="provider-setup-btn secondary" type="button" data-provider-setup="${escapeHtml(setup.provider)}">${escapeHtml(setup.buttonLabel || `Connect ${setup.label || 'provider'}`)}</button>` : ''}
        </div>
      </div>
    `;
  }

  function renderErrorBanner(message, details = {}) {
    const setup = providerSetupForDetails(details, message);
    const provider = normalizeProviderId(details?.provider || setup?.provider);
    if (setup || providerAcceptsKeys(provider)) return renderProviderAccessNotice(provider, setup, message);
    return `<div class="error-banner">${escapeHtml(message || 'Run failed')}</div>`;
  }

  function streamErrorMessage(err, fallback = 'Transport error') {
    if (err?.code === 'MODEL_ACCESS_REQUIRED' || err?.code === 'PROVIDER_SETUP_REQUIRED') {
      return err.message || 'This model needs an API key in this browser before it can run.';
    }
    return `${fallback}: ${err?.message || err || 'unknown error'}`;
  }

  async function startProviderConnection(provider, button = null) {
    if (!provider) return;
    const previous = button?.textContent;
    if (button) {
      button.disabled = true;
      button.textContent = 'Opening setup…';
    }
    providerSetupState = { provider, status: 'opening' };
    renderChannelOptions();
    if (providerKeysDialog && !providerKeysDialog.hidden) renderProviderKeysDialog();
    try {
      const result = await postJSON('/api/provider-setup/start', { provider });
      providerSetupState = { provider, status: 'opened', label: result.setup?.label || provider, buttonLabel: result.setup?.buttonLabel || 'Connect', openedAt: Date.now() };
      renderChannelOptions();
      if (providerKeysDialog && !providerKeysDialog.hidden) renderProviderKeysDialog();
      beginProviderSetupPolling(provider);
    } catch (e) {
      providerSetupState = { provider, status: 'error', error: e.message || String(e) };
      renderChannelOptions();
      if (providerKeysDialog && !providerKeysDialog.hidden) renderProviderKeysDialog();
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = previous || button.textContent;
      }
    }
  }

  function beginProviderSetupPolling(provider) {
    if (providerSetupPoll) clearInterval(providerSetupPoll);
    const openedAt = Date.now();
    providerSetupPoll = setInterval(async () => {
      try {
        await loadChannels();
        const connected = availableChannels.some((c) => c.provider === provider && c.configured);
        if (connected) {
          clearInterval(providerSetupPoll);
          providerSetupPoll = null;
          providerSetupState = { provider, status: 'connected' };
          renderChannelOptions();
          setTimeout(() => {
            if (providerSetupState?.provider === provider && providerSetupState.status === 'connected') {
              providerSetupState = null;
              renderChannelOptions();
            }
          }, 2800);
        }
        if (providerKeysDialog && !providerKeysDialog.hidden) renderProviderKeysDialog();
      } catch {
        // Keep polling; setup may still be in progress.
      }
      if (Date.now() - openedAt > 135000 && providerSetupState?.provider === provider && providerSetupState.status === 'opened') {
        clearInterval(providerSetupPoll);
        providerSetupPoll = null;
        providerSetupState = {
          ...providerSetupState,
          status: 'retry',
          error: 'Connection did not finish. If the provider rate-limited the login, wait a few minutes and try again.',
        };
        renderChannelOptions();
        if (providerKeysDialog && !providerKeysDialog.hidden) renderProviderKeysDialog();
      }
    }, 2500);
  }

  async function loadChannels() {
    try {
      const data = await fetchJSON('/api/channels');
      availableChannels = data.channels;
      if (data.localCli) {
        localCliEnabled = data.localCli.enabled !== false;
        localCliAgents = Array.isArray(data.localCli.agents) ? data.localCli.agents : [];
      }
      if (!selectedChannelId || !availableChannels.find((c) => c.id === selectedChannelId)) {
        // Prefer a runnable channel over the default when default isn't wired up.
        const firstConfigured = availableChannels.find((c) => channelConfiguredForBrowser(c));
        selectedChannelId = firstConfigured?.id || data.defaultChannel;
      }
      syncWikiChannelDefaults();
      updateProviderKeysButton();
      if (providerKeysDialog && !providerKeysDialog.hidden) renderProviderKeysDialog();
      renderChannelOptions();
      renderWikiModelPickers();
      renderTopbarModelControl();
      renderExecutionSettingsPanel();
    } catch (e) {
      const container = document.getElementById('channel-options');
      if (container) {
        container.innerHTML = `<span class="channel-hint">couldn't load models: ${escapeHtml(e.message)}</span>`;
      }
    }
  }

  function renderTopbarModelControl() {
    const trigger = document.getElementById('topbar-model-trigger');
    const menu = document.getElementById('topbar-model-menu');
    updateTopbarModelLabel();
    if (!trigger || !menu) return;
    if (!availableChannels.length) {
      menu.innerHTML = '<div class="channel-menu-empty">Loading models...</div>';
    } else {
      menu.innerHTML = groupedChannelsForPicker(availableChannels).map((group) => `
        <div class="channel-menu-group" role="group" aria-label="${escapeHtml(group.label)}">
          <div class="channel-menu-group-label">${escapeHtml(group.label)}</div>
          ${group.channels.map((c) => channelMenuItemMarkup(c)).join('')}
        </div>
      `).join('');
    }
    trigger.onclick = (e) => {
      e.stopPropagation();
      const open = !menu.classList.contains('open');
      closeChannelMenus(menu);
      menu.classList.toggle('open', open);
      trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    menu.querySelectorAll('.channel-menu-item').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        if (el.classList.contains('disabled')) {
          openProviderKeysDialog(el.dataset.providerAccess || '');
          closeChannelMenus();
          return;
        }
        selectChannel(el.dataset.channel);
        closeChannelMenus();
      });
    });
  }

  function renderChannelOptions() {
    updateTopbarModelLabel();
    renderTopbarModelControl();
    const container = document.getElementById('channel-options');
    const hint = document.getElementById('channel-hint');
    // Some routes expose a local model picker and some only use the topbar.
    // Bail quietly when the route has no inline picker.
    if (!container) return;
    const chosen = currentChannel();
    if (!chosen) {
      container.innerHTML = '<span class="channel-hint">no models</span>';
      return;
    }
    const chosenUsesSessionKey = providerHasLocalCredentials(chosen.provider);
    const chosenSub = chosenUsesSessionKey ? `${chosen.sub} · session key` : chosen.sub;
    const chosenIcon = providerIconMarkup(channelProviderSpec(chosen), 'channel');
    const channelGroupMarkup = groupedChannelsForPicker(availableChannels).map((group) => `
      <div class="channel-menu-group" role="group" aria-label="${escapeHtml(group.label)}">
        <div class="channel-menu-group-label">${escapeHtml(group.label)}</div>
        ${group.channels.map((c) => channelMenuItemMarkup(c)).join('')}
      </div>
    `).join('');
    container.innerHTML = `
      <div class="channel-dropdown" id="channel-dropdown">
        <button class="channel-trigger" id="channel-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
          ${chosenIcon}
          <span class="channel-trigger-main">
            <span class="channel-trigger-label">${escapeHtml(chosen.label)}</span>
            <span class="channel-trigger-sub">${escapeHtml(chosenSub)}</span>
          </span>
          <span class="channel-chevron">⌄</span>
        </button>
        <div class="channel-menu" id="channel-menu" role="listbox">
          ${channelGroupMarkup}
        </div>
      </div>
    `;
    const trigger = document.getElementById('channel-trigger');
    const menu = document.getElementById('channel-menu');
    trigger?.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = !menu.classList.contains('open');
      closeChannelMenus(menu);
      menu.classList.toggle('open', open);
      trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    container.querySelectorAll('.channel-menu-item').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        if (el.classList.contains('disabled')) {
          openProviderKeysDialog(el.dataset.providerAccess || '');
          closeChannelMenus();
          return;
        }
        selectChannel(el.dataset.channel);
        closeChannelMenus();
      });
    });
    if (providerSetupState?.status === 'opened') {
      hint.innerHTML = `Setup window opened. Finish connecting ${escapeHtml(providerSetupState.label || 'the provider')}, then retry.`;
      hint.style.color = '#d8d0bd';
    } else if (providerSetupState?.status === 'connected') {
      hint.innerHTML = 'Provider connected. You can run the request now.';
      hint.style.color = '#7ee787';
    } else if (providerSetupState?.status === 'error') {
      hint.innerHTML = `Could not open setup: ${escapeHtml(providerSetupState.error || 'unknown error')}`;
      hint.style.color = '#fc8181';
    } else if (providerSetupState?.status === 'retry') {
      hint.innerHTML = `
        <div class="provider-setup-notice">
          <div class="provider-setup-copy">
            <strong>${escapeHtml(providerSetupState.error || 'Connection did not finish.')}</strong>
            <span>Click ${escapeHtml(providerSetupState.buttonLabel || 'Connect')} when you are ready to retry.</span>
          </div>
          <button class="provider-setup-btn" type="button" data-provider-setup="${escapeHtml(providerSetupState.provider)}">${escapeHtml(providerSetupState.buttonLabel || 'Connect')}</button>
        </div>
      `;
      hint.style.color = '';
    } else if (chosen && providerHasLocalCredentials(chosen.provider)) {
      hint.innerHTML = 'Using a session key from this browser.';
      hint.style.color = '#7ee787';
    } else if (chosen && !channelConfiguredForBrowser(chosen)) {
      hint.innerHTML = renderProviderAccessNotice(chosen.provider, chosen.setup);
      hint.style.color = '';
    } else {
      hint.textContent = '';
      hint.style.color = '';
    }
  }

  function renderWikiChannelPicker(container, selectedId, label, onSelect) {
    if (!container) return;
    syncWikiChannelDefaults();
    const chosen = channelById(selectedId) || currentChannel();
    if (!chosen) {
      container.innerHTML = '<span class="channel-hint">no models</span>';
      return;
    }

  function groupedChannelsForPicker(channels) {
    const groups = [];
    const byLabel = new Map();
    channels.forEach((channel) => {
      const label = channel.group || providerGroupLabel(channel.provider);
      if (!byLabel.has(label)) {
        const group = { label, channels: [] };
        byLabel.set(label, group);
        groups.push(group);
      }
      byLabel.get(label).channels.push(channel);
    });
    return groups;
  }

  function providerGroupLabel(provider) {
    switch (normalizeProviderId(provider)) {
      case 'openai': return 'OpenAI';
      case 'gemini': return 'Gemini';
      case 'anthropic': return 'Anthropic (Claude)';
      case 'deepseek': return 'Deepseek V4';
      case 'openrouter': return 'OpenRouter';
      default: return 'Other';
    }
  }

  function channelProviderSpec(channel) {
    const provider = normalizeProviderId(channel?.provider);
    return PROVIDER_ACCESS_BY_PROVIDER.get(provider) || {
      provider,
      label: channel?.provider || 'Model',
      shortLabel: channel?.provider || 'M',
      sub: '',
      fields: [],
      keyUrl: '',
    };
  }

  function channelMenuItemMarkup(c, activeChannelId = selectedChannelId) {
    const active = c.id === activeChannelId ? ' active' : '';
    const ready = channelConfiguredForBrowser(c);
    const disabled = !ready ? ' disabled' : '';
    const title = ready
      ? `${c.sub} · session key`
      : c.acceptsProviderSecrets
        ? `Add ${c.label} key`
        : 'Unavailable with browser API keys';
    const accessAttr = !ready ? ` data-provider-access="${escapeHtml(c.provider)}"` : '';
    const chip = ready
      ? '<span class="channel-setup-chip ready">session</span>'
      : c.acceptsProviderSecrets
        ? '<span class="channel-setup-chip">access</span>'
        : '<span class="channel-setup-chip unavailable">unavailable</span>';
    return `
      <button class="channel-menu-item${active}${disabled}" type="button" data-channel="${escapeHtml(c.id)}"${accessAttr} title="${escapeHtml(title)}" role="option" aria-selected="${c.id === activeChannelId ? 'true' : 'false'}">
        ${providerIconMarkup(channelProviderSpec(c), 'channel')}
        <span class="channel-menu-text">
          <span class="channel-menu-label">${escapeHtml(c.label)}</span>
          <span class="channel-menu-sub">${escapeHtml(title)}</span>
        </span>
        ${chip}
      </button>
    `;
  }

      const [caps, connected] = await Promise.all([
        fetchJSON('/api/capabilities'),
        fetchJSON('/api/capabilities/composio/connected').catch((e) => ({ ok: false, items: [], error: e.message })),
      ]);
      state.settings = caps.settings || state.settings;
      state.active = caps.active || null;
      state.todos = caps.todos || [];
      state.connected = connected.items || [];
      if (connected.error) composioMessage.textContent = connected.error;
      renderConnected();
      renderLists();
      renderCatalog();
      renderSkillPicker();
    }

    async function refreshPendingConnections(reason = '') {
      if (!state.pendingConnections.size || capabilityAbort.signal.aborted) return false;
      try {
        if (reason === 'focus') composioMessage.textContent = 'checking connection status...';
        await refreshCapabilities();
        const connectedSlugs = Array.from(state.pendingConnections).filter(activeConnectedApp);
        connectedSlugs.forEach((slug) => {
          state.pendingConnections.delete(slug);
          stopConnectionPolling(slug);
        });
        if (connectedSlugs.length) {
          composioMessage.textContent = `${connectedSlugs.join(', ')} connected`;
          renderCatalog();
          setTimeout(() => {
            if (!state.pendingConnections.size && !capabilityAbort.signal.aborted) composioMessage.textContent = '';
          }, 2200);
          return true;
        }
        if (reason === 'focus') composioMessage.textContent = state.pendingConnections.size
          ? `waiting for ${Array.from(state.pendingConnections).join(', ')} authorization...`
          : '';
      } catch (e) {
        composioMessage.textContent = e.message || String(e);
      }
      return false;
    }

    function beginConnectionPolling(slug, authWindow = null) {
      stopConnectionPolling(slug);
      state.pendingConnections.add(slug);
      renderCatalog();
      const startedAt = Date.now();
      const timer = setInterval(async () => {
        const connected = await refreshPendingConnections('poll');
        if (connected || !state.pendingConnections.has(slug)) return;
        const elapsed = Date.now() - startedAt;
        const closed = authWindow && authWindow.closed;
        if (closed && elapsed > 12_000) {
          composioMessage.textContent = `still checking ${slug} connection...`;
        }
        if (elapsed > 180_000) {
          state.pendingConnections.delete(slug);
          stopConnectionPolling(slug);
          composioMessage.textContent = `${slug} authorization is still pending. Use refresh if it completed in another tab.`;
          renderCatalog();
        }
      }, 2400);
      capabilityTimers.add(timer);
      state.connectionPolls.set(slug, timer);
      refreshPendingConnections('poll');
    }

    async function loadCatalog({ reset = false } = {}) {
      state.catalogLoading = true;
      if (reset) {
        state.catalog = [];
        state.catalogCursor = null;
        renderSkeletons();
      }
      const params = new URLSearchParams({
        sort_by: state.sortBy,
        managed_by: 'all',
        limit: '24',
      });
      if (state.search) params.set('search', state.search);
      if (state.category) params.set('category', state.category);
      if (!reset && state.catalogCursor) params.set('cursor', state.catalogCursor);
      try {
        const data = await fetchJSON(`/api/capabilities/composio/catalog?${params.toString()}`);
        state.catalog = reset ? data.items || [] : [...state.catalog, ...(data.items || [])];
        state.catalogCursor = data.nextCursor || null;
        composioMessage.textContent = '';
      } catch (e) {
        composioMessage.textContent = e.message;
        state.catalog = reset ? [] : state.catalog;
      } finally {
        state.catalogLoading = false;
        renderCatalog();
      }
    }

    async function connectToolkit(slug, button) {
      if (!slug || state.connecting.has(slug)) return;
      state.connecting.add(slug);
      button.textContent = 'Opening OAuth...';
      button.disabled = true;
      composioMessage.textContent = `opening ${slug} authorization...`;
      const authWindow = window.open('about:blank', '_blank');
      if (authWindow) authWindow.opener = null;
      try {
        await postJSON('/api/capabilities/composio/toolkits', { toolkits: [slug] });
        const result = await postJSON('/api/capabilities/composio/authorize', { toolkit: slug });
        if (result.redirectUrl) {
          if (authWindow) authWindow.location = result.redirectUrl;
          else window.location.href = result.redirectUrl;
          composioMessage.textContent = `waiting for ${slug} authorization...`;
          beginConnectionPolling(slug, authWindow);
        } else {
          if (authWindow) authWindow.close();
          composioMessage.textContent = `${slug} authorization ${result.status || 'created'}`;
          beginConnectionPolling(slug, authWindow);
        }
        await refreshCapabilities();
        if (activeConnectedApp(slug)) {
          state.pendingConnections.delete(slug);
          stopConnectionPolling(slug);
        }
      } catch (e) {
        if (authWindow) authWindow.close();
        state.pendingConnections.delete(slug);
        stopConnectionPolling(slug);
        composioMessage.textContent = e.message;
      } finally {
        state.connecting.delete(slug);
        renderCatalog();
      }
    }

    async function inspectSkillSource() {
      const source = skillSourceInput.value.trim();
      if (!source) {
        skillMessage.textContent = 'enter a GitHub skill source';
        return;
      }
      skillMessage.textContent = 'looking for skills...';
      state.skillCandidates = [];
      state.skillSelection.clear();
      renderSkillPicker();
      const result = await postJSON('/api/capabilities/skills/inspect', { source });
      state.skillCandidates = result.skills || [];
      const available = state.skillCandidates.filter((skill) => !skillInstalled(skill));
      if (available.length === 1) state.skillSelection.add(available[0].installSource);
      renderSkillPicker();
      const found = state.skillCandidates.length;
      const availableCount = available.length;
      skillMessage.textContent = availableCount
        ? `${found} skill${found === 1 ? '' : 's'} found`
        : `${found} skill${found === 1 ? '' : 's'} already installed`;
    }

    async function installSelectedSkills() {
      const sources = (state.skillCandidates || [])
        .filter((skill) => state.skillSelection.has(skill.installSource) && !skillInstalled(skill))
        .map((skill) => skill.installSource);
      if (!sources.length) {
        skillMessage.textContent = 'select at least one skill';
        return;
      }
      skillMessage.textContent = `installing ${sources.length} skill${sources.length === 1 ? '' : 's'}...`;
      await postJSON('/api/capabilities/skills', { sources });
      skillMessage.textContent = `installed ${sources.length} skill${sources.length === 1 ? '' : 's'}`;
      state.skillCandidates = [];
      state.skillSelection.clear();
      skillForm.reset();
      renderSkillPicker();
      await refreshCapabilities();
    }

    searchInput.addEventListener('input', debounce(() => {
      state.search = searchInput.value.trim();
      loadCatalog({ reset: true });
    }, 250));
    sortSelect.addEventListener('change', () => {
      state.sortBy = sortSelect.value;
      loadCatalog({ reset: true });
    });
    categoryRow.querySelectorAll('[data-category]').forEach((button) => {
      button.addEventListener('click', () => {
        state.category = button.dataset.category || '';
        categoryRow.querySelectorAll('.cap-chip').forEach((chip) => chip.classList.toggle('active', chip === button));
        loadCatalog({ reset: true });
      });
    });
    loadMoreButton.addEventListener('click', () => loadCatalog({ reset: false }));
    document.getElementById('cap-refresh-connections').addEventListener('click', async () => {
      composioMessage.textContent = 'refreshing connections...';
      await refreshCapabilities();
      Array.from(state.pendingConnections)
        .filter(activeConnectedApp)
        .forEach((slug) => {
          state.pendingConnections.delete(slug);
          stopConnectionPolling(slug);
        });
      composioMessage.textContent = '';
    });

    window.addEventListener('focus', () => {
      refreshPendingConnections('focus');
    }, { signal: capabilityAbort.signal });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshPendingConnections('focus');
    }, { signal: capabilityAbort.signal });

    mcpForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      mcpMessage.textContent = 'connecting...';
      try {
        await postJSON('/api/capabilities/mcp', {
          name: document.getElementById('cap-mcp-name').value,
          url: document.getElementById('cap-mcp-url').value,
          type: document.getElementById('cap-mcp-type').value,
          tokenEnv: document.getElementById('cap-mcp-token-env').value,
        });
        mcpMessage.textContent = 'connected';
        mcpForm.reset();
        await refreshCapabilities();
      } catch (e) {
        mcpMessage.textContent = e.message;
      }
    });

    skillForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        await inspectSkillSource();
      } catch (e) {
        skillMessage.textContent = e.message;
      }
    });

    try {
      await Promise.all([refreshCapabilities(), loadCatalog({ reset: true })]);
    } catch (e) {
      composioMessage.textContent = e.message;
    }
  }

  // ── WIKIS workspace ───────────────────────────────────────
  function wikiRoute(owner, repo) {
    return `/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
  }

  function wikiExportUrl(wiki) {
    const params = new URLSearchParams({
      owner: wiki.owner || '',
      repo: wiki.repo || '',
    });
    if (wiki.branch) params.set('branch', wiki.branch);
    return `/api/wiki/export.zip?${params.toString()}`;
  }

  function wikiDepthLabel(value) {
    const depth = normalizeWikiDepth(value);
    if (depth === 'fast') return 'Fast wiki';
    if (depth === 'regular') return 'Regular wiki';
    return 'Deep wiki';
  }

  function wikiPageCountLabel(pageCount) {
    const count = normalizeWikiPageCount(pageCount);
    const depth = wikiDepthForPageCount(count);
    if (depth === 'fast') return `Fast · ${count} pages`;
    if (depth === 'regular') return `Regular · ${count} pages`;
    return `Deep · ${count} pages · expensive`;
  }

  function wikiRepoListLabel(repos, fallbackOwner = '', fallbackRepo = '') {
    const rows = Array.isArray(repos) ? repos : [];
    if (rows.length > 1) {
      return rows.map((repo) => repo.label || `${repo.owner}/${repo.repo}`).filter(Boolean).join(' + ');
    }
    return `${fallbackOwner}/${fallbackRepo}`;
  }

  function wikiRepoListInput(repos, fallbackOwner = '', fallbackRepo = '') {
    const rows = Array.isArray(repos) ? repos : [];
    if (rows.length > 1) {
      return rows.map((repo) => repo.url || `${repo.owner}/${repo.repo}`).filter(Boolean).join('\n');
    }
    return `${fallbackOwner}/${fallbackRepo}`;
  }

  function wikiStyleLabel(value) {
    const style = normalizeWikiStyle(value);
    if (style === 'basic') return 'Basic';
    if (style === 'functional') return 'Functional';
    if (style === 'wlog') return 'Wlog';
    if (style === 'design') return 'Design Ideas';
    if (style === 'custom') return 'Custom';
    return 'Technical';
  }

  function wikiDateLabel(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? 'recent' : date.toLocaleDateString();
  }

  function wikiRelativeTimeLabel(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return 'recently';
    const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
    if (seconds < 45) return 'just now';
    if (seconds < 90) return '1m ago';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    return `${Math.floor(hours / 24)}d ago`;
  }

  function wikiActiveRunLabel(run) {
    const progress = run.progressLabel || (
      run.plannedPageCount
        ? `${run.completedPageCount || 0}/${run.plannedPageCount} pages`
        : 'running'
    );
    if (run.state === 'stalled') return `${progress} · no worker heartbeat`;
    const activePage = Array.isArray(run.activePages) && run.activePages.length
      ? ` · writing ${run.activePages[0].title || run.activePages[0].pageId}`
      : '';
    const worker = run.worker?.active ? ' · worker active' : '';
    return `${progress}${activePage}${worker}`;
  }

  function renderWikiActiveLibraryItem(run) {
    const owner = escapeHtml(run.owner || '');
    const repo = escapeHtml(run.repo || '');
    const repoLabel = wikiRepoListLabel(run.repos || run.input?.refs, run.owner || '', run.repo || '');
    const title = escapeHtml(run.title || `Generating ${run.owner}/${run.repo}`);

    return `

        </div>
      </article>
    `;
  }

  function bindWikiActiveRunActions(root, activeRuns = []) {
    const runsById = new Map(activeRuns.map((run) => [run.id, run]));
    root.querySelectorAll('[data-wiki-run-resume]').forEach((button) => {
      button.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        const run = runsById.get(button.dataset.wikiRunResume);
        if (run) resumeWikiRun(run);
      });
    });
    root.querySelectorAll('[data-wiki-run-stop]').forEach((button) => {
      button.addEventListener('click', async (event) => {
        event.preventDefault();
        event.stopPropagation();
        const run = runsById.get(button.dataset.wikiRunStop);
        if (!run) return;
        button.disabled = true;
        button.textContent = 'Stopping';
        try {
          await postJSON('/api/run/cancel', { id: run.id });
          await loadWikiLibrary();
        } catch (error) {
          button.disabled = false;
          button.textContent = 'Stop';
          const message = String(error?.message || error || 'Could not stop run');
          const count = document.getElementById('wiki-library-count');
          if (count) count.textContent = message;
        }
      });
    });
  }

  function resumeWikiRun(run) {
    const url = wikiRepoListInput(run.repos || run.input?.refs, run.owner || '', run.repo || '') || run.url || (run.owner && run.repo ? `${run.owner}/${run.repo}` : '');
    if (!run.id || !url) return;
    const progressBox = document.getElementById('progress-box');
    progressBox?.scrollIntoView({ block: 'start', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
    startGenerate(url, {
      resumeRunId: run.id,
      pageCount: run.wikiPageCount || run.plannedPageCount || 18,
      style: run.wikiStyle || 'basic',
      runtime: run.runtime || run.input?.runtime || selectedWikiRuntime,
      structureChannel: run.structureChannel || run.channel,
      pageChannel: run.pageChannel || run.channel,
    });
  }
