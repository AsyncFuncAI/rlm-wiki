    const setupWikiFlowDismissal = () => {
      if (!flowHero) return;
      const flowPage = flowHero.closest('.wikis-page') || root;
      const setFlowValue = (name, value) => flowPage.style.setProperty(name, value);
      if (panelResizeAbort) panelResizeAbort.abort();
      panelResizeAbort = new AbortController();
      if (prefersReducedMotion()) {
        setFlowValue('--wiki-flow-dismiss', '0');
        setFlowValue('--wiki-flow-opacity', '1');
        setFlowValue('--wiki-flow-y', '0px');
        setFlowValue('--wiki-flow-blur', '0px');
        return;
      }
      let queued = false;
      const update = () => {
        queued = false;
        const rect = flowHero.getBoundingClientRect();
        const range = Math.max(220, rect.height * 0.72);
        const progress = Math.max(0, Math.min(1, -rect.top / range));
        setFlowValue('--wiki-flow-dismiss', progress.toFixed(3));
        setFlowValue('--wiki-flow-opacity', (1 - progress * 0.58).toFixed(3));
        setFlowValue('--wiki-flow-y', `${(-18 * progress).toFixed(2)}px`);
        setFlowValue('--wiki-flow-blur', `${(1.8 * progress).toFixed(2)}px`);
      };
      const queue = () => {
        if (queued) return;
        queued = true;
        window.requestAnimationFrame(update);
      };
      window.addEventListener('scroll', queue, { passive: true, signal: panelResizeAbort.signal });
      window.addEventListener('resize', queue, { signal: panelResizeAbort.signal });
      update();
    };

      if (customSaveTimer) window.clearTimeout(customSaveTimer);

        wikiStylePrompt = normalizeWikiStylePrompt(customInput?.value || wikiStylePrompt);
        localStorage.setItem(WIKI_CUSTOM_FORMAT_KEY, wikiStylePrompt);
        localStorage.setItem(WIKI_CUSTOM_FORMAT_SAVED_AT_KEY, String(Date.now()));
        setCustomStatus(wikiStylePrompt ? 'Saved automatically in this browser.' : 'Draft cleared from this browser.', wikiStylePrompt ? 'success' : '');
      };
      if (opts.immediate) {
        save();
        return;
      }
      setCustomStatus('Saving draft locally...', 'saving');
      customSaveTimer = window.setTimeout(save, 360);

    const syncCustomPanel = () => {

      customPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
      customPanelControls().forEach((control) => {
        control.disabled = !open;

      if ('inert' in customPanel) customPanel.inert = !open;
      if (open) {
        customPanel.hidden = false;
        customPanel.classList.add('is-opening');
        window.requestAnimationFrame(() => {

          customPanel.classList.remove('is-opening');

        setCustomStatus(savedCustomPromptMessage(), wikiStylePrompt ? 'success' : '');

      const parsedRefs = [];
      const seen = new Set(wikiRefs.map(wikiRepoKey));

        if (!parsed) {

        if (seen.has(key)) {

          return false;

        seen.add(key);
        parsedRefs.push(parsed);

        if (wikiAddRepoInput) wikiAddRepoInput.value = '';
        closeWikiAddRepoPopover();
        focusWikiRepoInput();
      }
    };

    async function loadWikiLibrary() {
      count.textContent = 'Loading';
      list.innerHTML = '<div class="empty">Loading...</div>';
      try {
        const { wikis, activeRuns = [] } = await fetchJSON('/api/wikis');
        const activeCount = activeRuns.length;
        const stalledCount = activeRuns.filter((run) => run.state === 'stalled').length;
        count.textContent = activeCount
          ? `${activeCount - stalledCount} running${stalledCount ? ` · ${stalledCount} stalled` : ''} · ${wikis.length} saved`
          : `${wikis.length} wiki${wikis.length === 1 ? '' : 's'}`;
        if (!activeRuns.length && !wikis.length) {
          list.innerHTML = '<div class="wiki-empty-state">No wikis yet.</div>';
          return;
        }
        list.innerHTML = [
          ...activeRuns.map(renderWikiActiveLibraryItem),
          ...wikis.map(renderWikiLibraryItem),
        ].join('');
        bindWikiActiveRunActions(list, activeRuns);
        list.querySelectorAll('[data-wiki-regenerate]').forEach((button) => {
          button.addEventListener('click', () => {
            setWikiReposFromText(button.dataset.wikiRegenerate || '');
            wikiPageCount = normalizeWikiPageCount(
              button.dataset.wikiPageCount,
              defaultWikiPageCountForDepth(button.dataset.wikiDepth),
            );
            wikiStyle = normalizeWikiStyle(button.dataset.wikiStyle);
            wikiStylePrompt = normalizeWikiStylePrompt(button.dataset.wikiStylePrompt);
            if (customInput) customInput.value = wikiStylePrompt;
            if (channelById(button.dataset.wikiStructureChannel)) {
              selectedWikiStructureChannelId = button.dataset.wikiStructureChannel;
              localStorage.setItem(WIKI_STRUCTURE_CHANNEL_KEY, selectedWikiStructureChannelId);
            }
            if (channelById(button.dataset.wikiPageChannel)) {
              selectedWikiPageChannelId = button.dataset.wikiPageChannel;
              localStorage.setItem(WIKI_PAGE_CHANNEL_KEY, selectedWikiPageChannelId);
            }
            localStorage.setItem(WIKI_STYLE_KEY, wikiStyle);
            if (wikiStylePrompt) persistCustomFormatPrompt({ immediate: true });
            renderPageCount();
            renderStyle();
            renderWikiModelPickers();
            syncCustomPanel();
            form.scrollIntoView({ block: 'start', behavior: prefersReducedMotion() ? 'auto' : 'smooth' });
            focusWikiRepoInput();
          });
        });
      } catch (e) {
        count.textContent = 'Error';
        list.innerHTML = `<div class="error-banner">Failed to load wikis: ${escapeHtml(e.message)}</div>`;
      }
    }

    pageCountSlider?.addEventListener('input', () => {
      wikiPageCount = normalizeWikiPageCount(pageCountSlider.value);
      renderPageCount();
    });
    pageCountInput?.addEventListener('input', () => {
      const raw = Number(pageCountInput.value);
      if (Number.isFinite(raw) && raw >= 6 && raw <= 30) {
        wikiPageCount = normalizeWikiPageCount(raw);
        renderPageCount();
      }
    });
    pageCountInput?.addEventListener('blur', () => {
      wikiPageCount = normalizeWikiPageCount(pageCountInput.value);
      renderPageCount();
    });
    renderPageCount();
    renderWikiScopeList();
    if (initialRepoInput) {
      addWikiReposFromText(initialRepoInput, {
        showError: setWikiInlineRepoError,
        preferLocal: preferInitialLocalRepoInput,
      });
      window.setTimeout(() => jumpToWikiTarget(createStart), 0);
    }
    renderStyle();
    renderWikiRuntime();
    syncCustomPanel();
    wikiAddRepoTrigger?.addEventListener('click', (event) => {
      event.stopPropagation();
      const open = !wikiAddRepoPopover?.classList.contains('open');
      if (open) openWikiAddRepoPopover();
      else closeWikiAddRepoPopover();
    });
    wikiAddRepoPopover?.addEventListener('click', (event) => event.stopPropagation());
    window.addEventListener('click', closeWikiAddRepoPopover, { signal: panelResizeAbort?.signal });
    wikiAddRepoConfirm?.addEventListener('click', addWikiRepoFromPopover);
    wikiAddRepoCancel?.addEventListener('click', closeWikiAddRepoPopover);
    wikiAddRepoInput?.addEventListener('input', () => setWikiAddRepoError(''));
    wikiAddRepoInput?.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        addWikiRepoFromPopover();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        closeWikiAddRepoPopover();
        wikiAddRepoTrigger?.focus();
      }
    });
    wikiLocalRepoTrigger?.addEventListener('click', pickLocalWikiRepo);
    customInput?.addEventListener('input', () => {
      wikiStylePrompt = normalizeWikiStylePrompt(customInput.value);
      persistCustomFormatPrompt();
    });
    tuneButton?.addEventListener('click', async () => {
      if (!customInput) return;
      const draft = normalizeWikiStylePrompt(customInput.value);
      if (!draft) {
        setCustomStatus('Write a rough format idea first.', 'error');
        customInput.focus();
        return;
      }
      tuneButton.disabled = true;
      setCustomStatus('Tuning with the selected model...');
      try {
        const data = await postJSONWithSecrets('/api/wiki/format/tune', { prompt: draft, channel: selectedChannelId });
        wikiStylePrompt = normalizeWikiStylePrompt(data.prompt);
        customInput.value = wikiStylePrompt;
        persistCustomFormatPrompt({ immediate: true });
        wikiStyle = 'custom';
        localStorage.setItem(WIKI_STYLE_KEY, wikiStyle);
        renderStyle();
        syncCustomPanel();
        setCustomStatus('Tuned. Edit anything before generating.', 'success');
      } catch (e) {
        setCustomStatus(`Could not tune: ${e.message}`, 'error');
      } finally {
        tuneButton.disabled = false;
      }
    });
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const urls = wikiRepoUrls();
      if (!urls.length) {
        setWikiInlineRepoError('Add at least one repository source.');
        focusWikiRepoInput();
        return;
      }
      wikiStylePrompt = normalizeWikiStylePrompt(customInput?.value || wikiStylePrompt);
      if (wikiStyle === 'custom' && !wikiStylePrompt) {
        setCustomStatus('Write a custom format prompt before generating.', 'error');
        customInput?.focus();
        return;
      }
      persistCustomFormatPrompt({ immediate: true });
      wikiPageCount = normalizeWikiPageCount(pageCountInput?.value || wikiPageCount);
      renderPageCount();
      syncWikiChannelDefaults();
      startGenerate(urls, {
        pageCount: wikiPageCount,
        style: wikiStyle,
        stylePrompt: wikiStylePrompt,
        runtime: selectedWikiRuntime,
        structureChannel: selectedWikiStructureChannelId,
        pageChannel: selectedWikiPageChannelId,
      });
    });
    document.getElementById('wiki-library-refresh')?.addEventListener('click', loadWikiLibrary);
    root.querySelector('[data-wiki-jump-create]')?.addEventListener('click', () => jumpToWikiTarget(createStart, true));
    root.querySelector('[data-wiki-jump-library]')?.addEventListener('click', () => jumpToWikiTarget(librarySection));
    setupWikiFlowDismissal();

    await loadChannels();
    renderWikiRuntime();
    renderWikiModelPickers();
    await loadWikiLibrary();
  }

  // Model of a running agent — one for the structure phase, N for pages.
  class AgentCard {
    constructor(id, kind, title, opts = {}) {
      this.id = id;
      this.kind = kind;                 // 'structure' | 'page'
      this.title = title;
      this.autoOpenOnActivity = opts.autoOpenOnActivity !== false;
      this.autoOpenOnError = opts.autoOpenOnError !== false;
      this.onToggle = typeof opts.onToggle === 'function' ? opts.onToggle : null;
      this.onBeforeCopy = typeof opts.onBeforeCopy === 'function' ? opts.onBeforeCopy : null;
      this.transcriptScrollMode = opts.transcriptScrollMode || 'page';
      this.requiresExplicitInspect = opts.requiresExplicitInspect === true;
      this.presentation = opts.presentation === 'rlm' ? 'rlm' : 'agent';
      this.channelId = opts.channelId || null;
      this.channelLabel = opts.channelLabel || channelLabelFor(this.channelId);
      this.status = 'pending';          // 'pending' | 'running' | 'done' | 'error'
      this.steps = [];                  // [{step, reasoning, code, output, resultType, ts}]
      this.logs = [];                   // [{kind, message, tool, reasoning, input, output, error, durationMs, ts}]
      this.deferredStats = { logs: 0, actions: 0, steps: 0 };
      this.deferredToolIds = new Set();
      this.tokens = 0;
      this.calls = 0;
      this.charCount = 0;
      this.error = null;
      this.liveThinkingText = '';
      this.liveThinkingFullText = '';
      this.liveThinkingFrame = null;
      this.liveResponseText = '';
      this.liveProbeTarget = '';
      this.liveProbeShown = '';
      this.liveProbeFrame = null;
      this.liveJITEl = null;
      this.liveTranscriptEl = null;
      this.liveTranscriptText = '';
      this.liveTranscriptFrame = null;
      this.replayStreams = [];
      this.liveResponseEventCount = 0;
      this.liveThinkingEventCount = 0;
      this.activityGroups = [];
      this.currentActivityGroup = null;
      this.toolActivities = new Map();
      this.rlmOperations = [];
      this.rlmOperationById = new Map();
      this.rlmProbePaintedText = '';
      this.statusQueue = [];
      this.statusFlushTimer = null;
      this.lastStatusMessage = '';
      this.open = typeof opts.open === 'boolean' ? opts.open : kind === 'structure'; // structure agent open by default
      this.el = this.build();
    }

    setChannel(channelId) {
      this.channelId = channelId || this.channelId;
      this.channelLabel = channelLabelFor(this.channelId);
      this.el.dataset.agentChannel = this.channelId || '';
      this.el.dataset.agentChannelLabel = this.channelLabel || '';
    }

    reasoningLabel() {
      return this.channelLabel || channelLabelFor(this.channelId);
    }

    build() {
      const card = document.createElement('div');
      const isRlm = this.presentation === 'rlm';
      card.className = `agent-card agent-card-${this.presentation}`;
      card.dataset.agentKind = this.kind;
      card.dataset.agentPresentation = this.presentation;
      card.dataset.agentChannel = this.channelId || '';
      card.dataset.agentChannelLabel = this.channelLabel || '';
      if (this.open) card.classList.add('open');
      const copyLabel = isRlm ? 'copy process' : 'copy logs';
      const copyTitle = isRlm ? 'Copy reasoning and probes' : 'Copy agent logs';
      const bodyMarkup = isRlm
        ? `
          <div class="agent-active empty" data-role="active"></div>
          <div class="agent-trail" data-role="trail"></div>
          <div class="agent-empty" data-role="empty">waiting for first agent event...</div>
          <button class="agent-expand-btn" data-role="expand" style="display:none">show full history ▾</button>
        `
        : `
          <div class="agent-transcript" data-role="transcript">
            <div class="agent-empty" data-role="empty">waiting for first agent event...</div>
            <div class="agent-transcript-stream" data-role="transcript-stream"></div>
          </div>
          <div class="agent-trail" data-role="trail" hidden></div>
          <div class="agent-active empty" data-role="active" hidden></div>
          <button class="agent-expand-btn" data-role="expand" style="display:none">show full history ▾</button>
        `;
      card.innerHTML = `
        <div class="agent-card-head">
          <span class="agent-chevron">▸</span>
          <span class="agent-badge ${this.kind}">${this.kind}</span>
          <span class="agent-badge ${this.status}" data-role="status-badge">${this.statusLabel()}</span>
          <span class="agent-title" data-role="title">${escapeHtml(this.title)}</span>
          <span class="agent-meta" data-role="meta"></span>
          <button class="agent-copy-btn" data-role="copy-process" type="button" aria-label="${copyTitle}" title="${copyTitle}" disabled>${copyLabel}</button>
        </div>
        <div class="agent-body" data-role="body">
          ${bodyMarkup}
        </div>
      `;
      const head = card.querySelector('.agent-card-head');
      head.setAttribute('aria-expanded', String(this.open));
      head.addEventListener('click', () => {
        this.setOpen(!this.open, { inspect: this.requiresExplicitInspect && !this.open });
      });
      const expandBtn = card.querySelector('[data-role="expand"]');
      expandBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        this.expanded = !this.expanded;
        card.classList.toggle('expanded', this.expanded);
        expandBtn.textContent = this.expanded ? 'collapse history ▴' : 'show full history ▾';
        this._syncHistoryDisclosureState();
        // Prism was skipped on trail rows to avoid work before expansion.
        // Now that the code blocks are visible, highlight them in one pass.
        if (this.expanded && window.Prism) {
          const trail = card.querySelector('[data-role="trail"]');
          if (trail) Prism.highlightAllUnder(trail);
        }
      });
      const copyBtn = card.querySelector('[data-role="copy-process"]');
      copyBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (this.onBeforeCopy) this.onBeforeCopy(this);
        this._copyProcessToClipboard(copyBtn);
      });
      this._updateCopyButtonState();
      return card;
    }

    _syncHistoryDisclosureState() {
      this.el.querySelectorAll('.agent-code-disclosure').forEach((details) => {
        details.open = Boolean(this.expanded);
      });
    }

    setOpen(open, opts = {}) {
      const next = Boolean(open);
      this.open = next;
      if (this.el) {
        this.el.classList.toggle('open', next);
        if (this.requiresExplicitInspect) {
          this.el.classList.toggle('inspecting', next && opts.inspect === true);
        }
        this.el.querySelector('.agent-card-head')?.setAttribute('aria-expanded', String(next));
      }
      if (!opts.silent && this.onToggle) this.onToggle(this, next);
    }

    statusLabel() {
      if (this.status === 'pending') return 'queued';
      if (this.status === 'running') return 'running';
      if (this.status === 'done') return 'done';
      if (this.status === 'error') return 'error';
      return this.status;
    }

    unitLabel(index) {
      return `${this.presentation === 'rlm' ? 'PROBE' : 'STEP'} ${index}`;
    }

    setStatus(s) {
      this.status = s;
      this.el.classList.toggle('running', s === 'running');
      const badge = this.el.querySelector('[data-role="status-badge"]');
      badge.className = `agent-badge ${s}`;
      badge.textContent = this.statusLabel();
    }

    updateMeta() {
      const parts = [];
      const stepCount = Math.max(this.steps.length, this.deferredStats.steps || 0);
      let logCount = 0;
      if (this.presentation === 'agent') {
        logCount = Math.max(this.logs.length, this.deferredStats.logs || 0);
        const activityCount = Math.max(
          this.activityGroups.reduce((sum, group) => sum + group.items.length, 0),
          this.deferredStats.actions || 0,
        );
        if (logCount) parts.push(`${logCount} log${logCount === 1 ? '' : 's'}`);
        if (activityCount) parts.push(`${activityCount} action${activityCount === 1 ? '' : 's'}`);
      } else {
        const operationCount = Math.max(this.rlmOperations.length, this.deferredStats.actions || 0);
        if (operationCount) parts.push(`${operationCount} ${plural('event', operationCount)}`);
      }
      if (stepCount) parts.push(`${stepCount} ${this.presentation === 'rlm' ? plural('probe', stepCount) : plural('step', stepCount)}`);
      if (!stepCount && !logCount) {
        const eventRows = this.el.querySelectorAll('[data-role="trail"] .agent-trail-row').length;
        if (eventRows) parts.push(`${eventRows} event${eventRows === 1 ? '' : 's'}`);
      }
      if (this.tokens) parts.push(`${formatNum(this.tokens)} tok`);
      if (this.charCount) parts.push(`${formatNum(this.charCount)} chars`);
      this.el.querySelector('[data-role="meta"]').textContent = parts.join(' · ');
      this._updateCopyButtonState();
    }

    noteDeferredEvent(event) {
      if (!event) return;
      let changed = false;
      if (event.type === 'step') {
        this.deferredStats.steps += 1;
        changed = true;
      } else if (event.type === 'agent-log') {
        const log = normalizeAgentLog(event);
        if (log.kind === 'reasoning') return;
        if (log.message || log.reasoning || log.input || log.output || log.error) {
          this.deferredStats.logs += 1;
          changed = true;
        }
        if (log.kind === 'tool-input' || log.kind === 'tool-output' || log.kind === 'tool-error') {
          const key = log.id || `${log.tool || 'tool'}:${log.input || log.message || this.deferredToolIds.size}`;
          if (!this.deferredToolIds.has(key)) {
            this.deferredToolIds.add(key);
            this.deferredStats.actions += 1;
            changed = true;
          }
        }
      } else if (event.type === 'submit') {
        this.deferredStats.logs += 1;
        changed = true;
      }
      if (changed) this.updateMeta();
    }

    _copyEntries() {
      const entries = this.steps.map((entry) => ({
        step: entry.step,
        summary: summarizeEntry(entry),
        reasoning: this.presentation === 'rlm' ? (entry.reasoning || '').trim() : '',
        code: (entry.code || '').trim(),
        live: false,
      }));
      const liveCode = (this.liveProbeTarget || '').trim();
      const liveReasoning = this.presentation === 'rlm' ? (this.liveThinkingFullText || '').trim() : '';
      if (liveCode || liveReasoning) {
        entries.push({
          step: this.steps.length + 1,
          summary: 'live probe',
          reasoning: liveReasoning,
          code: liveCode,
          live: true,
        });
      }
      return entries.filter((entry) => entry.reasoning || entry.code);
    }

    _copyLogEntries() {
      return this.logs
        .map((entry, i) => ({
          index: i + 1,
          kind: entry.kind || 'message',
          id: (entry.id || '').trim(),
          message: (entry.message || '').trim(),
          tool: (entry.tool || '').trim(),
          reasoning: (entry.reasoning || '').trim(),
          input: (entry.input || '').trim(),
          output: (entry.output || '').trim(),
          error: (entry.error || '').trim(),
          durationMs: entry.durationMs,
        }))
        .filter((entry) => entry.message || entry.reasoning || entry.input || entry.output || entry.error);
    }

    _clipboardProcessText() {
      const logs = this._copyLogEntries();
      const entries = this._copyEntries();
      const replayStreams = Array.isArray(this.replayStreams) ? this.replayStreams : [];
      if (!logs.length && !entries.length && !replayStreams.length) return '';
      const title = this.el?.querySelector('[data-role="title"]')?.textContent?.trim() || this.title || 'Agent logs';
      const header = [
        title,
        logs.length ? `${logs.length} log${logs.length === 1 ? '' : 's'}` : '',
        entries.length ? `${entries.length} step${entries.length === 1 ? '' : 's'}` : '',
      ].filter(Boolean);
      const logBody = logs.map((entry) => {
        const parts = [`Log ${entry.index} · ${entry.kind}${entry.tool ? ` · ${entry.tool}` : ''}`];
        if (entry.message) parts.push(`Message\n${entry.message}`);
        if (entry.reasoning) parts.push(`Reasoning\n${entry.reasoning}`);
        if (entry.input) parts.push(`Tool input\n${entry.input}`);
        if (entry.output) parts.push(`Tool output\n${entry.output}`);
        if (entry.error) parts.push(`Error\n${entry.error}`);
        if (typeof entry.durationMs === 'number') parts.push(`Duration\n${entry.durationMs}ms`);
        return parts.join('\n\n');
      });
      const stepBody = entries.map((entry) => {
        const parts = [`Step ${entry.step}${entry.live ? ' (live)' : ''}`];
        if (entry.summary) parts.push(`Summary\n${entry.summary}`);
        if (entry.reasoning) parts.push(`Reasoning\n${entry.reasoning}`);
        if (entry.code) parts.push(`Probe code\n${entry.code}`);
        return parts.join('\n\n');
      });
      const streamBody = replayStreams.map((entry, i) => {
        const parts = [`Stream ${i + 1}${entry.eventCount ? ` · ${entry.eventCount} event${entry.eventCount === 1 ? '' : 's'}` : ''}`];
        if (entry.thinking) parts.push(`Thinking\n${entry.thinking}`);
        if (entry.text) parts.push(`Text\n${entry.text}`);
        return parts.join('\n\n');
      });
      const sections = [];
      if (logBody.length) sections.push(logBody.join('\n\n---\n\n'));
      if (stepBody.length) sections.push(stepBody.join('\n\n---\n\n'));
      if (streamBody.length) sections.push(streamBody.join('\n\n---\n\n'));
      return `${header.join('\n')}\n\n${sections.join('\n\n===\n\n')}`;
    }

    _updateCopyButtonState() {
      const btn = this.el?.querySelector('[data-role="copy-process"]');
      if (!btn) return;
      const hasDeferredCopy = Boolean((this.deferredStats.logs || 0) || (this.deferredStats.steps || 0));
      btn.disabled = !hasDeferredCopy && !this._clipboardProcessText();
    }

    async _copyProcessToClipboard(btn) {
      const text = this._clipboardProcessText();
      if (!text) {
        this._updateCopyButtonState();
        return;
      }
      const previous = btn.textContent;
      btn.disabled = true;
      btn.classList.remove('copied', 'failed');
      try {
        await copyText(text);
        btn.textContent = 'copied';
        btn.classList.add('copied');
      } catch {
        btn.textContent = 'failed';
        btn.classList.add('failed');
      }
      window.setTimeout(() => {
        btn.textContent = previous || (this.presentation === 'rlm' ? 'copy process' : 'copy logs');
        btn.classList.remove('copied', 'failed');
        this._updateCopyButtonState();
      }, 1400);
    }

    addStep(ev, opts = {}) {
      const replay = opts.replay === true;
      this._clearStatusQueue();
      const transition = replay ? null : this._captureStepTransition();
      const streamedReasoning = this.liveThinkingFullText.trim();
      const liveToolStrip = this._detachLiveToolStrip();
      this.clearLiveStep();

      const body = this.el.querySelector('[data-role="body"]');
      const empty = body.querySelector('[data-role="empty"]');
      if (empty) empty.style.display = 'none';

      // Use a 1-based local display index, not the backend agent's internal step id.
      // The first backend "step" is often an environment/load pass that we route
      // to the status strip (not addStep), so its first real step ends up
      // being step 2 in its numbering. Renumbering locally keeps users from
      // seeing the confusing "STEP 2" as the first visible row.
      const classifiedStep = classifyAgentStep({
        reasoning: this._mergeReasoning(streamedReasoning, ev.reasoning),
        code: (ev.code || '').trim(),
        output: (ev.output || '').trim(),
        resultType: ev.resultType || '',
      });
      const entry = {
        step: this.steps.length + 1,
        reasoning: classifiedStep.reasoning,
        code: classifiedStep.code,
        output: classifiedStep.output,
        resultType: ev.resultType || '',
        ts: new Date(),
      };
      this.steps.push(entry);
      this.tokens = ev.tokenUsage?.totalTokens || this.tokens;
      this.calls = ev.tokenUsage?.calls || this.calls;
      if (this.presentation === 'agent') {
        const compactReasoning = compactReasoningForTranscript(entry.reasoning);
        if (!streamedReasoning && compactReasoning) {
          this._appendTranscriptThought(compactReasoning, { reasoning: true });
        } else if (!streamedReasoning && entry.code) {
          this._appendTranscriptThought(summarizeEntry(entry));
        }
      }

      this._demoteActiveToTrail();
      this._renderActive(entry);
      if (liveToolStrip) this._insertToolStrip(liveToolStrip);
      this._applyTrailFade();

      // Show the expand button once there's any history worth expanding.
      const btn = this.el.querySelector('[data-role="expand"]');
      if (this.steps.length > 1 || this.el.querySelector('[data-role="trail"] .agent-trail-row')) btn.style.display = '';

      this.updateMeta();

      // After rendering the step, kick off a "thinking…" placeholder that
      // tells the user we're waiting on the next LLM response. If the agent
      // submits, this gets cleared by markDone().
      if (entry.resultType !== 'submit' && !replay && this.status !== 'done' && this.status !== 'error') {
        this._showThinking();
      }
      if (!replay) this._playStepTransition(transition);
    }

    addLiveThinkingDelta(delta) {
      if (!delta) return;
      this.liveThinkingEventCount += 1;
      if (this.presentation === 'rlm') {
        const panel = this._ensureLiveThinkingPanel();
        this.liveThinkingFullText += delta;
        this.liveThinkingText = this.liveThinkingFullText;
        const cap = 6000;
        if (this.liveThinkingText.length > cap) {
          this.liveThinkingText = '…' + this.liveThinkingText.slice(-cap);
        }
        this._updateCopyButtonState();
        if (!this.liveThinkingFrame) {
          this.liveThinkingFrame = requestAnimationFrame(() => {
            this.liveThinkingFrame = null;
            const text = panel.querySelector('[data-role="live-thinking-text"]');
            if (text) {
              const scroll = panel.querySelector('[data-role="live-thinking-scroll"]');
              const shouldStickToBottom = !scroll || scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 28;
              text.textContent = compactLiveIntentText(this.liveThinkingText) || 'Waiting for the agent to declare its next move.';
              if (scroll && shouldStickToBottom) scroll.scrollTop = scroll.scrollHeight;
            }
          });
        }
        return;
      }
      this.liveThinkingFullText += delta;
      this.liveThinkingText = this.liveThinkingFullText;
      const cap = 6000;
      if (this.liveThinkingText.length > cap) {
        this.liveThinkingText = '…' + this.liveThinkingText.slice(-cap);
      }
      this._updateCopyButtonState();
    }

    addLiveProbeDelta(delta) {
      if (!delta) return;
      this.liveResponseEventCount += 1;
      if (this.presentation === 'rlm') {
        this._ensureLiveStep('composing');
        this.liveResponseText += delta;
        const rawCap = 30000;
        if (this.liveResponseText.length > rawCap) {
          this.liveResponseText = this.liveResponseText.slice(-rawCap);
        }
        const code = extractRlmStreamingProbeCode(this.liveResponseText);
        if (code && code !== this.liveProbeTarget) {
          this._setRlmProbeCode(code, { state: 'writing code' });
        }
        this._updateCopyButtonState();
        return;
      }
      this.liveResponseText += delta;
      const rawCap = 30000;
      if (this.liveResponseText.length > rawCap) {
        this.liveResponseText = this.liveResponseText.slice(-rawCap);
      }
      if (this.presentation === 'agent') this._appendLiveTranscriptDelta(delta, 'message');
      const code = extractLiveProbeCode(this.liveResponseText);
      if (code && code !== this.liveProbeTarget) {
        this.liveProbeTarget = code;
        this._ensureLiveProbePanel();
        this._scheduleLiveProbeReveal();
        this._updateCopyButtonState();
      }
    }

    replaceLiveProbeText(text) {
      const replacement = String(text || '');
      this.liveResponseEventCount += 1;
      this.liveResponseText = replacement.slice(-30000);
      if (this.presentation === 'rlm') {
        this._ensureLiveStep('composing');
        const code = extractRlmStreamingProbeCode(this.liveResponseText);
        if (code && code !== this.liveProbeTarget) {
          this._setRlmProbeCode(code, { state: 'writing code' });
        }
        this._updateCopyButtonState();
        return;
      } else this._replaceLiveTranscriptText(this.liveResponseText, 'message');
      const code = extractLiveProbeCode(this.liveResponseText);
      if (code && code !== this.liveProbeTarget) {
        this.liveProbeTarget = code;
        this._ensureLiveProbePanel();
        this._scheduleLiveProbeReveal();
        this._updateCopyButtonState();
      }
    }

    markLiveProbeRunning() {
      if (this.presentation === 'agent') {
        this._settleLiveTranscript();
        return;
      }
      this._flushLiveProbeReveal();
      const active = this.el.querySelector('[data-role="active"]');
      const pill = active?.querySelector('.agent-active-live');
      if (pill && active?.dataset.liveOnly === '1') {
        pill.classList.remove('thinking');
        pill.classList.add('running');
        pill.textContent = 'running';
      }
      const evidence = active?.querySelector('[data-role="live-evidence"]');
      if (evidence) evidence.textContent = 'running probe · output will compact after execution';
    }

    _transcriptStream() {
      return this.el.querySelector('[data-role="transcript-stream"]');
    }

    _hideTranscriptEmpty() {
      const empty = this.el.querySelector('[data-role="empty"]');
      if (empty) empty.style.display = 'none';
      if (this.autoOpenOnActivity) this.setOpen(true, { silent: true });
    }

    _appendTranscriptThought(text, opts = {}) {
      const clean = transcriptProseText(text);
      if (!clean) return null;
      this._hideTranscriptEmpty();
      this._closeCurrentActivityGroup();
      const stream = this._transcriptStream();
      if (!stream) return null;
      const block = document.createElement('div');
      block.className = `agent-transcript-thought${opts.live ? ' live' : ''}${opts.reasoning ? ' reasoning' : ''}${opts.muted ? ' muted' : ''}`;
      block.dataset.role = opts.live ? 'live-transcript' : 'transcript-thought';
      block.innerHTML = renderTranscriptText(clean);
      stream.appendChild(block);
      this._scrollTranscriptIntoView(block);
      return block;
    }

    _appendLiveTranscriptDelta(delta, kind = 'message') {
      const cleanDelta = String(delta || '');
      if (!cleanDelta) return;
      this._hideTranscriptEmpty();
      this.liveTranscriptText += cleanDelta;
      this._ensureLiveTranscriptElement(kind);
      if (!this.liveTranscriptFrame) {
        this.liveTranscriptFrame = requestAnimationFrame(() => {
          this.liveTranscriptFrame = null;
          this._paintLiveTranscript();
        });
      }
    }

    _replaceLiveTranscriptText(text, kind = 'message') {
      this._hideTranscriptEmpty();
      this.liveTranscriptText = String(text || '');
      this._ensureLiveTranscriptElement(kind);
      if (this.liveTranscriptFrame) cancelAnimationFrame(this.liveTranscriptFrame);
      this.liveTranscriptFrame = requestAnimationFrame(() => {
        this.liveTranscriptFrame = null;
        this._paintLiveTranscript();
      });
    }

    _ensureLiveTranscriptElement(kind = 'message') {
      if (!this.liveTranscriptEl || !this.liveTranscriptEl.isConnected) {
        this._closeCurrentActivityGroup();
        const stream = this._transcriptStream();
        this.liveTranscriptEl = document.createElement('div');
        this.liveTranscriptEl.className = `agent-transcript-thought live${kind === 'reasoning' ? ' reasoning' : ''}`;
        this.liveTranscriptEl.dataset.role = 'live-transcript';
        stream?.appendChild(this.liveTranscriptEl);
      }
    }

    _paintLiveTranscript() {
      if (!this.liveTranscriptEl) return;
      const clean = compactReasoningForTranscript(this.liveTranscriptText, 420);
      if (!clean) {
        this.liveTranscriptEl.innerHTML = '';
        return;
      }
      this.liveTranscriptEl.innerHTML = renderTranscriptText(clean);
      this._scrollTranscriptIntoView(this.liveTranscriptEl);
    }

    _settleLiveTranscript(replacement = '') {
      if (this.liveTranscriptFrame) {
        cancelAnimationFrame(this.liveTranscriptFrame);
        this.liveTranscriptFrame = null;
      }
      const rawText = replacement || this.liveTranscriptText;
      const text = replacement ? transcriptProseText(rawText) : compactReasoningForTranscript(rawText);
      if (this.liveTranscriptEl?.isConnected) {
        if (text) {
          this.liveTranscriptEl.classList.remove('live');
          this.liveTranscriptEl.innerHTML = renderTranscriptText(text);
        } else {
          this.liveTranscriptEl.remove();
        }
      } else if (text) {
        this._appendTranscriptThought(text);
      }
      this.liveTranscriptEl = null;
      this.liveTranscriptText = '';
    }

    _closeCurrentActivityGroup() {
      if (!this.currentActivityGroup) return;
      this.currentActivityGroup.el.removeAttribute('open');
      this.currentActivityGroup = null;
    }

    _ensureActivityGroup() {
      if (this.currentActivityGroup) return this.currentActivityGroup;
      this._hideTranscriptEmpty();
      const stream = this._transcriptStream();
      const group = {
        id: `activity-${this.activityGroups.length + 1}`,
        items: [],
        el: document.createElement('details'),
        summaryEl: null,
        linesEl: null,
      };
      group.el.className = `agent-activity-group${this.presentation === 'rlm' ? ' agent-evidence-group' : ''}`;
      group.el.open = true;
      group.el.innerHTML = `
        <summary>
          <span data-role="activity-summary">${this.presentation === 'rlm' ? 'Evidence' : 'Working...'}</span>
        </summary>
        <div class="agent-activity-lines" data-role="activity-lines"></div>
      `;
      group.summaryEl = group.el.querySelector('[data-role="activity-summary"]');
      group.linesEl = group.el.querySelector('[data-role="activity-lines"]');
      stream?.appendChild(group.el);
      this.activityGroups.push(group);
      this.currentActivityGroup = group;
      this._scrollTranscriptIntoView(group.el);
      return group;
    }

    _recordToolStart(log) {
      const id = log.id || `${log.tool || 'tool'}-${this.toolActivities.size + 1}`;
      if (!this.toolActivities.has(id)) {
        this.toolActivities.set(id, {
          id,
          tool: log.tool || 'tool',
          kind: 'tool',
          input: '',
          output: '',
          error: '',
          durationMs: log.durationMs ?? null,
          lineEl: null,
        });
      }
    }

    _recordToolInput(log) {
      const id = log.id || `${log.tool || 'tool'}-${this.toolActivities.size + 1}`;
      const existing = this.toolActivities.get(id) || {
        id,
        tool: log.tool || 'tool',
        kind: 'tool',
        input: '',
        output: '',
        error: '',
        durationMs: null,
        lineEl: null,
      };
      existing.input = log.input || existing.input || '';
      const classified = classifyToolActivity(existing.tool, existing.input, existing.output || existing.error);
      if (!(classified.pending && existing.summary && existing.summary !== 'file')) {
        Object.assign(existing, classified);
      }
      this.toolActivities.set(id, existing);
      this._renderToolActivity(existing);
    }

    _recordToolDone(log) {
      const id = log.id || `${log.tool || 'tool'}-${this.toolActivities.size + 1}`;
      const existing = this.toolActivities.get(id) || {
        id,
        tool: log.tool || 'tool',
        kind: 'tool',
        input: log.input || '',
        output: '',
        error: '',
        durationMs: null,
        lineEl: null,
      };
      existing.output = log.output || existing.output || '';
      existing.error = log.error || existing.error || '';
      existing.durationMs = log.durationMs ?? existing.durationMs;
      const classified = classifyToolActivity(existing.tool, existing.input, existing.output || existing.error);
      if (!(classified.pending && existing.summary && existing.summary !== 'file')) {
        Object.assign(existing, classified);
      }
      this.toolActivities.set(id, existing);
      this._renderToolActivity(existing);
    }

    addSyntheticEditActivity(edit, opts = {}) {
      const path = String(edit?.path || '').trim();
      if (!path) return;
      const id = edit.id || `diff-edit:${path}`;
      const delta = editLineDeltaLabel(edit);
      const summary = `${truncatePath(path)}${delta ? ` ${delta}` : ''}`;
      const duplicate = Array.from(this.toolActivities.values()).some((activity) => (
        activity.kind === 'edit'
        && (activity.path === path || String(activity.summary || '').startsWith(truncatePath(path)))
      ));
      if (duplicate && !this.toolActivities.has(id)) return;
      const existing = this.toolActivities.get(id) || {
        id,
        tool: 'Edit',
        kind: 'edit',
        input: '',
        output: '',
        error: '',
        durationMs: 0,
        lineEl: null,
      };
      Object.assign(existing, {
        path,
        kind: 'edit',
        summary,
        output: delta,
        durationMs: 0,
        pending: false,
      });
      this.toolActivities.set(id, existing);
      this._renderToolActivity(existing);
    }

    _renderToolActivity(activity) {
      if (activity.pending && !activity.lineEl) return;
      this._settleLiveTranscript();
      const group = this._ensureActivityGroup();
      if (!group.items.includes(activity)) group.items.push(activity);
      if (!activity.lineEl) {
        activity.lineEl = document.createElement('div');
        activity.lineEl.className = 'agent-activity-line';
        group.linesEl?.appendChild(activity.lineEl);
      }
      const summary = activity.summary || `${activity.tool} ${activity.input ? truncateMid(activity.input.replace(/\s+/g, ' '), 90) : ''}`.trim();
      activity.lineEl.className = `agent-activity-line ${activity.error ? 'error' : activity.durationMs != null ? 'done' : 'running'}`;
      activity.lineEl.innerHTML = `
        <span class="agent-activity-prefix">${escapeHtml(activityVerb(activity))}</span>
        <span class="agent-activity-text">${renderInlineCode(summary)}</span>
      `;
      this._refreshActivityGroup(group);
      this.updateMeta();
      this._scrollTranscriptIntoView(activity.lineEl);
    }

    _refreshActivityGroup(group) {
      const summary = summarizeActivityGroup(group.items);
      if (group.summaryEl) {
        group.summaryEl.textContent = this.presentation === 'rlm' ? `Evidence · ${summary}` : summary;
      }
    }

    _scrollTranscriptIntoView(node) {
      if (!node) return;
      if (!this.open) return;
      if (this.transcriptScrollMode === 'none') return;
      requestAnimationFrame(() => {
        if (this.transcriptScrollMode === 'local') {
          const body = this.el?.querySelector('[data-role="body"]');
          if (body) {
            this._bindLocalBodyScroll(body);
            const shouldFollow = body.dataset.stickToBottom !== '0' || this._isNearBottom(body);
            if (shouldFollow) body.scrollTop = body.scrollHeight;
          }
          return;
        }
        node.scrollIntoView({ block: 'nearest' });
      });
    }

    _ensureLiveStep(source = 'composing') {
      const body = this.el.querySelector('[data-role="body"]');
      const empty = body.querySelector('[data-role="empty"]');
      if (empty) empty.style.display = 'none';

      const active = this.el.querySelector('[data-role="active"]');
      if (active.dataset.liveOnly === '1') return active;

      const transition = this.presentation === 'rlm' ? null : this._captureStepTransition();
      if (active.dataset.step) {
        this._demoteActiveToTrail(this.steps[this.steps.length - 1]);
        this._applyTrailFade();
        const btn = this.el.querySelector('[data-role="expand"]');
        if (btn) btn.style.display = '';
      }

      active.classList.remove('empty');
      active.hidden = false;
      active.dataset.liveOnly = '1';
      delete active.dataset.step;
      delete active.dataset.ts;
      delete active.dataset.summary;
      const nextStep = this.steps.length + 1;
      const isRlm = this.presentation === 'rlm';
      active.innerHTML = isRlm
        ? this._rlmLiveTemplate()
        : `
          <div class="agent-active-head agent-live-step-head">
            <span class="agent-active-num">${escapeHtml(this.unitLabel(nextStep))}</span>
            <span class="agent-active-live thinking">${source === 'reasoning' ? 'thinking' : 'composing'}</span>
            <span class="agent-active-ts">live</span>
          </div>
          <div class="agent-live-step" data-role="live-step">
            <div class="agent-live-support" data-role="live-support"></div>
            ${this._liveProbeTemplate(nextStep)}
            <div class="agent-live-evidence" data-role="live-evidence">assembling probe · output stays compact</div>
          </div>
        `;
      if (isRlm) this._renderRlmOperations();
      this._playStepTransition(transition);
      return active;
    }

    _prefersReducedMotion() {
      return window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
    }

    _isNearBottom(el, threshold = 72) {
      if (!el) return true;
      return el.scrollHeight - el.scrollTop - el.clientHeight <= threshold;
    }

    _bindLocalBodyScroll(body) {
      if (!body || body.dataset.stickBound === '1') return;
      body.dataset.stickBound = '1';
      body.dataset.stickToBottom = '1';
      body.addEventListener('scroll', () => {
        body.dataset.stickToBottom = this._isNearBottom(body) ? '1' : '0';
      }, { passive: true });
    }

    _captureStepTransition() {
      if (this._prefersReducedMotion()) return null;
      const body = this.el.querySelector('[data-role="body"]');
      const active = this.el.querySelector('[data-role="active"]');
      const rows = Array.from(this.el.querySelectorAll('[data-role="trail"] .agent-trail-row'));
      return {
        body: body ? body.getBoundingClientRect() : null,
        active: active && !active.classList.contains('empty') ? active.getBoundingClientRect() : null,
        rows: new Map(rows.map((row) => [row.dataset.step || row.textContent.trim(), row.getBoundingClientRect()])),
      };
    }

    _playStepTransition(snapshot) {
      if (!snapshot || this._prefersReducedMotion()) return;
      if (this.presentation === 'rlm') return;
      const ease = 'cubic-bezier(0.16, 1, 0.3, 1)';
      const body = this.el.querySelector('[data-role="body"]');
      if (body && snapshot.body) {
        const nextBody = body.getBoundingClientRect();
        const fromHeight = snapshot.body.height;
        const toHeight = nextBody.height;
        if (Math.abs(fromHeight - toHeight) > 1) {
          body.style.overflow = 'hidden';
          body.style.willChange = 'height';
          const bodyAnimation = body.animate([
            { height: `${fromHeight}px` },
            { height: `${toHeight}px` },
          ], {
            duration: 620,
            easing: ease,
            fill: 'backwards',
          });
          bodyAnimation.onfinish = bodyAnimation.oncancel = () => {
            body.style.overflow = '';
            body.style.willChange = '';
          };
        }
      }

      const active = this.el.querySelector('[data-role="active"]');
      if (active && !active.classList.contains('empty')) {
        const nextRect = active.getBoundingClientRect();
        const rawY = snapshot.active ? snapshot.active.top - nextRect.top : 7;
        const fromY = Math.max(-18, Math.min(16, Number.isFinite(rawY) ? rawY : 7));
        active.animate([
          { opacity: 0.18, transform: `translateY(${fromY}px)`, filter: 'blur(1.4px)' },
          { opacity: 0.82, transform: 'translateY(1px)', filter: 'blur(0.35px)', offset: 0.72 },
          { opacity: 1, transform: 'translateY(0)', filter: 'blur(0px)' },
        ], {
          duration: 560,
          easing: ease,
          fill: 'backwards',
        });
      }

      this.el.querySelectorAll('[data-role="trail"] .agent-trail-row').forEach((row) => {
        if (row.classList.contains('fade-hidden')) return;
        const key = row.dataset.step || row.textContent.trim();
        const fromRect = snapshot.rows.get(key);
        const nextRect = row.getBoundingClientRect();
        const rawY = fromRect ? fromRect.top - nextRect.top : 5;
        const fromY = Math.max(-16, Math.min(14, Number.isFinite(rawY) ? rawY : 5));
        const toOpacity = Number(getComputedStyle(row).opacity) || 1;
        row.animate([
          { opacity: fromRect ? Math.max(toOpacity - 0.18, 0.24) : 0, transform: `translateY(${fromY}px)`, filter: 'blur(0.8px)' },
          { opacity: toOpacity, transform: 'translateY(0)', filter: 'blur(0px)' },
        ], {
          duration: fromRect ? 460 : 520,
          easing: ease,
          fill: 'backwards',
        });
      });
    }

    _mergeReasoning(streamed, finalReasoning) {
      const streamedText = (streamed || '').trim();
      const finalText = (finalReasoning || '').trim();
      if (!streamedText) return finalText;
      if (!finalText) return streamedText;
      if (streamedText === finalText) return streamedText;
      if (streamedText.includes(finalText)) return streamedText;
      if (finalText.includes(streamedText)) return finalText;
      return `${streamedText}\n\n${finalText}`;
    }

    _liveProbeTemplate(step) {
      const isRlm = this.presentation === 'rlm';
      return `
        <div class="agent-live-probe" data-role="live-probe">
          <div class="agent-live-probe-head">
            <div>
              <div class="agent-live-probe-kicker">${isRlm ? 'Writing probe.js' : 'live probe'}</div>
              <div class="agent-live-probe-title">${isRlm ? 'Exploration code' : 'Writing exploration code'}</div>
            </div>
            <span class="agent-live-probe-meta">JS · ${isRlm ? 'same sandbox' : `step ${step}`}</span>
          </div>
          <div class="agent-live-probe-scroll" data-role="live-probe-scroll">
            <pre class="agent-live-probe-code"><code class="language-javascript" data-role="live-probe-code">waiting for probe code…</code></pre>
          </div>
          <div class="agent-live-probe-foot" data-role="live-probe-foot">${isRlm ? 'waiting for executable probe' : '0 lines assembled'}</div>
        </div>
      `;
    }

    _rlmLiveTemplate() {
      return `
        <div class="agent-rlm-live" data-role="rlm-live">
          <div class="agent-rlm-live-head">
            <div class="agent-rlm-live-title">
              <span class="agent-rlm-live-dot"></span>
              <span data-role="rlm-live-title">Probing workspace</span>
            </div>
            <span class="agent-rlm-live-state" data-role="rlm-live-state">live</span>
          </div>
          <div class="agent-rlm-intent" data-role="live-thinking">
            <div class="agent-rlm-section-label">Reasoning</div>
            <div class="agent-live-thinking-scroll agent-rlm-intent-scroll" data-role="live-thinking-scroll">
              <div class="agent-live-thinking-text agent-rlm-intent-text" data-role="live-thinking-text">Waiting for the agent to declare its next move.</div>
            </div>
          </div>
          <div class="agent-live-probe agent-rlm-probe" data-role="live-probe" hidden>
            <div class="agent-live-probe-head">
              <div>
                <div class="agent-live-probe-kicker">Writing probe.js</div>
                <div class="agent-live-probe-title">Exploration code</div>
              </div>
              <span class="agent-live-probe-meta">JS · sandbox</span>
            </div>
            <div class="agent-live-probe-scroll" data-role="live-probe-scroll">
              <pre class="agent-live-probe-code"><code class="language-javascript" data-role="live-probe-code"></code></pre>
            </div>
            <div class="agent-live-probe-foot" data-role="live-probe-foot">waiting for executable probe</div>
          </div>
          <div class="agent-rlm-evidence" data-role="live-evidence">
            <div class="agent-rlm-section-label">Evidence</div>
            <div class="agent-rlm-evidence-lines" data-role="rlm-evidence-lines">
              <div class="agent-rlm-evidence-empty">No repository actions yet.</div>
            </div>
          </div>
        </div>
      `;
    }

    _ensureLiveProbePanel() {
      const active = this._ensureLiveStep('composing');
      let panel = active.querySelector('[data-role="live-probe"]');
      if (!panel) {
        const liveStep = active.querySelector('[data-role="live-step"]') || active;
        const evidence = active.querySelector('[data-role="live-evidence"]');
        if (evidence) evidence.insertAdjacentHTML('beforebegin', this._liveProbeTemplate(this.steps.length + 1));
        else liveStep.insertAdjacentHTML('beforeend', this._liveProbeTemplate(this.steps.length + 1));
        panel = active.querySelector('[data-role="live-probe"]');
      }
      return panel;
    }

    _scheduleLiveProbeReveal() {
      if (this.liveProbeFrame) return;
      const tick = () => {
        const remaining = this.liveProbeTarget.length - this.liveProbeShown.length;
        if (remaining <= 0) {
          this.liveProbeFrame = null;
          this._paintLiveProbe();
          return;
        }
        const diff = this.liveProbeTarget.slice(this.liveProbeShown.length);
        const chunkFloor = remaining > 4000 ? 900 : remaining > 1400 ? 360 : 120;
        let take = Math.min(diff.length, chunkFloor);
        const newlineAfterFloor = diff.indexOf('\n', Math.min(diff.length - 1, Math.max(24, Math.floor(chunkFloor * 0.45))));
        if (newlineAfterFloor >= 0 && newlineAfterFloor < chunkFloor * 1.7) {
          take = newlineAfterFloor + 1;
        }
        this.liveProbeShown += diff.slice(0, take);
        this._paintLiveProbe();
        this.liveProbeFrame = requestAnimationFrame(tick);
      };
      this.liveProbeFrame = requestAnimationFrame(tick);
    }

    _flushLiveProbeReveal() {
      if (this.liveProbeFrame) {
        cancelAnimationFrame(this.liveProbeFrame);
        this.liveProbeFrame = null;
      }
      if (this.liveProbeTarget && this.liveProbeShown !== this.liveProbeTarget) {
        this.liveProbeShown = this.liveProbeTarget;
        this._paintLiveProbe();
      }
    }

    _paintLiveProbe() {
      const panel = this._ensureLiveProbePanel();
      const codeEl = panel.querySelector('[data-role="live-probe-code"]');
      const scroll = panel.querySelector('[data-role="live-probe-scroll"]');
      const foot = panel.querySelector('[data-role="live-probe-foot"]');
      const shown = this.liveProbeShown || '';
      panel.hidden = !shown && this.presentation === 'rlm';
      if (codeEl) {
        const placeholder = this.presentation === 'rlm' ? '' : 'waiting for probe code…';
        codeEl.textContent = shown || placeholder;
        if (shown && window.Prism && this.rlmProbePaintedText !== shown) {
          try {
            if (Prism.languages?.javascript && Prism.highlight) {
              codeEl.innerHTML = Prism.highlight(shown, Prism.languages.javascript, 'javascript');
            } else if (Prism.highlightElement) {
              Prism.highlightElement(codeEl);
            }
            this.rlmProbePaintedText = shown;
          } catch {
            codeEl.textContent = shown;
          }
        }
      }
      if (scroll) scroll.scrollTop = scroll.scrollHeight;
      if (foot) {
        const lines = shown ? shown.split('\n').filter((line) => line.trim()).length : 0;
        const readCalls = (shown.match(/\breadFile\s*\(/g) || []).length;
        const detail = readCalls ? ` · ${readCalls} read probe${readCalls === 1 ? '' : 's'}` : '';
        foot.textContent = this.presentation === 'rlm'
          ? `${lines} line${lines === 1 ? '' : 's'} in same sandbox${detail}`
          : `${lines} line${lines === 1 ? '' : 's'} assembled${detail}`;
      }
    }

    _ensureLiveThinkingPanel() {
      const active = this._ensureLiveStep('reasoning');

      let panel = active.querySelector('[data-role="live-thinking"]');
      if (!panel) {
        panel = document.createElement('div');
        panel.className = 'agent-live-thinking';
        panel.dataset.role = 'live-thinking';
        panel.innerHTML = `
          <div class="agent-live-thinking-head">
            <span class="agent-live-thinking-kicker">
              <span class="agent-live-thinking-dot"></span>
              <span data-role="live-thinking-label">${escapeHtml(this.presentation === 'rlm' ? 'Reasoning' : `${this.reasoningLabel()} reasoning`)}</span>
            </span>
            <span class="agent-live-thinking-meta">${this.presentation === 'rlm' ? 'live' : 'live · clears after step'}</span>
          </div>
          <div class="agent-live-thinking-scroll" data-role="live-thinking-scroll">
            <div class="agent-live-thinking-text" data-role="live-thinking-text"></div>
          </div>
        `;
        const support = active.querySelector('[data-role="live-support"]');
        const probe = active.querySelector('[data-role="live-probe"]');
        if (support) support.appendChild(panel);
        else if (probe) active.querySelector('[data-role="live-step"]')?.insertBefore(panel, probe);
        else active.appendChild(panel);
      } else {
        const label = panel.querySelector('[data-role="live-thinking-label"]');
        if (label) label.textContent = this.presentation === 'rlm' ? 'Reasoning' : `${this.reasoningLabel()} reasoning`;
      }
      return panel;
    }

    _setRlmLiveState(text) {
      if (this.presentation !== 'rlm') return;
      const active = this._ensureLiveStep('composing');
      const state = active.querySelector('[data-role="rlm-live-state"]');
      if (state) state.textContent = text || 'live';
    }

    _setRlmProbeCode(code, opts = {}) {
      const clean = cleanProbeCode(code);
      if (!clean || !looksLikeProbeCode(clean)) return;
      this.liveProbeTarget = clean;
      this.liveProbeShown = clean;
      this.rlmProbePaintedText = '';
      this._ensureLiveProbePanel();
      this._paintLiveProbe();
      this._setRlmLiveState(opts.state || 'writing code');
      this._updateCopyButtonState();
    }

    _recordRlmOperation(log) {
      if (this.presentation !== 'rlm') return;
      const id = log.id || `${log.tool || log.kind || 'event'}:${this.rlmOperations.length + 1}`;
      const existing = this.rlmOperationById.get(id) || {
        id,
        tool: log.tool || 'tool',
        kind: 'tool',
        input: '',
        output: '',
        error: '',
        durationMs: null,
        pending: false,
        lineEl: null,
      };
      if (log.kind === 'tool-input') existing.input = log.input || existing.input || '';
      if (log.kind === 'tool-output') existing.output = log.output || existing.output || '';
      if (log.kind === 'tool-error') existing.error = log.error || log.output || existing.error || '';
      existing.durationMs = log.durationMs ?? existing.durationMs;
      existing.tool = log.tool || existing.tool;

      const classified = classifyRlmOperation(existing, log);
      Object.assign(existing, classified);
      existing.pending = log.kind === 'tool-input' && !existing.output && !existing.error;

      if (!this.rlmOperationById.has(id)) {
        this.rlmOperationById.set(id, existing);
        this.rlmOperations.push(existing);
      }
      this.toolActivities.set(id, existing);

      if (classified.code) this._setRlmProbeCode(classified.code, { state: 'writing code' });
      if (existing.kind === 'probe' && (log.kind === 'tool-output' || log.kind === 'tool-error')) {
        this._setRlmLiveState(log.kind === 'tool-error' ? 'probe failed' : 'probe finished');
      }

      this._renderRlmOperations();
      this.updateMeta();
    }

    _appendRlmStatus(message, opts = {}) {
      const clean = String(message || '').replace(/\s+/g, ' ').trim();
      if (!clean || clean === this.lastStatusMessage) return;
      this.lastStatusMessage = clean;
      const op = {
        id: `status:${Date.now()}:${this.rlmOperations.length}`,
        kind: 'status',
        summary: clean,
        pending: false,
        durationMs: null,
        lineEl: null,
      };
      this.rlmOperations.push(op);
      this._renderRlmOperations({ animate: opts.animate !== false });
      this.updateMeta();
    }

    _renderRlmOperations(opts = {}) {
      if (this.presentation !== 'rlm') return;
      const active = this._ensureLiveStep('composing');
      const lines = active.querySelector('[data-role="rlm-evidence-lines"]');
      if (!lines) return;
      const shouldStickToBottom = lines.scrollHeight - lines.scrollTop - lines.clientHeight < 28;
      lines.querySelector('.agent-rlm-evidence-empty')?.remove();
      const operations = this.rlmOperations;
      const seen = new Set(operations.map((op) => op.id));
      Array.from(lines.querySelectorAll('[data-rlm-operation-id]')).forEach((node) => {
        if (!seen.has(node.dataset.rlmOperationId)) node.remove();
      });
      operations.forEach((op) => {
        let row = Array.from(lines.querySelectorAll('[data-rlm-operation-id]')).find((node) => node.dataset.rlmOperationId === op.id);
        if (!row) {
          row = document.createElement('div');
          row.className = 'agent-rlm-op';
          row.dataset.rlmOperationId = op.id;
          lines.appendChild(row);
          if (opts.animate !== false && !this._prefersReducedMotion()) {
            row.animate([
              { opacity: 0, transform: 'translateY(3px)' },
              { opacity: 1, transform: 'translateY(0)' },
            ], { duration: 160, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
          }
        }
        row.className = `agent-rlm-op ${op.error ? 'error' : op.pending ? 'running' : 'done'} kind-${escapeClassName(op.kind || 'tool')}`;
        row.innerHTML = renderRlmOperation(op);
      });
      if (shouldStickToBottom) lines.scrollTop = lines.scrollHeight;
      if (!operations.length) {
        lines.innerHTML = '<div class="agent-rlm-evidence-empty">No repository actions yet.</div>';
      }
    }

    _detachLiveToolStrip() {
      const active = this.el.querySelector('[data-role="active"]');
      if (!active || active.dataset.liveOnly !== '1') return null;
      const strip = active.querySelector('[data-role="tool-strip"]');
      if (!strip) return null;
      strip.remove();
      return strip;
    }

    _insertToolStrip(strip) {
      const active = this.el.querySelector('[data-role="active"]');
      if (!active || !strip) return;
      const thinking = active.querySelector('[data-role="thinking"]');
      if (thinking) active.insertBefore(strip, thinking);
      else active.appendChild(strip);
    }

    clearLiveStep() {
      this._settleLiveTranscript();
      if (this.liveThinkingFrame) {
        cancelAnimationFrame(this.liveThinkingFrame);
        this.liveThinkingFrame = null;
      }
      if (this.liveProbeFrame) {
        cancelAnimationFrame(this.liveProbeFrame);
        this.liveProbeFrame = null;
      }
      this.liveThinkingText = '';
      this.liveThinkingFullText = '';
      this.liveResponseText = '';
      this.liveProbeTarget = '';
      this.liveProbeShown = '';
      this.rlmProbePaintedText = '';
      if (this.liveJITEl?.isConnected) this.liveJITEl.remove();
      this.liveJITEl = null;
      this._updateCopyButtonState();
      const active = this.el.querySelector('[data-role="active"]');
      if (active?.dataset.liveOnly === '1') {
        active.classList.add('empty');
        active.innerHTML = '';
        active.hidden = true;
        delete active.dataset.liveOnly;
      }
    }

    clearLiveThinking() {
      this.clearLiveStep();
    }

    _showThinking() {
      const active = this.el.querySelector('[data-role="active"]');
      if (!active || active.classList.contains('empty')) return;
      // Append a thinking row at the bottom of the active step. Label uses
      // whichever model the user selected so it reflects reality.
      if (!active.querySelector('[data-role="thinking"]')) {
        const row = document.createElement('div');
        row.className = 'agent-thinking-row';
        row.dataset.role = 'thinking';
        row.innerHTML = `
          <span>waiting on ${escapeHtml(currentChannelLabel())} for next step</span>
          <span class="thinking-dots"><span></span><span></span><span></span></span>
        `;
        active.appendChild(row);
      }
    }

    _demoteActiveToTrail(entryOverride = null) {
      const active = this.el.querySelector('[data-role="active"]');
      if (!active.dataset.step) return;

      // We need the full entry data to render both the compact summary row
      // AND the expanded "full history" body. addStep() pushes the NEW entry
      // before calling this helper, so the step that was previously in the
      // active slot is at length - 2, not length - 1. (length - 1 is the new
      // active's entry.)
      const entry = entryOverride || this.steps[this.steps.length - 2];
      if (!entry) return;

      const trail = this.el.querySelector('[data-role="trail"]');
      const row = document.createElement('div');
      row.className = 'agent-trail-row trail-enter';
      row.dataset.step = String(entry.step);
      const summary = summarizeEntry(entry);
      // Compact summary (visible when NOT expanded) + full body (visible when expanded).
      // Grab any tool-strip that accumulated under the active step so it
      // gets archived with that step's history instead of being thrown away.
      const oldActive = this.el.querySelector('[data-role="active"]');
      const oldStrip = oldActive?.querySelector('[data-role="tool-strip"]');
      const toolCount = oldStrip?.querySelectorAll('[data-role="tool-pills"] .tool-pill').length ?? 0;
      const toolBadge = toolCount
        ? `<span class="tr-tool-badge">${toolCount}⚙</span>`
        : '';

      row.innerHTML = `
        <div class="tr-compact">
          <span class="tr-num">${escapeHtml(this.unitLabel(entry.step))}</span>
          <span class="tr-ts">${entry.ts.toLocaleTimeString()}</span>
          <span class="tr-summary">${escapeHtml(summary)}</span>
          ${toolBadge}
        </div>
        <div class="tr-full">
          <div class="tr-full-head">
            <span class="tr-full-num">${escapeHtml(this.unitLabel(entry.step))}</span>
            <span class="tr-full-ts">${entry.ts.toLocaleTimeString()}</span>
          </div>
          ${renderStepBody(entry, { historical: true, channelLabel: this.reasoningLabel(), unitName: this.presentation === 'rlm' ? 'probe' : 'step' })}
          <div data-role="archived-tool-strip"></div>
        </div>
      `;
      if (oldStrip) {
        const slot = row.querySelector('[data-role="archived-tool-strip"]');
        // Re-parent the live strip element; preserves event listeners,
        // collapsed state, and pill count.
        slot.appendChild(oldStrip);
      }
      trail.appendChild(row);
      this._syncHistoryDisclosureState();
      window.setTimeout(() => row.classList.remove('trail-enter'), 900);
      // Highlight code blocks inside the full-body — only if expanded mode
      // is currently on, otherwise we do it lazily on first expand.
      if (this.expanded && window.Prism) {
        Prism.highlightAllUnder(row);
      }
    }

    _renderActive(entry) {
      const active = this.el.querySelector('[data-role="active"]');
      active.classList.remove('empty');
      active.hidden = false;
      delete active.dataset.liveOnly;
      active.dataset.step = String(entry.step);
      active.dataset.ts = entry.ts.toLocaleTimeString();
      active.dataset.summary = summarizeEntry(entry);

      active.innerHTML = `
        <div class="agent-active-head">
          <span class="agent-active-num">${escapeHtml(this.unitLabel(entry.step))}</span>
          <span class="agent-active-live complete">${entry.resultType === 'submit' ? 'submit' : 'complete'}</span>
          <span class="agent-active-ts">${escapeHtml(active.dataset.ts)}</span>
        </div>
        ${renderStepBody(entry, { historical: false, channelLabel: this.reasoningLabel(), unitName: this.presentation === 'rlm' ? 'probe' : 'step' })}
      `;
      this._syncHistoryDisclosureState();
      if (entry.code && window.Prism) {
        Prism.highlightAllUnder(active);
      }
    }

    _applyTrailFade() {
      // Only the 3 most recent trail rows are visible. Older rows are hidden
      // (still in the DOM — "show full history" reveals them). Fade is gentle
      // so users can still read the visible rows.
      const rows = Array.from(this.el.querySelectorAll('[data-role="trail"] .agent-trail-row'));
      const max = rows.length;
      rows.forEach((r, i) => {
        const distance = max - 1 - i; // 0 = newest in trail, 1, 2, ...
        r.classList.remove('fade-1', 'fade-2', 'fade-hidden');
        if (distance === 0) {
          // newest in trail — crisp
        } else if (distance === 1) r.classList.add('fade-1');
        else if (distance === 2) r.classList.add('fade-2');
        else r.classList.add('fade-hidden');
      });
    }

    addStatus(message) {
      const clean = String(message || '').replace(/\s+/g, ' ').trim();
      if (!clean || clean === this.lastStatusMessage || this.statusQueue.includes(clean)) return;
      this.statusQueue.push(clean);
      this._scheduleStatusFlush();
    }

    addStatusImmediate(message) {
      const clean = String(message || '').replace(/\s+/g, ' ').trim();
      if (!clean || clean === this.lastStatusMessage) return;
      this._clearStatusQueue();
      this._appendStatusNow(clean, { animate: false });
    }

    showJITPeekStart(event) {
      const code = String(event?.code || '').trim();
      if (this.presentation === 'rlm') {
        this._setRlmProbeCode(code, { state: 'writing code' });
        this._recordRlmOperation({
          kind: 'tool-input',
          id: `jit:${event?.step || this.rlmOperations.length + 1}`,
          tool: 'JIT',
          input: code,
          durationMs: null,
        });
        return;
      }
      const active = this._ensureLiveStep('composing');
      const body = this.el.querySelector('[data-role="body"]');

      const existing = body.querySelector('[data-role="jit-live"]');
      if (existing) existing.remove();

      const preview = truncateBlock(code || 'preparing peek…', { maxChars: 720, maxLines: 8 }).shown;
      const live = document.createElement('div');
      live.className = 'agent-jit-live running';
      live.dataset.role = 'jit-live';
      live.innerHTML = `
        <div class="agent-jit-live-head">
          <span class="agent-jit-live-kicker"><span class="agent-jit-dot"></span>quick probe</span>
          <span class="agent-jit-live-meta">same workspace${event?.llmCallBudget ? ` · model call 0/${event.llmCallBudget}` : ''}</span>
        </div>
        <pre class="agent-jit-live-code"><code class="language-javascript">${escapeHtml(preview)}</code></pre>
        <div class="agent-jit-live-foot" data-role="jit-live-foot">executing a tiny context probe</div>
      `;

      const liveStep = active.querySelector('[data-role="live-step"]') || active;
      const probe = this._ensureLiveProbePanel();
      const evidence = active.querySelector('[data-role="live-evidence"]');
      if (probe && probe.parentNode) {
        probe.insertAdjacentElement('afterend', live);
      } else if (evidence) {
        evidence.insertAdjacentElement('beforebegin', live);
      } else {
        liveStep.appendChild(live);
      }
      this.liveJITEl = live;
      if (window.Prism) {
        try { Prism.highlightAllUnder(live); } catch { }
      }
    }

    addJITPeek(event, opts = {}) {
      const replay = opts.replay === true;
      if (this.presentation === 'rlm') {
        this._recordRlmOperation({
          kind: event.resultType === 'error' ? 'tool-error' : 'tool-output',
          id: `jit:${event?.step || this.rlmOperations.length}`,
          tool: 'JIT',
          output: event.output || '',
          error: event.resultType === 'error' ? event.output || 'Probe failed' : '',
          durationMs: event.durationMs,
        });
      }
      if (!replay) this._settleLiveJIT(event);
      this._appendJITHistoryRow(event, { animate: !replay });
      this.updateMeta();
    }

    _settleLiveJIT(event) {
      const live = this.liveJITEl || this.el.querySelector('[data-role="jit-live"]');
      if (!live) return;
      const foot = live.querySelector('[data-role="jit-live-foot"]');
      live.classList.remove('running');
      live.classList.add(event.resultType === 'error' ? 'error' : 'done');
      if (foot) foot.textContent = jitSummary(event);

      const remove = () => {
        if (!live.isConnected) return;
        live.remove();
        if (this.liveJITEl === live) this.liveJITEl = null;
      };

      if (this._prefersReducedMotion()) {
        remove();
        return;
      }

      window.setTimeout(() => {
        live.classList.add('exiting');
        window.setTimeout(remove, 260);
      }, 2000);
    }

    _appendJITHistoryRow(event, opts = {}) {
      const trail = this.el.querySelector('[data-role="trail"]');
      const row = document.createElement('div');
      const animate = opts.animate !== false;
      row.className = `agent-trail-row agent-jit-row${animate ? ' trail-enter' : ''}`;
      row.dataset.kind = 'jit';
      const summary = jitSummary(event);
      const ts = new Date().toLocaleTimeString();
      const llmBadge = typeof event.llmCalls === 'number' && event.llmCalls > 0
        ? `<span class="tr-tool-badge">llm ${event.llmCalls}/${event.llmCallBudget ?? '?'}</span>`
        : '';
      row.innerHTML = `
        <div class="tr-compact">
          <span class="tr-num">probe</span>
          <span class="tr-ts">${typeof event.durationMs === 'number' ? `${event.durationMs}ms` : ''}</span>
          <span class="tr-summary">${escapeHtml(summary)}</span>
          ${llmBadge}
        </div>
        <div class="tr-full">
          <div class="tr-full-head">
            <span class="tr-full-num">agent probe</span>
            <span class="tr-full-ts">${escapeHtml(ts)}</span>
          </div>
          ${renderJITBody(event)}
        </div>
      `;
      trail.appendChild(row);
      const activeToolStrip = this.el.querySelector('[data-role="active"] [data-role="tool-strip"]');
      if (activeToolStrip) {
        row.querySelector('[data-role="archived-tool-strip"]')?.appendChild(activeToolStrip);
      }
      const btn = this.el.querySelector('[data-role="expand"]');
      if (btn) btn.style.display = '';
      this._applyTrailFade();
      if (animate) window.setTimeout(() => row.classList.remove('trail-enter'), 520);
      else row.classList.remove('trail-enter');
      if (this.expanded && window.Prism) {
        try { Prism.highlightAllUnder(row); } catch { }
      }
    }

    _scheduleStatusFlush() {
      if (this.statusFlushTimer) return;
      this.statusFlushTimer = window.setTimeout(() => this._flushStatusQueue(), 0);
    }

    _flushStatusQueue() {
      this.statusFlushTimer = null;
      const message = this.statusQueue.shift();
      if (!message) return;
      this._appendStatusNow(message);
      if (this.statusQueue.length) {
        this.statusFlushTimer = window.setTimeout(() => this._flushStatusQueue(), 124);
      }
    }

    _clearStatusQueue() {
      this.statusQueue = [];
      if (this.statusFlushTimer) {
        window.clearTimeout(this.statusFlushTimer);
        this.statusFlushTimer = null;
      }
    }

    _appendStatusNow(message, opts = {}) {
      if (this.presentation === 'rlm') {
        this._appendRlmStatus(message, opts);
        return;
      }
      this.lastStatusMessage = message;
      if (shouldShowTranscriptStatus(message)) this._appendTranscriptThought(message, { muted: true });
      this.updateMeta();
    }

    _appendTrailStatusNow(message, opts = {}) {
      const animate = opts.animate !== false;
      const transition = animate ? this._captureStepTransition() : null;
      const body = this.el.querySelector('[data-role="body"]');
      const empty = body?.querySelector('[data-role="empty"]');
      if (empty) empty.style.display = 'none';
      this.lastStatusMessage = message;

      const trail = this.el.querySelector('[data-role="trail"]');
      if (!trail) return;
      const row = document.createElement('div');
      row.className = 'agent-trail-row trail-enter';
      row.innerHTML = `
        <div class="tr-compact">
          <span class="tr-num">•</span>
          <span class="tr-ts"></span>
          <span class="tr-summary">${escapeHtml(message)}</span>
        </div>
        <div class="tr-full">
          <div class="agent-status">${escapeHtml(message)}</div>
        </div>
      `;
      trail.appendChild(row);
      const btn = this.el.querySelector('[data-role="expand"]');
      if (btn) btn.style.display = '';
      this._applyTrailFade();
      this.updateMeta();
      if (animate) {
        window.setTimeout(() => row.classList.remove('trail-enter'), 900);
        this._playStepTransition(transition);
      } else {
        row.classList.remove('trail-enter');
      }
    }

    addReplayStreamSummary({ text = '', thinking = '', eventCount = 0 } = {}) {
      const cleanText = String(text || '').trim();
      const cleanThinking = String(thinking || '').trim();
      if (!cleanText && !cleanThinking) return;

      this.replayStreams.push({ text: cleanText, thinking: cleanThinking, eventCount, ts: new Date() });
      const body = this.el.querySelector('[data-role="body"]');
      const empty = body?.querySelector('[data-role="empty"]');
      if (empty) empty.style.display = 'none';

      const trail = this.el.querySelector('[data-role="trail"]');
      if (!trail) return;
      const row = document.createElement('div');
      row.className = 'agent-trail-row agent-replay-stream-row';
      row.dataset.kind = 'stream';
      const textBlock = cleanText ? truncateBlock(cleanText, { maxChars: 12000, maxLines: 260 }) : null;
      const thinkingBlock = cleanThinking ? truncateBlock(cleanThinking, { maxChars: 8000, maxLines: 180 }) : null;
      const streamChars = cleanText.length + cleanThinking.length;
      const preview = (cleanText || cleanThinking).replace(/\s+/g, ' ').trim();
      row.innerHTML = `
        <div class="tr-compact">
          <span class="tr-num">stream</span>
          <span class="tr-ts">${eventCount ? `${formatNum(eventCount)} events` : ''}</span>
          <span class="tr-summary">${escapeHtml(truncateMid(preview || 'Stream restored', 150))}</span>
          <span class="tr-tool-badge">${formatNum(streamChars)} chars</span>
        </div>
        <div class="tr-full">
          <div class="tr-full-head">
            <span class="tr-full-num">normalized stream</span>
            <span class="tr-full-ts">${eventCount ? `${formatNum(eventCount)} event${eventCount === 1 ? '' : 's'}` : 'replayed'}</span>
          </div>
          ${thinkingBlock ? `
            <details class="agent-output-wrap agent-log-block">
              <summary class="agent-output-head">
                <span class="agent-code-lang">thinking stream</span>
                <span class="agent-code-lang">${formatNum(cleanThinking.length)} chars · show</span>
              </summary>
              <pre class="agent-output">${escapeHtml(thinkingBlock.shown)}</pre>
            </details>
          ` : ''}
          ${textBlock ? `
            <details class="agent-output-wrap agent-log-block" open>
              <summary class="agent-output-head">
                <span class="agent-code-lang">text stream</span>
                <span class="agent-code-lang">${formatNum(cleanText.length)} chars · show</span>
              </summary>
              <pre class="agent-output">${escapeHtml(textBlock.shown)}</pre>
            </details>
          ` : ''}
          <div data-role="archived-tool-strip"></div>
        </div>
      `;
      trail.appendChild(row);
      const btn = this.el.querySelector('[data-role="expand"]');
      if (btn) btn.style.display = '';
      this._applyTrailFade();
      this.updateMeta();
      return row;
    }

    addAgentLog(event, opts = {}) {
      const log = normalizeAgentLog(event);
      if (!log.message && !log.reasoning && !log.input && !log.output && !log.error) return;
      log.ts = new Date();
      this.logs.push(log);
