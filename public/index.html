            const elapsed = formatElapsed(Date.now() - startedAt);
            renderDiff(data.diff || '', data.changedFiles || [], data.truncated === true);
            const hasPatch = hasRenderableCodePatch(data.diff || '', data.changedFiles || []);
            card.markDone({ chars: (data.diff || '').length });
            expandAskProcessCard(card);
            const doneText = publishRequestedRun && latestPullRequest?.url
              ? `PR updated in ${elapsed}`
              : publishBlockedRun ? `PR draft ready in ${elapsed}` : hasPatch ? `Patch updated in ${elapsed}` : `No changes in ${elapsed}`;
            setTurnStatus(statusEl, 'done', doneText);
            appendAskScanRow(doneText);
            setAskScanMeta(`done · ${elapsed}`);
            showFullAskProcessHistory(card);
            document.getElementById('topbar-status').textContent = 'ready';
            activeRunStatus = 'done';
            codeStreamReconnectAttempts = 0;
            setBusy(false);
            codePageAbort = null;
            setCodeTab('patch');
            updatePublishVisibility();
          } else if (ev === 'canceled') {
            const message = data.message || 'Stopped';
            routeRunEventToCard(card, { type: ev, payload: data });
            card.markError(message, data);
            expandAskProcessCard(card);
            setTurnStatus(statusEl, 'canceled', message);
            appendAskScanRow(message);
            setAskScanMeta('stopped');
            document.getElementById('topbar-status').textContent = 'stopped';
            activeRunStatus = 'canceled';
            codeStreamReconnectAttempts = 0;
            setBusy(false);
            setSessionState('canceled', 'stopped');
            codePageAbort = null;
          } else if (ev === 'error') {
            const message = data.message || data.error || 'Code follow-up failed';
            card.markError(message, data);
            expandAskProcessCard(card);
            setTurnStatus(statusEl, 'error', 'Follow-up failed');
            answerContent.className = 'ask-reader-body';
            answerContent.innerHTML = renderErrorBanner(message, data);
            appendAskScanRow(message);
            setAskScanMeta('error');
            document.getElementById('topbar-status').textContent = 'error';
            activeRunStatus = 'error';
            codeStreamReconnectAttempts = 0;
            setBusy(false);
            setSessionState('error', 'error');
            codePageAbort = null;
            setCodeTab('summary');
          }
        },
        onError(err) {
          if (reconnectCodeRunStream(err, streamHandlers, { card, statusEl })) return;
          const message = streamErrorMessage(err);
          card.markError(message, err);
          if (err?.needsGitHubConnection || err?.status === 428) {
            showCodeGithubRequired(err.message || message);
            setTurnStatus(statusEl, 'error', 'Connect GitHub');
          } else {
            setTurnStatus(statusEl, 'error', err?.code === 'MODEL_ACCESS_REQUIRED' || err?.code === 'PROVIDER_SETUP_REQUIRED' ? 'API key needed' : 'Transport error');
          }
          answerContent.className = 'ask-reader-body';
          answerContent.innerHTML = renderErrorBanner(message, err);
          appendAskScanRow(message);
          setAskScanMeta('error');
          document.getElementById('topbar-status').textContent = 'error';
          activeRunStatus = 'error';
          setBusy(false);
          setSessionState('error', 'error');
          codePageAbort = null;
          setCodeTab('summary');
        },
        onDone() {
          if (activeRunStatus === 'running') reconnectCodeRunStream({ message: 'stream ended' }, streamHandlers, { card, statusEl });
        },
      };
      codePageAbort = sseStream('/api/code-anything/follow-up', requestBody, streamHandlers);
    }

    function markCodeStopped(message = 'Stopped') {
      activeRunStatus = 'canceled';
      if (activeCodeStatusEl) setTurnStatus(activeCodeStatusEl, 'canceled', message);
      if (activeCard) {
        activeCard.markError(message);
        expandAskProcessCard(activeCard);
      }
      appendAskScanRow(message);
      setAskScanMeta('stopped');
      document.getElementById('topbar-status').textContent = 'stopped';
      setSessionState('canceled', 'stopped');
      setBusy(false);
      updateCodeSessionActions();
    }

    async function waitForCodeRunStopped(runId) {
      const deadline = Date.now() + 8000;
      while (Date.now() < deadline) {
        try {
          const { run } = await fetchJSON(`/api/run?id=${encodeURIComponent(runId)}`);
          const stillRunning = run?.status === 'running' || (run ? codeTurnsFromRun(run).some((turn) => turn.status === 'running') : false);
          if (!stillRunning) {
            activeRunStatus = run?.status || 'canceled';
            return run;
          }
        } catch {
          return null;
        }
        await new Promise((resolve) => setTimeout(resolve, 350));
      }
      return null;
    }

    async function stopCodeRun() {
      if (!activeRunId || stoppingRun) return;
      stoppingRun = true;
      updateCodeSessionActions();
      try {
        const result = await postJSON('/api/run/cancel', { id: activeRunId });
        if (result.status === 'canceling') await waitForCodeRunStopped(activeRunId);
        if (codePageAbort) {
          codePageAbort();
          codePageAbort = null;
        }
        markCodeStopped('Stopped');
      } catch (error) {
        showCodeValidation(`Could not stop run: ${error.message || error}`);
      } finally {
        stoppingRun = false;
        updateCodeSessionActions();
      }
    }

    async function deleteCodeRun() {
      if (!activeRunId || deletingRun || busy || activeRunStatus === 'running') return;
      const ok = window.confirm('Delete this Code session history? This only removes the local app record.');
      if (!ok) return;
      deletingRun = true;
      updateCodeSessionActions();
      try {
        await postJSON('/api/run/delete', { id: activeRunId });
        history.pushState(null, '', '/code');
        render();
      } catch (error) {
        showCodeValidation(`Could not delete run: ${error.message || error}`);
      } finally {
        deletingRun = false;
        updateCodeSessionActions();
      }
    }

    async function deleteCodeTurn(turnId, button = null) {
      if (!activeRunId || !turnId || busy) return;
      const previous = button?.textContent;
      if (button) {
        button.disabled = true;
        button.textContent = 'Deleting...';
      }
      try {
        await postJSON('/api/code-anything/turn/delete', { runId: activeRunId, turnId });
        await loadPersistedCodeRun(activeRunId);
      } catch (error) {
        showCodeValidation(`Could not delete turn: ${error.message || error}`);
        if (button) {
          button.disabled = false;
          button.textContent = previous || 'Delete turn';
        }
      }
    }

    async function publishCodePr() {
      if (busy || publishing || !activeRunId) return;
      if (!codeGithubConnected()) {
        showCodeGithubRequired('Connect GitHub before publishing a pull request.');
        return;
      }
      if (!latestDiff || latestDiff === '(no diff)') {
        showCodeValidation('Run Code Anything until a patch is ready before publishing.');
        return;
      }
      const mode = (latestPullRequest?.url || latestPublishBranch?.url) ? 'update' : 'create';
      publishing = true;
      publishError = '';
      publishNotice = '';
      setSessionState('working', 'publishing');
      updatePublishVisibility();
      publishStatus.textContent = mode === 'update'
        ? 'Updating the pull request...'
        : 'Creating the pull request...';
      appendAskScanRow(mode === 'update' ? 'Updating pull request' : 'Creating pull request');
      try {
        const data = await postJSON('/api/code-anything/publish-pr', {
          runId: activeRunId,
          mode,
          channel: selectedChannelId,
          openUpstreamPr: true,
          confirm: true,
        });
        latestPullRequest = data.pullRequest || data.publish?.pullRequest || latestPullRequest;
        latestPublishBranch = data.branch || data.publish?.branch || latestPublishBranch;
        publishError = '';
        publishNotice = data.publish?.pullRequestError || data.pullRequestError || '';
        hasUnpublishedChanges = false;
        setSessionState('ready', latestPullRequest?.url ? 'published' : 'ready');
        appendAskScanRow(latestPullRequest?.url
          ? (data.publish?.target === 'fork'
            ? (mode === 'update' ? 'PR updated from fork' : 'PR created from fork')
            : (mode === 'update' ? 'PR updated' : 'PR created'))
          : (publishNotice ? 'Branch ready, PR blocked' : 'Branch ready'));
        setAskScanMeta(latestPullRequest?.url ? (mode === 'update' ? 'pr updated' : 'pr ready') : 'fork ready');
      } catch (error) {
        const message = error.message || String(error);
        if (error.needsGitHubConnection || error.status === 428) {
          showCodeGithubRequired(message);
        }
        publishError = message;
        setSessionState('error', 'error');
        appendAskScanRow(message);
        setAskScanMeta('publish error');
      } finally {
        publishing = false;
        if (!publishError) setSessionState('ready', latestPullRequest?.url ? 'published' : 'ready');
        updatePublishVisibility();
      }
    }

      return [
        'Review this PR for correctness, regressions, security issues, and missing tests.',
        'This PR was generated by Code Anything; focus on whether the patch is safe to merge, with concrete findings only.',

    function reviewPublishedPr() {
      if (!latestPullRequest?.url) return;
      const question = codeReviewQuestion();
      const params = new URLSearchParams({
        pr: latestPullRequest.url,

      render();

          setAskScanMeta('draft ready');
          taskInput.focus();
        }
      } else {
        (prefillRepo ? taskInput : repoInput).focus();
      }
    }
  }

  function statusLetter(status) {

  function renderReviewPatchFallback(data) {
    const patch = data?.patch || buildSyntheticPatch(data);
    return `<pre class="review-patch"><code>${escapeHtml(patch || 'No textual diff available for this file.')}</code></pre>`;
  }

  function buildSyntheticPatch(data) {
    const oldText = data?.oldFile?.contents || '';
    const newText = data?.newFile?.contents || '';
    if (!oldText && !newText) return '';
    if (!oldText) {
      return newText.split('\n').map((line) => `+${line}`).join('\n');
    }
    if (!newText) {
      return oldText.split('\n').map((line) => `-${line}`).join('\n');
    }
    return [
      '--- base',
      '+++ head',
      '@@ full file shown because GitHub did not provide a patch @@',
      ...newText.split('\n').slice(0, 600).map((line) => ` ${line}`),
    ].join('\n');
  }

  function renderReviewMarkdown(el, markdown, review) {
    el.className = 'markdown';
    el.innerHTML = marked.parse(markdown || '(empty)');
    Prism.highlightAllUnder(el);
    linkifySources(el, {
      owner: review?.owner,
      repo: review?.repo,
      branch: review?.headSha || 'HEAD',

  function renderSafeGithubMarkdown(markdown, emptyText = 'No description provided.') {
    const text = String(markdown || '').trim();

  }

  function formatRelativeTime(iso) {
    if (!iso) return '';
    const then = Date.parse(iso);
    if (!Number.isFinite(then)) return '';
    const seconds = Math.max(0, Math.floor((Date.now() - then) / 1000));
    if (seconds < 60) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    if (days < 30) return `${days}d ago`;
    const months = Math.floor(days / 30);
    if (months < 12) return `${months}mo ago`;
    const years = Math.floor(days / 365);
    return `${years}y ago`;
  }

  function reviewMergeTone(review) {
    const status = (review.github?.mergeStatus || '').toLowerCase();
    if (status.includes('ready') || status.includes('merged')) return 'ok';
    if (status.includes('blocked') || status.includes('conflict') || status.includes('closed')) return 'bad';
    return 'wait';
  }

  function reviewStateLabel(review) {
    if (review.github?.merged) return 'Merged';
    if (review.draft) return 'Draft';
    if ((review.state || '').toLowerCase() === 'closed') return 'Closed';
    return 'Open';
  }

    return `<span class="${className} fallback">${escapeHtml(login.slice(0, 1).toUpperCase() || '?')}</span>`;

    const reviewLocalCliAgentBar = document.getElementById('review-local-cli-agent-bar');
    const reviewCodeHandoff = document.getElementById('review-code-handoff');
    const prSlot = document.getElementById('review-pr-slot');
    const filesEl = document.getElementById('review-files');
    const diffBody = document.getElementById('review-diff-body');
    const diffTitle = document.getElementById('review-diff-title');
    const githubPanel = document.getElementById('review-github-panel');
    const githubPlaceholder = document.getElementById('review-pr-placeholder');
    const workspaceTabs = document.getElementById('review-workspace-tabs');
    const processTabButton = workspaceTabs.querySelector('[data-workspace-tab="process"]');
    const workspacePanels = Array.from(document.querySelectorAll('[data-workspace-panel]'));
    const processCenterSlot = document.getElementById('review-process-center-slot');
    const processEmpty = document.getElementById('review-process-empty');
    const processReceipt = document.getElementById('review-process-receipt');
    const reviewRight = document.querySelector('.review-right');
    const investigationEl = document.getElementById('review-investigation');
    const thread = document.getElementById('review-thread');
    const reviewTabs = document.getElementById('review-tabs');

    let currentReview = null;
    let currentFileData = null;
    let selectedPath = null;
    let diffStyle = 'split';
    let currentSelection = null;
    let investigationIssues = [];
    let activeReviewTab = 'review';
    let workspaceTab = 'pr';
    let githubPanelTab = 'description';
    let investigationPanelVisible = false;
    let reviewSourceCodeRunId = initialSourceCodeRunId;
    let reviewBusy = false;
    let reviewStarting = false;
    let reviewGithubStatus = { connected: false, checking: true, connecting: false, message: '' };
    let reviewGithubConnectionPromise = null;
    let reviewGithubPollTimer = null;
    const reviewHistory = [];
    const restoredReviewRunIds = new Set();

    function setWorkspaceTab(tab) {
      const requested = ['pr', 'diff', 'review', 'process'].includes(tab) ? tab : 'pr';
      const processAvailable = processTabButton && !processTabButton.hidden;
      workspaceTab = requested === 'process' && !processAvailable
        ? (currentFileData ? 'diff' : 'pr')
        : requested;
      workspaceTabs.querySelectorAll('[data-workspace-tab]').forEach((button) => {
        button.classList.toggle('active', button.dataset.workspaceTab === workspaceTab);
      });
      workspacePanels.forEach((panel) => {
        panel.hidden = panel.dataset.workspacePanel !== workspaceTab;
      });
    }

    workspaceTabs.querySelectorAll('[data-workspace-tab]').forEach((button) => {
      button.addEventListener('click', () => setWorkspaceTab(button.dataset.workspaceTab));
    });

    function setReviewTab(tab) {
      activeReviewTab = tab === 'analysis' ? 'analysis' : 'review';
      reviewTabs.querySelectorAll('[data-review-tab]').forEach((button) => {
        button.classList.toggle('active', button.dataset.reviewTab === activeReviewTab);
      });
      reviewTabs.hidden = !investigationPanelVisible;
      thread.hidden = investigationPanelVisible && activeReviewTab !== 'review';
      investigationEl.hidden = !investigationPanelVisible || activeReviewTab !== 'analysis';
    }

    function showInvestigationPanel(html, activate = true) {
      investigationPanelVisible = true;
      investigationEl.innerHTML = html;
      setReviewTab(activate ? 'analysis' : activeReviewTab);
      if (activate) setWorkspaceTab('review');
    }

    function hideInvestigationPanel() {
      investigationIssues = [];
      investigationPanelVisible = false;
      investigationEl.innerHTML = '';
      setReviewTab('review');
      if (currentFileData) renderDiff(currentFileData);
    }

    function renderReviewCodeHandoff(payload) {
      if (!reviewCodeHandoff || !payload?.returnUrl) return;
      reviewCodeHandoff.hidden = false;
      reviewCodeHandoff.innerHTML = `
        <div class="review-code-handoff-copy">
          <div class="review-code-handoff-title">Reviewing Code output</div>
          <div class="review-code-handoff-meta">${escapeHtml(payload.label || 'Code PR')} · fixes return to the Code session</div>
        </div>
        <button class="review-code-handoff-link" type="button">Back to Code</button>
      `;
      reviewCodeHandoff.querySelector('button')?.addEventListener('click', () => {
        history.pushState(null, '', payload.returnUrl);
        render();
      });
    }

    if (reviewHandoffPayload) renderReviewCodeHandoff(reviewHandoffPayload);

    reviewTabs.querySelectorAll('[data-review-tab]').forEach((button) => {
      button.addEventListener('click', () => setReviewTab(button.dataset.reviewTab));
    });

    function reviewGithubConnected() {
      return Boolean(reviewGithubStatus?.connected);
    }

    function syncReviewControls() {
      const blocked = !reviewGithubConnected();
      const locked = reviewBusy || reviewStarting;
      submitBtn.disabled = locked || blocked;
      investigateBtn.disabled = locked || blocked;
      loadBtn.disabled = locked || blocked;
      prInput.disabled = locked;
      questionInput.disabled = locked;
      if (githubConnectBtn) {
        githubConnectBtn.disabled = locked || Boolean(reviewGithubStatus.checking) || Boolean(reviewGithubStatus.connecting);
      }
    }

    function beginReviewLaunch() {
      if (reviewBusy || reviewStarting) return false;
      reviewStarting = true;
      syncReviewControls();
      return true;
    }

    function finishReviewLaunch(startedRun = false) {
      reviewStarting = false;
      if (!startedRun) syncReviewControls();
    }

    function setReviewGithubGate(nextStatus = {}, opts = {}) {
      reviewGithubStatus = {
        ...reviewGithubStatus,
        ...nextStatus,
        connected: Object.prototype.hasOwnProperty.call(nextStatus, 'connected')
          ? Boolean(nextStatus.connected)
          : Boolean(reviewGithubStatus.connected),
        checking: Object.prototype.hasOwnProperty.call(nextStatus, 'checking')
          ? Boolean(nextStatus.checking)
          : Boolean(reviewGithubStatus.checking),
        connecting: Object.prototype.hasOwnProperty.call(nextStatus, 'connecting')
          ? Boolean(nextStatus.connecting)
          : Boolean(reviewGithubStatus.connecting),
      };
      const connected = reviewGithubConnected();
      if (githubGate) {
        githubGate.hidden = connected && !opts.forceVisible;
        githubGate.dataset.state = connected
          ? 'connected'
          : reviewGithubStatus.error
            ? 'error'
            : reviewGithubStatus.checking
              ? 'checking'
              : reviewGithubStatus.connecting
                ? 'connecting'
                : 'needed';
      }
      if (githubGateTitle) {
        githubGateTitle.textContent = connected
          ? 'GitHub connected'
          : reviewGithubStatus.checking
            ? 'Checking GitHub'
            : reviewGithubStatus.connecting
              ? 'Finish GitHub connection'
              : 'Connect GitHub';
      }
      if (githubGateMeta) {
        githubGateMeta.textContent = connected
          ? 'Review can load PR metadata, diffs, and comments.'
          : reviewGithubStatus.message || reviewGithubStatus.error || 'Required for PR metadata, diffs, review comments, and higher GitHub API limits.';
      }
      if (githubConnectBtn) {
        githubConnectBtn.textContent = connected
          ? 'Connected'
          : reviewGithubStatus.checking
            ? 'Checking'
            : reviewGithubStatus.connecting
              ? 'Waiting'
              : 'Connect GitHub';
      }
      syncReviewControls();
    }

    async function refreshReviewGithubConnection(force = false, opts = {}) {
      if (!force && reviewGithubConnectionPromise) return reviewGithubConnectionPromise;
      if (!opts.silent) {
        setReviewGithubGate({
          connected: reviewGithubStatus.connected,
          checking: true,
          connecting: false,
          message: 'Review uses your GitHub connection for PR metadata and diffs.',
          error: '',
        });
      }
      reviewGithubConnectionPromise = fetchJSON('/api/review/github/status')
        .then((data) => {
          const connected = Boolean(data.connected);
          setReviewGithubGate({
            ...data,
            connected,
            checking: false,
            connecting: connected ? false : Boolean(reviewGithubStatus.connecting),
            message: connected ? '' : reviewGithubStatus.message,
            error: '',
          });
          if (connected) window.dispatchEvent(new CustomEvent('review-github-connected'));
          return connected;
        })
        .catch((error) => {
          console.warn('failed to inspect GitHub connection', error);
          setReviewGithubGate({
            connected: false,
            checking: false,
            connecting: false,
            error: error.message || String(error),
            message: 'Could not confirm GitHub access. Connect GitHub before reviewing PRs.',
          }, { forceVisible: true });
          return false;
        })
        .finally(() => {
          reviewGithubConnectionPromise = null;
        });
      return reviewGithubConnectionPromise;
    }

    function pollReviewGithubConnection(attempt = 0) {
      if (reviewGithubPollTimer) window.clearTimeout(reviewGithubPollTimer);
      if (attempt > 45) {
        setReviewGithubGate({
          connected: false,
          checking: false,
          connecting: false,
          message: 'Still waiting for GitHub. Finish the connection, then press Connect GitHub again.',
        }, { forceVisible: true });
        return;
      }
      reviewGithubPollTimer = window.setTimeout(async () => {
        const connected = await refreshReviewGithubConnection(true, { silent: true });
        if (!connected) pollReviewGithubConnection(attempt + 1);
      }, attempt === 0 ? 1000 : 2000);
    }

    async function connectReviewGithub(button = githubConnectBtn) {
      if (reviewGithubConnected()) return true;
      const previousLabel = button?.textContent || '';
      if (button) {
        button.disabled = true;
        button.textContent = 'Opening';
      }
      setReviewGithubGate({
        connected: false,
        checking: false,
        connecting: true,
        message: 'Opening GitHub connection. Complete the approval window, then return here.',
        error: '',
      }, { forceVisible: true });
      try {
        const data = await postJSON('/api/review/github/connect', {});
        if (data.connected) {
          setReviewGithubGate({ ...data, connected: true, checking: false, connecting: false, message: '', error: '' });
          window.dispatchEvent(new CustomEvent('review-github-connected'));
          return true;
        }
        const redirectUrl = data.redirectUrl || data.authorization?.redirectUrl || data.authorization?.url || '';
        if (redirectUrl) {
          window.open(redirectUrl, 'rlm-wiki-github-connect', 'width=760,height=820,noopener,noreferrer');
        }
        setReviewGithubGate({
          connected: false,
          checking: false,
          connecting: true,
          message: redirectUrl
            ? 'Finish the GitHub connection in the new window. This page will unlock automatically.'
            : 'Finish the GitHub connection, then press Connect GitHub again.',
          error: '',
        }, { forceVisible: true });
        pollReviewGithubConnection();
        return false;
      } catch (error) {
        setReviewGithubGate({
          connected: false,
          checking: false,
          connecting: false,
          error: error.message || String(error),
          message: error.message || 'Could not start GitHub connection.',
        }, { forceVisible: true });
        if (button) {
          button.disabled = false;
          button.textContent = previousLabel || 'Connect GitHub';
        }
        return false;
      }
    }

    async function hasReviewGithubConnection() {
      return refreshReviewGithubConnection(false, { silent: true });
    }

    function showReviewGithubRequired(message = '') {
      setReviewGithubGate({
        connected: false,
        checking: false,
        connecting: false,
        message: message || 'Connect GitHub before loading pull requests for Review.',
        error: '',
      }, { forceVisible: true });
      appendAskScanRow('Connect GitHub required');
      setAskScanMeta('waiting for GitHub');
      document.getElementById('topbar-status').textContent = 'connect github';
    }

    function setBusy(busy, label = 'review') {
      reviewBusy = busy;
      renderReviewRuntimeToggle(busy);
      submitBtn.textContent = busy && label === 'review' ? 'Reviewing' : 'Review PR';
      investigateBtn.textContent = busy && label === 'investigate' ? 'Investigating' : 'Investigate';
      loadBtn.textContent = busy && label === 'load' ? 'Loading' : 'Load PR';
      syncReviewControls();
    }

    function renderReviewRuntimeToggle(disabled = false) {
      renderRuntimeToggle(reviewRuntimeToggle, selectedReviewRuntime, (runtime) => {
        if (disabled) return;
        selectedReviewRuntime = normalizeRuntime(runtime, 'rlm');
        localStorage.setItem(REVIEW_RUNTIME_KEY, selectedReviewRuntime);
        renderReviewRuntimeToggle();
      }, disabled);
      renderLocalCliAgentPicker(reviewLocalCliAgentBar, selectedReviewRuntime, { onChange: renderReviewRuntimeToggle });
      setRuntimeModelBarVisibility(reviewModelBar, selectedReviewRuntime);
    }
    renderReviewRuntimeToggle();

    function setCompactRightPane(compact) {
      const page = reviewRight?.closest('.review-page');
      if (!page) return;
      page.dataset.reviewCompactRight = compact ? '1' : '0';
      window.dispatchEvent(new Event('resize'));
    }

    function setReviewProcessState(state) {
      const page = reviewRight?.closest('.review-page');
      if (!page) return;
      const next = ['empty', 'live', 'complete'].includes(state) ? state : 'empty';
      page.dataset.reviewProcess = next;
      if (processTabButton) processTabButton.hidden = next === 'empty';
      if (next === 'empty' && workspaceTab === 'process') setWorkspaceTab(currentFileData ? 'diff' : 'pr');
      window.dispatchEvent(new Event('resize'));
    }

    function showReviewError(message) {
      const card = document.createElement('div');
      card.className = 'error-banner';
      card.textContent = message;
      thread.querySelector('.review-empty')?.remove();
      thread.appendChild(card);
      appendAskScanRow(message);
      setAskScanMeta('error');
      setWorkspaceTab('review');
      document.getElementById('topbar-status').textContent = 'error';
    }

    function resetReviewProcessPresentation() {
      setReviewProcessState('empty');
      setCompactRightPane(false);
      reviewRight?.classList.remove('process-complete');
      if (processReceipt) {
        processReceipt.hidden = true;
        processReceipt.innerHTML = '';
      }
      if (processCenterSlot) processCenterSlot.innerHTML = '';
      if (processEmpty) {
        processEmpty.hidden = false;
        processEmpty.textContent = 'Run a review to see the full agentic log history here.';
      }
    }

    function prepareReviewProcessRun() {
      setReviewProcessState('live');
      setCompactRightPane(false);
      if (processEmpty) {
        processEmpty.hidden = false;
        processEmpty.textContent = 'Live logs are running in the right panel. Full history moves here when complete.';
      }
      if (workspaceTab === 'process') setWorkspaceTab(currentFileData ? 'diff' : 'pr');
    }

    function completeReviewProcess(card, elapsed, label = 'Review') {
      reviewRight?.classList.add('process-complete');
      setReviewProcessState('complete');
      setCompactRightPane(true);
      if (processReceipt) {
        processReceipt.hidden = false;
        processReceipt.innerHTML = `
          <div class="review-process-receipt-title">${escapeHtml(label)} complete</div>
          <div class="review-process-receipt-meta">${escapeHtml(elapsed)} · ${processCountMeta(card)}</div>
          <button class="review-process-link" type="button" data-role="show-process">show logs</button>
        `;
        processReceipt.querySelector('[data-role="show-process"]')?.addEventListener('click', () => setWorkspaceTab('process'));
      }

      if (card?.el && processCenterSlot) {
        processCenterSlot.innerHTML = '';
        processCenterSlot.appendChild(card.el);
        if (processEmpty) processEmpty.hidden = true;
        card.open = true;
        card.expanded = true;
        card.el.classList.add('open', 'expanded');
        const expandBtn = card.el.querySelector('[data-role="expand"]');
        if (expandBtn) {
          const hasRows = Boolean(card.el.querySelector('[data-role="trail"] .agent-trail-row'));
          if (card.steps.length > 1 || hasRows) expandBtn.style.display = '';
          expandBtn.textContent = 'collapse history ▴';
        }
        if (window.Prism) Prism.highlightAllUnder(card.el);
      }
    }

    function renderGithubLabels(labels = []) {
      const visible = labels.filter(Boolean).slice(0, 5);
      if (!visible.length) return '';
      return `<div class="review-gh-labels">${visible.map((label) => `<span>${escapeHtml(label)}</span>`).join('')}</div>`;
    }

    function renderGithubDescription(review) {
      return `
        <div class="review-gh-description markdown">
          ${renderSafeGithubMarkdown(review.body, 'No description provided.')}
        </div>
        ${review.github?.warning ? `<div class="review-gh-warning">Some GitHub context could not be refreshed: ${escapeHtml(review.github.warning)}</div>` : ''}
      `;
    }

    function discussionKindLabel(item) {
      if (item.kind === 'review-comment') return item.path ? `Review comment · ${item.path}${item.line ? `:${item.line}` : ''}` : 'Review comment';
      if (item.kind === 'review') {
        const state = (item.state || 'reviewed').replace(/_/g, ' ').toLowerCase();
        return state.charAt(0).toUpperCase() + state.slice(1);
      }
      return 'Comment';
    }

    function renderGithubDiscussion(review) {
      const items = review.github?.discussion || [];
      if (!items.length) {
        return '<div class="review-gh-empty">No discussion comments or reviews yet.</div>';
      }
      const visible = items.slice(-18);
      return `
        <div class="review-gh-feed">
          ${items.length > visible.length ? `<div class="review-gh-note">Showing latest ${visible.length} of ${items.length} discussion items.</div>` : ''}
          ${visible.map((item) => {
            const body = item.body?.trim() || `${discussionKindLabel(item)} submitted.`;
            return `
              <article class="review-gh-feed-item">
                ${renderReviewAvatar(item.author)}
                <div class="review-gh-feed-body">
                  <div class="review-gh-feed-head">
                    <span class="review-gh-author">${escapeHtml(item.author?.login || 'unknown')}</span>
                    <span>${escapeHtml(discussionKindLabel(item))}</span>
                    ${item.createdAt ? `<span>${escapeHtml(formatRelativeTime(item.createdAt))}</span>` : ''}
                  </div>
                  <div class="review-gh-comment markdown">${renderSafeGithubMarkdown(body, '')}</div>
                </div>
              </article>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderGithubCommits(review) {
      const commits = review.github?.commits || [];
      if (!commits.length) return '<div class="review-gh-empty">No commit details available.</div>';
      return `
        <div class="review-gh-commits">
          ${commits.slice().reverse().slice(0, 20).map((commit) => `
            <a class="review-gh-commit" href="${escapeHtml(commit.htmlUrl || review.github?.htmlUrl || review.url)}" target="_blank" rel="noreferrer">
              <div class="review-gh-commit-main">
                <span class="review-gh-commit-title">${escapeHtml(commit.title || 'Commit')}</span>
                <span class="review-gh-commit-meta">
                  ${commit.current ? '<strong>Current</strong> · ' : ''}
                  ${escapeHtml(formatRelativeTime(commit.authoredAt))}
                  ${commit.author?.login ? ` · ${escapeHtml(commit.author.login)}` : ''}
                </span>
              </div>
              ${commit.shortSha ? `<span class="review-gh-sha">${escapeHtml(commit.shortSha)}</span>` : ''}
            </a>
          `).join('')}
        </div>
      `;
    }

    function renderGithubPanel(review) {
      if (!githubPanel || !review) return;
      if (githubPlaceholder) githubPlaceholder.hidden = true;
      const github = review.github || {};
      const discussionCount = github.commentsCount + github.reviewCommentsCount + github.reviewsCount || github.discussion?.length || 0;
      const commitsCount = github.commitsCount || github.commits?.length || 0;
      const activeTab = ['description', 'discussion', 'commits'].includes(githubPanelTab) ? githubPanelTab : 'description';
      const content = activeTab === 'discussion'
        ? renderGithubDiscussion(review)
        : activeTab === 'commits'
          ? renderGithubCommits(review)
          : renderGithubDescription(review);
      const mergeTone = reviewMergeTone(review);

      githubPanel.hidden = false;
      githubPanel.innerHTML = `
        ${github.mergeStatus ? `
          <div class="review-gh-merge ${mergeTone}">
            <span>${mergeTone === 'ok' ? '✓' : mergeTone === 'bad' ? '×' : '•'}</span>
            <span>${escapeHtml(github.mergeStatus)}</span>
          </div>
        ` : ''}
        <div class="review-gh-head">
          <div class="review-gh-kicker">
            <span class="review-gh-state ${escapeHtml(reviewStateLabel(review).toLowerCase())}">${escapeHtml(reviewStateLabel(review))}</span>
            <a href="${escapeHtml(github.htmlUrl || review.url)}" target="_blank" rel="noreferrer">${escapeHtml(review.owner)}/${escapeHtml(review.repo)} #${review.number}</a>
          </div>
          <h2 class="review-gh-title">${escapeHtml(review.title || `PR #${review.number}`)}</h2>
          <div class="review-gh-meta">
            ${renderReviewAvatar(github.author || { login: review.author }, 'review-gh-avatar small')}
            <span>${escapeHtml(review.author || github.author?.login || 'unknown')}</span>
            <code>${escapeHtml(review.baseBranch)}</code>
            <span>←</span>
            <code>${escapeHtml(review.headBranch)}</code>
            <span>${review.changedFiles} file${review.changedFiles === 1 ? '' : 's'}</span>
            <strong class="review-gh-plus">+${review.additions}</strong>
            <strong class="review-gh-minus">-${review.deletions}</strong>
          </div>
          ${renderGithubLabels(github.labels || [])}
          <div class="review-gh-tabs">
            <button class="${activeTab === 'description' ? 'active' : ''}" type="button" data-github-tab="description">Description</button>
            <button class="${activeTab === 'discussion' ? 'active' : ''}" type="button" data-github-tab="discussion">Discussion ${discussionCount}</button>
            <button class="${activeTab === 'commits' ? 'active' : ''}" type="button" data-github-tab="commits">Commits ${commitsCount}</button>
          </div>
        </div>
        <div class="review-gh-content">${content}</div>
      `;
      githubPanel.querySelectorAll('[data-github-tab]').forEach((button) => {
        button.addEventListener('click', () => {
          githubPanelTab = button.dataset.githubTab || 'description';
          renderGithubPanel(review);
        });
      });
      Prism.highlightAllUnder(githubPanel);
    }

    function renderPR(review) {
      renderGithubPanel(review);
      prSlot.innerHTML = `
        <div class="review-pr-card">
          <div class="review-pr-title">${escapeHtml(review.title || `PR #${review.number}`)}</div>
          <div class="review-pr-meta">${escapeHtml(review.owner)}/${escapeHtml(review.repo)}#${review.number} · ${escapeHtml(review.author || 'unknown')}</div>
          <div class="review-pr-stats">
            <span>${review.changedFiles} files</span>
            <span>+${review.additions}</span>
            <span>-${review.deletions}</span>
            <span>${escapeHtml(review.baseBranch)} <- ${escapeHtml(review.headBranch)}</span>
          </div>
        </div>
      `;
      filesEl.innerHTML = review.files.map((file) => `
        <button class="review-file${file.path === selectedPath ? ' selected' : ''}" type="button" data-path="${escapeHtml(file.path)}">
          <span class="review-file-status ${escapeHtml(file.status)}">${statusLetter(file.status)}</span>
          <span class="review-file-path">${escapeHtml(file.path)}</span>
          <span class="review-file-stat">+${file.additions} -${file.deletions}</span>
        </button>
      `).join('');
      filesEl.querySelectorAll('.review-file').forEach((el) => {
        el.addEventListener('click', () => selectFile(el.dataset.path));
      });
    }

    function issueLocation(issue) {
      const citation = issue.citations?.[0];
      if (!citation) return 'no exact diff line';
      const file = citation.path.split('/').pop();
      const end = citation.endLine && citation.endLine !== citation.startLine ? `-${citation.endLine}` : '';
      return `${file}:${citation.startLine}${end}`;
    }

    function issueKind(issue) {
      return issue.category === 'bug' ? 'bug' : 'flag';
    }

    function issueHeader(issue) {
      if (issue.category === 'bug') return 'Bug';
      if (issue.category === 'investigation' || issue.severity === 'high' || issue.severity === 'critical') return 'Investigate';
      return 'Flag';
    }

    function issueCopyLabel(issue) {
      return issue.category === 'bug' ? 'bug' : 'flag';
    }

    function issueMarkdown(issue) {
      const citation = issue.citations?.[0];
      const location = citation ? `${citation.path}:${citation.startLine}${citation.endLine && citation.endLine !== citation.startLine ? `-${citation.endLine}` : ''}` : 'No exact diff line';
      const lines = [
        `# ${issueHeader(issue)}: ${issue.title || 'Review note'}`,
        '',
        `- Severity: ${issue.severity || 'medium'}`,
        `- Location: ${location}`,
        '',
        issue.explanationMarkdown || '',
      ];
      if (issue.fixSuggestions?.length) {
        lines.push('', '## Suggested fix', issue.fixSuggestions.join('\n\n'));
      }
      if (issue.testsToAdd?.length) {
        lines.push('', '## Tests to add', ...issue.testsToAdd.map((test) => `- ${test}`));
      }
      return lines.join('\n');
    }

    function reviewPublishLabel(kind) {
      return kind === 'investigation' ? 'bugs / flags' : 'review';
    }

    function reviewPublishTarget(review) {
      if (!review) return 'this pull request';
      return `${review.owner}/${review.repo}#${review.number}`;
    }

    function setReviewPublishActionPosted(action, comment) {
      const button = action.querySelector('button');
      const title = action.querySelector('.review-fix-title');
      const meta = action.querySelector('.review-fix-meta');
      if (title) title.textContent = comment?.alreadyPublished ? 'Already posted to GitHub' : 'Posted to GitHub';
      if (meta) {
        meta.innerHTML = comment?.url
          ? `Comment published to the PR conversation. <a href="${escapeHtml(comment.url)}" target="_blank" rel="noreferrer">View comment</a>.`
          : 'Comment published to the PR conversation.';
      }
      if (button) {
        button.disabled = true;
        button.textContent = 'Posted';
      }
    }

    function setReviewPublishActionError(action, message) {
      const button = action.querySelector('button');
      const meta = action.querySelector('.review-fix-meta');
      if (meta) meta.innerHTML = `<span class="review-publish-error">${escapeHtml(message)}</span>`;
      if (button) {
        button.disabled = false;
        button.textContent = 'Try again';
      }
    }

    function showReviewPublishConnectState(action) {
      const button = action.querySelector('button');
      const title = action.querySelector('.review-fix-title');
      const meta = action.querySelector('.review-fix-meta');
      if (title) title.textContent = 'Connect GitHub to post';
      if (meta) meta.textContent = 'Posting comments uses your connected GitHub account.';
      if (button) {
        button.disabled = false;
        button.textContent = 'Connect GitHub';
        button.dataset.githubAction = 'connect';
        const markConnected = () => {
          delete button.dataset.githubAction;
          if (title) title.textContent = 'GitHub connected';
          if (meta) meta.textContent = 'Press again to post this comment to the PR.';
          button.disabled = false;
          button.textContent = 'Post comment';
        };
        window.addEventListener('review-github-connected', markConnected, { once: true });
        button.addEventListener('click', async () => {
          button.disabled = true;
          button.textContent = 'Waiting';
          const connected = await connectReviewGithub();
          if (connected) markConnected();
          else button.disabled = false;
        });
      }
    }

    function attachReviewPublishAction(targetEl, opts) {
      if (!targetEl || !opts?.runId) return;
      const kind = opts.kind === 'investigation' ? 'investigation' : 'review';
      const issueCount = Array.isArray(opts.result?.issues) ? opts.result.issues.length : 0;
      if (kind === 'investigation' && issueCount <= 0) return;
      const target = targetEl.closest?.('.review-answer-card') || targetEl;
      target.querySelector('[data-role="review-publish-action"]')?.remove();

      const action = document.createElement('div');
      action.className = 'review-fix-action review-publish-action';
      action.dataset.role = 'review-publish-action';
      const label = reviewPublishLabel(kind);
      const targetLabel = reviewPublishTarget(opts.review || currentReview);
      action.innerHTML = `
        <div class="review-fix-copy">
          <div class="review-fix-title">Post ${escapeHtml(label)} to PR?</div>
          <div class="review-fix-meta">Creates a GitHub conversation comment on <code>${escapeHtml(targetLabel)}</code>.</div>
        </div>
        <button class="review-fix-button" type="button">Post comment</button>
      `;
      target.appendChild(action);

      if (opts.posted?.url) {
        setReviewPublishActionPosted(action, opts.posted);
        return;
      }

      const button = action.querySelector('button');
      hasReviewGithubConnection().then((connected) => {
        if (!connected) showReviewPublishConnectState(action);
      });
      button?.addEventListener('click', async () => {
        if (button.dataset.githubAction === 'connect') return;
        button.disabled = true;
        button.textContent = 'Posting...';
        try {
          const data = await postJSON('/api/review/publish-comment', {
            runId: opts.runId,
            confirm: true,
          });
          setReviewPublishActionPosted(action, data.comment || {});
        } catch (error) {
          setReviewPublishActionError(action, error.message || String(error));
        }
      });
    }

    function issueAskPrompt(issue) {
      const citation = issue.citations?.[0];
      const location = citation ? `${citation.path}:${citation.startLine}${citation.endLine && citation.endLine !== citation.startLine ? `-${citation.endLine}` : ''}` : 'the cited PR change';
      return [
        `Investigate this ${issueCopyLabel(issue)} from ${currentReview?.url || 'the pull request'}.`,
        '',
        `Title: ${issue.title || 'Review note'}`,
        `Location: ${location}`,
        `Severity: ${issue.severity || 'medium'}`,
        '',
        issue.explanationMarkdown || '',
        '',
        issue.fixSuggestions?.length ? `Suggested fix: ${issue.fixSuggestions.join('\n')}` : '',
        '',
        'Please verify whether this is real, explain the relevant code path, and suggest the safest fix.',
      ].filter(Boolean).join('\n');
    }

    function hideIssuePopover() {
      document.getElementById('review-issue-popover')?.remove();
    }

    function showIssuePopover(issue, rect) {
      hideIssuePopover();
      const kind = issueKind(issue);
      const citation = issue.citations?.[0];
      const lineRange = citation ? `R${citation.startLine}${citation.endLine && citation.endLine !== citation.startLine ? `-${citation.endLine}` : ''}` : '';
      const fixes = issue.fixSuggestions?.length ? `
        <div class="review-issue-popover-extra">
          <div class="review-issue-popover-extra-title">Suggested fix</div>
          <div class="markdown">${marked.parse(issue.fixSuggestions[0])}</div>
        </div>
      ` : '';
      const tests = issue.testsToAdd?.length ? `
        <div class="review-issue-popover-extra">
          <div class="review-issue-popover-extra-title">Tests to add</div>
          <div class="markdown">${marked.parse(issue.testsToAdd.map((t) => `- ${t}`).join('\n'))}</div>
        </div>
      ` : '';
      const popover = document.createElement('div');
      popover.id = 'review-issue-popover';
      popover.className = 'review-issue-popover';
      popover.innerHTML = `
        <div class="review-issue-popover-head">
          <div class="review-issue-popover-kicker ${kind}">
            <span>${escapeHtml(issueHeader(issue))}</span>
            ${lineRange ? `<span class="review-issue-popover-loc">${escapeHtml(lineRange)}</span>` : ''}
          </div>
          <button class="review-issue-popover-close" type="button" aria-label="Close">×</button>
        </div>
        <div class="review-issue-popover-body">
          <div class="review-issue-popover-title">${escapeHtml(issue.title || 'Review note')}</div>
          <div class="markdown">${marked.parse(issue.explanationMarkdown || '')}</div>
          ${fixes}
          ${tests}
          <button class="review-issue-popover-copy" type="button" data-role="copy">Copy ${escapeHtml(issueCopyLabel(issue))}</button>
        </div>
        <div class="review-issue-popover-actions">
          <button class="review-issue-action" type="button" data-role="ask">Ask</button>
        </div>
      `;
      document.body.appendChild(popover);
      popover.querySelector('.review-issue-popover-close')?.addEventListener('click', hideIssuePopover);
      popover.querySelector('[data-role="copy"]')?.addEventListener('click', async () => {
        const text = issueMarkdown(issue);
        try {
          await navigator.clipboard.writeText(text);
          popover.querySelector('[data-role="copy"]').textContent = `Copied ${issueCopyLabel(issue)}`;
        } catch {
          popover.querySelector('[data-role="copy"]').textContent = 'Copy failed';
        }
      });
      popover.querySelector('[data-role="ask"]')?.addEventListener('click', () => {
        const repoUrl = currentReview ? `https://github.com/${currentReview.owner}/${currentReview.repo}` : '';
        const q = issueAskPrompt(issue);
        history.pushState(null, '', `/ask?repo=${encodeURIComponent(repoUrl)}&q=${encodeURIComponent(q)}`);
        hideIssuePopover();
        render();
      });

      const margin = 12;
      const box = popover.getBoundingClientRect();
      let left = rect.right + 10;
      let top = rect.top;
      if (left + box.width > window.innerWidth - margin) left = window.innerWidth - box.width - margin;
      if (top + box.height > window.innerHeight - margin) top = Math.max(margin, window.innerHeight - box.height - margin);
      if (left < margin) left = margin;
      popover.style.left = `${left}px`;
      popover.style.top = `${top}px`;
      Prism.highlightAllUnder(popover);
    }

    function buildReviewLineAnnotations(data) {
      if (!selectedPath || !investigationIssues.length) return [];
      const oldLineCount = data.oldFile?.contents ? data.oldFile.contents.split('\n').length : 0;
      const newLineCount = data.newFile?.contents ? data.newFile.contents.split('\n').length : 0;
      const annotations = [];
      for (const issue of investigationIssues) {
        for (const citation of issue.citations || []) {
          if (citation.path !== selectedPath) continue;
          const line = Number(citation.startLine || 0);
          if (!line) continue;
          let side = citation.side;
          let valid = false;
          if (side === 'deletions') {
            valid = line <= oldLineCount;
          } else if (side === 'additions') {
            valid = line <= newLineCount;
          } else if (line <= newLineCount) {
            side = 'additions';
            valid = true;
          } else if (line <= oldLineCount) {
            side = 'deletions';
            valid = true;
          }
          if (valid) {
            annotations.push({ lineNumber: line, side, metadata: issue });
          }
        }
      }
      return annotations;
    }

    function renderIssueAnnotation(annotation) {
      const issue = annotation.metadata || {};
      const kind = issueKind(issue);
      const color = kind === 'bug' ? '#fc8181' : '#f6ad55';
      const h = window.pierreDiff?.h;
      if (!h) return null;
      const icon = kind === 'bug'
        ? h('svg', { width: 20, height: 20, viewBox: '0 0 16 16', fill: 'none' },
            h('circle', { cx: 8, cy: 8, r: 6, fill: color }),
            h('path', { d: 'M8 4.25v4.25', stroke: '#181818', strokeWidth: 1.7, strokeLinecap: 'round' }),
            h('circle', { cx: 8, cy: 11.2, r: 0.9, fill: '#181818' }))
        : h('svg', { width: 22, height: 22, viewBox: '0 0 16 16', fill: 'none' },
            h('path', { d: 'M3 2v12', stroke: color, strokeWidth: 2, strokeLinecap: 'round' }),
            h('path', { d: 'M4 2.8h8.6v6.8H4z', fill: color }));
      return h('button', {
        type: 'button',
        className: `review-line-marker ${kind}`,
        title: issue.title || 'Review note',
        onClick(event) {
          event.stopPropagation();
          showIssuePopover(issue, event.currentTarget.getBoundingClientRect());
        },
      }, icon);
    }

    function renderInvestigation(result, runId = '') {
      const issues = Array.isArray(result?.issues) ? result.issues : [];
      investigationIssues = issues;
      const bugs = issues.filter((issue) => issue.category === 'bug');
      const flags = issues.filter((issue) => issue.category !== 'bug');
      const issueButton = (issue, kind) => `
        <button class="investigation-item ${kind}" type="button" data-path="${escapeHtml(issue.citations?.[0]?.path || '')}">
          <span class="investigation-icon">${kind === 'bug' ? '!' : '⚑'}</span>
          <span class="investigation-item-body">
            <span class="investigation-item-title">${escapeHtml(issue.title || 'Review note')}</span>
            <span class="investigation-item-meta">${escapeHtml(issue.severity || 'medium')} · ${escapeHtml(issueLocation(issue))}</span>
          </span>
        </button>
      `;
      showInvestigationPanel(`
        <div class="investigation-card">
          <div class="investigation-head bugs ${bugs.length ? 'active' : 'empty'}">
            <span>${bugs.length ? `${bugs.length} bug${bugs.length === 1 ? '' : 's'} found` : 'No bugs found'}</span>
          </div>
          ${bugs.length ? `<div class="investigation-list">${bugs.map((issue) => issueButton(issue, 'bug')).join('')}</div>` : ''}
        </div>
        <div class="investigation-card">
          <div class="investigation-head flags ${flags.length ? 'active' : ''}">
            <span>${flags.length} Flag${flags.length === 1 ? '' : 's'}</span>
          </div>
          ${flags.length ? `<div class="investigation-list">${flags.map((issue) => issueButton(issue, 'flag')).join('')}</div>` : ''}
        </div>
        ${result?.summaryMarkdown ? `<div class="investigation-summary markdown">${marked.parse(result.summaryMarkdown)}</div>` : ''}
      `);
      Prism.highlightAllUnder(investigationEl);
      investigationEl.querySelectorAll('.investigation-item[data-path]').forEach((el) => {
        el.addEventListener('click', () => {
          if (el.dataset.path) selectFile(el.dataset.path);
        });
      });
      attachReviewPublishAction(investigationEl, {
        runId,
        kind: 'investigation',
        review: currentReview,
        result,
        posted: result?.investigationComment,
      });
      if (currentFileData) renderDiff(currentFileData);
    }

    function renderDiff(data) {
      currentFileData = data;
      const oldFile = data.oldFile || { name: selectedPath || 'base', contents: '', cacheKey: `empty-base-${selectedPath || ''}` };
      const newFile = data.newFile || { name: selectedPath || 'head', contents: '', cacheKey: `empty-head-${selectedPath || ''}` };

      if ((!data.oldFile && !data.newFile && data.patch) || !window.pierreDiff) {
        diffBody.innerHTML = renderReviewPatchFallback(data);
        return;
      }

      const selectedLines = currentSelection && currentSelection.path === selectedPath
        ? {
            start: currentSelection.startLine,
            end: currentSelection.endLine,
            side: currentSelection.side || 'unified',
          }
        : null;
      diffBody.innerHTML = '<div class="review-pierre-mount" id="review-pierre-mount"></div>';
      const mount = document.getElementById('review-pierre-mount');
      window.pierreDiff.render(mount, {
        oldFile,
        newFile,
        selectedLines,
        lineAnnotations: buildReviewLineAnnotations(data),
        renderAnnotation: renderIssueAnnotation,
        options: {
          theme: { dark: 'pierre-dark', light: 'pierre-light' },
          diffStyle,
          enableLineSelection: true,
          onLineSelected(range) {
            currentSelection = range && selectedPath ? {
              path: selectedPath,
              side: range.side || 'unified',
              startLine: range.start,
              endLine: range.end,
              mode: range.start === range.end ? 'single-line' : 'range',
            } : null;
          },
        },
      });
    }

    async function selectFile(path, opts = {}) {
      if (!currentReview || !path) return;
      selectedPath = path;
      if (!opts.preserveSelection) currentSelection = null;
      setWorkspaceTab('diff');
      renderPR(currentReview);
      diffTitle.textContent = path;
      diffBody.innerHTML = '<div class="review-loading"><span class="spinner"></span>loading diff</div>';
      try {
        const params = new URLSearchParams({
          reviewId: currentReview.reviewId,
          path,
          url: currentReview.url || '',
        });
        const file = await fetchJSON(`/api/review/file?${params.toString()}`);
        renderDiff(file);
      } catch (e) {
        const fileMeta = currentReview.files?.find((file) => file.path === path);
        if (fileMeta?.patch) {
          renderDiff({ oldFile: null, newFile: null, patch: fileMeta.patch });
        } else {
          diffBody.innerHTML = `<div class="review-error">${escapeHtml(e.message)}</div>`;
        }
      }
    }

    async function loadPR() {
      const prUrl = prInput.value.trim();
      if (!prUrl) return null;
      if (!(await hasReviewGithubConnection())) {
        resetAskScan('connect github');
        showReviewGithubRequired('Connect GitHub before loading pull requests for Review.');
        return null;
      }
      document.getElementById('topbar-status').textContent = 'loading pr';
      resetAskScan('loading pr');
      resetReviewProcessPresentation();
      appendAskScanRow('Fetching PR metadata');
      setBusy(true, 'load');
      try {
        const response = await fetch('/api/review/load', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ url: prUrl }),
        });
        const data = await response.json();
        if (!response.ok) {
          const error = new Error(data.error || 'Failed to load PR');
          error.needsGitHubConnection = data.needsGitHubConnection || response.status === 428;
          throw error;
        }
        currentReview = data.review;
        prInput.value = currentReview.url;
        selectedPath = currentReview.files[0]?.path || null;
        hideInvestigationPanel();
        document.getElementById('brand-sub').textContent = `${currentReview.owner}/${currentReview.repo}#${currentReview.number}`;
        document.getElementById('topbar-status').textContent = 'pr loaded';
        setAskScanMeta(`${currentReview.owner}/${currentReview.repo}#${currentReview.number}`);
        appendAskScanRow('PR metadata loaded');
        renderPR(currentReview);
        setWorkspaceTab('pr');
        if (selectedPath) await selectFile(selectedPath);
        setWorkspaceTab('pr');
        return currentReview;
      } catch (e) {
        if (e.needsGitHubConnection) showReviewGithubRequired(e.message);
        else showReviewError(e.message);
        return null;
      } finally {
        setBusy(false, 'load');
      }
    }

    function reviewFixRepoUrl(review) {
      if (!review) return '';
      const owner = review.headOwner || review.owner;
      const repo = review.headRepo || review.repo;
      if (!owner || !repo) return '';
      const branch = String(review.headBranch || '').trim();
      const base = `https://github.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
      if (!branch) return base;
      const branchPath = branch.split('/').map((part) => encodeURIComponent(part)).join('/');
      return `${base}/tree/${branchPath}`;
    }

    function reviewFixTargetLabel(review) {
      if (!review) return 'PR head branch';
      const owner = review.headOwner || review.owner;
      const repo = review.headRepo || review.repo;
      const branch = review.headBranch || 'HEAD';
      return `${owner}/${repo}:${branch}`;
    }

    function buildReviewFixTask(markdown, review, question) {
      const reviewText = truncateBlock(markdown || '', { maxChars: 24000, maxLines: 420 }).shown;
      const files = (review?.files || [])
        .filter((file) => file?.path)
        .slice(0, 80)
        .map((file) => `- ${file.path} (${file.status || 'modified'}, +${file.additions || 0}/-${file.deletions || 0})`)
        .join('\n');
      const hiddenFileCount = Math.max(0, (review?.files?.length || 0) - 80);
      const prLabel = review ? `${review.owner}/${review.repo}#${review.number}` : 'the reviewed pull request';
      return [
        `Fix the actionable findings from this review of ${prLabel}.`,
        '',
        `Work on this branch: ${reviewFixTargetLabel(review)}.`,
        review?.baseBranch ? `Base branch for context: ${review.owner}/${review.repo}:${review.baseBranch}.` : '',
        'Keep the patch narrow. Preserve unrelated code. Add or update focused tests when the review calls for it.',
        'Stop after producing the local patch; the app handles shipping as a separate explicit action.',
        question ? `## Original review request\n${question}` : '',
        `## Changed files\n${files || '- Changed file list was not available.'}${hiddenFileCount ? `\n- ...${hiddenFileCount} more file${hiddenFileCount === 1 ? '' : 's'}` : ''}`,
        `## Review output to fix\n${reviewText || '(empty review output)'}`,
      ].filter(Boolean).join('\n\n');
    }

    function normalizedPrHtmlUrl(review) {
      const url = review?.github?.htmlUrl || review?.url || '';
      return normalizeClientUrl(url.replace(/\/changes$/, ''));
    }

    function codeRunMatchesReview(run, review) {
      if (!run || !review) return false;
      if (run.status === 'running') return false;
      const prUrl = normalizedPrHtmlUrl(review);
      const resultPr = run.result?.pullRequest || {};
      if (prUrl && normalizeClientUrl(resultPr.url) === prUrl) return true;
      const branch = review.headBranch || '';
      if (branch) {
        if (resultPr.branch === branch) return true;
        if (run.result?.branch?.branch === branch) return true;
        if (run.input?.ref?.branch === branch) return true;
      }
      if (Number(resultPr.number) === Number(review.number || 0)) {
        const owner = resultPr.baseOwner || resultPr.headOwner || run.input?.ref?.owner;
        const repo = resultPr.baseRepo || resultPr.headRepo || run.input?.ref?.repo;
        if (owner === review.owner && repo === review.repo) return true;
      }
      return false;
    }

    async function findCodeRunForReview(review, preferredRunId = '') {
      if (preferredRunId) {
        try {
          const { run } = await fetchJSON(`/api/run?id=${encodeURIComponent(preferredRunId)}`);
          if (run?.kind === 'code' && run.status !== 'running') return run;
        } catch (error) {
          console.warn('failed to load preferred source code run for review', error);
        }
      }
      try {
        const { runs } = await fetchJSON('/api/runs?kind=code&limit=80');
        return (runs || []).find((run) => codeRunMatchesReview(run, review)) || null;
      } catch (error) {
        console.warn('failed to find source code run for review', error);
        return null;
      }
    }

    function attachReviewFixAction(answerBody, markdown, review, question, sourceRunId = '') {
      if (!answerBody || !review) return;
      const repoUrl = reviewFixRepoUrl(review);
      if (!repoUrl) return;
      const target = answerBody.closest('.review-answer-card') || answerBody;
      target.querySelector('[data-role="review-fix-action"]')?.remove();

      const action = document.createElement('div');
      action.className = 'review-fix-action';
      action.dataset.role = 'review-fix-action';
      action.innerHTML = `
        <div class="review-fix-copy">
          <div class="review-fix-title">Ready to fix?</div>
          <div class="review-fix-meta">Send this review to Code on <code>${escapeHtml(reviewFixTargetLabel(review))}</code>.</div>
        </div>
        <button class="review-fix-button" type="button">Fix with Code</button>
      `;
      action.querySelector('button')?.addEventListener('click', async (event) => {
        const button = event.currentTarget;
        const previousLabel = button.textContent;
        button.disabled = true;
        button.textContent = 'Preparing...';
        const task = buildReviewFixTask(markdown, review, question);
        const params = new URLSearchParams({ repo: repoUrl, handoff: 'review-fix' });
        const reviewLabel = review ? `${review.owner}/${review.repo}#${review.number}` : 'PR review';
        const returnUrl = location.pathname.startsWith('/review')
          ? `${location.pathname}${location.search || ''}`
          : (review?.url ? `/review?pr=${encodeURIComponent(review.url)}` : '/review');
        try {
          const key = `review-fix-${Date.now()}-${Math.random().toString(16).slice(2)}`;
          sessionStorage.setItem(`rlm-wiki-code-handoff:${key}`, JSON.stringify({
            repo: repoUrl,
            task,
            displayTask: `Fix review findings for ${reviewLabel}`,
            kind: 'review-fix',
            reviewLabel,
            detail: `Full review attached as agent context for ${reviewFixTargetLabel(review)}.`,
            changedFileCount: review?.changedFiles || review?.files?.length || 0,
            returnUrl,
            source: 'review',
            createdAt: Date.now(),
          }));
          params.set('handoffKey', key);
        } catch {
          params.set('task', truncateBlock(task, { maxChars: 6000, maxLines: 120 }).shown);
        }
        try {
          const sourceRun = await findCodeRunForReview(review, sourceRunId || reviewSourceCodeRunId);
          if (sourceRun?.id) {
            const key = `review-followup-${Date.now()}-${Math.random().toString(16).slice(2)}`;
            const followupPayload = {
              task,
              displayTask: `Fix review findings for ${reviewLabel}`,
              kind: 'review-fix',
              reviewLabel,
              detail: `Continuing the Code session that created ${reviewLabel}.`,
              changedFileCount: review?.changedFiles || review?.files?.length || 0,
              returnUrl,
              source: 'review',
              createdAt: Date.now(),
            };
            sessionStorage.setItem(`rlm-wiki-code-followup:${key}`, JSON.stringify(followupPayload));
            history.pushState(null, '', `/code/${encodeURIComponent(sourceRun.id)}?handoff=review-fix&followupKey=${encodeURIComponent(key)}`);
          } else {
            history.pushState(null, '', `/code?${params.toString()}`);
          }
          render();
        } catch (error) {
          console.warn('failed to launch review fix', error);
          history.pushState(null, '', `/code?${params.toString()}`);
          render();
        } finally {
          button.disabled = false;
          button.textContent = previousLabel;
        }
      });
      target.appendChild(action);
    }

    function appendReviewTurn(question) {
      if (investigationPanelVisible) setReviewTab('review');
      thread.querySelector('.review-empty')?.remove();
      const card = document.createElement('div');
      card.className = 'review-answer-card';
      card.innerHTML = `
        <div class="ask-turn-label">request</div>
        <div class="ask-question-card">${escapeHtml(question)}</div>
        <div class="ask-turn-label" style="margin-top:14px">review</div>
        <div class="ask-answer-pending" data-role="answer"><span class="spinner"></span>thinking</div>
      `;
      thread.appendChild(card);
      thread.scrollTop = thread.scrollHeight;
      return card.querySelector('[data-role="answer"]');
    }

    function normalizeClientUrl(value) {
      return String(value || '').trim().replace(/\/$/, '');
    }

    function reviewRunMatches(run, matchUrl) {
      if (!matchUrl) return true;
      return normalizeClientUrl(run.input?.url) === normalizeClientUrl(matchUrl);
    }

    function renderPersistedInvestigationRun(run) {
      const result = run.result || {};
      const issues = Array.isArray(result.issues) ? result.issues : [];
      const bugs = issues.filter((issue) => issue.category === 'bug');
      const flags = issues.filter((issue) => issue.category !== 'bug');
      thread.querySelector('.review-empty')?.remove();
      const card = document.createElement('div');
      card.className = 'review-answer-card';
      card.innerHTML = `
        <div class="ask-turn-label">investigation</div>
        <div class="ask-question-card">${escapeHtml(run.title || run.input?.url || 'Previous investigation')}</div>
