          return;
        }
        showRunError(streamErrorMessage(err, 'Connection error'), err);
        clearInterval(tickHandle);
      },
      onDone() {
        if (!terminalReceived && activeRunId && reconnectAttempts < 6) {
          attachToRunStream(Math.min(10_000, 900 * Math.max(1, reconnectAttempts + 1)));
        }
      },
    };

    streamAbort = resumeRunId
      ? sseGetStream(`/api/run/stream?id=${encodeURIComponent(resumeRunId)}`, streamHandlers)
      : sseStream('/api/generate', {
        url: primaryUrl,
        urls,
        channel: pageChannelId,
        structureChannel: structureChannelId,
        pageChannel: pageChannelId,
        depth: wikiDepth,
        pageCount: wikiPageCount,
        style: wikiStyle,
        stylePrompt: wikiStylePrompt,
        runtime: wikiRuntime,
        localCli: currentLocalCliConfig(),
      }, streamHandlers);

    function showRunError(message, details = {}) {
      currentPhase = 'done';
      document.getElementById('topbar-status').textContent = 'error';
      progressMeta.textContent = `failed · ${formatElapsed(Date.now() - startedAt)}`;
      document.querySelector('.dot-pulse')?.remove();
      const box = document.getElementById('run-error');
      box.style.display = '';
      const setup = providerSetupForDetails(details, message);
      const provider = normalizeProviderId(details?.provider || setup?.provider);
      box.innerHTML = (setup || providerAcceptsKeys(provider)) ? renderProviderAccessNotice(provider, setup, message) : `
        <div class="run-error-banner">
          <span class="err-label">error</span>
          <span>${escapeHtml(message)}</span>
        </div>
      `;
      // Also clear any lingering "thinking…" placeholders on active cards —
      // nothing is going to arrive after this.
      document.querySelectorAll('[data-role="thinking"]').forEach((n) => n.remove());
      document.querySelectorAll('.agent-active-live.thinking').forEach((n) => {
        n.classList.remove('thinking');
        n.textContent = 'stopped';
      });
    }
  }

  // Map a backend agent event onto the correct AgentCard method.
  function routeAgentEvent(card, event, opts = {}) {
    if (!event) return;
    const replay = opts.replay === true;
    if (event.type === 'text_delta') {
      if (!replay) {
        if (event.replace) card.replaceLiveProbeText(event.text || '');
        else card.addLiveProbeDelta(event.text || '');
      }
    } else if (event.type === 'thinking_start') {
      if (!replay) card.addLiveThinkingDelta('');
    } else if (event.type === 'thinking_delta') {
      if (!replay) card.addLiveThinkingDelta(event.text || '');
    } else if (event.type === 'tool_use') {
      if (typeof card.addAgentLog === 'function') {
        card.addAgentLog({
          type: 'agent-log',
          kind: 'tool-input',
          id: event.id,
          tool: event.name,
          message: `Using ${event.name || 'tool'}`,
          input: typeof event.input === 'string' ? event.input : JSON.stringify(event.input || {}, null, 2),
        }, { replay });
      }
    } else if (event.type === 'tool_result') {
      if (typeof card.addAgentLog === 'function') {
        card.addAgentLog({
          type: 'agent-log',
          kind: event.isError ? 'tool-error' : 'tool-output',
          id: event.id,
          tool: event.name,
          message: `${event.name || 'Tool'} ${event.isError ? 'failed' : 'finished'}`,
          output: event.output || '',
          error: event.isError ? event.output || 'Tool failed' : '',
          durationMs: event.durationMs,
        }, { replay });
      }
    } else if (event.type === 'stream-delta') {
      if (!replay) {
        if (event.replace) card.replaceLiveProbeText(event.delta || '');
        else card.addLiveProbeDelta(event.delta || '');
      }
    } else if (event.type === 'stream-done') {
      if (!replay) card.markLiveProbeRunning();
    } else if (event.type === 'stream-reasoning-delta') {
      if (!replay) {
        // JCODE exposes provider thought streams for its TUI. In the app,
        // those are private implementation noise; tool use and final text
        // are the user-facing process.
        card.addLiveThinkingDelta(event.delta || '');
      }
    } else if (event.type === 'step') {
      card.addStep(event, { replay });
    } else if (event.type === 'agent-log') {
      if (typeof card.addAgentLog === 'function') card.addAgentLog(event, { replay });
    } else if (event.type === 'status') {
      // Rich agent-log rows now drive the transcript. Raw status events still
      // feed the phase rail, but they are intentionally quiet here.
      if (event.label === 'stream_done' || event.message === 'Agent stream finished.') {
        return;
      }
      if (event.phase === 'jit') {
        return;
      }
      if (event.phase === 'tool') {
        return;
      }
      if (event.phase === 'jcode' || event.phase === 'connection') return;
      const friendly = friendlyStatusFor(event);
      if (friendly === null) return;
      const msg = friendly || `[${event.phase || 'status'}] ${event.message || ''}`.trim();
      if (msg && msg.length < 200) {
        if (replay && typeof card.addStatusImmediate === 'function') card.addStatusImmediate(msg);
        else card.addStatus(msg);
      }
    } else if (event.type === 'submit') {
      const msg = `submit · ${event.sources?.length ?? 0} sources cited`;
      if (replay && typeof card.addStatusImmediate === 'function') card.addStatusImmediate(msg);
      else card.addStatus(msg);
    } else if (event.type === 'jit-start') {
      if (!replay && typeof card.showJITPeekStart === 'function') card.showJITPeekStart(event);
    } else if (event.type === 'jit') {
      if (typeof card.addJITPeek === 'function') card.addJITPeek(event, { replay });
    } else if (event.type === 'error') {
      card.markError(event.error || 'unknown agent error', event);
    } else if (event.type === 'tool-start') {
      // Tool details render through agent-log tool-input/tool-output groups.
    } else if (event.type === 'tool-done') {
      // Tool details render through agent-log tool-input/tool-output groups.
    } else if (event.type === 'tool-error') {
      // Tool details render through agent-log tool-input/tool-output groups.
    }
  }

  function addCardProcessStatus(card, message, opts = {}) {
    const clean = String(message || '').replace(/\s+/g, ' ').trim();
    if (!card || !clean) return;
    if (opts.replay && typeof card.addStatusImmediate === 'function') card.addStatusImmediate(clean);
    else if (typeof card.addStatus === 'function') card.addStatus(clean);
  }

  function addCardProcessStatusNow(card, message) {
    const clean = String(message || '').replace(/\s+/g, ' ').trim();
    if (!card || !clean) return;
    if (typeof card.addStatusImmediate === 'function') card.addStatusImmediate(clean);
    else addCardProcessStatus(card, clean);
  }

  function isProcessGeneratedPath(path) {
    const normalized = String(path || '').replace(/^["']|["']$/g, '').replace(/^\.?\//, '');
    return normalized === 'graphify-out' || normalized.startsWith('graphify-out/');
  }

  function splitProcessPatchFiles(patch) {
    const text = String(patch || '');
    if (!text || text === '(no diff)') return [];
    if (!text.includes('diff --git ')) return [text];
    const segments = [];
    let current = [];
    for (const line of text.split('\n')) {
      if (line.startsWith('diff --git ') && current.length) {
        segments.push(current.join('\n'));
        current = [];
      }
      current.push(line);
    }
    if (current.length) segments.push(current.join('\n'));
    return segments.filter((segment) => segment.trim());
  }

  function patchEditSummary(segment) {
    const text = String(segment || '');
    const header = text.match(/^diff --git a\/(.+?) b\/(.+)$/m);
    const path = header ? header[2] : '';
    if (!path || isProcessGeneratedPath(path)) return null;
    let additions = 0;
    let deletions = 0;
    for (const line of text.split('\n')) {
      if (line.startsWith('+++') || line.startsWith('---')) continue;
      if (line.startsWith('+')) additions += 1;
      else if (line.startsWith('-')) deletions += 1;
    }
    return { path, additions, deletions };
  }

  function patchEditSummaries(diff, changedFiles = []) {
    const segments = splitProcessPatchFiles(diff);
    const fromPatch = segments.map(patchEditSummary).filter(Boolean);
    if (fromPatch.length) return fromPatch;
    return (Array.isArray(changedFiles) ? changedFiles : [])
      .map((path) => String(path || '').trim())
      .filter((path) => path && !isProcessGeneratedPath(path))
      .map((path) => ({ path, additions: 0, deletions: 0 }));
  }

  function addPatchEditsToProcessCard(card, diff, changedFiles = [], opts = {}) {
    if (!card || typeof card.addSyntheticEditActivity !== 'function') return;
    const edits = patchEditSummaries(diff, changedFiles);
    edits.forEach((edit, index) => {
      card.addSyntheticEditActivity({
        ...edit,
        id: `${opts.idPrefix || 'diff-edit'}:${index}:${edit.path}`,
      }, opts);
    });
  }

  function routeRunEventToCard(card, event, opts = {}) {
    if (!card || !event) return;
    const payload = event.payload || {};
    const agentEvent = runEventAgentEvent(event);
    if (agentEvent) {
      routeAgentEvent(card, agentEvent, opts);
      return;
    }
    if (event.type === 'start') {
      if (payload.publishRequested) {
        addCardProcessStatus(card, payload.publishBlocked ? 'Preparing PR draft from current patch' : 'Publishing current patch', opts);
      } else if (payload.continuation) {
        addCardProcessStatus(card, payload.patchRehydrated ? 'Previous patch applied' : payload.patchExcerptOnly ? 'Previous patch excerpt loaded' : 'Continuation accepted', opts);
      } else {
        addCardProcessStatus(card, 'Code session accepted', opts);
      }
      return;
    }
    if (event.type === 'publish') {
      const pr = payload.pullRequest || payload.publish?.pullRequest;
      addCardProcessStatus(card, pr?.number ? `PR ${payload.mode === 'updated' ? 'updated' : 'published'} #${pr.number}` : 'Branch published', opts);
      return;
    }
    if (event.type === 'answer') {
      addCardProcessStatus(card, 'Result summary captured', opts);
      return;
    }
    if (event.type === 'diff') {
      const count = Array.isArray(payload.changedFiles) ? payload.changedFiles.length : 0;
      const patchText = String(payload.diff || '').trim();
      const hasPatch = count > 0 || Boolean(patchText && patchText !== '(no diff)');
      if (patchText || !opts.replay) {
        addPatchEditsToProcessCard(card, payload.diff || '', payload.changedFiles || [], {
          ...opts,
          idPrefix: `event-diff:${payload.turnId || event.turnId || 'run'}`,
        });
      }
      addCardProcessStatus(card, hasPatch ? `Patch ready${count ? ` · ${count} file${count === 1 ? '' : 's'}` : ''}` : 'No changes', opts);
      return;
    }
    if (event.type === 'error') {
      card.markError(payload.message || payload.error || 'Code run failed', payload);
    }
  }

  function runEventAgentEvent(event) {
    if (!event || event.type !== 'agent') return null;
    const payload = event.payload || {};
    return payload.event || payload.agentEvent || null;
  }

  function runEventTurnId(event) {
    const payload = event?.payload || {};
    return payload.turnId || payload.event?.turnId || payload.agentEvent?.turnId || '';
  }

  function replayRunEventsIntoCard(card, run, turnId = '') {
    const events = processEventsForRun(run, turnId);
    const streamReplay = { text: '', thinking: '', count: 0 };
    events.forEach((event) => {
      const agentEvent = runEventAgentEvent(event);
      if (agentEvent?.type === 'text_delta') {
        streamReplay.text += agentEvent.text || '';
        streamReplay.count += 1;
        return;
      }
      if (agentEvent?.type === 'thinking_delta') {
        streamReplay.thinking += agentEvent.text || '';
        streamReplay.count += 1;
        return;
      }
      if (agentEvent?.type === 'thinking_start') {
        streamReplay.count += 1;
        return;
      }
      routeRunEventToCard(card, event, { replay: true });
    });
    if (streamReplay.count && typeof card?.addReplayStreamSummary === 'function') {
      card.addReplayStreamSummary({
        text: streamReplay.text,
        thinking: streamReplay.thinking,
        eventCount: streamReplay.count,
      });
    }
    card?._clearStatusQueue?.();
  }

  function processEventsForRun(run, turnId = '') {
    const persistedEvents = Array.isArray(run?.events) ? run.events : [];
    const snapshotEvents = run?.result?.processSnapshot?.events;
    const events = persistedEvents.length
      ? persistedEvents
      : Array.isArray(snapshotEvents) && snapshotEvents.length
        ? snapshotEvents
        : [];
    if (!turnId) return events;
    const scoped = events.filter((event) => runEventTurnId(event) === turnId);
    if (scoped.length) return scoped;
    return events.some((event) => runEventTurnId(event)) ? [] : events;
  }

  function processCountMeta(card) {
    const logs = card?.logs?.length || 0;
    const steps = card?.steps?.length || 0;
    const rows = card?.el?.querySelectorAll('[data-role="trail"] .agent-trail-row')?.length || 0;
    if (card?.presentation === 'rlm') {
      const actions = (card.activityGroups || []).reduce((sum, group) => sum + (group?.items?.length || 0), 0);
      if (actions) return `${actions} evidence action${actions === 1 ? '' : 's'}`;
      if (steps) return `${steps} probe${steps === 1 ? '' : 's'}`;
      if (rows) return `${rows} event${rows === 1 ? '' : 's'}`;
      if (logs) return `${logs} log${logs === 1 ? '' : 's'}`;
      return '0 events';
    }
    if (logs) return `${logs} log${logs === 1 ? '' : 's'}`;
    if (steps) return `${steps} step${steps === 1 ? '' : 's'}`;
    return `${rows} event${rows === 1 ? '' : 's'}`;
  }

  // ── ASK view ───────────────────────────────────────────────
  let askPageAbort = null;
  let askScanQueue = [];
  let askScanFlushTimer = null;
  let askScanUnseenCount = 0;
  const ASK_SCAN_ROW_DELAY_MS = 96;
  const ASK_STICKY_BOTTOM_PX = 44;
  const ASK_INTRO_DISMISS_SCROLL_PX = 28;

  function renderAskScanPlaceholder() {
    const rows = [
      'Waiting for GitHub URL',
      'Preparing agent session',
      'Loading repository',
      'Scanning source tree',
      'Booting sandbox',
      'Reading files',
      'Running tool calls',
      'Composing answer',
    ];
    return rows.map((label, i) => `
      <div class="ask-scan-row${i > 4 ? ' dim' : ''}" style="--row-index:${i}">
        <span class="ask-scan-chevron">›</span>
        <span class="ask-scan-label">${escapeHtml(label)}</span>
        <span class="ask-scan-line"></span>
      </div>
    `).join('');
  }

  function setAskScanMeta(text) {
    const meta = document.getElementById('ask-scan-meta');
    if (meta) meta.textContent = text || 'idle';
  }

  function setAskProcessStatusVisible(visible) {
    const status = document.getElementById('ask-process-status') || document.querySelector('.ask-process-status');
    if (status) status.hidden = !visible;
    const panel = status?.closest?.('.ask-scan-panel') || document.querySelector('.ask-scan-panel');
    if (panel) panel.classList.toggle('has-agent-logs', !visible);
  }

  function mountProcessAgentCard(card) {
    const slot = document.getElementById('ask-agent-slot');
    if (!slot || !card?.el) return;
    slot.innerHTML = '';
    slot.appendChild(card.el);
    setAskProcessStatusVisible(false);
  }

  function prefersReducedMotion() {
    return window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
  }

  function isNearScrollBottom(el, threshold = ASK_STICKY_BOTTOM_PX) {
    if (!el) return true;
    return el.scrollHeight - el.scrollTop - el.clientHeight <= threshold;
  }

  function setAskScanUnseenCount(count) {
    askScanUnseenCount = Math.max(0, count || 0);
    const pill = document.getElementById('ask-scan-unseen');
    if (!pill) return;
    pill.hidden = askScanUnseenCount === 0;
    pill.textContent = askScanUnseenCount === 1 ? '1 new log' : `${askScanUnseenCount} new logs`;
  }

  function bindAskProcessScroller(scroller) {
    if (!scroller || scroller.dataset.stickBound === '1') return;
    scroller.dataset.stickBound = '1';
    scroller.dataset.stickToBottom = '1';
    scroller.addEventListener('scroll', () => {
      if (scroller.dataset.programmaticScroll === '1') return;
      scroller.dataset.userScrolled = '1';
      scroller.dataset.stickToBottom = isNearScrollBottom(scroller, 72) ? '1' : '0';
      queueAskIntroDismissal(scroller);
    }, { passive: true });
    updateAskIntroDismissal(scroller);
  }

  function setAskProcessScrollTop(scroller, top) {
    if (!scroller) return;
    scroller.dataset.programmaticScroll = '1';
    scroller.scrollTop = top;
    requestAnimationFrame(() => {
      if (scroller.dataset.programmaticScroll === '1') {
        delete scroller.dataset.programmaticScroll;
      }
    });
  }

  function queueAskIntroDismissal(scroller) {
    if (!scroller || scroller.dataset.introFrame === '1') return;
    scroller.dataset.introFrame = '1';
    requestAnimationFrame(() => {
      scroller.dataset.introFrame = '0';
      updateAskIntroDismissal(scroller);
    });
  }

  function updateAskIntroDismissal(scroller) {
    const panel = scroller?.closest?.('.ask-scan-panel');
    if (!panel) return;
    const shouldDismiss = panel.classList.contains('working') || scroller.scrollTop > ASK_INTRO_DISMISS_SCROLL_PX;
    panel.classList.toggle('intro-dismissed', shouldDismiss);
  }

  function bindAskScanList(list) {
    if (!list || list.dataset.stickBound === '1') return;
    list.dataset.stickBound = '1';
    list.dataset.stickToBottom = '1';
    list.addEventListener('scroll', () => {
      const stuck = isNearScrollBottom(list);
      list.dataset.stickToBottom = stuck ? '1' : '0';
      if (stuck) setAskScanUnseenCount(0);
    }, { passive: true });
  }

  function bindAskScanUnseenPill() {
    const pill = document.getElementById('ask-scan-unseen');
    if (!pill || pill.dataset.bound === '1') return;
    pill.dataset.bound = '1';
    pill.addEventListener('click', () => {
      const list = document.getElementById('ask-scan-list');
      const scroller = document.getElementById('ask-process-scroll');
      if (list) {
        bindAskScanList(list);
        list.dataset.stickToBottom = '1';
        scrollAskScanListToBottom(list, { force: true, countUnseen: false });
      }
      if (scroller) {
        bindAskProcessScroller(scroller);
        scroller.dataset.stickToBottom = '1';
        scrollAskProcessToBottom({ force: true });
      }
      setAskScanUnseenCount(0);
    });
  }

  function scrollAskProcessToBottom(opts = {}) {
    const scroller = document.getElementById('ask-process-scroll');
    if (!scroller) return;
    bindAskProcessScroller(scroller);
    const shouldFollow = opts.force === true || scroller.dataset.stickToBottom !== '0' || isNearScrollBottom(scroller, 72);
    if (!shouldFollow) return;
    requestAnimationFrame(() => {
      setAskProcessScrollTop(scroller, scroller.scrollHeight);
    });
  }

  function scrollAskScanListToBottom(list, opts = {}) {
    if (!list) return;
    bindAskScanList(list);
    const shouldFollow = opts.force === true || list.dataset.stickToBottom !== '0' || isNearScrollBottom(list);
    if (!shouldFollow) {
      if (opts.countUnseen !== false) setAskScanUnseenCount(askScanUnseenCount + 1);
      return;
    }
    requestAnimationFrame(() => {
      list.scrollTop = list.scrollHeight;
      setAskScanUnseenCount(0);
    });
  }

  function refreshAskScanFlow(list) {
    const rows = Array.from(list.querySelectorAll('.ask-scan-row'));
    rows.forEach((row, i) => {
      const distance = rows.length - 1 - i;
      const targetOpacity = distance === 0 ? 0.96 : distance === 1 ? 0.78 : distance === 2 ? 0.62 : 0.48;
      row.style.setProperty('--row-opacity', String(targetOpacity));
      row.dataset.flowDistance = String(distance);
      row.classList.toggle('current', distance === 0);
      row.classList.toggle('recent-1', distance === 1);
      row.classList.toggle('recent-2', distance === 2);
    });
  }

  function expandAskProcessCard(card) {
    if (card) {
      card.open = true;
      card.expanded = true;
      card.el.classList.add('open', 'expanded');
      const expandBtn = card.el.querySelector('[data-role="expand"]');
      if (expandBtn) {
        const hasRows = Boolean(card.el.querySelector('[data-role="trail"] .agent-trail-row'));
        if (card.steps.length > 1 || hasRows) expandBtn.style.display = '';
        expandBtn.textContent = 'collapse history ▴';
      }
      if (typeof card._syncHistoryDisclosureState === 'function') card._syncHistoryDisclosureState();
      if (window.Prism) Prism.highlightAllUnder(card.el);
    }
  }

  function showFullAskProcessHistory(card, opts = {}) {
    document.querySelector('.ask-scan-panel')?.classList.add('done');
    expandAskProcessCard(card);
    const scroller = document.getElementById('ask-process-scroll');
    if (scroller) {
      const anchorKey = opts.anchorKey || card?.id || '';
      const hasAnchored = anchorKey && scroller.dataset.historyAnchorKey === anchorKey;
      const userScrolled = scroller.dataset.userScrolled === '1';
      if (anchorKey && !hasAnchored) scroller.dataset.historyAnchorKey = anchorKey;
      if (hasAnchored || userScrolled) {
        scroller.dataset.stickToBottom = '0';
        updateAskIntroDismissal(scroller);
        return;
      }
      requestAnimationFrame(() => {
        setAskProcessScrollTop(scroller, 0);
        scroller.dataset.stickToBottom = '0';
        updateAskIntroDismissal(scroller);
      });
    }
  }

  function resetAskScan(repoLabel) {
    clearAskScanQueue();
    const list = document.getElementById('ask-scan-list');
    if (!list) return;
    document.querySelector('.ask-scan-panel')?.classList.remove('done', 'working', 'intro-dismissed');
    list.classList.remove('live');
    list.dataset.live = '';
    list.dataset.lastLabel = '';
    list.dataset.stickToBottom = '1';
    list.innerHTML = renderAskScanPlaceholder();
    refreshAskScanFlow(list);
    setAskScanMeta(repoLabel || 'idle');
    setAskScanUnseenCount(0);
    setAskProcessStatusVisible(true);
    bindAskScanList(list);
    bindAskScanUnseenPill();
    const scroller = document.getElementById('ask-process-scroll');
    if (scroller) {
      bindAskProcessScroller(scroller);
      scroller.dataset.stickToBottom = '1';
      delete scroller.dataset.userScrolled;
      delete scroller.dataset.historyAnchorKey;
      setAskProcessScrollTop(scroller, 0);
      updateAskIntroDismissal(scroller);

  function clearAskScanQueue() {
    askScanQueue = [];
    if (askScanFlushTimer) {
      window.clearTimeout(askScanFlushTimer);
      askScanFlushTimer = null;
    }
  }

  function scheduleAskScanFlush() {
    if (askScanFlushTimer) return;
    askScanFlushTimer = window.setTimeout(flushAskScanQueue, 0);
  }

  function flushAskScanQueue() {
    askScanFlushTimer = null;
    const next = askScanQueue.shift();
    if (!next) return;
    appendAskScanRowNow(next.clean, next.dim);
    if (askScanQueue.length) {
      askScanFlushTimer = window.setTimeout(flushAskScanQueue, ASK_SCAN_ROW_DELAY_MS);
    }
  }

  function appendAskScanRow(label, dim = false) {
    if (!label) return;
    const list = document.getElementById('ask-scan-list');
    if (!list) return;
    const clean = String(label).replace(/\s+/g, ' ').trim();
    if (!clean || clean === list.dataset.lastLabel || askScanQueue.some((item) => item.clean === clean)) return;
    askScanQueue.push({ clean, dim });
    scheduleAskScanFlush();
  }

  function appendAskScanRowNow(clean, dim = false) {
    const list = document.getElementById('ask-scan-list');
    if (!list || !clean || clean === list.dataset.lastLabel) return;
    bindAskScanList(list);
    bindAskScanUnseenPill();
    const scanShouldFollow = list.dataset.stickToBottom !== '0' || isNearScrollBottom(list);
    const processScroller = document.getElementById('ask-process-scroll');
    if (processScroller) bindAskProcessScroller(processScroller);
    const processShouldFollow = !processScroller || processScroller.dataset.stickToBottom !== '0' || isNearScrollBottom(processScroller, 72);
    list.dataset.lastLabel = clean;
    if (list.dataset.live !== '1') {
      list.innerHTML = '';
      list.dataset.live = '1';
      list.classList.add('live', 'live-enter');
      if (prefersReducedMotion()) list.classList.remove('live-enter');
      else window.setTimeout(() => list.classList.remove('live-enter'), 360);
    }
    const row = document.createElement('div');
    row.style.setProperty('--row-index', String(Math.min(list.children.length, 8)));
    const shouldAnimate = list.querySelectorAll('.ask-scan-row').length < 4 && !prefersReducedMotion();
    row.className = `ask-scan-row${shouldAnimate ? ' flow-in' : ''}${dim ? ' dim' : ''}`;
    row.innerHTML = `
      <span class="ask-scan-chevron">›</span>
      <span class="ask-scan-label">${escapeHtml(clean.slice(0, 140))}</span>
      <span class="ask-scan-line"></span>
    `;
    list.appendChild(row);
    const pruneFromTop = !scanShouldFollow;
    const scrollTopBeforePrune = list.scrollTop;
    let prunedHeight = 0;
    while (list.children.length > 80) {
      const first = list.firstElementChild;
      if (!first) break;
      if (pruneFromTop) prunedHeight += first.getBoundingClientRect().height;
      list.removeChild(first);
    }
    if (pruneFromTop && prunedHeight) {
      list.scrollTop = Math.max(0, scrollTopBeforePrune - prunedHeight);
    }
    refreshAskScanFlow(list);
    if (shouldAnimate) window.setTimeout(() => row.classList.remove('flow-in'), 260);
    else row.classList.remove('flow-in');
    scrollAskScanListToBottom(list, { force: scanShouldFollow });
    scrollAskProcessToBottom({ force: processShouldFollow });
  }

  function askStatusLabelForEvent(event) {
    if (!event) return null;
    if (event.type === 'stream-delta' || event.type === 'stream-done' || event.type === 'stream-reasoning-delta') return null;
    if (event.type === 'agent-log') return agentLogSummary(event);
    const friendly = friendlyStatusFor(event);
    if (friendly) return friendly;
    if (event.type === 'status') return event.message || event.label || event.phase || null;
    if (event.type === 'tool_use') return `Using ${event.name || 'tool'}`;
    if (event.type === 'tool_result') return `${event.isError ? 'Tool error in' : 'Finished'} ${event.name || 'tool'}`;
    if (event.type === 'submit') return `Submitting answer with ${event.sources?.length ?? 0} source${event.sources?.length === 1 ? '' : 's'}`;
    if (event.type === 'tool-start') return `Using ${event.tool || 'tool'}`;
    if (event.type === 'tool-done') return `Finished ${event.tool || 'tool'}`;
    if (event.type === 'tool-error') return `Tool error in ${event.tool || 'tool'}`;
    if (event.type === 'error') return event.error || 'Agent error';
    return null;
  }

  function summarizeAskTitle(question) {
    const raw = (question || '').trim();
    if (!raw) return 'ask anything';
    const lines = raw.split(/\n+/).map((line) => line.trim()).filter(Boolean);
    const first = lines[0] || raw;
    const titleLine = lines.find((line) => /^title:/i.test(line));
    if (/^investigate this (bug|flag)\b/i.test(first) && titleLine) {
      const kind = first.match(/^investigate this (bug|flag)\b/i)?.[1] || 'finding';
      return clampText(`Investigate ${kind}: ${titleLine.replace(/^title:\s*/i, '')}`, 132);
    }
    return clampText(first.replace(/\s+/g, ' '), 132);
  }

  function clampText(text, max) {
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (clean.length <= max) return clean;
    return `${clean.slice(0, max - 1).trimEnd()}…`;
  }

  function setAskPageTitle(question) {
    const title = document.getElementById('ask-question-title');
    if (!title) return;
    title.textContent = summarizeAskTitle(question);
    title.title = question || '';
  }

  let panelResizeAbort = null;

  function clampNumber(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function storedPanelNumber(key, fallback) {
    const value = Number(localStorage.getItem(key));
    return Number.isFinite(value) && value > 0 ? value : fallback;
  }

  function startPanelDrag(handle, onMove, signal) {
    handle.addEventListener('pointerdown', (event) => {
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault();
      handle.classList.add('dragging');
      document.body.classList.add('panel-resizing');
      handle.setPointerCapture?.(event.pointerId);

      const move = (moveEvent) => {
        moveEvent.preventDefault();
        onMove(moveEvent.clientX);
      };
      const finish = () => {
        handle.classList.remove('dragging');
        document.body.classList.remove('panel-resizing');
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', finish);
        window.removeEventListener('pointercancel', finish);
      };

      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', finish);
      window.addEventListener('pointercancel', finish);
    }, { signal });
  }

  function initAskPanelResize(page) {
    const key = 'rlm-wiki:ask-left-width';
    const handle = page.querySelector('[data-resizer="ask-main"]');
    if (!handle) return;

    let leftWidth = storedPanelNumber(key, Math.round(window.innerWidth * 0.41));
    const apply = () => {
      if (window.matchMedia('(max-width: 900px)').matches) {
        page.style.gridTemplateColumns = '';
        return;
      }
      const total = page.getBoundingClientRect().width - handle.getBoundingClientRect().width;
      leftWidth = clampNumber(leftWidth, 320, Math.max(320, total - 420));
      page.style.gridTemplateColumns = `${Math.round(leftWidth)}px 7px minmax(420px, 1fr)`;
    };
    const persist = () => localStorage.setItem(key, String(Math.round(leftWidth)));

    startPanelDrag(handle, (clientX) => {
      const rect = page.getBoundingClientRect();
      const total = rect.width - handle.getBoundingClientRect().width;
      leftWidth = clampNumber(clientX - rect.left, 320, Math.max(320, total - 420));
      persist();
      apply();
    }, panelResizeAbort.signal);

    window.addEventListener('resize', apply, { signal: panelResizeAbort.signal });
    apply();
  }

  function initReviewPanelResize(page) {
    const leftKey = 'rlm-wiki:review-left-width';
    const rightKey = 'rlm-wiki:review-right-width';
    const leftHandle = page.querySelector('[data-resizer="review-left"]');
    const rightHandle = page.querySelector('[data-resizer="review-right"]');
    if (!leftHandle || !rightHandle) return;

    let leftWidth = storedPanelNumber(leftKey, 320);
    let rightWidth = storedPanelNumber(rightKey, Math.round(window.innerWidth * 0.34));
    const handleWidth = 14;

    const normalize = () => {
      const total = page.getBoundingClientRect().width - handleWidth;
      leftWidth = clampNumber(leftWidth, 260, 460);
      rightWidth = clampNumber(rightWidth, 320, 620);
      const middleMin = 420;
      const overflow = leftWidth + rightWidth + middleMin - total;
      if (overflow > 0) {
        const rightCanGive = Math.max(0, rightWidth - 320);
        const rightGive = Math.min(overflow, rightCanGive);
        rightWidth -= rightGive;
        const leftGive = Math.min(overflow - rightGive, Math.max(0, leftWidth - 260));
        leftWidth -= leftGive;
      }
    };
    const apply = () => {
      if (window.matchMedia('(max-width: 900px)').matches) {
        page.style.gridTemplateColumns = '';
        return;
      }
      if (page.dataset.reviewProcess === 'empty') {
        leftWidth = clampNumber(leftWidth, 300, 460);
        page.style.gridTemplateColumns = `${Math.round(leftWidth)}px 7px minmax(420px, 1fr)`;
        return;
      }
      if (page.dataset.reviewCompactRight === '1') {
        const total = page.getBoundingClientRect().width - handleWidth;
        const compactRight = 260;
        leftWidth = clampNumber(leftWidth, 260, 460);
        const overflow = leftWidth + compactRight + 420 - total;
        if (overflow > 0) {
          leftWidth -= Math.min(overflow, Math.max(0, leftWidth - 260));
        }
        page.style.gridTemplateColumns = `${Math.round(leftWidth)}px 7px minmax(420px, 1fr) 7px ${compactRight}px`;
        return;
      }
      normalize();
      page.style.gridTemplateColumns = `${Math.round(leftWidth)}px 7px minmax(420px, 1fr) 7px ${Math.round(rightWidth)}px`;
    };
    const persist = () => {
      localStorage.setItem(leftKey, String(Math.round(leftWidth)));
      localStorage.setItem(rightKey, String(Math.round(rightWidth)));
    };

    startPanelDrag(leftHandle, (clientX) => {
      const rect = page.getBoundingClientRect();
      const total = rect.width - handleWidth;
      leftWidth = clampNumber(clientX - rect.left, 260, Math.max(260, total - rightWidth - 420));
      persist();
      apply();
    }, panelResizeAbort.signal);

    startPanelDrag(rightHandle, (clientX) => {
      if (page.dataset.reviewCompactRight === '1') return;
      const rect = page.getBoundingClientRect();
      const total = rect.width - handleWidth;
      rightWidth = clampNumber(rect.right - clientX, 320, Math.max(320, total - leftWidth - 420));
      persist();
      apply();
    }, panelResizeAbort.signal);

    window.addEventListener('resize', apply, { signal: panelResizeAbort.signal });
    apply();
  }

  function initWikiDrawerResize() {
    const key = 'rlm-wiki:wiki-drawer-width';
    const handle = document.getElementById('wiki-drawer-resizer');
    if (!handle) return;

    const minWidth = () => Math.min(340, Math.max(280, window.innerWidth - 32));
    const maxWidth = () => Math.max(minWidth(), Math.min(720, window.innerWidth - 32));
    let drawerWidth = storedPanelNumber(key, 430);

    const apply = () => {
      drawerWidth = clampNumber(drawerWidth, minWidth(), maxWidth());
      document.documentElement.style.setProperty('--wiki-drawer-width', `${Math.round(drawerWidth)}px`);
    };
    const persist = () => localStorage.setItem(key, String(Math.round(drawerWidth)));

    startPanelDrag(handle, (clientX) => {
      drawerWidth = clampNumber(clientX, minWidth(), maxWidth());
      persist();
      apply();
    }, panelResizeAbort.signal);

    window.addEventListener('resize', apply, { signal: panelResizeAbort.signal });
    apply();
  }

  function initWikiLayoutResize(page) {
    const key = 'rlm-wiki:wiki-sidebar-width';
    const handle = page?.querySelector('[data-resizer="wiki-nav"]');
    if (!page || !handle) return;

    let sidebarWidth = storedPanelNumber(key, 260);
    const apply = () => {
      if (window.matchMedia('(max-width: 900px)').matches) {
        page.style.gridTemplateColumns = '';
        return;
      }
      const total = page.getBoundingClientRect().width - handle.getBoundingClientRect().width;
      sidebarWidth = clampNumber(sidebarWidth, 220, Math.max(220, total - 520));
      page.style.gridTemplateColumns = `${Math.round(sidebarWidth)}px 7px minmax(520px, 1fr)`;
    };
    const persist = () => localStorage.setItem(key, String(Math.round(sidebarWidth)));

    startPanelDrag(handle, (clientX) => {
      const rect = page.getBoundingClientRect();
      const total = rect.width - handle.getBoundingClientRect().width;
      sidebarWidth = clampNumber(clientX - rect.left, 220, Math.max(220, total - 520));
      persist();
      apply();
    }, panelResizeAbort.signal);

    window.addEventListener('resize', apply, { signal: panelResizeAbort.signal });
    apply();
  }

  function initPanelResize(page, kind) {
    if (panelResizeAbort) panelResizeAbort.abort();
    panelResizeAbort = new AbortController();
    if (kind === 'wiki') {
      initWikiLayoutResize(page);
      initWikiDrawerResize();
      return;
    }
    if (!page) return;
    if (kind === 'ask') initAskPanelResize(page);
    if (kind === 'review') initReviewPanelResize(page);
  }

    function askCodeRepoCandidatesForTurn(turn) {
      const repos = turn?.repoInfo?.repos?.length ? turn.repoInfo.repos : turn?.repoInfo?.refs || [];
      return repos
        .filter((repo) => repo?.owner && repo?.repo)
        .map((repo) => ({
          ...repo,
          id: repo.id || clientWorkspaceRepoId(repo),
          label: repo.label || `${repo.owner}/${repo.repo}`,
          branch: repo.branch || null,
          url: repo.url || `https://github.com/${repo.owner}/${repo.repo}`,
        }));
    }

    function askCodeRepoLabel(repo) {
      return `${repo.label || `${repo.owner}/${repo.repo}`}${repo.branch && repo.branch !== 'HEAD' ? ` @ ${repo.branch}` : ''}`;
    }

    function codeUrlForAskRepo(repo) {
      const base = (repo.input || repo.url || `https://github.com/${repo.owner}/${repo.repo}`).replace(/\/+$/, '');
      const branch = repo.branch && repo.branch !== 'HEAD' ? String(repo.branch) : '';
      if (!branch || /\/(?:tree|blob)\//.test(base)) return base;
      const encodedBranch = branch.split('/').map((part) => encodeURIComponent(part)).join('/');
      return `${base}/tree/${encodedBranch}`;
    }

    function defaultAskCodeRepo(turn) {
      const repos = askCodeRepoCandidatesForTurn(turn);

    function defaultAskCodeRepoUrl(turn) {

    function buildAskCodeTask(turn, implementationPrompt, targetRepo) {
      const answer = truncateBlock(turn.answer || '', { maxChars: 24000, maxLines: 420 }).shown;
      const sources = Array.isArray(turn.sources) && turn.sources.length
        ? turn.sources.map((source) => `- ${source}`).join('\n')
        : '- No structured sources were submitted with the answer.';
      const target = targetRepo?.owner && targetRepo?.repo ? askCodeRepoLabel(targetRepo) : targetRepo?.url || 'selected repository';
      return `# Ask Answer To Code Anything

User implementation prompt:
${implementationPrompt}

Target repository:
${target}

Original Ask question:
${turn.question || '(not recorded)'}

Ask answer context:
${answer || '(empty)'}

Ask sources:
${sources}

Execution rules:
- Treat the Ask answer as context, not proof. Inspect the target repository before editing.
- Implement the smallest concrete patch that satisfies the user implementation prompt.
- Preserve unrelated changes and existing architecture.
- If the answer context is insufficient or points to no safe code change, report that after verifying the repository.`;
    }

    function askCodeImageFileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read screenshot.'));
        reader.onload = () => resolve(String(reader.result || ''));
        reader.readAsDataURL(file);
      });
    }

    async function addAskCodeScreenshotFiles(turn, files) {
      const imageFiles = Array.from(files || []).filter((file) => file && /^image\/(png|jpeg|webp)$/i.test(file.type));
      if (!turn || !imageFiles.length) return;
      const shots = askCodeScreenshotList(turn);
      for (const file of imageFiles) {
        if (shots.length >= 3) break;
        const dataUrl = await askCodeImageFileToDataUrl(file);
        shots.push({
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          name: file.name || 'screenshot',
          mimeType: dataUrl.match(/^data:([^;]+);/)?.[1] || file.type || 'image/png',
          dataUrl,
        });
      }
      renderAskCodePendingScreenshots(turn);
    }

    function handleAskCodeScreenshotPaste(turn, event) {
      const items = Array.from(event.clipboardData?.items || []);
      const imageFiles = items
        .filter((item) => item.kind === 'file' && /^image\//i.test(item.type))
        .map((item) => item.getAsFile())
        .filter(Boolean);
      if (!imageFiles.length) return;
      event.preventDefault();
      event.stopPropagation();
      addAskCodeScreenshotFiles(turn, imageFiles).catch((error) => setAskCodeMessage(error.message || String(error)));
    }

    function revealAskCodeInlineWhenReached() {
      const inline = document.getElementById('ask-code-inline');
      if (!inline) return;
      inline.classList.remove('is-visible');
      if (!('IntersectionObserver' in window)) {
        inline.classList.add('is-visible');
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        if (!entries.some((entry) => entry.isIntersecting)) return;
        inline.classList.add('is-visible');
        observer.disconnect();
      }, {
        root: answerContent,
        threshold: 0.18,
        rootMargin: '0px 0px -18px 0px',
      });
      observer.observe(inline);
    }

    function launchAskCodeTask(autoRun) {
      const turn = selectedAskTurn();
      if (!turn || turn.status !== 'done' || !turn.answer) {
        setAskCodeMessage('Run Ask first, then send the completed answer to Code Anything.');
        return;
      }
      const askCodeRepo = document.getElementById('ask-code-url-input');
      const repoValue = (askCodeRepo?.value || '').trim();
      const targetRepo = parseGithubInput(repoValue);
      if (!targetRepo) {
        setAskCodeMessage('Use owner/repo or a GitHub URL.');
        askCodeRepo?.focus();
        return;

      const screenshots = askCodeScreenshotList(turn);
      if (screenshots.length && !askCodeSelectedChannelSupportsVision(turn)) {
        setAskCodeMessage(`Selected model cannot inspect screenshots. ${askCodeVisionProviderHint()}`);
        return;

      const askCodePrompt = document.getElementById('ask-code-task-input');
      const prompt = (askCodePrompt?.value || '').trim() || ASK_CODE_DEFAULT_PROMPT;
      turn.codePromptDraft = prompt;
      turn.codeRepoUrl = repoValue;
      const repoUrl = codeUrlForAskRepo(targetRepo);
      const task = buildAskCodeTask(turn, prompt, targetRepo);
      const returnUrl = activeAskSessionId
        ? `/ask/${encodeURIComponent(activeAskSessionId)}`
        : `${location.pathname}${location.search || ''}`;
      const params = new URLSearchParams({ repo: repoUrl, handoff: 'ask-code' });
      try {
        const key = `ask-code-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        sessionStorage.setItem(`rlm-wiki-code-handoff:${key}`, JSON.stringify({
          repo: repoUrl,
          task,
          displayTask: prompt,
          kind: 'ask-to-code',
          reviewLabel: 'Ask answer',
          detail: `Answer context from ${askCodeRepoLabel(targetRepo)} is attached for the coding agent.`,
          returnUrl,
          returnLabel: 'Back to Ask',
          source: 'ask',
          sourceRunId: activeAskSessionId || turn.runId || '',
          sourceTurnId: turn.id || '',
          askQuestion: turn.question || '',
          channel: askCodeChannelId(turn),
          modelLabel: channelLabelFor(askCodeChannelId(turn)),
          screenshots,
          autoRun: autoRun === true,
          createdAt: Date.now(),
        }));
        params.set('handoffKey', key);
      } catch {
        params.set('task', truncateBlock(task, { maxChars: 6000, maxLines: 140 }).shown);
      }
      history.pushState(null, '', `/code?${params.toString()}`);
      render();
    }

    function markSelectedAskTurn() {
      askTurns.forEach((turn) => {
        turn.el?.classList.toggle('selected', turn.id === selectedAskTurnId);
        turn.el?.setAttribute('aria-current', turn.id === selectedAskTurnId ? 'true' : 'false');
      });
    }

    function captureAskScan(turn) {
      if (!turn || selectedAskTurnId !== turn.id) return;
      const list = document.getElementById('ask-scan-list');
      const meta = document.getElementById('ask-scan-meta');
      if (list) turn.scanHtml = list.innerHTML;
      if (meta) turn.scanMeta = meta.textContent || '';
    }

    function restoreAskScan(turn) {
      const list = document.getElementById('ask-scan-list');
      const panel = document.querySelector('.ask-scan-panel');
      if (!list || !turn) return;
      list.innerHTML = turn.scanHtml || renderAskScanPlaceholder();
      list.classList.toggle('live', Boolean(turn.scanHtml));
      list.dataset.live = turn.scanHtml ? '1' : '';
      refreshAskScanFlow(list);
      bindAskScanList(list);
      bindAskScanUnseenPill();
      setAskScanUnseenCount(0);
      panel?.classList.toggle('working', turn.status === 'running');
      panel?.classList.toggle('done', turn.status === 'done' || turn.status === 'error');
      updateAskIntroDismissal(document.getElementById('ask-process-scroll'));
      setAskScanMeta(turn.scanMeta || (turn.status === 'running' ? 'running' : 'idle'));
    }

    function renderSelectedAskAnswer(turn) {
      readerTitle.textContent = summarizeAskTitle(turn.question);
      latestAnswerMarkdown = turn.answer || '';
      readerCopy.hidden = !turn.answer;
      readerCopy.textContent = 'Copy';

      if (turn.status === 'done') {
        answerContent.className = 'ask-reader-body markdown';
        answerContent.innerHTML = marked.parse(turn.answer || '(empty)');
        Prism.highlightAllUnder(answerContent);
        linkifySources(answerContent, repoInfoForLinks());
        renderMermaidDiagrams(answerContent, { afterRender: () => setupMermaidZoom(answerContent) });
        answerContent.insertAdjacentHTML('beforeend', renderAskCodeInline(turn));
        bindAskCodeInline(turn);
        renderSourcesPane(turn.sources || []);
      } else if (turn.status === 'error') {
        answerContent.className = 'ask-reader-body';
        answerContent.innerHTML = renderErrorBanner(turn.error || 'Ask failed', turn);
        clearAskSourceMounts();
        askSourceRefs = [];
        renderSourcesPane([]);
      } else {
        answerContent.className = 'ask-reader-body';
        answerContent.innerHTML = '<div class="ask-reader-pending"><span class="spinner"></span>Working on this answer...</div>';
        clearAskSourceMounts();
        askSourceRefs = [];
        sourcesList.innerHTML = '<div class="ask-reader-empty">Sources appear here after this answer is ready.</div>';
      }
    }

    function renderSelectedAskProcess(turn) {
      const slot = document.getElementById('ask-agent-slot');
      if (!slot || !turn) return;
      const scroller = document.getElementById('ask-process-scroll');
      if (scroller && slot.dataset.processTurnId !== turn.id) {
        delete scroller.dataset.userScrolled;
        delete scroller.dataset.historyAnchorKey;
        slot.dataset.processTurnId = turn.id;
      }
      slot.innerHTML = '';
      setAskProcessStatusVisible(!turn.card);
      if (turn.card) {
        mountProcessAgentCard(turn.card);
        if (turn.status === 'done' || turn.status === 'error') showFullAskProcessHistory(turn.card, { anchorKey: turn.id });
        else {
          turn.card.open = true;
          turn.card.el.classList.add('open');
        }
      }
    }

    function selectAskTurn(turnId, opts = {}) {
      const turn = askTurns.find((item) => item.id === turnId);
      if (!turn) return;
      selectedAskTurnId = turn.id;
      activeRepoInfo = turn.repoInfo || activeRepoInfo;
      markSelectedAskTurn();
      setAskPageTitle(turn.question);
      renderSelectedAskAnswer(turn);
      restoreAskScan(turn);
      renderSelectedAskProcess(turn);
      setAskWorkspaceTab(opts.tab || turn.tab || (turn.status === 'done' ? 'answer' : 'process'));
    }

    function scanHtmlFromRunEvents(run, turnId = '') {
      const events = processEventsForRun(run, turnId);
      const labels = [];
      for (const event of events) {
        if (event.type === 'start') labels.push('Session accepted');
        else if (event.type === 'agent') {
          const label = askStatusLabelForEvent(runEventAgentEvent(event));
          if (label) labels.push(label);
        } else if (event.type === 'answer') labels.push('Answer submitted');
        else if (event.type === 'error') labels.push(event.payload?.message || event.payload?.error || 'Run failed');
      }
      const compact = labels.filter(Boolean).slice(-80);
      if (!compact.length) return '';
      return compact.map((label, index) => `
        <div class="ask-scan-row" style="--row-index:${Math.min(index, 8)}">
          <span class="ask-scan-chevron">›</span>
          <span class="ask-scan-label">${escapeHtml(String(label).slice(0, 140))}</span>
          <span class="ask-scan-line"></span>
        </div>
      `).join('');
    }

    function buildAskCardFromRun(run, turn = null) {
      const input = run.input || {};
      const repos = turn?.refs || input.refs || input.repos || [];
      const label = Array.isArray(repos) && repos.length
        ? describeRepoSet(repos)
        : 'restored run';
      const runtime = normalizeRuntime(turn?.runtime || input.runtime, 'rlm');
      const card = new AgentCard(turn?.id || run.id || `ask-restored-${Date.now()}`, 'page', `${runtimeLabel(runtime)} · ${label}`, { presentation: runtime, transcriptScrollMode: 'local' });
      replayRunEventsIntoCard(card, run, turn?.id || '');
      if (turn?.status === 'error') card.markError(turn.error || run.error || 'Run failed', turn);
      else if (turn?.status === 'done') card.markDone({ chars: (turn.answer || '').length });
      else if (run.status === 'error') card.markError(run.error || 'Run failed', run);
      else if (run.status === 'done') card.markDone({ chars: (run.result?.answer || '').length });
      else card.setStatus('running');
      expandAskProcessCard(card);
      return card;
    }

    function normalizePersistedAskTurn(raw, run, index) {
      const input = run.input || {};
      const result = run.result || {};
      const row = raw || {};
      const refs = Array.isArray(row.refs)
        ? row.refs
        : Array.isArray(input.refs)
          ? input.refs
          : [];
      const status = row.status === 'done' || row.status === 'error'
        ? row.status
        : run.status === 'done' || run.status === 'error'
          ? run.status
          : 'running';
      return {
        id: row.id || row.turnId || (index === 0 ? run.id : `${run.id}:turn-${index + 1}`),
        runId: run.id,
        question: row.question || input.question || run.title || 'Previous question',
        status,
        answer: row.answer || (index === 0 ? result.answer || '' : ''),
        sources: Array.isArray(row.sources) ? row.sources : (index === 0 && Array.isArray(result.sources) ? result.sources : []),
        error: row.error || (status === 'error' ? run.error || result.error || '' : ''),
        refs,
        history: Array.isArray(row.history) ? row.history : (Array.isArray(input.history) ? input.history : []),
        channel: row.channel || input.channel || selectedChannelId,
        runtime: normalizeRuntime(row.runtime || input.runtime, 'rlm'),
        askMode: row.askMode || input.askMode || selectedAskMode,
        workspaceGoal: row.workspaceGoal ?? input.workspaceGoal ?? 'custom',
      };
    }

    function persistedAskTurnsFromRun(run) {
      const resultTurns = Array.isArray(run.result?.turns) ? run.result.turns : null;
      const inputTurns = Array.isArray(run.input?.turns) ? run.input.turns : null;
      const rawTurns = resultTurns?.length ? resultTurns : inputTurns?.length ? inputTurns : null;
      if (rawTurns) {
        return rawTurns.map((turn, index) => normalizePersistedAskTurn(turn, run, index));
      }
      return [normalizePersistedAskTurn(null, run, 0)];
    }

    function setAskTurnStatus(turnState) {
      const statusEl = turnState.el?.querySelector('[data-role="answer-status"]');
      if (!statusEl) return;
      if (turnState.status === 'done') {
        statusEl.className = 'ask-turn-status done';
        statusEl.textContent = 'Answer ready';
      } else if (turnState.status === 'error') {
        statusEl.className = 'ask-turn-status error';
        statusEl.textContent = 'Answer failed';
      } else {
        statusEl.className = 'ask-turn-status';
        statusEl.innerHTML = '<span class="spinner"></span>researching in process';
      }
    }

    async function loadPersistedAskRun(runId) {
      if (!runId) return false;
      try {
        const { run } = await fetchJSON(`/api/run?id=${encodeURIComponent(runId)}`);
        if (run.kind !== 'ask') throw new Error('That session is not an Ask session.');
        if (askTurns.some((turn) => turn.runId === run.id || turn.id === run.id)) return true;
        const input = run.input || {};
        const restoredTurns = persistedAskTurnsFromRun(run);
        const latestTurn = restoredTurns[restoredTurns.length - 1];
        const refs = latestTurn?.refs?.length
          ? latestTurn.refs
          : Array.isArray(input.refs)
            ? input.refs
            : [];
        activeAskSessionId = run.id;
        scopeRefs = refs;
        activeRepoInfo = refs.length ? { refs, repos: null } : null;
        selectedWorkspaceGoal = latestTurn?.workspaceGoal || input.workspaceGoal || 'custom';
        selectedAskMode = (latestTurn?.askMode || input.askMode) === 'fast' ? 'fast' : 'deep';
        selectedAskRuntime = normalizeRuntime(latestTurn?.runtime || input.runtime, 'rlm');
        localStorage.setItem(ASK_RUNTIME_KEY, selectedAskRuntime);
        if (latestTurn?.channel || input.channel) selectedChannelId = latestTurn?.channel || input.channel;
        questionInput.value = '';
        document.getElementById('brand-sub').textContent = refs.length ? describeRepoSet(refs) : 'ask any github repo';
        renderChannelOptions();
        renderScopeList();
        renderWorkspaceGoalOptions();
        renderAskModeToggle();
        renderAskRuntimeToggle();
        askHistory.length = 0;
        for (const restoredTurn of restoredTurns) {
          if (restoredTurn.question) askHistory.push({ role: 'user', content: restoredTurn.question });
          if (restoredTurn.status === 'done' && restoredTurn.answer) {
            askHistory.push({ role: 'assistant', content: restoredTurn.answer });
          }
          const turnState = {
            id: restoredTurn.id,
            runId: run.id,
            question: restoredTurn.question,
            status: restoredTurn.status,
            answer: restoredTurn.answer || '',
            sources: restoredTurn.sources || [],
            error: restoredTurn.error || '',
            repoInfo: { refs: restoredTurn.refs || refs, repos: null },
            card: buildAskCardFromRun(run, restoredTurn),
            el: null,
            scanHtml: scanHtmlFromRunEvents(run, restoredTurn.id),
            scanMeta: restoredTurn.status === 'done' ? 'restored' : restoredTurn.status === 'error' ? 'error' : 'running',
            tab: restoredTurn.status === 'done' ? 'answer' : 'process',
            channel: restoredTurn.channel || input.channel || selectedChannelId,
          };
          askTurns.push(turnState);
          appendTurn(turnState);
          setAskTurnStatus(turnState);
        }
        if (latestTurn) selectAskTurn(latestTurn.id, { tab: latestTurn.status === 'done' ? 'answer' : 'process' });
        if (run.status === 'running') {
          document.getElementById('topbar-status').textContent = 'running';
        } else {
          document.getElementById('topbar-status').textContent = run.status === 'error' ? 'error' : 'ready';
        }
        return true;
      } catch (error) {
        console.warn('failed to restore ask run', error);
        activeAskSessionId = '';
        showValidation(`Could not load ask session: ${error.message || error}`);
        return false;
      }
    }

    function clearAskSourceMounts() {
      sourcesList.querySelectorAll('.ask-pierre-mount').forEach((mount) => {
        window.pierreDiff?.unmount?.(mount);
      });
    }

    function clientWorkspaceRepoId(ref) {
      return (
        `${ref.owner}-${ref.repo}`
          .toLowerCase()
          .replace(/[^a-z0-9-]/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '') || 'repo'
      );
    }

    function askRepoCandidates() {
      const repos = activeRepoInfo?.repos?.length ? activeRepoInfo.repos : activeRepoInfo?.refs || [];
      return repos
        .filter((repo) => repo?.owner && repo?.repo)
        .map((repo) => ({
          ...repo,
          id: repo.id || clientWorkspaceRepoId(repo),
          label: repo.label || `${repo.owner}/${repo.repo}`,
          branch: repo.branch || 'HEAD',
        }));
    }

    function askRepoLookup() {
      const map = new Map();
      askRepoCandidates().forEach((repo) => {
        [
          repo.id,
          repo.label,
          `${repo.owner}/${repo.repo}`,
          clientWorkspaceRepoId(repo),
        ].filter(Boolean).forEach((key) => map.set(String(key).toLowerCase(), repo));
      });
      return map;
    }

    function normalizeAskSource(source) {
      let text = String(source || '').trim();
      const markdownLink = text.match(/^\[([^\]]+)\]\([^)]*\)$/);
      if (markdownLink) text = markdownLink[1].trim();
      return text.replace(/^`+|`+$/g, '').trim();
    }

    function parseAskSourceRef(source) {
      const raw = normalizeAskSource(source);
      const lineMatch = raw.match(/:(\d+)(?:[-–](\d+))?$/);
      const startLine = lineMatch ? Number(lineMatch[1]) : null;
      const endLine = lineMatch ? Number(lineMatch[2] || lineMatch[1]) : null;
      let path = lineMatch ? raw.slice(0, lineMatch.index) : raw;
      const repos = askRepoCandidates();
      const byKey = askRepoLookup();
      let repo = null;
      const colon = path.indexOf(':');
      if (colon > 0) {
        const prefix = path.slice(0, colon).toLowerCase();
        const matched = byKey.get(prefix);
        if (matched) {
          repo = matched;
          path = path.slice(colon + 1);
        }
      }
      if (!repo && repos.length === 1) repo = repos[0];
      path = path.replace(/^\.?\//, '').replace(/^\/+/, '');
      return {
        raw,
        repo,
        path,
        startLine,
        endLine,
      };
    }

    function encodeGithubPath(path) {
      return String(path || '')
        .split('/')
        .filter(Boolean)
        .map((part) => encodeURIComponent(part))
        .join('/');
    }

    function sourceLineLabel(ref) {
      if (!ref.startLine) return '';
      return ref.endLine && ref.endLine !== ref.startLine
        ? `L${ref.startLine}-L${ref.endLine}`
        : `L${ref.startLine}`;
    }

    function githubBlobUrlForSource(ref) {
      if (!ref.repo || !ref.path) return '';
      const branch = encodeURIComponent(ref.repo.branch || 'HEAD');
      const base = `https://github.com/${ref.repo.owner}/${ref.repo.repo}/blob/${branch}/${encodeGithubPath(ref.path)}`;
      const lineLabel = sourceLineLabel(ref);
      return lineLabel ? `${base}#${lineLabel}` : base;
    }

    function githubRawUrlForSource(ref) {
      if (!ref.repo || !ref.path) return '';
      const branch = encodeURIComponent(ref.repo.branch || 'HEAD');
      return `https://raw.githubusercontent.com/${ref.repo.owner}/${ref.repo.repo}/${branch}/${encodeGithubPath(ref.path)}`;
    }

    function sourceKindLabel(path) {
      const name = String(path || '').split('/').pop() || 'file';
      if (/^dockerfile$/i.test(name)) return 'df';
      if (/^readme\b/i.test(name)) return 'md';
      const ext = name.includes('.') ? name.split('.').pop() : '';
      return (ext || 'file').slice(0, 4).toLowerCase();
    }

    function sourcePrismLanguage(path) {
      const name = String(path || '').split('/').pop() || '';
      const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : name.toLowerCase();
      const byExt = {
        ts: 'typescript',
        tsx: 'tsx',
        js: 'javascript',
        jsx: 'jsx',
        mjs: 'javascript',
        cjs: 'javascript',
        json: 'json',
        md: 'markdown',
        mdx: 'markdown',
        py: 'python',
        rb: 'ruby',
        rs: 'rust',
        go: 'go',
        java: 'java',
        kt: 'kotlin',
        kts: 'kotlin',
        php: 'php',
        css: 'css',
        scss: 'scss',
        html: 'markup',
        htm: 'markup',
        xml: 'markup',
        vue: 'markup',
        svelte: 'markup',
        sh: 'bash',
        bash: 'bash',
        zsh: 'bash',
        yml: 'yaml',
        yaml: 'yaml',
        toml: 'toml',
        sql: 'sql',
        dockerfile: 'docker',
      };
      if (/^dockerfile$/i.test(name)) return 'docker';
      return byExt[ext] || 'plaintext';
    }

    async function loadAskSourceText(ref) {
      const url = githubRawUrlForSource(ref);
      if (!url) throw new Error('Could not resolve this source to a GitHub file.');
      if (!askSourceCache.has(url)) {
        const request = fetch(url, { cache: 'force-cache' }).then(async (response) => {
          if (!response.ok) throw new Error(`GitHub returned ${response.status} for ${ref.path}`);
          return response.text();
        });
        askSourceCache.set(url, request);
      }
      try {
        return await askSourceCache.get(url);
      } catch (error) {
        askSourceCache.delete(url);
        throw error;
      }
    }

    function renderSourceTextFallback(contents, ref) {
      const lines = String(contents || '').split('\n');
      const maxLines = 900;
      const language = sourcePrismLanguage(ref.path || ref.raw);
      const selectedStart = ref.startLine || null;
      const selectedEnd = ref.endLine || selectedStart;
      const hasRange = Boolean(selectedStart);
      const windowStart = hasRange ? Math.max(1, selectedStart - 8) : 1;
      const windowEnd = hasRange
        ? Math.min(lines.length, Math.max(selectedEnd, selectedStart) + 8)
        : Math.min(lines.length, maxLines);
      const visible = lines.slice(windowStart - 1, windowEnd);
      const rows = visible.map((line, index) => {
        const lineNumber = windowStart + index;
        const selected = hasRange && lineNumber >= selectedStart && lineNumber <= selectedEnd;
        return `<span class="ask-source-code-line"${selected ? ' data-selected-line="range"' : ''}><span class="ask-source-line-number">${lineNumber}</span><code class="language-${escapeHtml(language)}">${escapeHtml(line || ' ')}</code></span>`;
      }).join('');
      const before = windowStart > 1
        ? `<span class="ask-source-window-gap" aria-label="Earlier lines hidden">↑</span>`
        : '';
      const after = windowEnd < lines.length
        ? `<span class="ask-source-window-gap" aria-label="Later lines hidden">↓</span>`
        : '';
      const note = !hasRange && lines.length > maxLines
        ? `<div class="ask-source-note">Showing the first ${maxLines} lines. Open the file on GitHub for the full source.</div>`
        : '';
      return `${note}<pre class="ask-source-fallback language-${escapeHtml(language)}">${before}${rows}${after}</pre>`;
    }

    function applyPierreSourceSelection(mount, startLine, endLine) {
      if (!startLine) return false;
      const host = mount.querySelector('diffs-container');
      const root = host?.shadowRoot;
      const pre = root?.querySelector('pre');
      const target = root?.querySelector(`[data-line="${startLine}"]`);
      if (!pre || !target) return false;

      const first = Math.min(startLine, endLine || startLine);
      const last = Math.max(startLine, endLine || startLine);
      root.querySelectorAll('[data-selected-line]').forEach((element) => {
        element.removeAttribute('data-selected-line');
      });
      for (let line = first; line <= last; line += 1) {
        const element = root.querySelector(`[data-line="${line}"]`);
        if (!element) continue;
        const value = first === last
          ? 'single'
          : line === first
            ? 'first'
            : line === last
              ? 'last'
              : '';
        element.setAttribute('data-selected-line', value);
      }

      const scrollers = [host, mount, pre, root.querySelector('[data-code]')].filter(Boolean);
      const scroller = scrollers.find((element) => element.scrollHeight > element.clientHeight + 2) || host || pre;
      const preRect = scroller.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const scrollTarget = Math.max(0, scroller.scrollTop + targetRect.top - preRect.top - scroller.clientHeight * 0.28);
      scroller.scrollTop = scrollTarget;
      target.scrollIntoView({ block: 'center', inline: 'nearest' });
      return true;
    }

    function keepPierreSourceRangeVisible(mount, startLine, endLine, attempt = 0) {
      if (!startLine || attempt > 36) return;
      const applied = applyPierreSourceSelection(mount, startLine, endLine);
      if (!applied || attempt < 10) {
        window.setTimeout(
          () => keepPierreSourceRangeVisible(mount, startLine, endLine, attempt + 1),
          applied ? 180 : 80,
        );
      }
    }

    async function renderAskSourceBody(ref, body) {
      if (body.dataset.loaded === 'true' || body.dataset.loading === 'true') return;
      body.dataset.loading = 'true';
      body.innerHTML = `<div class="ask-source-loading"><span class="spinner"></span>loading ${escapeHtml(ref.path || ref.raw)}</div>`;
      try {
        const contents = await loadAskSourceText(ref);
        const lineCount = contents ? contents.split('\n').length : 0;
        const openUrl = githubBlobUrlForSource(ref);
        const lineLabel = sourceLineLabel(ref);
        const meta = [
          `${lineCount.toLocaleString()} line${lineCount === 1 ? '' : 's'}`,
          lineLabel || null,
        ].filter(Boolean).join(' · ');
        const note = `
          <div class="ask-source-note">
            <span>${escapeHtml(meta || 'GitHub source')}</span>
            ${openUrl ? `<a href="${escapeHtml(openUrl)}" target="_blank" rel="noopener noreferrer">open on GitHub</a>` : ''}
          </div>
        `;
        if (window.pierreDiff?.renderFile) {
          body.innerHTML = `${note}<div class="ask-pierre-mount"></div>`;
          const mount = body.querySelector('.ask-pierre-mount');
          const selectedLines = ref.startLine
            ? { start: ref.startLine, end: ref.endLine || ref.startLine, side: 'additions' }
            : null;
          window.pierreDiff.renderFile(mount, {
            file: {
              name: ref.path,
              contents,
              cacheKey: `ask-source:${ref.repo?.id || repoKey(ref.repo || {})}:${ref.path}:${contents.length}`,
            },
            selectedLines,
            lineAnnotations: [],
            options: {
              theme: { dark: 'pierre-dark', light: 'pierre-light' },
              disableFileHeader: true,
              enableLineSelection: false,
              overflow: 'scroll',
            },
          });
          if (ref.startLine) keepPierreSourceRangeVisible(mount, ref.startLine, ref.endLine || ref.startLine);
        } else {
          body.innerHTML = note + renderSourceTextFallback(contents, ref);
          Prism.highlightAllUnder(body);
        }
        body.dataset.loaded = 'true';
      } catch (error) {
        body.innerHTML = `<div class="ask-source-error">${escapeHtml(error.message || String(error))}</div>`;
      } finally {
        delete body.dataset.loading;
      }
    }

    function renderSourcesPane(sources) {
      clearAskSourceMounts();
      const sourceList = Array.isArray(sources) ? sources.filter(Boolean) : [];
      if (!sourceList.length) {
        askSourceRefs = [];
        sourcesList.innerHTML = '<div class="ask-reader-empty">No source files were submitted with this answer.</div>';
        return;
      }
      askSourceRefs = sourceList.map(parseAskSourceRef);
      sourcesList.innerHTML = `
        <div class="ask-source-viewer-list">
          ${askSourceRefs.map((source, index) => `
            <div class="ask-source-card${source.repo && source.path ? '' : ' unresolved'}">
              <div class="ask-source-row">
                <button class="ask-source-toggle" type="button" data-source-index="${index}" aria-expanded="false">
                  <span class="ask-source-chevron">&gt;</span>
                  <span class="ask-source-kind">${escapeHtml(sourceKindLabel(source.path || source.raw))}</span>
                  <span class="ask-source-main">
                    <span class="ask-source-repo">${escapeHtml(source.repo?.label || 'unresolved source')}</span>
                    <span class="ask-source-path">${escapeHtml(source.path || source.raw)}</span>
                  </span>
                  ${sourceLineLabel(source) ? `<span class="ask-source-lines">${escapeHtml(sourceLineLabel(source))}</span>` : ''}
                </button>
                ${githubBlobUrlForSource(source) ? `<a class="ask-source-open" href="${escapeHtml(githubBlobUrlForSource(source))}" target="_blank" rel="noopener noreferrer">open</a>` : ''}
                <button class="ask-source-copy" type="button" data-copy-source="${index}">copy</button>
              </div>
              <div class="ask-source-body" data-source-body="${index}" hidden></div>
            </div>
          `).join('')}
        </div>
      `;
      sourcesList.querySelectorAll('[data-source-index]').forEach((button) => {
        button.addEventListener('click', () => {
          const index = Number(button.dataset.sourceIndex);
          const card = button.closest('.ask-source-card');
          const body = sourcesList.querySelector(`[data-source-body="${index}"]`);
          if (!card || !body) return;
          const open = !card.classList.contains('open');
          card.classList.toggle('open', open);
          button.setAttribute('aria-expanded', String(open));
          body.hidden = !open;
          if (open) renderAskSourceBody(askSourceRefs[index], body);
        });
      });
      sourcesList.querySelectorAll('[data-copy-source]').forEach((button) => {
        button.addEventListener('click', async (event) => {
          event.stopPropagation();
          const source = askSourceRefs[Number(button.dataset.copySource)];
          if (!source) return;
          await copyText(source.raw);
          button.textContent = 'copied';
          window.setTimeout(() => {
            button.textContent = 'copy';
          }, 1100);
        });
      });
    }

    function repoKey(ref) {
      return `${ref.owner}/${ref.repo}@${ref.branch || ''}`.toLowerCase();
    }

    function workspaceGoalLabel() {
      return WORKSPACE_GOAL_OPTIONS.find((g) => g.id === selectedWorkspaceGoal)?.label || 'Custom';
    }

    function workspaceRoleLabel(index) {
      if (index === 0) return 'Primary';

    function renderScopeList() {
      scopeCount.textContent = `${scopeRefs.length} repo${scopeRefs.length === 1 ? '' : 's'}`;
      if (!scopeRefs.length) {

          <div class="ask-scope-empty ask-scope-entry">

          </div>

      } else {
        scopeList.innerHTML = scopeRefs.map((ref, index) => `
          <div class="ask-scope-row" data-index="${index}">

          const index = Number(button.dataset.removeRepo);
          scopeRefs = scopeRefs.filter((_, i) => i !== index);
          activeRepoInfo = scopeRefs.length ? { refs: scopeRefs, repos: null } : null;
          renderScopeList();
          const label = describeRepoSet(scopeRefs);
          document.getElementById('brand-sub').textContent = scopeRefs.length ? label : 'ask any github repo';
          setAskScanMeta(scopeRefs.length ? label : 'idle');

      const inlineInput = document.getElementById('ask-scope-entry-input');

      inlineEntry?.addEventListener('click', (event) => {

        if (event.target !== inlineInput) inlineInput?.focus();

      inlineInput?.addEventListener('input', () => setInlineRepoError(''));
      inlineInput?.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          addRepoFromInline(inlineInput.value);
        }

      inlineInput?.addEventListener('paste', (event) => {
        const text = event.clipboardData?.getData('text') || '';

        event.preventDefault();
        inlineInput.value = text.trim();
        addRepoFromInline(text);

      goalOptions.innerHTML = `
        <div class="channel-dropdown ask-goal-dropdown" id="ask-goal-dropdown">

                <span class="co-status ask-goal-status"></span>

    function renderAskModeToggle() {
      askModeToggle.innerHTML = ASK_MODE_OPTIONS.map((mode) => `
        <button
          class="ask-mode-button${mode.id === selectedAskMode ? ' active' : ''}"
          type="button"
          data-ask-mode="${escapeHtml(mode.id)}"

      `).join('');
      askModeToggle.querySelectorAll('[data-ask-mode]').forEach((button) => {

          localStorage.setItem(ASK_MODE_KEY, selectedAskMode);

    function renderAskRuntimeToggle() {
      renderRuntimeToggle(askRuntimeToggle, selectedAskRuntime, (runtime) => {
        if (askBusy) return;
        selectedAskRuntime = normalizeRuntime(runtime, 'rlm');
        localStorage.setItem(ASK_RUNTIME_KEY, selectedAskRuntime);
