          <p><strong>${bugs.length} bug${bugs.length === 1 ? '' : 's'}</strong> · ${flags.length} flag${flags.length === 1 ? '' : 's'}</p>
          ${marked.parse(result.summaryMarkdown || run.error || 'Investigation restored.')}
        </div>
      `;
      thread.appendChild(card);
      Prism.highlightAllUnder(card);
      attachReviewPublishAction(card, {
        runId: run.id,
        kind: 'investigation',
        review: run.input?.review || currentReview,
        result,
        posted: result.investigationComment,
      });
    }

    function reviewProcessLabelsFromRun(run) {
      const labels = [];
      for (const event of processEventsForRun(run)) {
        if (event.type === 'start') labels.push('Session accepted');
        else if (event.type === 'agent') {
          const label = askStatusLabelForEvent(runEventAgentEvent(event));
          if (label) labels.push(label);
        } else if (event.type === 'answer') labels.push('Review submitted');
        else if (event.type === 'investigation') labels.push('Investigation submitted');
        else if (event.type === 'comment') labels.push('GitHub comment posted');
        else if (event.type === 'error') labels.push(event.payload?.message || event.payload?.error || 'Run failed');
      }
      return labels.filter(Boolean).slice(-80);
    }

    function restoreReviewScanFromRun(run, label) {
      resetAskScan(label);
      reviewProcessLabelsFromRun(run).forEach((item) => appendAskScanRow(item));
      setAskScanMeta(run.status === 'done' ? 'restored' : run.status === 'error' ? 'error' : 'running');
      document.querySelector('.ask-scan-panel')?.classList.toggle('done', run.status !== 'running');
      document.querySelector('.ask-scan-panel')?.classList.toggle('working', run.status === 'running');
      updateAskIntroDismissal(document.getElementById('ask-process-scroll'));
    }

    function buildReviewCardFromRun(run) {
      const label = run.kind === 'investigate' ? 'Investigation' : 'Review';
      const review = run.input?.review || currentReview;
      const runtime = normalizeRuntime(run.input?.runtime, 'rlm');
      const card = new AgentCard(run.id || `review-restored-${Date.now()}`, 'page', `${runtimeLabel(runtime)} · ${label}${review?.number ? ` #${review.number}` : ''}`, { presentation: runtime, transcriptScrollMode: 'local' });
      replayRunEventsIntoCard(card, run);
      if (run.status === 'error') card.markError(run.error || 'Run failed', run);
      else if (run.status === 'done') card.markDone({ chars: (run.result?.answer || run.result?.rawAnswer || '').length });
      else card.setStatus('running');
      return card;
    }

    function showRestoredRunningReview(card, label) {
      const slot = document.getElementById('ask-agent-slot');
      if (slot && card?.el) {
        mountProcessAgentCard(card);
        expandAskProcessCard(card);
      }
      if (processCenterSlot) processCenterSlot.innerHTML = '';
      if (processEmpty) {
        processEmpty.hidden = false;
        processEmpty.textContent = `${label} is still running. This URL shows the agentic logs captured so far; refresh later for the final result.`;
      }
      if (processReceipt) {
        processReceipt.hidden = true;
        processReceipt.innerHTML = '';
      }
      reviewRight?.classList.remove('process-complete');
      setReviewProcessState('live');
      setCompactRightPane(false);
      setWorkspaceTab('process');
      document.getElementById('topbar-status').textContent = 'running';
    }

    async function loadPersistedReviewRun(runId) {
      if (!runId) return false;
      try {
        const { run } = await fetchJSON(`/api/run?id=${encodeURIComponent(runId)}`);
        if (run.kind !== 'review' && run.kind !== 'investigate') {
          throw new Error('That session is not a Review session.');
        }
        const input = run.input || {};
        if (input.sourceCodeRunId) reviewSourceCodeRunId = input.sourceCodeRunId;
        selectedReviewRuntime = normalizeRuntime(input.runtime, 'rlm');
        localStorage.setItem(REVIEW_RUNTIME_KEY, selectedReviewRuntime);
        renderReviewRuntimeToggle();
        if (input.channel) {
          selectedChannelId = input.channel;
          renderChannelOptions();
        }
        if (input.url) prInput.value = input.url;
        if (input.question) questionInput.value = input.question;

        let loaded = null;
        if (input.url) loaded = await loadPR();
        if (!loaded && input.review) {
          currentReview = input.review;
          selectedPath = currentReview.files?.[0]?.path || null;
          document.getElementById('brand-sub').textContent = `${currentReview.owner}/${currentReview.repo}#${currentReview.number}`;
          renderPR(currentReview);
          setWorkspaceTab('pr');
        }

        const label = currentReview
          ? `${currentReview.owner}/${currentReview.repo}#${currentReview.number}`
          : input.url || run.title || 'review session';
        restoreReviewScanFromRun(run, label);
        const card = buildReviewCardFromRun(run);
        restoredReviewRunIds.add(run.id);
        if (Array.isArray(input.history)) {
          reviewHistory.push(...input.history);
        }
        if (run.kind === 'review' && input.question) {
          reviewHistory.push({ role: 'user', content: input.question });
        }
        if (run.kind === 'review' && run.status === 'done' && run.result?.answer) {
          reviewHistory.push({ role: 'assistant', content: run.result.answer });
        }

        const persistedSelection = input.selection && input.selection.path ? input.selection : null;
        if (persistedSelection && currentReview) {
          currentSelection = persistedSelection;
          await selectFile(persistedSelection.path, { preserveSelection: true });
        }

        if (run.status === 'running') {
          if (run.kind === 'investigate') {
            showInvestigationPanel('<div class="review-empty"><span class="spinner"></span>Investigation is still running. Refresh this URL later for the final result.</div>', false);
          } else {
            const pendingBody = appendReviewTurn(input.question || run.title || 'Previous review');
            pendingBody.innerHTML = '<span class="spinner"></span>Review is still running. Refresh this URL later for the final result.';
          }
          showRestoredRunningReview(card, run.kind === 'investigate' ? 'Investigation' : 'Review');
          return true;
        }

        if (run.kind === 'investigate') {
          if (run.status === 'error') {
            showInvestigationPanel(renderErrorBanner(run.error || 'Investigation failed', run));
          } else {
            renderInvestigation(run.result || {}, run.id);
          }
          completeReviewProcess(card, run.status === 'done' ? 'restored' : 'failed', 'Investigation');
          setWorkspaceTab('review');
          document.getElementById('topbar-status').textContent = run.status === 'error' ? 'error' : 'ready';
          return true;
        }

        const question = input.question || run.title || 'Previous review';
        const answerBody = appendReviewTurn(question);
        if (run.status === 'error') {
          answerBody.className = '';
          answerBody.innerHTML = renderErrorBanner(run.error || 'Review failed', run);
        } else {
          const restoredAnswer = run.result?.answer || '(empty)';
          const restoredReview = input.review || currentReview;
          renderReviewMarkdown(answerBody, restoredAnswer, restoredReview);
          attachReviewPublishAction(answerBody, {
            runId: run.id,
            kind: 'review',
            review: restoredReview,
            posted: run.result?.reviewComment,
          });
          attachReviewFixAction(answerBody, restoredAnswer, restoredReview, question, input.sourceCodeRunId || reviewSourceCodeRunId);
        }
        completeReviewProcess(card, run.status === 'done' ? 'restored' : 'failed', 'Review');
        setWorkspaceTab('review');
        document.getElementById('topbar-status').textContent = run.status === 'error' ? 'error' : 'ready';
        return true;
      } catch (error) {
        console.warn('failed to restore review run', error);
        showReviewError(`Could not load review session: ${error.message || error}`);
        return false;
      }
    }

    async function loadPersistedReviewRuns(matchUrl = '') {
      try {
        const { runs } = await fetchJSON('/api/runs?kind=review,investigate&limit=30');
        const candidates = (runs || [])
          .filter((run) => (run.status === 'done' || run.status === 'error') && reviewRunMatches(run, matchUrl))
          .reverse();
        for (const summary of candidates) {
          if (restoredReviewRunIds.has(summary.id)) continue;
          const { run } = await fetchJSON(`/api/run?id=${encodeURIComponent(summary.id)}`);
          restoredReviewRunIds.add(run.id);
          if (run.kind === 'investigate') {
            renderPersistedInvestigationRun(run);
            continue;
          }
          const question = run.input?.question || run.title || 'Previous review';
          const answerBody = appendReviewTurn(question);
          if (run.status === 'error') {
            answerBody.className = '';
            answerBody.innerHTML = renderErrorBanner(run.error || 'Review failed', run);
          } else {
            const restoredAnswer = run.result?.answer || '(empty)';
            const restoredReview = run.input?.review || currentReview;
            renderReviewMarkdown(answerBody, restoredAnswer, restoredReview);
            attachReviewPublishAction(answerBody, {
              runId: run.id,
              kind: 'review',
              review: restoredReview,
              posted: run.result?.reviewComment,
            });
            attachReviewFixAction(answerBody, restoredAnswer, restoredReview, question, run.input?.sourceCodeRunId || reviewSourceCodeRunId);
          }
        }
        if (candidates.length) setWorkspaceTab('review');
      } catch (error) {
        console.warn('failed to restore review runs', error);
      }
    }

    async function runReview() {
      if (!beginReviewLaunch()) return;
      let preflightOk = false;
      const question = questionInput.value.trim() || 'Review this PR for correctness, regressions, security issues, and missing tests.';
      try {
        if (!(await hasReviewGithubConnection())) {
          resetAskScan('connect github');
          showReviewGithubRequired('Connect GitHub before reviewing pull requests.');
          return;
        }
        if (!currentReview || (prInput.value.trim() && prInput.value.trim() !== currentReview.url)) {
          const loaded = await loadPR();
          if (!loaded) return;
        }
        if (!currentReview) return;
        preflightOk = true;
      } finally {
        if (!preflightOk) finishReviewLaunch(false);
      }
      if (reviewBusy) {
        finishReviewLaunch(false);
        return;
      }

      if (reviewPageAbort) {
        reviewPageAbort();
        reviewPageAbort = null;
      }

      const reviewRuntime = normalizeRuntime(selectedReviewRuntime, 'rlm');
      document.getElementById('topbar-status').textContent = 'reviewing';
      resetAskScan(`${currentReview.owner}/${currentReview.repo}#${currentReview.number}`);
      resetReviewProcessPresentation();
      prepareReviewProcessRun();
      requestAnimationFrame(() => {
        document.querySelector('.ask-scan-panel')?.classList.add('working');
        updateAskIntroDismissal(document.getElementById('ask-process-scroll'));
      });
      appendAskScanRow(`${runtimeLabel(reviewRuntime)} · starting PR review`);

      const answerBody = appendReviewTurn(question);
      const slot = document.getElementById('ask-agent-slot');
      const card = new AgentCard(`review-${Date.now()}`, 'page', `${runtimeLabel(reviewRuntime)} · PR #${currentReview.number}`, { presentation: reviewRuntime, transcriptScrollMode: 'local' });
      card.open = true;
      card.el.classList.add('open');
      mountProcessAgentCard(card);
      card.setStatus('running');

      const startedAt = Date.now();
      const history = reviewHistory.slice();
      reviewHistory.push({ role: 'user', content: question });
      let reviewRunId = '';
      setBusy(true, 'review');
      finishReviewLaunch(true);

      reviewPageAbort = sseStream('/api/review/run', {
        url: currentReview.url,
        reviewId: currentReview.reviewId,
        question,
        history,
        selection: currentSelection,
        channel: selectedChannelId,
        runtime: reviewRuntime,
        localCli: currentLocalCliConfig(),
        sourceCodeRunId: reviewSourceCodeRunId || undefined,
      }, {
        onEvent(ev, data) {
          if (ev === 'start') {
            if (data.runId) {
              reviewRunId = data.runId;
              pushSessionUrl('review', data.runId);
            }
            appendAskScanRow('Review session accepted');
            addCardProcessStatus(card, 'Review session accepted');
          } else if (ev === 'agent') {
            const e = data.event;
            if (!e) return;
            routeAgentEvent(card, e);
            appendAskScanRow(askStatusLabelForEvent(e));
            scrollAskProcessToBottom();
          } else if (ev === 'answer') {
            const elapsed = formatElapsed(Date.now() - startedAt);
            card.markDone({ chars: (data.answer || '').length });
            const titleEl = card.el.querySelector('[data-role="title"]');
            if (titleEl) {
              titleEl.textContent = `Worked for ${elapsed} · ${processCountMeta(card)}`;
            }
            renderReviewMarkdown(answerBody, data.answer || '', currentReview);
            attachReviewPublishAction(answerBody, {
              runId: reviewRunId,
              kind: 'review',
              review: currentReview,
            });
            attachReviewFixAction(answerBody, data.answer || '', currentReview, question, reviewSourceCodeRunId);
            reviewHistory.push({ role: 'assistant', content: data.answer || '' });
            appendAskScanRow(`Review ready in ${elapsed}`);
            setAskScanMeta(`done · ${elapsed}`);
            showFullAskProcessHistory(card);
            completeReviewProcess(card, elapsed, 'Review');
            setWorkspaceTab('review');
            document.getElementById('topbar-status').textContent = 'ready';
            setBusy(false, 'review');
            reviewPageAbort = null;
            thread.scrollTop = thread.scrollHeight;
            questionInput.focus();
          } else if (ev === 'error') {
            const message = data.message || 'Review failed';
            card.markError(message, data);
            answerBody.className = '';
            answerBody.innerHTML = renderErrorBanner(message, data);
            appendAskScanRow(message);
            setAskScanMeta('error');
            showFullAskProcessHistory(card);
            completeReviewProcess(card, 'failed', 'Review');
            setWorkspaceTab('review');
            document.getElementById('topbar-status').textContent = 'error';
            setBusy(false, 'review');
            reviewPageAbort = null;
          }
        },
        onError(err) {
          const message = streamErrorMessage(err);
          if (err?.needsGitHubConnection || err?.status === 428) showReviewGithubRequired(err.message || message);
          card.markError(message, err);
          answerBody.className = '';
          answerBody.innerHTML = renderErrorBanner(message, err);
          appendAskScanRow(message);
          setAskScanMeta('error');
          showFullAskProcessHistory(card);
          completeReviewProcess(card, 'failed', 'Review');
          setWorkspaceTab('review');
          document.getElementById('topbar-status').textContent = 'error';
          setBusy(false, 'review');
          reviewPageAbort = null;
        },
      });
    }

  function renderNav() {
    const nav = document.getElementById('wiki-nav');
    const select = document.getElementById('wiki-page-select');
    const pages = currentWiki.structure.pages;
    const sections = currentWiki.structure.sections || [];
    const pageById = new Map(pages.map((p) => [p.id, p]));
    const seen = new Set();
    const html = [];
    const selectHtml = [];

    // Render sections in declared order, pages in the order the section lists them.
    for (const section of sections) {
      if (!section.pages || !section.pages.length) continue;
      html.push(`<div class="wiki-nav-section">${escapeHtml(section.title)}</div>`);
      const options = [];
      for (const pageId of section.pages) {
        const p = pageById.get(pageId);
        if (!p) continue;
        seen.add(p.id);
        html.push(renderNavItem(p));
        options.push(`<option value="${escapeHtml(p.id)}">${escapeHtml(p.title)}</option>`);
      }
      if (options.length) {
        selectHtml.push(`<optgroup label="${escapeHtml(section.title)}">${options.join('')}</optgroup>`);
      }
    }

    // Orphan pages (no parent section or parent missing from sections list)
    const orphans = pages.filter((p) => !seen.has(p.id));
    if (orphans.length) {
      if (sections.length) html.push(`<div class="wiki-nav-unsectioned">Other</div>`);
      const options = [];
      for (const p of orphans) {
        html.push(renderNavItem(p));
        options.push(`<option value="${escapeHtml(p.id)}">${escapeHtml(p.title)}</option>`);
      }
      if (sections.length) {
        selectHtml.push(`<optgroup label="Other">${options.join('')}</optgroup>`);
      } else {
        selectHtml.push(...options);
      }
    }

    nav.innerHTML = html.join('');
    nav.querySelectorAll('.wiki-nav-item').forEach((el) => {
      el.addEventListener('click', () => renderPage(el.dataset.page));
    });
    if (select) {
      select.innerHTML = selectHtml.join('');
      select.value = currentPageId || '';
      select.onchange = () => {
        if (select.value) renderPage(select.value);
      };
    }
  }

  function renderNavItem(p) {
    const active = p.id === currentPageId ? ' active' : '';
    return `
      <div class="wiki-nav-item${active}" data-page="${escapeHtml(p.id)}" title="${escapeHtml(p.description || p.title)}">
        <span class="wiki-nav-label">${escapeHtml(p.title)}</span>
      </div>
    `;
  }

  function renderPage(pageId) {
    currentPageId = pageId;
    const page = currentWiki.pages[pageId];
    const meta = currentWiki.structure.pages.find((p) => p.id === pageId);
    if (!page || !meta) return;
    const globalCustomPrompt = currentWiki.wikiStyle === 'custom'
      ? normalizeWikiStylePrompt(currentWiki.wikiStylePrompt)
      : '';
    const pagePromptOverride = page.stylePromptOverride
      ? normalizeWikiStylePrompt(page.stylePrompt)
      : '';
    const customPrompt = page.stylePromptOverride ? pagePromptOverride : globalCustomPrompt;
    const promptLabel = page.stylePromptOverride ? 'Page prompt' : 'Custom prompt';
    document.getElementById('wiki-pagehead').innerHTML = `
      <span class="wiki-pagehead-main">
        <span>${meta.filePaths.length} source file${meta.filePaths.length === 1 ? '' : 's'}</span>
        <span>${page.generatedAt ? `updated ${escapeHtml(new Date(page.generatedAt).toLocaleDateString())}` : ''}</span>
      </span>
      ${customPrompt ? `
        <span class="wiki-prompt-inspector">
          <button class="wiki-prompt-trigger" id="wiki-prompt-trigger" type="button" aria-expanded="false" aria-controls="wiki-prompt-popover">
            Prompt

            </span>

          </span>
        </span>
      ` : ''}
    `;
    setupWikiPromptInspector();
    const md = document.getElementById('wiki-md');
    md.innerHTML = marked.parse(page.content || '(no content)');
    fixSourceFilesDetails(md);
    Prism.highlightAllUnder(md);
    linkifySources(md, {
      owner: currentWiki.owner,
      repo: currentWiki.repo,
      branch: currentWiki.branch || 'HEAD',

    renderMermaidDiagrams(md, { afterRender: () => setupMermaidZoom(md) });

  function setupWikiPromptInspector() {
    const trigger = document.getElementById('wiki-prompt-trigger');
    const popover = document.getElementById('wiki-prompt-popover');
    const closeButton = document.getElementById('wiki-prompt-close');
    const editButton = document.getElementById('wiki-prompt-edit');
    if (!trigger || !popover) return;
    trigger.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (popover.hidden || !popover.classList.contains('is-open')) openWikiPromptPopover();
      else closeWikiPromptPopover();
    });
    popover.addEventListener('click', (event) => event.stopPropagation());
    closeButton?.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      closeWikiPromptPopover();
      trigger.focus();
    });
    editButton?.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      closeWikiPromptPopover();
      openWikiEditDrawer({ focus: 'prompt' });
    });
  }

  function openWikiPromptPopover() {
    const trigger = document.getElementById('wiki-prompt-trigger');
    const popover = document.getElementById('wiki-prompt-popover');
    if (!trigger || !popover) return;
    popover.hidden = false;
    trigger.setAttribute('aria-expanded', 'true');
    window.requestAnimationFrame(() => popover.classList.add('is-open'));
    const closeOnOutside = () => closeWikiPromptPopover();
    window.setTimeout(() => document.addEventListener('click', closeOnOutside, { once: true }), 0);
  }

  function closeWikiPromptPopover() {
    const trigger = document.getElementById('wiki-prompt-trigger');
    const popover = document.getElementById('wiki-prompt-popover');
    if (!popover || popover.hidden) return;
    trigger?.setAttribute('aria-expanded', 'false');
    popover.classList.remove('is-open');
    window.setTimeout(() => {
      if (!popover.classList.contains('is-open')) popover.hidden = true;
    }, prefersReducedMotion() ? 0 : 150);
  }

  async function loadWikiPublication() {
    if (!currentWiki) return;
    try {
      const params = new URLSearchParams({
        owner: currentWiki.owner,
        repo: currentWiki.repo,
      });
      if (currentWiki.branch) params.set('branch', currentWiki.branch);
      const data = await fetchJSON(`/api/wiki/publication?${params.toString()}`);
      currentWikiPublication = data.publication || null;
      renderWikiPublication();
    } catch (e) {
      currentWikiPublication = null;
      renderWikiPublication(e.message || String(e));
    }
  }

  function renderWikiPublication(error = '') {
    const title = document.getElementById('wiki-public-title');
    const detail = document.getElementById('wiki-public-detail');
    const toggle = document.getElementById('wiki-public-toggle');
    const linkRow = document.getElementById('wiki-public-link-row');
    const link = document.getElementById('wiki-public-link');
    if (!title || !detail || !toggle || !linkRow || !link) return;

    const published = Boolean(currentWikiPublication?.published);
    const publicUrl = currentWikiPublication?.publicUrl || '';
    title.textContent = published ? 'Public read-only' : 'Private';
    detail.textContent = error
      ? `Sharing status unavailable: ${error}`
      : published
        ? 'Anyone with the link can read this wiki.'
        : 'Only authenticated users can open this wiki.';
    toggle.textContent = published ? 'Make private' : 'Make public';
    toggle.disabled = false;
    linkRow.hidden = !published;
    link.value = published ? publicUrl : '';
  }

  async function updateWikiPublication(published) {
    if (!currentWiki) return;
    const toggle = document.getElementById('wiki-public-toggle');
    if (toggle) {
      toggle.disabled = true;
      toggle.textContent = published ? 'Publishing…' : 'Unpublishing…';
    }
    setWikiEditStatus(published ? 'publishing read-only page…' : 'removing public access…');
    try {
      const data = await postJSON('/api/wiki/publication', {
        owner: currentWiki.owner,
        repo: currentWiki.repo,
        branch: currentWiki.branch || null,
        published,
      });
      currentWikiPublication = data.publication || null;
      renderWikiPublication();
      setWikiEditStatus(published ? 'public read-only link is ready' : 'public link disabled', 'success');
    } catch (e) {
      renderWikiPublication(e.message || String(e));
      setWikiEditStatus(`sharing failed: ${e.message || e}`, 'error');
    }
  }

  function setupMermaidZoom(container) {
    ensureWikiDiagramModal();
    container.querySelectorAll('.mermaid').forEach((node) => {
      if (!node.querySelector('svg')) return;
      if (node.dataset.mermaidZoomBound === '1') return;
      node.dataset.mermaidZoomBound = '1';
      node.classList.add('wiki-mermaid-zoomable');
      node.setAttribute('role', 'button');
      node.setAttribute('tabindex', '0');
      node.setAttribute('title', 'Click to inspect diagram');
      node.addEventListener('click', () => openWikiDiagram(node));
      node.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openWikiDiagram(node);
        }
      });
    });

  function ensureWikiDiagramModal() {
    let modal = document.getElementById('wiki-diagram-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.className = 'wiki-diagram-modal';
      modal.id = 'wiki-diagram-modal';
      modal.hidden = true;
      modal.innerHTML = `
        <div class="wiki-diagram-shell">
          <div class="wiki-diagram-controls">
            <button type="button" id="wiki-diagram-zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
            <button type="button" id="wiki-diagram-zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
            <button type="button" id="wiki-diagram-reset" aria-label="Reset zoom" title="Reset zoom">1×</button>
            <button type="button" id="wiki-diagram-close" aria-label="Close diagram" title="Close diagram">×</button>
          </div>
          <div class="wiki-diagram-stage" id="wiki-diagram-stage">
            <div class="wiki-diagram-canvas" id="wiki-diagram-canvas"></div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }
    if (modal.dataset.diagramModalBound === '1') return modal;
    modal.dataset.diagramModalBound = '1';
    modal.addEventListener('click', (e) => {
      if (e.target?.id === 'wiki-diagram-modal') closeWikiDiagram();
    });
    document.getElementById('wiki-diagram-close')?.addEventListener('click', closeWikiDiagram);
    document.getElementById('wiki-diagram-zoom-in')?.addEventListener('click', () => setWikiDiagramZoom(wikiDiagramZoom + 0.2));
    document.getElementById('wiki-diagram-zoom-out')?.addEventListener('click', () => setWikiDiagramZoom(wikiDiagramZoom - 0.2));
    document.getElementById('wiki-diagram-reset')?.addEventListener('click', resetWikiDiagramView);
    document.getElementById('wiki-diagram-stage')?.addEventListener('wheel', (e) => {
      if (!e.metaKey && !e.ctrlKey) return;
      e.preventDefault();
      setWikiDiagramZoom(wikiDiagramZoom + (e.deltaY < 0 ? 0.15 : -0.15));
    }, { passive: false });
    return modal;
  }

  function openWikiDiagram(sourceNode) {
    ensureWikiDiagramModal();
    const modal = document.getElementById('wiki-diagram-modal');
    const canvas = document.getElementById('wiki-diagram-canvas');
    const stage = document.getElementById('wiki-diagram-stage');
    if (!modal || !canvas || !stage) return;
    canvas.innerHTML = sourceNode.innerHTML;
    modal.removeAttribute('hidden');
    document.body.classList.add('wiki-diagram-open');
    wikiDiagramReturnFocusEl = sourceNode;
    wikiDiagramZoom = 1;
    window.setTimeout(() => {
      if (modal.hasAttribute('hidden')) return;
      const svg = canvas.querySelector('svg');
      if (svg) {
        const viewBox = (svg.getAttribute('viewBox') || '').split(/\s+/).map(Number);
        const naturalWidth = Number.isFinite(viewBox[2]) && viewBox[2] > 0
          ? viewBox[2]
          : Math.max(640, svg.getBoundingClientRect().width || 900);
        const sidePadding = window.matchMedia('(max-width: 760px)').matches ? 36 : 96;
        const availableWidth = Math.max(260, stage.clientWidth - sidePadding);
        const fitWidth = Math.max(260, Math.min(naturalWidth, availableWidth, 860));
        canvas.dataset.fitWidth = String(fitWidth);
      } else {
        canvas.dataset.fitWidth = String(Math.max(260, Math.min(stage.clientWidth - 96, 860)));
      }
      setWikiDiagramZoom(1);
      stage.scrollTo({ top: 0, left: 0 });
      document.getElementById('wiki-diagram-close')?.focus({ preventScroll: true });
    }, 0);
  }

  function closeWikiDiagram() {
    const modal = document.getElementById('wiki-diagram-modal');
    const canvas = document.getElementById('wiki-diagram-canvas');
    modal?.setAttribute('hidden', '');
    document.body.classList.remove('wiki-diagram-open');
    if (canvas) {
      canvas.innerHTML = '';
      canvas.dataset.fitWidth = '';
    }
    if (wikiDiagramReturnFocusEl?.isConnected) {
      wikiDiagramReturnFocusEl.focus({ preventScroll: true });
    }
    wikiDiagramReturnFocusEl = null;
    wikiDiagramZoom = 1;
  }

  function setWikiDiagramZoom(nextZoom) {
    wikiDiagramZoom = Math.max(0.5, Math.min(3, Number(nextZoom) || 1));
    const canvas = document.getElementById('wiki-diagram-canvas');
    const stage = document.getElementById('wiki-diagram-stage');
    const svg = canvas?.querySelector('svg');
    if (!canvas || !stage || !svg) return;
    const fitWidth = Number(canvas.dataset.fitWidth || Math.min(stage.clientWidth - 96, 860));
    svg.style.width = `${Math.max(260, fitWidth * wikiDiagramZoom)}px`;
    svg.style.maxWidth = 'none';
    svg.style.height = 'auto';
  }

  function resetWikiDiagramView() {
    setWikiDiagramZoom(1);
    document.getElementById('wiki-diagram-stage')?.scrollTo({ top: 0, left: 0 });
  }

  function currentWikiPage() {
    if (!currentWiki || !currentPageId) return { page: null, meta: null };
    return {
      page: currentWiki.pages[currentPageId] || null,
      meta: currentWiki.structure.pages.find((p) => p.id === currentPageId) || null,
    };
  }

  function setWikiBatchSelection(mode) {
    if (!currentWiki) return;
    if (mode === 'all') {
      wikiBatchSelectedPageIds = new Set(currentWiki.structure.pages.map((page) => page.id));
    } else if (mode === 'clear') {
      wikiBatchSelectedPageIds = new Set();
    } else {
      wikiBatchSelectedPageIds = new Set(currentPageId ? [currentPageId] : []);
    }
    renderWikiBatchPagePicker();
  }

  function renderWikiBatchPagePicker() {
    const list = document.getElementById('wiki-batch-list');
    if (!list || !currentWiki) return;
    const pages = currentWiki.structure.pages || [];
    list.innerHTML = pages.map((page) => {
      const checked = wikiBatchSelectedPageIds.has(page.id) ? ' checked' : '';
      const current = page.id === currentPageId ? '<span class="wiki-batch-current-pill">Current</span>' : '';
      const sourceCount = Array.isArray(page.filePaths) ? page.filePaths.length : 0;
      return `
        <label class="wiki-batch-row">
          <input type="checkbox" value="${escapeHtml(page.id)}"${checked} />
          <span class="wiki-batch-row-main">
            <span class="wiki-batch-row-title">${escapeHtml(page.title)}${current}</span>
            <span class="wiki-batch-row-meta">${sourceCount} source file${sourceCount === 1 ? '' : 's'}</span>
          </span>
        </label>
      `;
    }).join('');
    list.querySelectorAll('input[type="checkbox"]').forEach((input) => {
      input.addEventListener('change', () => {
        if (input.checked) wikiBatchSelectedPageIds.add(input.value);
        else wikiBatchSelectedPageIds.delete(input.value);
        updateWikiBatchSelectionState();
      });
    });
    updateWikiBatchSelectionState();
  }

  function updateWikiBatchSelectionState() {
    const count = wikiBatchSelectedPageIds.size;
    const countEl = document.getElementById('wiki-batch-count');
    const button = document.getElementById('wiki-regenerate-selected-pages');
    if (countEl) countEl.textContent = `${count} selected`;
    if (button) {
      button.disabled = Boolean(wikiRepairAbort) || count === 0;
      button.textContent = count > 1 ? `Regenerate ${count} selected pages` : 'Regenerate selected pages';
    }
  }

  function hydrateWikiEditor() {
    const { page, meta } = currentWikiPage();
    const current = document.getElementById('wiki-edit-current');
    const markdown = document.getElementById('wiki-page-markdown');
    const request = document.getElementById('wiki-fix-instruction');
    const pagePrompt = document.getElementById('wiki-page-prompt');
    wikiBatchSelectedPageIds = new Set(currentPageId ? [currentPageId] : []);
    if (current) {
      current.innerHTML = meta
        ? `<div>${escapeHtml(meta.title)}</div><span>${meta.filePaths.length} source file${meta.filePaths.length === 1 ? '' : 's'}</span>`
        : '';
    }
    if (markdown) markdown.value = page?.content || '';
    if (request) request.value = '';
    if (pagePrompt) {
      pagePrompt.value = page?.stylePromptOverride
        ? normalizeWikiStylePrompt(page.stylePrompt)
        : currentWiki?.wikiStyle === 'custom'
        ? normalizeWikiStylePrompt(currentWiki.wikiStylePrompt)
        : '';
    }
    renderWikiBatchPagePicker();
    renderWikiEditorDiagrams();
    setWikiEditStatus('');
  }

  function findMermaidBlocks(markdown) {
    const blocks = [];
    const text = String(markdown || '');
    const re = /(^|\n)(```|~~~)([^\n]*)\n([\s\S]*?)\n\2[ \t]*(?=\n|$)/g;
    let match;
    while ((match = re.exec(text)) !== null) {
      const prefix = match[1] || '';
      const fence = match[2] || '```';
      const info = match[3] || '';
      const code = match[4] || '';
      const lang = info.trim().split(/\s+/)[0] || '';
      if (!looksLikeMermaid(lang, code)) continue;
      const start = match.index + prefix.length;
      const opener = `${fence}${info}\n`;
      const codeStart = start + opener.length;
      const codeEnd = codeStart + code.length;
      blocks.push({
        index: blocks.length,
        lang,
        code,
        start,
        end: start + match[0].length - prefix.length,
        codeStart,
        codeEnd,
        lineCount: code.split('\n').length,
      });
    }
    return blocks;
  }

  function renderWikiEditorDiagrams() {
    const markdown = document.getElementById('wiki-page-markdown');
    const list = document.getElementById('wiki-diagram-list');
    const section = document.getElementById('wiki-edit-diagrams');
    if (!markdown || !list || !section) return;
    wikiEditorDiagramBlocks = findMermaidBlocks(markdown.value);
    if (!wikiEditorDiagramBlocks.length) {
      section.hidden = true;
      list.innerHTML = '';
      return;
    }
    section.hidden = false;
    list.innerHTML = wikiEditorDiagramBlocks.map((block, index) => `
      <div class="wiki-diagram-row" data-diagram-index="${index}">
        <div>
          <strong>Diagram ${index + 1}</strong>
          <span data-role="diagram-status">checking syntax…</span>
        </div>
        <div class="wiki-diagram-row-actions">
          <button class="wiki-edit-secondary" type="button" data-diagram-edit="${index}">Edit block</button>
          <button class="wiki-edit-secondary" type="button" data-diagram-fix="${index}">Auto-fix</button>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('[data-diagram-edit]').forEach((button) => {
      button.addEventListener('click', () => focusWikiDiagramBlock(Number(button.dataset.diagramEdit)));
    });
    list.querySelectorAll('[data-diagram-fix]').forEach((button) => {
      button.addEventListener('click', () => autoFixWikiDiagramBlock(Number(button.dataset.diagramFix)));
    });
    validateWikiEditorDiagrams();
  }

  async function validateWikiEditorDiagrams() {
    const blocks = wikiEditorDiagramBlocks;
    for (const block of blocks) {
      const row = document.querySelector(`[data-diagram-index="${block.index}"]`);
      const status = row?.querySelector('[data-role="diagram-status"]');
      if (!status) continue;
      try {
        await Promise.resolve(mermaid.parse(block.code));
        status.textContent = `${block.lineCount} lines · valid`;
        status.dataset.tone = 'success';
        delete row.dataset.error;
      } catch (e) {
        const message = e?.str || e?.message || String(e);
        status.textContent = `${block.lineCount} lines · broken`;
        status.dataset.tone = 'error';
        row.dataset.error = message;
      }
    }
  }

  function focusWikiDiagramBlock(index) {
    const markdown = document.getElementById('wiki-page-markdown');
    const block = wikiEditorDiagramBlocks[index];
    if (!markdown || !block) return;
    markdown.focus();
    markdown.setSelectionRange(block.codeStart, block.codeEnd);
    const lineHeight = 18;
    const before = markdown.value.slice(0, block.codeStart);
    markdown.scrollTop = Math.max(0, before.split('\n').length * lineHeight - markdown.clientHeight * 0.35);
    setWikiEditStatus(`selected diagram ${index + 1}`);
  }

  function replaceWikiDiagramBlock(index, nextCode) {
    const markdown = document.getElementById('wiki-page-markdown');
    const block = wikiEditorDiagramBlocks[index];
    if (!markdown || !block) return false;
    markdown.value = `${markdown.value.slice(0, block.codeStart)}${nextCode.trim()}\n${markdown.value.slice(block.codeEnd)}`;
    renderWikiEditorDiagrams();
    const nextBlock = wikiEditorDiagramBlocks[index];
    if (nextBlock) {
      markdown.focus();
      markdown.setSelectionRange(nextBlock.codeStart, nextBlock.codeEnd);
    }
    return true;
  }

  async function autoFixWikiDiagramBlock(index) {
    const markdown = document.getElementById('wiki-page-markdown');
    const { meta } = currentWikiPage();
    const block = wikiEditorDiagramBlocks[index];
    if (!currentWiki || !markdown || !meta || !block) return;
    const row = document.querySelector(`[data-diagram-index="${index}"]`);
    const button = row?.querySelector('[data-diagram-fix]');
    const error = row?.dataset.error || '';
    if (button) button.disabled = true;
    setWikiEditStatus(`fixing diagram ${index + 1}…`);
    try {
      const data = await postJSONWithSecrets('/api/wiki/diagram/fix', {
        owner: currentWiki.owner,
        repo: currentWiki.repo,
        pageTitle: meta.title,
        pageContext: markdown.value.slice(Math.max(0, block.start - 1400), Math.min(markdown.value.length, block.end + 1400)),
        diagram: block.code,
        error,
        instruction: document.getElementById('wiki-fix-instruction')?.value || '',
        channel: selectedChannelId,
      });
      if (!replaceWikiDiagramBlock(index, data.diagram || '')) {
        throw new Error('Could not replace diagram block');
      }
      setWikiEditStatus(`diagram ${index + 1} fixed; saving page…`, 'success');
      await saveCurrentWikiPage({ keepStatus: true });
      setWikiEditStatus(`diagram ${index + 1} fixed and saved`, 'success');

      setWikiEditStatus(e.message || 'diagram fix failed', 'error');

  function finishWikiRepairProcess({ ok = true, message = '', chars = 0, hideDelay = 1400 } = {}) {
    const shell = document.getElementById('wiki-repair-process');
    if (!shell) return;
    shell.classList.toggle('running', false);
    shell.classList.toggle('done', ok);
    shell.classList.toggle('error', !ok);
    updateWikiRepairProcessMeta(message || (ok ? 'done' : 'failed'), ok ? 'success' : 'error');
    if (wikiRepairCard) {
      if (ok) {
        wikiRepairCard.markDone({ chars });
        wikiRepairCard.open = false;
        wikiRepairCard.el.classList.remove('open', 'expanded');
      } else {
        wikiRepairCard.markError(message || 'regeneration failed');

      wikiRepairHideTimer = window.setTimeout(() => hideWikiRepairProcess(), hideDelay);

  function friendlyWikiRepairStatus(event) {
    if (!event) return '';
    if (event.type === 'step') {
      if (event.summary) return event.summary;
      if (event.reasoning) return event.reasoning.split('\n').find(Boolean)?.slice(0, 120) || 'thinking…';
      if (event.code) return 'checking source files…';
      if (event.output) return 'received tool output…';
    }
    if (event.type === 'submit') return 'submitted replacement page…';
    return event.type ? `${event.type}…` : '';
  }

  function regenerateCurrentWikiPage() {
    const { meta } = currentWikiPage();
    const request = document.getElementById('wiki-fix-instruction');
    const pagePrompt = document.getElementById('wiki-page-prompt');
    if (!currentWiki || !currentPageId || !meta || wikiRepairAbort) return;
    const instruction = (request?.value || '').trim()
      || 'Fix this page if it contains broken Markdown, invalid Mermaid syntax, inaccurate citations, or incomplete generated content.';

    const wikiRuntime = normalizeRuntime(selectedWikiRepairRuntime, 'rlm');

    const card = showWikiRepairProcess(`${runtimeLabel(wikiRuntime)} · Regenerating · ${meta.title}`);
    document.getElementById('topbar-status').textContent = 'repairing page';
    wikiRepairAbort = sseStream('/api/wiki/page', {
      owner: currentWiki.owner,

      stylePrompt,

        if (ev === 'start') {
          updateWikiRepairProcessMeta(`regenerating ${data.title || meta.title}`);
          addCardProcessStatusNow(wikiRepairCard || card, 'Worker accepted page regeneration');
        } else if (ev === 'phase') {
          updateWikiRepairProcessMeta(data.message || 'regenerating page');
          addCardProcessStatusNow(wikiRepairCard || card, data.message || 'Regenerating page');
        } else if (ev === 'page-start') {
          updateWikiRepairProcessMeta(`writing ${data.title || meta.title}`);
          addCardProcessStatusNow(wikiRepairCard || card, 'Worker is writing replacement page');
        } else if (ev === 'page-agent') {
          if (wikiRepairCard || card) routeAgentEvent(wikiRepairCard || card, data.event);
          const text = friendlyWikiRepairStatus(data.event);
          if (text) updateWikiRepairProcessMeta(text);
        } else if (ev === 'page-done') {
          if (data.page) currentWiki.pages[data.pageId || currentPageId] = data.page;
          addCardProcessStatusNow(wikiRepairCard || card, data.contentLength ? `Replacement page written · ${data.contentLength.toLocaleString()} chars` : 'Replacement page written');
          updateWikiRepairProcessMeta('replacement page ready', 'success');
        } else if (ev === 'done') {
          currentWiki = data.wiki || currentWiki;
          renderPage(data.pageId || currentPageId);

          finishWikiRepairProcess({

          wikiRepairAbort = null;
          if (button) button.disabled = false;
          renderWikiRepairRuntimeToggle();

  function regenerateSelectedWikiPages() {
    const request = document.getElementById('wiki-fix-instruction');

    const pageIds = currentWiki.structure.pages
      .map((page) => page.id)

    if (!pageIds.length) {
      setWikiEditStatus('select at least one page', 'error');
      return;

    const pageById = new Map(currentWiki.structure.pages.map((page) => [page.id, page]));
    const instruction = (request?.value || '').trim()
      || 'Improve readability, add helpful Mermaid diagrams or ASCII diagrams where useful, and keep the page grounded in the repository sources.';
    const wikiRuntime = normalizeRuntime(selectedWikiRepairRuntime, 'rlm');

    setWikiEditStatus('');

    const total = pageIds.length;
    const completed = new Set();
    const failed = new Map();
    const card = showWikiRepairProcess(`${runtimeLabel(wikiRuntime)} · Regenerating ${total} page${total === 1 ? '' : 's'}`);
    document.getElementById('topbar-status').textContent = `repairing ${total} page${total === 1 ? '' : 's'}`;

    wikiRepairAbort = sseStream('/api/wiki/pages', {
      owner: currentWiki.owner,
      repo: currentWiki.repo,
      branch: currentWiki.branch || null,
      pageIds,
      instruction,
      channel: selectedChannelId,
      runtime: wikiRuntime,
      localCli: currentLocalCliConfig(),
    }, {
      onEvent(ev, data) {
        if (ev === 'start') {
          updateWikiRepairProcessMeta(`${data.pageCount || total} pages queued`);
          addCardProcessStatusNow(wikiRepairCard || card, 'Worker accepted batch regeneration');
        } else if (ev === 'phase') {
          updateWikiRepairProcessMeta(data.message || 'regenerating pages');
          addCardProcessStatusNow(wikiRepairCard || card, data.message || 'Regenerating pages');
        } else if (ev === 'page-start') {
          const meta = pageById.get(data.pageId);
          const label = data.title || meta?.title || data.pageId || 'page';
          const index = data.index || (completed.size + failed.size + 1);
          updateWikiRepairProcessMeta(`${index}/${data.total || total} · ${label}`);
          addCardProcessStatusNow(wikiRepairCard || card, `Writing ${label}`);
        } else if (ev === 'page-agent') {
          if (wikiRepairCard || card) routeAgentEvent(wikiRepairCard || card, data.event);
          const text = friendlyWikiRepairStatus(data.event);
          if (text) updateWikiRepairProcessMeta(text);
        } else if (ev === 'page-done') {
          completed.add(data.pageId);
          if (data.page) currentWiki.pages[data.pageId] = data.page;
          const meta = pageById.get(data.pageId);
          const label = meta?.title || data.pageId || 'page';
          addCardProcessStatusNow(wikiRepairCard || card, `Finished ${label}`);
          updateWikiRepairProcessMeta(`${completed.size}/${total} regenerated`, 'success');
        } else if (ev === 'page-error') {
          failed.set(data.pageId, data.error || data.message || 'regeneration failed');
          const meta = pageById.get(data.pageId);
          const label = data.title || meta?.title || data.pageId || 'page';
          addCardProcessStatusNow(wikiRepairCard || card, `Failed ${label}`);
          updateWikiRepairProcessMeta(`${failed.size} failed`, 'error');
        } else if (ev === 'done') {
          currentWiki = data.wiki || currentWiki;
          const currentStillExists = currentPageId && currentWiki.pages[currentPageId];
          renderPage(currentStillExists ? currentPageId : (data.pageIds?.[0] || currentWiki.structure.pages[0]?.id));
          hydrateWikiEditor();
          const errors = Array.isArray(data.pageErrors) ? data.pageErrors.length : failed.size;
          const regenerated = Array.isArray(data.pageIds) ? data.pageIds.length : completed.size;
          setWikiEditStatus(errors ? `${regenerated} regenerated, ${errors} failed` : `${regenerated} regenerated`, errors ? 'error' : 'success');
          finishWikiRepairProcess({
            ok: errors === 0,
            message: errors ? `${regenerated}/${total} regenerated` : 'pages regenerated',
            chars: data.pageIds?.reduce((sum, pageId) => sum + (currentWiki.pages[pageId]?.content?.length || 0), 0) || 0,
            hideDelay: errors ? -1 : 1400,
          });
          document.getElementById('topbar-status').textContent = `${Object.keys(currentWiki.pages).length} pages`;
          wikiRepairAbort = null;
          if (currentButton) currentButton.disabled = false;
          renderWikiRepairRuntimeToggle();
        } else if (ev === 'error') {
          setWikiEditStatus('');
          finishWikiRepairProcess({ ok: false, message: data.message || 'batch regeneration failed', hideDelay: -1 });
          document.getElementById('topbar-status').textContent = 'error';
          wikiRepairAbort = null;
          if (currentButton) currentButton.disabled = false;
          renderWikiRepairRuntimeToggle();
        }
      },
      onError(err) {
        setWikiEditStatus('');
        finishWikiRepairProcess({ ok: false, message: `transport error: ${err.message}`, hideDelay: -1 });
        document.getElementById('topbar-status').textContent = 'error';
        wikiRepairAbort = null;
        if (currentButton) currentButton.disabled = false;
        renderWikiRepairRuntimeToggle();
      },
      onDone() {
        wikiRepairAbort = null;
        if (currentButton) currentButton.disabled = false;
        renderWikiRepairRuntimeToggle();
      },
    });
  }

  function countTermMatches(text, query) {
    const q = query.trim().toLowerCase();
    if (!q) return 0;
    let count = 0;
    let index = 0;
    const hay = String(text || '').toLowerCase();
    while ((index = hay.indexOf(q, index)) !== -1) {
      count++;
      index += q.length || 1;
    }
    return count;
  }

  function fuzzySubsequenceScore(text, query) {
    const hay = String(text || '').toLowerCase();
    const q = query.trim().toLowerCase();
    if (!q) return 0;
    let pos = 0;
    let score = 0;
    for (const ch of q) {
      const next = hay.indexOf(ch, pos);
      if (next === -1) return 0;
      score += Math.max(1, 12 - (next - pos));
      pos = next + 1;
    }
    return score;
  }

  function markdownToSearchText(markdown) {
    return String(markdown || '')
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/<[^>]+>/g, ' ')
      .replace(/[#>*_[\]()]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function searchSnippetFor(text, query, label) {
    const q = query.trim();
    if (!q) return null;
    const source = String(text || '').replace(/\s+/g, ' ').trim();
    if (!source) return null;
    const idx = source.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return null;
    const start = Math.max(0, idx - 42);
    const end = Math.min(source.length, idx + q.length + 58);
    const before = source.slice(start, idx);
    const match = source.slice(idx, idx + q.length);
    const after = source.slice(idx + q.length, end);
    return {
      label,
      html: `${start > 0 ? '…' : ''}${escapeHtml(before)}<mark>${escapeHtml(match)}</mark>${escapeHtml(after)}${end < source.length ? '…' : ''}`,
    };
  }

  function highlightSearchText(text, query) {
    const source = String(text || '');
    const q = query.trim();
    if (!q) return escapeHtml(source);
    const lower = source.toLowerCase();
    const needle = q.toLowerCase();
    let html = '';
    let pos = 0;
    let idx;
    while ((idx = lower.indexOf(needle, pos)) !== -1) {
      html += escapeHtml(source.slice(pos, idx));
      html += `<mark>${escapeHtml(source.slice(idx, idx + q.length))}</mark>`;
      pos = idx + q.length;
    }
    html += escapeHtml(source.slice(pos));
    return html;
  }

  function cleanMarkdownHeading(line) {
    return line
      .replace(/^#{1,6}\s+/, '')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/[*_[\]()]/g, '')
      .trim();
  }

  function markdownSearchSections(markdown) {
    const sections = [];
    let current = { heading: '', text: '' };
    let inFence = false;
    for (const rawLine of String(markdown || '').split('\n')) {
      const line = rawLine.trim();
      if (line.startsWith('```')) {
        inFence = !inFence;
        continue;
      }
      if (inFence) continue;
      const heading = line.match(/^#{1,4}\s+(.+)/);
      if (heading) {
        if (current.text.trim()) sections.push(current);
        current = { heading: cleanMarkdownHeading(line), text: '' };
        continue;
      }
      const text = markdownToSearchText(line);
      if (text) current.text += `${current.text ? ' ' : ''}${text}`;
    }
    if (current.text.trim()) sections.push(current);
    return sections;
  }

  function wikiSearchSnippets(meta, page, query) {
    const snippets = [];
    const descriptionSnippet = searchSnippetFor(meta.description, query, '');
    if (descriptionSnippet) snippets.push(descriptionSnippet);
    for (const section of markdownSearchSections(page?.content || '')) {
      const snippet = searchSnippetFor(section.text, query, section.heading);
      if (snippet) snippets.push(snippet);
      if (snippets.length >= 3) break;
    }
    return snippets.slice(0, 3);
  }

  function wikiSearchRows(query) {
    if (!currentWiki) return [];
    const pages = currentWiki.structure.pages || [];
    return pages.map((meta, idx) => {
      const page = currentWiki.pages[meta.id] || {};
      const titleMatches = countTermMatches(meta.title, query);
      const descMatches = countTermMatches(meta.description, query);
      const bodyMatches = countTermMatches(page.content || '', query);
      const fuzzy = fuzzySubsequenceScore(`${meta.title} ${meta.description}`, query);
      const emptyScore = query.trim() ? 0 : Math.max(1, pages.length - idx);
      const score = emptyScore + titleMatches * 80 + descMatches * 20 + Math.min(bodyMatches, 80) + fuzzy;
      return {
        meta,
        idx,
        matches: titleMatches + descMatches + bodyMatches,
        snippets: wikiSearchSnippets(meta, page, query),
        titleHtml: highlightSearchText(meta.title, query),
        score,
      };
    }).filter((row) => row.score > 0)
      .sort((a, b) => b.score - a.score || a.idx - b.idx)
      .slice(0, 12);
  }

  function renderWikiSearchResults(query) {
    const results = document.getElementById('wiki-search-results');
    if (!results) return;
    const rows = wikiSearchRows(query);
    if (wikiSearchIndex < 0) wikiSearchIndex = 0;
    if (wikiSearchIndex >= rows.length) wikiSearchIndex = Math.max(0, rows.length - 1);
    if (!rows.length) {
      results.innerHTML = `<div class="wiki-search-empty">No pages found</div>`;
      return;
    }
    results.innerHTML = rows.map((row, i) => `
      <button class="wiki-search-result${i === wikiSearchIndex ? ' active' : ''}" type="button" data-page="${escapeHtml(row.meta.id)}">
        <span class="wiki-search-result-main">
          <span class="wiki-search-result-top">
            <strong>${row.titleHtml}</strong>
            <small>${row.matches || 'open'} ${row.matches === 1 ? 'match' : row.matches ? 'matches' : ''}</small>
          </span>
          <em>Page ${row.idx + 1}${row.meta.parentSection ? ` · ${escapeHtml(row.meta.parentSection)}` : ''}</em>
          ${row.snippets.length ? `
            <span class="wiki-search-snippets">
              ${row.snippets.map((snippet) => `
                <span class="wiki-search-snippet">${snippet.label ? `<b>${escapeHtml(snippet.label)}</b>` : ''}${snippet.html}</span>
              `).join('')}
            </span>
          ` : ''}
        </span>
      </button>
    `).join('');
    results.querySelectorAll('.wiki-search-result').forEach((btn, i) => {
      btn.addEventListener('mouseenter', () => {
        wikiSearchIndex = i;
        setWikiSearchActive(i);
      });
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        renderPage(btn.dataset.page);
        closeWikiSearch();
      });
    });
  }

  function setWikiSearchActive(index) {
    wikiSearchIndex = index;
    document.querySelectorAll('.wiki-search-result').forEach((btn, i) => {
      btn.classList.toggle('active', i === wikiSearchIndex);
    });
  }

  function handleWikiSearchKeydown(e) {
    const rows = wikiSearchRows(e.currentTarget.value);
    if (e.key === 'Escape') {
      closeWikiSearch();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      wikiSearchIndex = Math.min(rows.length - 1, wikiSearchIndex + 1);
      setWikiSearchActive(wikiSearchIndex);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      wikiSearchIndex = Math.max(0, wikiSearchIndex - 1);
      setWikiSearchActive(wikiSearchIndex);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const row = rows[Math.max(0, wikiSearchIndex)];
      if (row) {
        renderPage(row.meta.id);
        closeWikiSearch();
      }
    }
  }

  // The page prompt tells the agent to emit the "Relevant source files" list
  // inside a `<details>` block with markdown list items, but marked doesn't
  // re-parse markdown inside raw HTML blocks — so the `- [path](path)` lines
  // collapse into a single dash-separated run. We walk each such block here
  // and rebuild the body as a proper <ul> so the list actually breaks per line.
  function fixSourceFilesDetails(container) {
    container.querySelectorAll('details').forEach((det) => {
      // The body text (excluding the summary, if any) is what we inspect.
      const clone = det.cloneNode(true);
      clone.querySelector('summary')?.remove();
      const raw = clone.textContent || '';

      // Identify this as the source-files block either by its summary label
      // OR by its body text — agents sometimes skip emitting <summary>, in
      // which case the browser renders the default "Details" label.
      const sum = det.querySelector('summary');
      const summaryText = (sum?.textContent || '').toLowerCase();
      const bodyLooksLikeSources =
        /following files were used as context/i.test(raw) ||
        /relevant source files/i.test(raw);
      if (!summaryText.includes('relevant source files') && !bodyLooksLikeSources) return;

      // Match `[label](href)` pairs. Labels and hrefs in practice are the
      // same path, but we keep both in case the agent emits aliases.
      const linkRe = /\[([^\]]+)\]\(([^)]*)\)/g;
      const paths = new Set();
      let m;
      while ((m = linkRe.exec(raw)) !== null) {
        const p = (m[2] || m[1]).trim();
        if (p) paths.add(p);
      }

      if (paths.size === 0) return; // nothing to rebuild — leave as-is

      // Wipe the entire details body. We'll rebuild it with a known-good
      // <summary> (agents sometimes skip it, leaving the browser's default
      // "Details" label), followed by the intro paragraph and file list.
      det.innerHTML = '';

      const summary = document.createElement('summary');
      summary.textContent = 'Relevant source files';
      det.appendChild(summary);

      const intro = document.createElement('p');
      intro.className = 'source-files-intro';
      intro.textContent = 'The following files were used as context for this page:';
      det.appendChild(intro);

      const ul = document.createElement('ul');
      ul.className = 'source-files-list';
      for (const p of paths) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.textContent = p;
        a.setAttribute('href', p); // linkifySources() will rewrite to GitHub
        li.appendChild(a);
        ul.appendChild(li);
      }
      det.appendChild(ul);
    });
  }

  // Turn the LLM's `Sources: [src/foo.ts:12-40]()` citations into real GitHub
  // blob links. The page prompt tells the model to emit `[path:start-end]()`
  // — an anchor with empty href — which naively resolves to our own homepage.
  // We walk every <a> the renderer produced and, where the text looks like a
  // path (with optional line range), replace href with a GitHub blob URL.
  // Also covers bare-text citations that never became anchors.
  function linkifySources(container, repoInfo) {
    const reposById = new Map();
    if (Array.isArray(repoInfo?.repos)) {
      repoInfo.repos.forEach((r) => {
        if (r?.id && r.owner && r.repo) reposById.set(r.id, r);
      });
    }
    const singleRepo = repoInfo?.owner && repoInfo?.repo
      ? { owner: repoInfo.owner, repo: repoInfo.repo, branch: repoInfo.branch || 'HEAD' }
      : null;

    if (!singleRepo && reposById.size === 0) return;

    const resolvePath = (rawPath) => {
      const colon = rawPath.indexOf(':');
      if (colon > 0) {
        const repoId = rawPath.slice(0, colon);
        const repo = reposById.get(repoId);
        if (repo) {
          return {
            owner: repo.owner,
            repo: repo.repo,
            branch: repo.branch || 'HEAD',
            path: rawPath.slice(colon + 1),
          };
        }
      }
      if (reposById.size > 0) return null;
      return { ...singleRepo, path: rawPath };
    };

    const buildUrl = (rawPath, startLine, endLine) => {
      const resolved = resolvePath(rawPath);
      if (!resolved) return null;
      const base = `https://github.com/${resolved.owner}/${resolved.repo}/blob/${encodeURIComponent(resolved.branch)}/${resolved.path}`;
      if (startLine) {
        return endLine && endLine !== startLine
          ? `${base}#L${startLine}-L${endLine}`
          : `${base}#L${startLine}`;
      }
      return base;
    };

    // Loose enough to match: path/with/slashes.ext, path.ext, path.ext:42,
    // path.ext:42-58. Requires a file extension or a "/" to avoid matching
    // generic words.
    const PATH_RE = /^\s*`?((?:[A-Za-z0-9_.-]+:)?(?:[\w.\-/]+?\.[A-Za-z0-9]+|[\w.\-/]+\/[\w.\-]+))`?(?::(\d+)(?:[-–](\d+))?)?\s*$/;

    // Pass 1: fix existing <a> elements emitted by marked.
    container.querySelectorAll('a').forEach((a) => {
      const text = a.textContent.trim();
      const href = a.getAttribute('href') || '';

      // Skip obvious external links — full URLs already resolve fine.
      if (/^https?:\/\//i.test(href) || /^mailto:/i.test(href)) return;

      // Skip in-page anchors like `#section`.
      if (href.startsWith('#')) return;

      const m = text.match(PATH_RE);
      if (!m) return;

      const [, path, start, end] = m;
      const sourceHref = buildUrl(path, start ? Number(start) : null, end ? Number(end) : null);
      if (!sourceHref) return;
      a.setAttribute('href', sourceHref);
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
      a.classList.add('source-link');
    });

    // Pass 2: bare-text citations like `Sources: src/foo.ts:12-40,
    // src/bar.ts:5` that never became anchors. Walk text nodes, replace
    // the path-like tokens with real anchors.
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        // Skip text inside code / pre / existing anchors.
        const p = n.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        if (p.closest('a, pre, code, .mermaid')) return NodeFilter.FILTER_REJECT;
        return /(?:[A-Za-z0-9_.-]+:)?[\w.\-/]+\.[A-Za-z0-9]+(?::\d+)?/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      },
    });
    const TOKEN_RE = /((?:[A-Za-z0-9_.-]+:)?[\w.\-/]+?\.[A-Za-z0-9]+)(?::(\d+)(?:[-–](\d+))?)?/g;
    const targets = [];
    let node;
    while ((node = walker.nextNode())) targets.push(node);

    for (const text of targets) {
      const src = text.nodeValue;
      TOKEN_RE.lastIndex = 0;
      let lastIndex = 0;
      const frag = document.createDocumentFragment();
      let matched = false;
      let m;
      while ((m = TOKEN_RE.exec(src)) !== null) {
        const [full, path, startLine, endLine] = m;
        const colon = path.indexOf(':');
        const relPath = colon > 0 && reposById.has(path.slice(0, colon))
          ? path.slice(colon + 1)
          : path;
        // Require at least one "/" OR a common source extension to avoid
        // linkifying prose like "Example.md" when the author means the
        // noun. Keep this conservative — false positives are worse than
        // false negatives here.
        if (!relPath.includes('/') && !/\.(ts|tsx|js|jsx|py|go|rs|java|c|cc|cpp|h|hpp|md|json|yaml|yml|toml|sh|rb|sql|tf|proto)$/i.test(relPath)) {
          continue;
        }
        const href = buildUrl(path, startLine ? Number(startLine) : null, endLine ? Number(endLine) : null);
        if (!href) continue;
        matched = true;
        if (m.index > lastIndex) {
          frag.appendChild(document.createTextNode(src.slice(lastIndex, m.index)));
        }
        const a = document.createElement('a');
        a.textContent = full;
        a.setAttribute('href', href);
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
        a.classList.add('source-link');
        frag.appendChild(a);
        lastIndex = m.index + full.length;
      }
      if (!matched) continue;
      if (lastIndex < src.length) {
        frag.appendChild(document.createTextNode(src.slice(lastIndex)));
      }
      text.parentNode.replaceChild(frag, text);
    }
  }

  async function copyText(text) {
    const value = String(text || '');
    let clipboardError = null;
    if (navigator.clipboard?.writeText) {
      try {
        await navigator.clipboard.writeText(value);
        return;
      } catch (e) {
        clipboardError = e;
      }
    }

    let eventCopyError = null;
    const onCopy = (event) => {
      try {
        event.clipboardData?.setData('text/plain', value);
        event.preventDefault();
      } catch (e) {
        eventCopyError = e;
      }
    };
    document.addEventListener('copy', onCopy);
    let eventCopyOk = false;
    try {
      eventCopyOk = document.execCommand('copy');
    } finally {
      document.removeEventListener('copy', onCopy);
    }
    if (eventCopyOk && !eventCopyError) return;

    const ta = document.createElement('textarea');
    ta.value = value;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    let ok = false;
    try {
      ok = document.execCommand('copy');
    } finally {
      ta.remove();
    }
    if (!ok) throw eventCopyError || clipboardError || new Error('Clipboard copy failed');
  }

  function attachMarkdownCopyButton(answerEl, markdown, host = null) {
    if (!answerEl) return;
    const target = host || answerEl.closest('.chat-msg, .ask-answer-card, .review-answer-card') || answerEl.parentElement;
    if (!target) return;
    target.classList.add('has-markdown-copy');
    answerEl.dataset.rawMarkdown = markdown || '';

    let btn = target.querySelector(':scope > [data-role="copy-markdown"]');
    if (!btn) {
      btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'markdown-copy-btn';
      btn.dataset.role = 'copy-markdown';
      btn.setAttribute('aria-label', 'Copy markdown answer');
      btn.textContent = 'copy md';
      target.appendChild(btn);
    }

    btn.onclick = async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const raw = answerEl.dataset.rawMarkdown || markdown || '';
      const previous = btn.textContent;
      try {
        await copyText(raw);
        btn.textContent = 'copied';
        btn.classList.add('copied');
      } catch {
        btn.textContent = 'failed';
        btn.classList.add('failed');
      }
      window.setTimeout(() => {
        btn.textContent = previous || 'copy md';
        btn.classList.remove('copied', 'failed');
      }, 1400);
    };
  }

  // ── Chat ───────────────────────────────────────────────────
  const chatHistory = [];
  let chatAbort = null;

  function setupChat(owner, repo) {
    const fab = document.getElementById('chat-fab');
    const panel = document.getElementById('chat-panel');
    const closeBtn = document.getElementById('chat-close');
    const sendBtn = document.getElementById('chat-send');
    const input = document.getElementById('chat-input');

    fab.addEventListener('click', () => {
      panel.classList.add('open');
      fab.style.display = 'none';
      input.focus();
    });
    closeBtn.addEventListener('click', () => {
      panel.classList.remove('open');
      fab.style.display = '';
    });

    function doSend() {
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      askQuestion(owner, repo, q);
    }
    sendBtn.addEventListener('click', doSend);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        doSend();
      }
    });
  }

  function askQuestion(owner, repo, question) {
    const messages = document.getElementById('chat-messages');
    chatHistory.push({ role: 'user', content: question });

    // User bubble (unchanged).
    const userEl = document.createElement('div');
    userEl.className = 'chat-msg';
    userEl.innerHTML = `<div class="chat-msg-role user">you</div><div class="chat-msg-body"></div>`;
    userEl.querySelector('.chat-msg-body').textContent = question;
    messages.appendChild(userEl);

    // Assistant bubble — contains a research trail and an answer body.
    const assistantEl = document.createElement('div');
    assistantEl.className = 'chat-msg';
    assistantEl.innerHTML = `
      <div class="chat-msg-role assistant"><span class="spinner"></span>thinking</div>
      <div class="chat-trail" data-role="trail"></div>
      <div class="chat-msg-body markdown" data-role="answer" style="display:none"></div>
    `;
    const trailSlot = assistantEl.querySelector('[data-role="trail"]');
    const answerBody = assistantEl.querySelector('[data-role="answer"]');
    const roleLine = assistantEl.querySelector('.chat-msg-role');
    messages.appendChild(assistantEl);
    messages.scrollTop = messages.scrollHeight;

    // Build a reusable AgentCard for this question's research trail.
    // Kind "page" is fine — it's cosmetic; the badge is suppressed via CSS in .chat-trail.done.
    const card = new AgentCard(`chat-${Date.now()}`, 'page', 'Researching…', { presentation: 'rlm' });
    card.open = true;                              // stays open while thinking
    card.el.classList.add('open');
    trailSlot.appendChild(card.el);
    card.setStatus('running');

    const startedAt = Date.now();

    const history = chatHistory.slice(0, -1);
    chatAbort = sseStream('/api/ask', { url: `${owner}/${repo}`, question, history, channel: selectedChannelId }, {
      onEvent(ev, data) {
        if (ev === 'agent') {
          const e = data.event;
          if (!e) return;
          // Route structured events through the same focused process UI used
          // by generation: live probe code first, reasoning second, output
          // as compact evidence after execution.
          routeAgentEvent(card, e);
        } else if (ev === 'answer') {
          // Finalize the trail and show the answer.
          const elapsed = formatElapsed(Date.now() - startedAt);
          card.markDone({ chars: (data.answer || '').length });

          // Collapse the trail and replace the title with a "Worked for X · N steps" hook.
          card.el.classList.remove('open');
          card.open = false;
          trailSlot.classList.add('done');
          // Rewrite the card title to the summary.
          const titleEl = card.el.querySelector('[data-role="title"]');
          if (titleEl) {
            titleEl.textContent = `Worked for ${elapsed} · ${processCountMeta(card)}`;
          }
          // Remove the "thinking"/spinner role line — status is clear now.
          roleLine.innerHTML = 'assistant';

          // Render the markdown answer.
          answerBody.style.display = '';
          answerBody.innerHTML = marked.parse(data.answer || '(empty)');
          Prism.highlightAllUnder(answerBody);
          linkifySources(answerBody, {
            owner,
            repo,
            branch: currentWiki?.branch || 'HEAD',
          });
          renderMermaidDiagrams(answerBody, { afterRender: () => setupMermaidZoom(answerBody) });
          attachMarkdownCopyButton(answerBody, data.answer || '', assistantEl);
          chatHistory.push({ role: 'assistant', content: data.answer });
          messages.scrollTop = messages.scrollHeight;
        } else if (ev === 'error') {
          card.markError(data.message, data);
          answerBody.style.display = '';
          answerBody.innerHTML = renderErrorBanner(data.message, data);
          roleLine.innerHTML = 'assistant';
        }
      },
      onError(err) {
        const message = streamErrorMessage(err);
        card.markError(message, err);
        answerBody.style.display = '';
        answerBody.innerHTML = renderErrorBanner(message, err);
        roleLine.innerHTML = 'assistant';
      },
    });
  }

  // ── router wire-up ────────────────────────────────────────
  function renderRouteContent() {
    const s = parseHash();
    document.body.classList.toggle('public-wiki-readonly', s.route === 'public-wiki');
    updateTopbarActive(s.route);
    if (s.route !== 'ask' && askPageAbort) {
      askPageAbort();
      askPageAbort = null;
    }
    if (s.route !== 'code' && codePageAbort) {
      codePageAbort();
      codePageAbort = null;
    }
    if (s.route !== 'review' && reviewPageAbort) {
      reviewPageAbort();
      reviewPageAbort = null;
    }
    if (s.route !== 'capabilities' && capabilitiesPageAbort) {
      capabilitiesPageAbort();
      capabilitiesPageAbort = null;
    }
    if (s.route === 'public-wiki') {
      renderWiki('', '', { readOnly: true, publicId: s.publicId });
    } else if (s.route === 'wiki') {
      renderWiki(s.owner, s.repo);
    } else if (s.route === 'ask') {
      renderAskPage(s.repoInput, s.initialQuestion, s.extraReposInput, s.workspaceGoal, s.sessionId);
    } else if (s.route === 'code') {
      renderCodeAnythingPage(s.repoInput, s.initialTask, s.sessionId, s.handoff, s.handoffKey, s.followupKey);
    } else if (s.route === 'review') {
      renderReviewPage(s.prInput, s.initialQuestion, s.sessionId, s.handoff, s.handoffKey, s.sourceCodeRunId);
    } else if (s.route === 'capabilities') {
      renderCapabilitiesPage();
    } else if (s.route === 'wikis') {
      renderWikisPage({ repoInput: s.repoInput, preferLocalRepoInput: s.preferLocalRepoInput });
    } else {
      document.getElementById('brand-sub').textContent = 'github repository wikis, generated by agents';
      renderHome();
    }
  }

  function render(options = {}) {
    const root = document.getElementById('view-root');
    const shouldTransition = hasRenderedRoute && options.transition !== false && !routeMotionReduced();

    window.clearTimeout(routeFallbackTimer);
    document.documentElement.classList.remove('route-transition-fallback');
    root?.classList.remove('route-fallback-enter');

    const renderNow = () => {
      renderRouteContent();
      hasRenderedRoute = true;
    };

    if (!shouldTransition) {
      renderNow();
      return;
    }

    if (document.startViewTransition) {
      try {
        const transition = document.startViewTransition(renderNow);
        transition.finished.catch(() => {});
        return;
      } catch (error) {
        console.warn('route view transition failed; using fallback', error);
      }
    }

    renderNow();
    if (!root) return;
    document.documentElement.classList.add('route-transition-fallback');
    root.classList.add('route-fallback-enter');
    routeFallbackTimer = window.setTimeout(() => {
      root.classList.remove('route-fallback-enter');
      document.documentElement.classList.remove('route-transition-fallback');
    }, 220);
  }

  document.getElementById('brand').addEventListener('click', (event) => {
    if (document.body.classList.contains('public-wiki-readonly')) return;
    navigateTo('/', { transition: event.detail !== 0 });
  });
  render({ transition: false });
</script>
