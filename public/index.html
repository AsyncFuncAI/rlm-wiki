      if (this.presentation === 'rlm') {
        if (log.kind === 'status' && shouldShowTranscriptStatus(log.message)) {
          this._appendRlmStatus(log.message);
        } else if (log.kind === 'reasoning') {
          this.liveThinkingFullText = log.reasoning || log.message || this.liveThinkingFullText;
          this.liveThinkingText = this.liveThinkingFullText;
          const panel = this._ensureLiveThinkingPanel();
          const text = panel.querySelector('[data-role="live-thinking-text"]');
          if (text) text.textContent = compactLiveIntentText(this.liveThinkingText) || 'Working through the next move.';
        } else if (log.kind === 'tool' || log.kind === 'tool-input' || log.kind === 'tool-output' || log.kind === 'tool-error') {
          this._recordRlmOperation(log);
        } else {
          this.updateMeta();
        }
        return;
      }

      if (log.kind === 'reasoning') {
        this.liveThinkingFullText = '';
        this.liveThinkingText = '';
        const compact = compactReasoningForTranscript(log.reasoning || log.message, 460);
        if (compact) {
          this._appendTranscriptThought(compact, { reasoning: true });
        }
        this.updateMeta();
        return;
      }

      if (log.kind === 'status') {
        const startupMessage = visibleAgentStartupStatus(log.message, this);
        if (startupMessage) this._appendTranscriptThought(startupMessage, { muted: true });
      } else if (log.kind === 'tool') {
        this._recordToolStart(log);
      } else if (log.kind === 'tool-input') {
        this._recordToolInput(log);
      } else if (log.kind === 'tool-output' || log.kind === 'tool-error') {
        this._recordToolDone(log);
      } else if (log.message) {
        this._appendTranscriptThought(log.message);
      }
      this.updateMeta();
    }

    /**
     * Tool pings ("⚙ bash" / "✓ bash (2ms)") arrive very frequently — often
     * 10+ between meaningful steps. Render them in a single collapsible
     * strip so they don't eat vertical space.
     */
    addToolPing(tool, status, durationMs) {
      const body = this.el.querySelector('[data-role="body"]');
      const empty = body.querySelector('[data-role="empty"]');
      if (empty) empty.style.display = 'none';

      // Tool pings live in the active card's pill strip (attached to the
      // currently-displayed active step — or a standalone strip if no step
      // has rendered yet). They migrate into the trail row's full-body
      // when that step is demoted, via renderStepBody's tool summary.
      let active = this.el.querySelector('[data-role="active"]');
      if (!active || active.classList.contains('empty')) {
        active = this._ensureLiveStep('composing');
      }
      let strip = active.querySelector('[data-role="tool-strip"]');
      if (!strip) {
        strip = document.createElement('div');
        strip.className = 'agent-tool-strip collapsed';
        strip.dataset.role = 'tool-strip';
        strip.innerHTML = `
          <button class="tool-strip-toggle" type="button" data-role="tool-toggle"></button>
          <div class="tool-strip-pills" data-role="tool-pills"></div>
        `;
        const toggleBtn = strip.querySelector('[data-role="tool-toggle"]');
        toggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          strip.classList.toggle('collapsed');
          this._refreshToolStripHeader(strip);
        });
        // Insert the strip before the thinking row / end of active card.
        const thinking = active.querySelector('[data-role="thinking"]');
        if (thinking) active.insertBefore(strip, thinking);
        else active.appendChild(strip);
      }

      const pills = strip.querySelector('[data-role="tool-pills"]');
      const pill = document.createElement('span');
      pill.className = 'tool-pill ' + (status === 'done' ? 'done' : status === 'error' ? 'error' : 'running');
      const icon = status === 'done' ? '✓' : status === 'error' ? '✗' : '⚙';
      const dur = durationMs != null ? ` ${durationMs}ms` : '';
      pill.textContent = `${icon} ${tool}${dur}`;
      pills.appendChild(pill);
      this._refreshToolStripHeader(strip);
    }

    _refreshToolStripHeader(strip) {
      const pills = strip.querySelectorAll('[data-role="tool-pills"] .tool-pill');
      const toggle = strip.querySelector('[data-role="tool-toggle"]');
      const n = pills.length;
      const collapsed = strip.classList.contains('collapsed');
      // Sum durations of ✓ / ✗ pills.
      let totalMs = 0;
      let errCount = 0;
      pills.forEach((p) => {
        const m = p.textContent.match(/(\d+)ms/);
        if (m) totalMs += parseInt(m[1], 10);
        if (p.classList.contains('error')) errCount++;
      });
      const summary = errCount
        ? `${n} tool call${n === 1 ? '' : 's'} · ${errCount} error${errCount === 1 ? '' : 's'} · ${totalMs}ms`
        : `${n} tool call${n === 1 ? '' : 's'} · ${totalMs}ms`;
      toggle.innerHTML = `<span class="tool-strip-chevron">${collapsed ? '▸' : '▾'}</span> ${escapeHtml(summary)}`;
    }

    markDone({ chars, tokens }) {
      this._preserveLiveStreamTrail();
      this.clearLiveThinking();
      this._clearStatusQueue();
      this.setStatus('done');
      if (chars) this.charCount = chars;
      if (tokens) this.tokens = tokens;
      this.updateMeta();
      this._renderRunReceipt();
      // Clear any "thinking…" placeholder — the agent is done, no next step.
      const thinkingRow = this.el.querySelector('[data-role="thinking"]');
      if (thinkingRow) thinkingRow.remove();
      const livePill = this.el.querySelector('.agent-active-live');
      if (livePill) {
        livePill.classList.remove('thinking');
        livePill.textContent = 'done';
      }
    }

    _renderRunReceipt() {
      if (this.presentation !== 'rlm') return;
      const body = this.el.querySelector('[data-role="body"]');
      if (!body || body.querySelector('[data-role="run-receipt"]')) return;
      const activities = Array.from(this.toolActivities.values()).filter((activity) => !activity.pending);
      const counts = activities.reduce((acc, activity) => {
        const kind = activity.kind || 'tool';
        acc[kind] = (acc[kind] || 0) + 1;
        return acc;
      }, {});
      const parts = [];
      if (counts.read) parts.push(`${counts.read} ${plural('read', counts.read)}`);
      if (counts.search) parts.push(`${counts.search} ${counts.search === 1 ? 'search' : 'searches'}`);
      if (counts.command) parts.push(`${counts.command} ${plural('command', counts.command)}`);
      if (counts.edit) parts.push(`${counts.edit} ${plural('edit', counts.edit)}`);
      const probes = Math.max(this.steps.length, this.replayStreams.length);
      if (probes) parts.push(`${probes} ${plural('probe', probes)}`);
      if (this.charCount) parts.push(`${formatNum(this.charCount)} chars`);
      const receipt = document.createElement('div');
      receipt.className = 'agent-run-receipt';
      receipt.dataset.role = 'run-receipt';
      receipt.innerHTML = `
        <span class="agent-run-receipt-title">Run complete</span>
        <span class="agent-run-receipt-meta">${escapeHtml(parts.length ? parts.join(' · ') : 'no evidence actions captured')}</span>
      `;
      body.appendChild(receipt);
    }

    _preserveLiveStreamTrail() {
      if (this.presentation !== 'rlm') return;
      const text = String(this.liveResponseText || '').trim();
      const thinking = String(this.liveThinkingFullText || '').trim();
      if (!text && !thinking) return;
      const alreadyCaptured = this.replayStreams.some((entry) => entry.text === text && entry.thinking === thinking);
      if (alreadyCaptured) return;
      const active = this.el.querySelector('[data-role="active"]');
      const toolStrip = active?.querySelector('[data-role="tool-strip"]') || null;
      const row = this.addReplayStreamSummary({
        text,
        thinking,
        eventCount: this.liveResponseEventCount + this.liveThinkingEventCount,
      });
      if (row && toolStrip) {
        const slot = row.querySelector('[data-role="archived-tool-strip"]');
        slot?.appendChild(toolStrip);
      }
    }

    markError(msg, details = {}) {
      this.clearLiveThinking();
      this._clearStatusQueue();
      this.setStatus('error');
      this.error = msg;
      const body = this.el.querySelector('[data-role="body"]');
      const setup = providerSetupForDetails(details, msg);
      const provider = normalizeProviderId(details?.provider || setup?.provider);
      if (setup || providerAcceptsKeys(provider)) {
        const row = document.createElement('div');
        row.innerHTML = renderProviderAccessNotice(provider, setup, msg);
        body.appendChild(row);
      } else {
        this._hideTranscriptEmpty();
        const row = document.createElement('div');
        if (this.presentation === 'rlm') {
          row.className = 'agent-output agent-output-error';
          row.textContent = msg;
          body.appendChild(row);
        } else {
          const stream = this._transcriptStream();
          row.className = 'agent-transcript-error';
          row.textContent = msg;
          stream?.appendChild(row);
        }
      }
      if (this.autoOpenOnError) this.setOpen(true, { silent: true });
    }
  }

  function formatNum(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
    return String(n);
  }

  function extractLiveProbeCode(text) {
    const classified = classifyMixedAgentText(text);
    if (classified.codeBlocks.length) return classified.codeBlocks[classified.codeBlocks.length - 1];
    const raw = String(text || '');
    const fence = raw.match(/```(?:javascript|js)\s*\n([\s\S]*?)(?:```|$)/i);
    if (!fence) return '';
    return fence[1].replace(/\s+$/, '');
  }

  function extractRlmStreamingProbeCode(text) {
    const raw = String(text || '').replace(/\r\n?/g, '\n');
    const blocks = [];
    const jitRe = /<JIT>\s*([\s\S]*?)(?:<\/JIT>|$)/gi;
    let match;
    while ((match = jitRe.exec(raw))) {
      const code = cleanProbeCode(match[1] || '');
      if (looksLikeProbeCode(code)) blocks.push(code);
    }
    const fenceRe = /```(?:javascript|js|typescript|ts)\s*\n([\s\S]*?)(?:```|$)/gi;
    while ((match = fenceRe.exec(raw))) {
      const code = cleanProbeCode(match[1] || '');
      if (looksLikeProbeCode(code)) blocks.push(code);
    }
    return blocks[blocks.length - 1] || '';
  }

  function cleanAnswerArtifacts(text) {
    return String(text || '')
      .replace(/\r\n?/g, '\n')
      .replace(/<ANSWER\b[^>]*>[\s\S]*?<\/ANSWER>/gi, '')
      .replace(/<ANSWER\b[^>]*>[\s\S]*$/i, '')
      .replace(/^\s*<\/?ANSWER\b[^>]*>\s*$/gim, '')
      .replace(/<\/?ANSWER\b[^>]*>/gi, '')
      .trim();
  }

  function cleanJitArtifacts(text) {
    return cleanAnswerArtifacts(text)
      .replace(/\r\n?/g, '\n')
      .replace(/<JIT>[\s\S]*?<\/JIT>/gi, '')
      .replace(/<JIT>[\s\S]*$/gi, '')
      .replace(/^\s*<\/?JIT>\s*$/gim, '')
      .replace(/<\/?JIT>/gi, '')
      .trim();
  }

  function cleanProbeCode(text) {
    const raw = String(text || '').replace(/\r\n?/g, '\n').trim();
    if (!raw) return '';
    const classified = classifyMixedAgentText(raw);
    if (classified.codeBlocks.length === 1 && !classified.prose) return classified.codeBlocks[0];
    return raw
      .replace(/^```(?:javascript|js|typescript|ts)?\s*\n/i, '')
      .replace(/\n```\s*$/i, '')
      .replace(/^(?:"""|'''|```) *(?:javascript|js|typescript|ts)?\s*\n/i, '')
      .replace(/\n(?:"""|'''|```) *$/i, '')
      .trim();
  }

  function codeBlockFingerprint(code) {
    return String(code || '').replace(/\s+/g, ' ').trim();
  }

  function looksLikeProbeCode(code) {
    const clean = String(code || '').trim();
    if (!clean) return false;
    if (/^(?:const|let|var|await|function|class|import|export|return|if|for|while|try|catch|switch)\b/m.test(clean)) return true;
    if (/\b(?:readFile|writeFile|editFile|grep|glob|listFiles|bash|console\.log|SUBMIT|llmQuery|llmQueryBatched)\s*\(/.test(clean)) return true;
    return /[{};]/.test(clean) && clean.split('\n').length >= 2;
  }

  function classifyMixedAgentText(text) {
    const raw = cleanJitArtifacts(text);
    if (!raw) return { prose: '', codeBlocks: [] };
    const lines = raw.split('\n');
    const prose = [];
    const codeBlocks = [];

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const clean = line.trim();
      const start = clean.match(/^(?<fence>```|"""|''')\s*(?<lang>javascript|js|typescript|ts)?\s*$/i);
      if (start) {
        const fence = start.groups?.fence || clean.slice(0, 3);
        const lang = start.groups?.lang || '';
        const block = [];
        i += 1;
        for (; i < lines.length; i++) {
          if (lines[i].trim().startsWith(fence)) break;
          block.push(lines[i]);
        }
        const code = block.join('\n').trim();
        if ((lang || looksLikeProbeCode(code)) && code) {
          codeBlocks.push(cleanProbeCode(code));
        } else if (code) {
          prose.push(clean, ...block);
        }
        continue;
      }
      if (/^\s*<\/?JIT>\s*$/i.test(clean)) continue;
      prose.push(line);
    }

    return {
      prose: normalizeTranscriptText(prose.join('\n')),
      codeBlocks: codeBlocks.map(cleanProbeCode).filter(Boolean),
    };
  }

  function transcriptProseText(text) {
    return classifyMixedAgentText(text).prose;
  }

  function compactReasoningForTranscript(text, maxChars = 560) {
    const prose = transcriptProseText(text);
    if (!prose) return '';
    const paragraphs = prose.split(/\n{2,}/).map((part) => part.trim()).filter(Boolean);
    if (!paragraphs.length) return '';
    const useful = paragraphs.find((part) => /^(?:let me|i(?:'|’)?ll|i need|now|next|so|given|the key|key findings)/i.test(part)) || paragraphs[0];
    const singleLine = useful.replace(/\s+/g, ' ').trim();
    if (singleLine.length <= maxChars) return singleLine;
    return `${singleLine.slice(0, maxChars).replace(/\s+\S*$/, '')}…`;
  }

  function codePeekText(code, maxLines = 4) {
    const lines = cleanProbeCode(code)
      .split('\n')
      .map((line) => line.replace(/\s+$/g, ''))
      .filter((line) => line.trim());
    const selected = lines.filter((line) => !line.trim().startsWith('//')).slice(0, maxLines);
    const fallback = lines.slice(0, maxLines);
    return (selected.length ? selected : fallback).join('\n').trim();
  }

  function renderCodePeekBlock(code) {
    const peek = codePeekText(code);
    if (!peek) return '';
    return `<pre class="agent-code-peek-block"><code>${escapeHtml(peek)}</code></pre>`;
  }

  function classifyAgentStep(entry) {
    const reasoning = classifyMixedAgentText(entry.reasoning || '');
    const codes = [];
    const seen = new Set();
    const addCode = (code) => {
      const clean = cleanProbeCode(code);
      const key = codeBlockFingerprint(clean);
      if (!clean || seen.has(key)) return;
      seen.add(key);
      codes.push(clean);
    };
    addCode(entry.code || '');
    reasoning.codeBlocks.forEach(addCode);
    return {
      reasoning: reasoning.prose,
      code: codes.join('\n\n'),
      output: String(entry.output || '').trim(),
      resultType: entry.resultType || '',
    };
  }

  function truncateBlock(text, opts = {}) {
    const raw = String(text || '').trim();
    const maxChars = opts.maxChars ?? 2400;
    const maxLines = opts.maxLines ?? 60;
    const lines = raw.split('\n');
    let shown = lines.slice(0, maxLines).join('\n');
    if (shown.length > maxChars) shown = shown.slice(0, maxChars);
    const hiddenLines = Math.max(0, lines.length - shown.split('\n').length);
    const hiddenChars = Math.max(0, raw.length - shown.length);
    const truncated = hiddenLines > 0 || hiddenChars > 0;
    const suffix = truncated
      ? `\n…[truncated${hiddenLines ? ` ${hiddenLines} line${hiddenLines === 1 ? '' : 's'}` : ''}${hiddenChars ? `${hiddenLines ? ',' : ''} ${formatNum(hiddenChars)} char${hiddenChars === 1 ? '' : 's'}` : ''}]`
      : '';
    return { shown: shown + suffix, truncated, originalLength: raw.length, originalLines: lines.length };
  }

  function jitSummary(event) {
    const result = event.resultType === 'error' ? 'error' : 'peek';
    const dur = typeof event.durationMs === 'number' ? ` · ${event.durationMs}ms` : '';
    const llm = typeof event.llmCalls === 'number' && event.llmCalls > 0
      ? ` · model call ${event.llmCalls}/${event.llmCallBudget ?? '?'}`
      : '';
    return `Agent ${result}${dur}${llm}`;
  }

  function renderJITBody(event) {
    const code = truncateBlock(event.code || '', { maxChars: 2600, maxLines: 80 });
    const output = truncateBlock(event.output || '(no output)', { maxChars: 3600, maxLines: 80 });
    const result = event.resultType === 'error' ? 'error' : 'output';
    const outputClass = event.resultType === 'error' ? ' error' : '';
    return `
      <div class="agent-jit-history">
        <div class="agent-jit-history-head">
          <span>same-workspace probe</span>
          <span>${escapeHtml(jitSummary(event))}</span>
        </div>
        <div class="agent-jit-history-grid">
          <div class="agent-jit-history-block">
            <div class="agent-code-head">
              <span class="agent-code-title">Probe code</span>
              <span class="agent-code-lang">${formatNum(code.originalLength)} chars · ${code.originalLines} lines</span>
            </div>
            <pre class="agent-jit-code"><code class="language-javascript">${escapeHtml(code.shown)}</code></pre>
          </div>
          <div class="agent-jit-history-block${outputClass}">
            <details class="agent-output-wrap agent-jit-output-wrap${outputClass}">
              <summary class="agent-output-head">
                <span class="agent-code-lang">probe ${result}</span>
                <span class="agent-code-lang">${formatNum(output.originalLength)} chars captured · show</span>
              </summary>
              <pre class="agent-jit-output">${escapeHtml(output.shown)}</pre>
            </details>
          </div>
        </div>
      </div>`;
  }

  function normalizeAgentLog(event = {}) {
    return {
      kind: String(event.kind || 'message'),
      id: String(event.id || '').trim(),
      message: String(event.message || '').trim(),
      tool: String(event.tool || '').trim(),
      reasoning: String(event.reasoning || '').trim(),
      input: String(event.input || '').trim(),
      output: String(event.output || '').trim(),
      error: String(event.error || '').trim(),
      durationMs: typeof event.durationMs === 'number' ? event.durationMs : null,
      ts: event.ts instanceof Date ? event.ts : new Date(),
    };
  }

  function normalizeTranscriptText(text) {
    const raw = String(text || '')
      .replace(/\r\n?/g, '\n')
      .replace(/[\u2028\u2029\u0085]/g, '\n')
      .replace(/\u00a0/g, ' ')
      .replace(/\n{4,}/g, '\n\n\n');
    const repaired = repairFragmentedTranscriptMarkdown(raw);
    return repaired
      .split(/\n{2,}/)
      .map(normalizeTranscriptBlock)
      .filter(Boolean)
      .join('\n\n')
      .trim();
  }

  function repairFragmentedTranscriptMarkdown(text) {
    const lines = String(text || '').split('\n');
    const repaired = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].replace(/[ \t]+$/g, '');
      const clean = line.trim();
      if (!clean) {
        if (repaired[repaired.length - 1] !== '') repaired.push('');
        continue;
      }

      if (/^[-*+]$/.test(clean)) {
        const lookahead = nextNonBlankLine(lines, i + 1);
        if (!lookahead) {
          repaired.push(clean);
          continue;
        }
        if (lookahead.clean === '`') {
          const span = collectInlineCodeFragment(lines, lookahead.index);
          if (span) {
            repaired.push(`${clean} ${span.text}`);
            i = span.nextIndex - 1;
            continue;
          }
        }
        if (isFragmentedPhraseStart(lookahead.clean)) {
          const phrase = collectFragmentedPhrase(lines, lookahead.index);
          if (phrase.items.length) {
            repaired.push(`${clean} ${stitchFragmentedPhraseLines(phrase.items)}`);
            i = phrase.nextIndex - 1;
            continue;
          }
        }
      }

      if (clean === '`') {
        const span = collectInlineCodeFragment(lines, i);
        if (span) {
          repaired.push(span.text);
          i = span.nextIndex - 1;
          continue;
        }
      }

      repaired.push(line);
    }
    return repairFragmentedInlineCodeSpans(repaired.join('\n')).replace(/\n{4,}/g, '\n\n\n');
  }

  function repairFragmentedInlineCodeSpans(text) {
    return String(text || '').replace(/(^|[^`])`(?!`)([\s\S]*?)`(?!`)/g, (match, prefix, body) => {
      if (!body.includes('\n')) return match;
      if (body.includes('\n\n') || body.length > 260) return match;
      const compact = body.split(/\n+/).map((part) => part.trim()).filter(Boolean).join('');
      if (!compact) return match;
      return `${prefix}\`${compact}\``;
    });
  }

  function nextNonBlankLine(lines, start) {
    for (let i = start; i < lines.length; i++) {
      const clean = String(lines[i] || '').trim();
      if (clean) return { index: i, clean };
    }
    return null;
  }

  function collectInlineCodeFragment(lines, start) {
    if (String(lines[start] || '').trim() !== '`') return null;
    const parts = [];
    for (let i = start + 1; i < lines.length; i++) {
      const clean = String(lines[i] || '').trim();
      if (clean === '`') {
        const content = parts.join('').replace(/\s+/g, '');
        return content ? { text: `\`${content}\``, nextIndex: i + 1 } : null;
      }
      if (!clean) continue;
      if (/^[-*+]$/.test(clean)) return null;
      parts.push(clean);
    }
    return null;
  }

  function isFragmentedPhraseStart(line) {
    return Boolean(line)
      && !/^(?:```|#{1,6}\s+|>\s+|\|)/.test(line)
      && !/^[-*+]$/.test(line);
  }

  function collectFragmentedPhrase(lines, start) {
    const items = [];
    let i = start;
    for (; i < lines.length; i++) {
      const clean = String(lines[i] || '').trim();
      if (!clean) break;
      if (clean === '`' || /^[-*+]$/.test(clean) || /^(?:```|#{1,6}\s+|>\s+|\|)/.test(clean)) break;
      if (clean.length > 36 && items.length) break;
      items.push(clean);
      if (clean.length > 36) {
        i += 1;
        break;
      }
    }
    return { items, nextIndex: i };
  }

  function stitchFragmentedPhraseLines(lines) {
    const clean = lines.map((line) => String(line || '').trim()).filter(Boolean);
    if (!clean.length) return '';
    if (looksLikeFilenameFragmentRun(clean)) return clean.join('').replace(/\s+/g, '');
    return stitchTranscriptProseLines(clean).replace(/\b([A-Za-z]{2,5})\s+(metry|metry\b|tion|tions|ment|ments|ing|ings|ness|able|ible)\b/g, '$1$2');
  }

  function looksLikeFilenameFragmentRun(lines) {
    const joined = lines.join('');
    if (/\.(?:md|mdx|txt|json|ya?ml|toml|ts|tsx|js|jsx|rs|go|py|rb|java|kt|swift|c|cc|cpp|h|hpp|css|scss|html)$/i.test(joined)) return true;
    const shortish = lines.filter((line) => line.length <= 6).length / lines.length;
    return lines.length >= 2 && shortish >= 0.8 && /[-_.]/.test(joined) && /^[A-Za-z0-9._-]+$/.test(joined);
  }

  function looksLikeFragmentedTranscriptProse(text) {
    const lines = String(text || '')
      .split(/\n+/)
      .map((line) => line.trim())
      .filter(Boolean);
    if (lines.length < 6) return false;
    const structured = lines.filter((line) => /^(?:```|[-*+]\s+|\d+[.)]\s+|#{1,6}\s+|>\s+|\|)/.test(line)).length;
    if (structured && structured / lines.length > 0.35) return false;
    const codeish = lines.filter((line) => /^(?:const|let|var|function|class|import|export|return|if|for|while|try|catch|switch)\b/.test(line) || /[{};]/.test(line)).length;
    if (codeish >= 2) return false;
    const shortLines = lines.filter((line) => line.length <= 18).length;
    const wordishLines = lines.filter((line) => /^[\w'’./-]+[,.;:!?%)]?$/.test(line)).length;
    const proseLineRatio = (wordishLines + structured) / lines.length;
    return shortLines / lines.length >= 0.6 && proseLineRatio >= 0.68;
  }

  function normalizeTranscriptBlock(block) {
    const lines = String(block || '')
      .split('\n')
      .map((line) => line.replace(/[ \t]+$/g, ''))
      .filter((line) => line.trim().length > 0);
    if (!lines.length) return '';
    return normalizeTranscriptLines(lines);
  }

  function normalizeTranscriptLines(lines) {
    const output = [];
    let prose = [];
    const codeishCount = lines.filter((line) => isCodeishTranscriptLine(line.trim())).length;
    const flushProse = () => {
      if (!prose.length) return;
      output.push(stitchTranscriptProseLines(prose));
      prose = [];
    };

    for (const line of lines) {
      const clean = line.trim();
      if (isStructuredTranscriptLine(clean) || (codeishCount >= 2 && isCodeishTranscriptLine(clean))) {
        flushProse();
        output.push(clean);
      } else {
        prose.push(clean);
      }
    }
    flushProse();
    return output.join('\n').trim();
  }

  function isStructuredTranscriptLine(line) {
    return /^(?:```|[-*+]\s+|\d+[.)]\s+|#{1,6}\s+|>\s+|\|)/.test(String(line || '').trim());
  }

  function isCodeishTranscriptLine(line) {
    const clean = String(line || '').trim();
    return /^(?:const|let|var|function|class|import|export|return|if|for|while|try|catch|switch)\b/.test(clean)
      || /[{};]/.test(clean);
  }

  function stitchTranscriptProseLines(lines) {
    let text = '';
    for (const line of lines) {
      if (!text) {
        text = line;
      } else if (/^[,.;:!?%)]/.test(line)) {
        text += line;
      } else if (/^[-/]\S/.test(line) && /[A-Za-z0-9]$/.test(text)) {
        text += line;
      } else {
        text += ` ${line}`;
      }
    }
    return text
      .replace(/\s+([,.;:!?%])/g, '$1')
      .replace(/([([{])\s+/g, '$1')
      .replace(/\s+([)\]}])/g, '$1')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  function renderTranscriptText(text) {
    const normalized = normalizeTranscriptText(text);
    if (!normalized) return '';
    const safe = escapeHtml(normalized);
    return safe
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\n{2,}/g, '</p><p>')
      .replace(/\n/g, '<br>')
      .replace(/^([\s\S]*)$/, '<p>$1</p>');
  }

  function renderAgentProse(text) {
    return renderTranscriptText(transcriptProseText(text));
  }

  function renderInlineCode(text) {
    return escapeHtml(String(text || '')).replace(/`([^`\n]+)`/g, '<code>$1</code>');
  }

  function shouldShowTranscriptStatus(message) {
    const clean = String(message || '').trim();
    if (!clean) return false;
    return !/^(starting agent|starting local agent|agent ready|opening websocket|connecting|waiting for response|streaming|retrying\b|thinking\b|thought for\b)/i.test(clean);
  }

  function agentCardHasVisibleTranscript(card) {
    if (!card) return false;
    if ((card.steps?.length || 0) > 0) return true;
    if ((card.activityGroups || []).some((group) => group?.items?.length)) return true;
    const stream = typeof card._transcriptStream === 'function' ? card._transcriptStream() : null;
    return Boolean(stream?.childElementCount);
  }

  function visibleAgentStartupStatus(message, card) {
    const clean = String(message || '').replace(/\s+/g, ' ').trim();
    if (!clean) return '';
    if (shouldShowTranscriptStatus(clean)) return clean;
    if (agentCardHasVisibleTranscript(card)) return '';
    if (/^starting (?:local )?agent\b/i.test(clean)) return 'Starting local agent';
    if (/^agent ready\b/i.test(clean)) return clean;
    if (/^opening websocket\b/i.test(clean)) return 'Opening agent stream';
    if (/^connecting\b/i.test(clean)) return 'Connecting to model';
    if (/^waiting for response\b/i.test(clean)) return 'Waiting for model response';
    if (/^streaming\b/i.test(clean)) return 'Streaming model response';
    if (/^retrying\b/i.test(clean)) return clean;
    return '';
  }

  function parseToolInput(input) {
    const raw = String(input || '').trim();
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch {
      return null;
    }
  }

  function classifyToolActivity(tool, input, output = '') {
    const name = String(tool || 'tool');
    const lower = name.toLowerCase();
    const parsed = parseToolInput(input);
    const text = typeof input === 'string' ? input.trim() : '';
    const command = parsed?.cmd || parsed?.command || parsed?.script || parsed?.argv?.join?.(' ') || '';
    const query = parsed?.query || parsed?.pattern || parsed?.glob || parsed?.regex || '';
    const path = parsed?.path
      || parsed?.file
      || parsed?.filepath
      || parsed?.file_path
      || parsed?.filePath
      || parsed?.absolute_path
      || parsed?.absolutePath
      || parsed?.relative_path
      || parsed?.relativePath
      || parsed?.notebook_path
      || parsed?.notebookPath
      || parsed?.uri
      || parsed?.url
      || parsed?.cwd
      || parsed?.directory
      || '';
    const content = command || query || path || text;
    const isReadTool = /(read|open|cat|view|show|get[_-]?file|read[_-]?file)/i.test(lower);

    if (/(bash|shell|terminal|exec|command)/i.test(lower) || command) {
      const readTarget = pathFromReadCommand(command);
      if (readTarget) {
        return {
          kind: 'read',
          summary: truncatePath(readTarget),
        };
      }
      return {
        kind: 'command',
        summary: command ? truncateMid(command, 130) : name,
      };
    }
    if (/(grep|search|rg|find|glob)/i.test(lower) || query) {
      const target = query ? `for ${truncateMid(query, 80)}` : '';
      const scope = path ? `in ${truncatePath(String(path))}` : '';
      return {
        kind: 'search',
        summary: [target, scope].filter(Boolean).join(' ') || name,
      };
    }
    if (isReadTool) {
      return {
        kind: 'read',
        path: path ? String(path) : '',
        summary: path ? truncatePath(String(path)) : (content && content !== '{}' ? truncateMid(String(content).replace(/\s+/g, ' '), 110) : 'file'),
        pending: !path && (!content || content === '{}'),
      };
    }
    if (/(list|ls|tree)/i.test(lower) || path) {
      return {
        kind: 'file',
        path: path ? String(path) : '',
        summary: path ? truncatePath(String(path)) : name,
      };
    }
    if (/(write|edit|patch|apply|multi[_-]?edit|replace)/i.test(lower)) {
      const delta = editLineDelta(parsed, input, output);
      const deltaLabel = delta ? ` ${delta}` : '';
      return {
        kind: 'edit',
        path: path ? String(path) : '',
        summary: `${path ? truncatePath(String(path)) : 'file'}${deltaLabel}`,
        pending: !path && !delta,
      };
    }
    return {
      kind: 'tool',
      summary: content ? `${name} ${truncateMid(String(content).replace(/\s+/g, ' '), 100)}` : name,
    };
  }

  function compactLiveIntentText(text) {
    const prose = transcriptProseText(text);
    const paragraphs = (prose || String(text || ''))
      .split(/\n{2,}/)
      .map((part) => part.replace(/\s+/g, ' ').trim())
      .filter(Boolean);
    const intentPattern = /^(?:i(?:'|’)?m|i am|i(?:'|’)?ll|i will|i need|now|next|okay|given|since|the plan|my plan|i have|i found|i(?:'|’)?ve|i’m)/i;
    const useful = paragraphs.filter((part) => intentPattern.test(part)).pop() || paragraphs[paragraphs.length - 1] || '';
    const clean = useful.replace(/\s+/g, ' ').trim();
    if (!clean) return '';
    return clean.length > 560 ? `${clean.slice(-560).replace(/^\S+\s+/, '')}` : clean;
  }

  function escapeClassName(value) {
    return String(value || 'tool').replace(/[^a-z0-9_-]+/gi, '-').toLowerCase();
  }

  function summarizeProbeCode(code) {
    const clean = cleanProbeCode(code);
    if (!clean) return 'sandbox probe';
    const calls = Array.from(clean.matchAll(/\b(readFileRange|readFile|rg|grep|glob|listFiles|llmQuery|llmQueryBatched|experiment|bash)\s*\(([^)]{0,140})/g));
    const call = calls[0];
    if (!call) {
      const firstLine = clean.split('\n').find((line) => line.trim() && !line.trim().startsWith('//')) || 'JavaScript probe';
      return truncateMid(firstLine.trim(), 120);
    }
    const tool = call[1];
    const arg = call[2].replace(/["'`]/g, '').replace(/\s+/g, ' ').trim();
    if (tool === 'readFile' || tool === 'readFileRange') return `reads ${truncatePath(arg || 'file')}`;
    if (tool === 'rg' || tool === 'grep') return `searches ${truncateMid(arg || 'repository', 70)}`;
    if (tool === 'glob' || tool === 'listFiles') return 'maps repository files';
    if (tool === 'llmQuery' || tool === 'llmQueryBatched') return 'asks a sub-model';
    if (tool === 'bash') return 'runs a shell probe';
    return `runs ${tool}`;
  }

  function classifyRlmOperation(activity, log) {
    const tool = String(activity.tool || log.tool || 'tool');
    const lower = tool.toLowerCase();
    const input = activity.input || log.input || '';
    const output = activity.output || log.output || '';
    const error = activity.error || log.error || '';
    if (/^(jit|experiment)$/i.test(tool) || looksLikeProbeCode(input)) {
      const code = looksLikeProbeCode(input) ? cleanProbeCode(input) : '';
      const summary = error
        ? `Probe failed${activity.durationMs != null ? ` after ${activity.durationMs}ms` : ''}`
        : output
          ? `Probe returned ${formatNum(output.length)} chars${activity.durationMs != null ? ` in ${activity.durationMs}ms` : ''}`
          : `Writing probe.js · ${summarizeProbeCode(code || input)}`;
      return { kind: 'probe', summary, code, error };
    }
    if (/llmquery|model|sub-?llm/i.test(lower)) {
      return {
        kind: 'model',
        summary: output
          ? `Model call returned ${formatNum(output.length)} chars`
          : 'Asking model for synthesis',
        error,
      };
    }
    const classified = classifyToolActivity(tool, input, output || error);
    return {
      ...classified,
      summary: classified.summary || tool,
      error,
    };
  }

  function rlmOperationVerb(op) {
    if (op.error) return 'Failed';
    if (op.pending) return 'Running';
    switch (op.kind) {
      case 'read': return 'Read';
      case 'search': return 'Searched';
      case 'command': return 'Ran';
      case 'edit': return 'Edited';
      case 'file': return 'Opened';
      case 'probe': return 'Probed';
      case 'model': return 'Asked';
      case 'status': return 'Status';
      default: return 'Used';
    }
  }

  function renderRlmOperation(op) {
    const mark = op.error ? '!' : op.pending ? '...' : '✓';
    const duration = typeof op.durationMs === 'number' ? `${op.durationMs}ms` : '';
    return `
      <span class="agent-rlm-op-mark">${escapeHtml(mark)}</span>
      <span class="agent-rlm-op-verb">${escapeHtml(rlmOperationVerb(op))}</span>
      <span class="agent-rlm-op-text">${renderInlineCode(op.summary || op.tool || 'tool')}</span>
      <span class="agent-rlm-op-duration">${escapeHtml(duration)}</span>
    `;
  }

  function pathFromReadCommand(command) {
    const raw = String(command || '').trim();
    if (!raw) return '';
    const segment = firstShellCommandSegment(raw);
    if (!/^\s*(?:cat|bat|less|more|head|tail|sed)\b/i.test(segment)) return '';
    const quoted = segment.match(/^\s*(?:cat|bat|less|more|head|tail)\b[\s\S]*?["']([^"']+)["']/i);
    if (quoted?.[1]) return quoted[1];
    const sed = segment.match(/^\s*sed\s+-n\s+['"]?[^'"\s]+['"]?\s+([^\s|;&]+)$/i);
    if (sed?.[1]) return normalizeReadCommandPathToken(sed[1]);
    const tokens = shellWords(segment);
    if (!tokens.length) return '';
    const tool = tokens[0].toLowerCase();
    if (!['cat', 'bat', 'less', 'more', 'head', 'tail'].includes(tool)) return '';
    for (let i = tokens.length - 1; i >= 1; i -= 1) {
      const candidate = normalizeReadCommandPathToken(tokens[i]);
      if (candidate) return candidate;
    }
    return '';
  }

  function firstShellCommandSegment(command) {
    const raw = String(command || '');
    let quote = '';
    for (let i = 0; i < raw.length; i += 1) {
      const ch = raw[i];
      if (quote) {
        if (ch === quote && raw[i - 1] !== '\\') quote = '';
        continue;
      }
      if (ch === '"' || ch === "'") {
        quote = ch;
        continue;
      }
      if (ch === '|' || ch === ';') return raw.slice(0, i).trim();
      if (ch === '&' && raw[i + 1] === '&') return raw.slice(0, i).trim();
    }
    return raw.trim();
  }

  function shellWords(segment) {
    const words = [];
    let current = '';
    let quote = '';
    const raw = String(segment || '');
    for (let i = 0; i < raw.length; i += 1) {
      const ch = raw[i];
      if (quote) {
        if (ch === quote && raw[i - 1] !== '\\') quote = '';
        else current += ch;
        continue;
      }
      if (ch === '"' || ch === "'") {
        quote = ch;
        continue;
      }
      if (/\s/.test(ch)) {
        if (current) {
          words.push(current);
          current = '';
        }
        continue;
      }
      current += ch;
    }
    if (current) words.push(current);
    return words;
  }

  function normalizeReadCommandPathToken(token) {
    const clean = String(token || '').replace(/^['"]|['"]$/g, '').trim();
    if (!clean || clean === '--' || clean === '-') return '';
    if (/^-\d+$/.test(clean)) return '';
    if (/^-[A-Za-z]/.test(clean)) return '';
    if (/^[<>]/.test(clean)) return '';
    return clean;
  }

  function editLineDelta(parsed, input = '', output = '') {
    const diffText = [
      parsed?.diff,
      parsed?.patch,
      parsed?.unified_diff,
      parsed?.unifiedDiff,
      output,
      typeof input === 'string' ? input : '',
    ].filter(Boolean).join('\n');
    const patchDelta = countPatchDelta(diffText);
    if (patchDelta) return formatLineDelta(patchDelta);

    const edits = Array.isArray(parsed?.edits)
      ? parsed.edits.map((item) => parseToolInput(JSON.stringify(item)) || item)
      : [parsed].filter(Boolean);
    let plus = 0;
    let minus = 0;
    for (const edit of edits) {
      const before = stringish(edit?.old_string ?? edit?.oldString ?? edit?.old ?? edit?.before ?? edit?.from);
      const after = stringish(edit?.new_string ?? edit?.newString ?? edit?.new ?? edit?.after ?? edit?.to ?? edit?.replacement);
      if (before || after) {
        minus += countTextLines(before);
        plus += countTextLines(after);
      }
    }
    const writeContent = stringish(parsed?.content ?? parsed?.text ?? parsed?.body);
    if (!plus && !minus && writeContent) plus = countTextLines(writeContent);
    if (!plus && !minus) return '';
    return formatLineDelta({ plus, minus });
  }

  function stringish(value) {
    return typeof value === 'string' ? value : '';
  }

  function countTextLines(text) {
    const clean = String(text || '');
    if (!clean) return 0;
    return clean.replace(/\r\n?/g, '\n').split('\n').length;
  }

  function countPatchDelta(text) {
    const raw = String(text || '');
    if (!raw.trim()) return null;
    const compact = raw.match(/(?:^|\s)\+(\d+)\s+-([0-9]+)/);
    if (compact) return { plus: Number(compact[1]), minus: Number(compact[2]) };
    const words = raw.match(/(\d+)\s+addition(?:s)?(?:,?\s+(\d+)\s+deletion(?:s)?)?/i);
    if (words) return { plus: Number(words[1]), minus: Number(words[2] || 0) };
    const gitWords = raw.match(/(\d+)\s+insertion(?:s)?\(\+\)(?:,?\s+(\d+)\s+deletion(?:s)?\(-\))?/i);
    if (gitWords) return { plus: Number(gitWords[1]), minus: Number(gitWords[2] || 0) };
    const lineWords = raw.match(/(\d+)\s+line(?:s)?\s+(?:added|inserted)(?:,?\s+(\d+)\s+line(?:s)?\s+(?:removed|deleted))?/i);
    if (lineWords) return { plus: Number(lineWords[1]), minus: Number(lineWords[2] || 0) };
    let plus = 0;
    let minus = 0;
    for (const line of raw.split(/\r?\n/)) {
      if (line.startsWith('+++') || line.startsWith('---')) continue;
      if (line.startsWith('+')) plus += 1;
      else if (line.startsWith('-')) minus += 1;
    }
    return plus || minus ? { plus, minus } : null;
  }

  function formatLineDelta(delta) {
    const plus = Math.max(0, Number(delta?.plus || 0));
    const minus = Math.max(0, Number(delta?.minus || 0));
    return `+${plus} -${minus}`;
  }

  function editLineDeltaLabel(edit) {
    const plus = Number(edit?.additions ?? edit?.plus ?? 0);
    const minus = Number(edit?.deletions ?? edit?.minus ?? 0);
    if (!Number.isFinite(plus) && !Number.isFinite(minus)) return '';
    if (!plus && !minus) return '';
    return formatLineDelta({ plus, minus });
  }

  function activityVerb(activity) {
    if (activity.error) return 'Failed';
    switch (activity.kind) {
      case 'command': return 'Ran';
      case 'search': return 'Searched';
      case 'read': return 'Read';
      case 'file': return 'Explored';
      case 'edit': return 'Edited';
      default: return 'Used';
    }
  }

  function summarizeActivityGroup(items) {
    const counts = items.reduce((acc, item) => {
      acc[item.kind || 'tool'] = (acc[item.kind || 'tool'] || 0) + 1;
      return acc;
    }, {});
    const parts = [];
    if (counts.read) parts.push(`read ${counts.read} ${plural('file', counts.read)}`);
    if (counts.file) parts.push(`explored ${counts.file} ${plural('file', counts.file)}`);
    if (counts.search) parts.push(`${counts.search} ${plural('search', counts.search)}`);
    if (counts.command) parts.push(`ran ${counts.command} ${plural('command', counts.command)}`);
    if (counts.edit) parts.push(`edited ${counts.edit} ${plural('file', counts.edit)}`);
    const other = Object.entries(counts)
      .filter(([kind]) => !['read', 'file', 'search', 'command', 'edit'].includes(kind))
      .reduce((sum, [, value]) => sum + value, 0);
    if (other) parts.push(`used ${other} ${plural('tool', other)}`);
    const text = parts.length ? parts.join(', ') : 'worked';
    return capitalize(text);
  }

  function plural(word, count) {
    return count === 1 ? word : `${word}s`;
  }

  function capitalize(text) {
    return String(text || '').replace(/^\w/, (ch) => ch.toUpperCase());
  }

  function agentLogKindClass(kind) {
    return `agent-log-${String(kind || 'message').replace(/[^a-z0-9_-]+/gi, '-').toLowerCase()}`;
  }

  function agentLogLabel(kind) {
    switch (kind) {
      case 'reasoning': return 'think';
      case 'tool-input': return 'input';
      case 'tool-output': return 'result';
      case 'tool-error': return 'error';
      case 'tool': return 'tool';
      case 'status': return 'state';
      default: return 'log';
    }
  }

  function agentLogTitle(log) {
    const label = agentLogLabel(log.kind);
    return log.tool ? `${label} · ${log.tool}` : label;
  }

  function agentLogSummary(input) {
    const log = normalizeAgentLog(input);
    if (log.kind === 'reasoning') {
      const source = log.message || log.reasoning;
      return source ? `Reasoning · ${truncateMid(source.replace(/\s+/g, ' '), 96)}` : 'Reasoning captured';
    }
    if (log.kind === 'tool-input') {
      const size = log.input ? ` · ${formatNum(log.input.length)} chars` : '';
      return `${log.tool || 'tool'} input${size}`;
    }
    if (log.kind === 'tool-output') {
      const size = log.output ? ` · ${formatNum(log.output.length)} chars` : '';
      return `${log.tool || 'tool'} finished${log.durationMs != null ? ` · ${log.durationMs}ms` : ''}${size}`;
    }
    if (log.kind === 'tool-error') {
      return `${log.tool || 'tool'} failed${log.durationMs != null ? ` · ${log.durationMs}ms` : ''}`;
    }
    return log.message || (log.tool ? `Using ${log.tool}` : 'Agent log');
  }

  function renderAgentLogBody(input) {
    const log = normalizeAgentLog(input);
    const blocks = [];
    if (log.message) {
      blocks.push(`<div class="agent-log-message">${renderAgentProse(log.message)}</div>`);
    }
    if (log.reasoning) {
      blocks.push(`
        <div class="agent-reasoning-panel agent-log-reasoning">
          <div class="agent-side-label">${escapeHtml(currentChannelLabel())} reasoning</div>
          <div class="agent-reasoning">${renderAgentProse(log.reasoning)}</div>
        </div>
      `);
    }
    if (log.input) {
      const inputBlock = truncateBlock(log.input, { maxChars: 5000, maxLines: 120 });
      blocks.push(`
        <details class="agent-output-wrap agent-log-block" open>
          <summary class="agent-output-head">
            <span class="agent-code-lang">tool input</span>
            <span class="agent-code-lang">${formatNum(log.input.length)} chars · show</span>
          </summary>
          <pre class="agent-output">${escapeHtml(inputBlock.shown)}</pre>
        </details>
      `);
    }
    if (log.output) {
      const outputBlock = truncateBlock(log.output, { maxChars: 5000, maxLines: 120 });
      blocks.push(`
        <details class="agent-output-wrap agent-log-block">
          <summary class="agent-output-head">
            <span class="agent-code-lang">tool output</span>
            <span class="agent-code-lang">${formatNum(log.output.length)} chars · show</span>
          </summary>
          <pre class="agent-output">${escapeHtml(outputBlock.shown)}</pre>
        </details>
      `);
    }
    if (log.error) {
      const errorBlock = truncateBlock(log.error, { maxChars: 3000, maxLines: 80 });
      blocks.push(`
        <details class="agent-output-wrap agent-log-block error" open>
          <summary class="agent-output-head">
            <span class="agent-code-lang">tool error</span>
            <span class="agent-code-lang">${formatNum(log.error.length)} chars</span>
          </summary>
          <pre class="agent-output">${escapeHtml(errorBlock.shown)}</pre>
        </details>
      `);
    }
    return `<div class="agent-log-body">${blocks.join('')}</div>`;
  }

  // Render the full body of an agent step. Code is the primary artifact:
  // it is the probe the agent wrote to understand the repo. Reasoning and
  // output remain available, but quieter.
  function renderStepBody(entry, opts = { historical: false }) {
    const classified = classifyAgentStep(entry);
    const reasoningTxt = classified.reasoning;
    const codeTxt = classified.code;
    const outputTxt = classified.output;
    const channelLabel = opts.channelLabel || currentChannelLabel();
    const unitName = opts.unitName || 'step';

    const reasoningPreview = compactReasoningForTranscript(reasoningTxt, 220);
    const reasoningBlock = reasoningTxt
      ? `<details class="agent-reasoning-panel agent-reasoning-disclosure">
           <summary class="agent-reasoning-summary">
             <span class="agent-side-label">${escapeHtml(channelLabel)} note</span>
             <span class="agent-reasoning-preview">${escapeHtml(reasoningPreview || 'Reasoning captured')}</span>
           </summary>
           <div class="agent-reasoning">${renderAgentProse(reasoningTxt)}</div>
         </details>`
      : '';
    const codePreview = codeTxt.split('\n').map((line) => line.trim()).find((line) => line && !line.startsWith('//')) || 'JavaScript probe';
    const codeBlock = codeTxt
      ? `<details class="agent-code-wrap agent-code-disclosure">
           <summary class="agent-code-head agent-code-summary">
             <span class="agent-code-head-main">
               <span class="agent-code-title">${unitName === 'probe' ? 'Exploration code' : 'Wrote probe code'}</span>
               <span class="agent-code-peek">${escapeHtml(truncateMid(codePreview, 120))}</span>
               ${renderCodePeekBlock(codeTxt)}
             </span>
             <span class="agent-code-lang">JS · ${escapeHtml(unitName)} ${entry.step} · ${codeTxt.split('\n').length} lines · show code</span>
           </summary>
           <pre class="agent-code"><code class="language-javascript">${escapeHtml(codeTxt)}</code></pre>
         </details>`
      : '';
    let outputBlock = '';
    if (entry.resultType === 'submit') {
      outputBlock = `<div class="agent-submit-pill">✓ submit · answer captured</div>`;
    } else if (outputTxt && outputTxt !== '(submitted)') {
      const isError = entry.resultType === 'error';
      const cap = opts.historical ? 5000 : 900;
      const lineCap = opts.historical ? 80 : 10;
      const lineLimited = outputTxt.split('\n').slice(0, lineCap).join('\n');
      const shown = lineLimited.slice(0, cap);
      const more = outputTxt.length > shown.length ? '\n…' : '';
      const label = isError ? 'error' : 'output';
      outputBlock = `
        <details class="agent-output-wrap${isError ? ' error' : ''}"${isError ? ' open' : ''}>
          <summary class="agent-output-head">
            <span class="agent-code-lang">${label} evidence</span>
            <span class="agent-code-lang">${formatNum(outputTxt.length)} char${outputTxt.length === 1 ? '' : 's'} captured · show</span>
          </summary>
          <pre class="agent-output">${escapeHtml(shown)}${more}</pre>
        </details>`;
    }
    return `<div class="agent-step-body">${codeBlock}${reasoningBlock}${outputBlock}</div>`;
  }

  // One-line summary of an agent step — used in the trail so users can still
  // trace history at a glance.  Prefers the first `await toolCall(...)`
  // expression; falls back to the first reasoning sentence.
  function summarizeEntry(entry) {
    const classified = classifyAgentStep(entry);
    const code = classified.code;
    if (entry.resultType === 'submit') return 'Answer captured';
    if (code) {
      const toolCall = code.match(/(?:await\s+)?(\w+)\s*\(([^)]{0,120})\)/);
      if (toolCall) {
        const name = toolCall[1];
        const arg = toolCall[2].trim().replace(/\s+/g, ' ');
        return `${name}(${arg.slice(0, 80)}${arg.length > 80 ? '…' : ''})`;
      }
      const firstLine = code.split('\n').find((l) => l.trim() && !l.trim().startsWith('//'));
      if (firstLine) return firstLine.trim().slice(0, 120);
    }
    const reasoning = classified.reasoning;
    if (reasoning) {
      const firstSentence = reasoning.split(/[.\n]/)[0].trim();
      return firstSentence.slice(0, 140);
    }
    return '(no content)';
  }

  // Map a backend agent event to a human-readable one-liner for the phase rail.
  // The raw events say things like "phase: index, message: Building repo index..."
  // which is noise to users; this turns them into "Scanning source tree", etc.
  function friendlyStatusFor(event) {
    if (!event) return null;
    if (event.type === 'status') {
      const phase = (event.phase || '').toLowerCase();
      const msg = event.message || '';
      if (phase === 'load') return msg.includes('Repo') ? 'Fetched repo' : 'Cloning repo…';
      if (phase === 'index') return msg.includes('files') ? msg.replace('Index: ', 'Scanned ') : 'Scanning source tree…';
      if (phase === 'sandbox') return 'Booting sandbox…';
      if (phase === 'session') return 'Session started';
      if (phase === 'jcode') {
        if (/starting/i.test(msg)) return 'Starting local agent…';
        if (/ready/i.test(msg)) return msg.replace(/\bJCODE agent\b/gi, 'Agent').replace(/\bJCODE\b/gi, 'agent');
        return msg.replace(/\bJCODE\b/gi, 'agent');
      }
      if (phase === 'tool') return msg.replace(/^JCODE running\s+/i, 'Using ');
      if (phase === 'loop') return 'Thinking…';
      if (phase === 'mode') return null; // skip — implementation detail
      return msg;
    }
    if (event.type === 'step') {
      const code = (event.code || '').trim();
      const firstCall = code.match(/(?:await\s+)?(readFile|writeFile|editFile|glob|grep|listFiles|llmQuery|llmQueryBatched|bash|gitLog|graphifyQuery)\s*\(([^)]{0,80})/);
      if (firstCall) {
        const tool = firstCall[1];
        const arg = firstCall[2].replace(/["'`]/g, '').trim();
        switch (tool) {
          case 'readFile':  return `Reading ${truncatePath(arg)}`;
          case 'writeFile': return `Writing ${truncatePath(arg)}`;
          case 'editFile':  return `Editing ${truncatePath(arg)}`;
          case 'glob':      return `Searching ${truncatePath(arg)}`;
          case 'grep':      return `Grepping "${truncateMid(arg, 30)}"`;
          case 'listFiles': return 'Listing files';
          case 'llmQuery':  return 'Asking sub-LLM to analyse code';
          case 'llmQueryBatched': return 'Summarising files in parallel';
          case 'bash':      return `Running shell command`;
          case 'gitLog':    return 'Reading git history';
          default:          return `Calling ${tool}(…)`;
        }
      }
      if (event.resultType === 'submit') return 'Finalising…';
      return `Step ${event.step}`;
    }
    return null;
  }
  function truncatePath(p) {
    if (p.length <= 36) return p;
    const parts = p.split('/');
    if (parts.length <= 2) return '…' + p.slice(-34);
    return parts[0] + '/…/' + parts[parts.length - 1];
  }
  function truncateMid(s, n) {
    if (s.length <= n) return s;
    return s.slice(0, Math.max(4, n - 1)) + '…';
  }
  function formatElapsed(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    return `${m}m ${s % 60}s`;
  }

  // Ambient video URLs — CloudFront-cached MP4s (~15 MB each), used as a
  // backdrop during generation so users have something calm to look at
  // while the model works. Structure video plays during the planning phase;
  // pages video plays during the page-writing phase. Both swap via opacity.
  const AMBIENT_VIDEO_STRUCTURE = "https://ipfs.asyncfunc.ai/ipfs/bafybeiewdtdtn3yh6nl4yd4mdmstc54qmrqc7k5msyadfxm6q55bqwjvba";
  const AMBIENT_VIDEO_PAGES     = "https://ipfs.asyncfunc.ai/ipfs/bafybeibuil4xnubfyfmudpuwfebgsrv5meajr4ld52tdzmguy6eu37njn4";

  function startGenerate(url, options = {}) {
    const urls = Array.isArray(url)
      ? url.map((item) => String(item || '').trim()).filter(Boolean)
      : String(url || '').split(/[\n,]+/).map((item) => item.trim()).filter(Boolean);
    const primaryUrl = urls[0] || '';
    const urlLabel = urls.length > 1 ? `${urls.length} repositories` : primaryUrl;
    const resumeRunId = options.resumeRunId || '';
    const wikiPageCount = normalizeWikiPageCount(options.pageCount, defaultWikiPageCountForDepth(options.depth));
    const wikiDepth = wikiDepthForPageCount(wikiPageCount);
    const wikiStyle = normalizeWikiStyle(options.style);
    const wikiStylePrompt = wikiStyle === 'custom' ? normalizeWikiStylePrompt(options.stylePrompt) : '';
    const wikiRuntime = normalizeRuntime(options.runtime || selectedWikiRuntime, 'rlm');
    let structureChannelId = channelIdOrDefault(options.structureChannel || selectedWikiStructureChannelId || selectedChannelId);
    let pageChannelId = channelIdOrDefault(options.pageChannel || selectedWikiPageChannelId || selectedChannelId);
    const box = document.getElementById('progress-box');
    if (!box) return;
    box.innerHTML = `
      <div class="progress">
        <div class="progress-header">
          <div class="progress-title"><span class="dot-pulse"></span>${escapeHtml(runtimeLabel(wikiRuntime))} · ${escapeHtml(wikiPageCountLabel(wikiPageCount))} for ${escapeHtml(urlLabel)}</div>
          <div class="progress-meta" id="progress-meta">starting…</div>
        </div>

        <div class="wiki-background-cue" id="wiki-background-cue" hidden aria-live="polite">
          <span class="wiki-background-dot" aria-hidden="true"></span>
          <span class="wiki-background-copy">
            <strong>Running in background</strong>
            <span>Safe to leave this screen.</span>
          </span>
          <button class="wiki-background-action" id="wiki-background-later" type="button">Check later</button>
        </div>

        <div class="phase-rail" id="phase-rail">
          <div class="phase-cell active" data-phase="structure">
            <video class="phase-cell-video" data-role="pv-structure"
                   src="${AMBIENT_VIDEO_STRUCTURE}"
                   autoplay loop muted playsinline preload="metadata"></video>
            <div class="phase-cell-scrim"></div>
            <span class="phase-num" id="phase-num-1">1</span>
            <div class="phase-cell-body">
              <span class="phase-label">Planning the ${wikiDepth === 'fast' ? 'fast' : wikiDepth === 'regular' ? 'regular' : 'deep'} wiki</span>
              <span class="phase-sub" id="phase-sub-1">Exploring ${urls.length > 1 ? 'the repositories' : 'the repository'} to decide sections &amp; pages…</span>
            </div>
            <div class="phase-arrow"></div>
          </div>
          <div class="phase-cell pending" data-phase="pages">
            <video class="phase-cell-video" data-role="pv-pages"
                   src="${AMBIENT_VIDEO_PAGES}"
                   loop muted playsinline preload="none"></video>
            <div class="phase-cell-scrim"></div>
            <span class="phase-num" id="phase-num-2">2</span>
            <div class="phase-cell-body">
              <span class="phase-label">Writing pages</span>
              <span class="phase-sub" id="phase-sub-2">${escapeHtml(wikiStyleLabel(wikiStyle))} format waits for the plan</span>
            </div>
          </div>
        </div>

        <div class="phase-explainer" id="phase-explainer">
          A <strong>structure agent</strong> is reading ${urls.length > 1 ? 'the repos' : 'the repo'} — README, file tree, and the most interesting source files — so it can design a <strong>${escapeHtml(wikiPageCountLabel(wikiPageCount).toLowerCase())}</strong> table of contents. Once it submits the plan, page agents run in parallel to write the <strong>${escapeHtml(wikiStyleLabel(wikiStyle).toLowerCase())}</strong> markdown.
        </div>

        <div class="timeline" id="timeline">
          <div class="tl-milestone queued" id="tl-m1" data-milestone="structure">
            <div class="tl-milestone-head">
              <span class="tl-status-icon"></span>
              <span class="tl-title">Plan the wiki structure</span>
              <span class="tl-meta" data-role="m1-meta">queued</span>
            </div>
            <div class="tl-body" id="tl-m1-body"></div>
          </div>
          <div class="tl-milestone queued" id="tl-m2" data-milestone="pages">
            <div class="tl-milestone-head">
              <span class="tl-status-icon"></span>
              <span class="tl-title" data-role="m2-title">Write pages in parallel</span>
              <span class="tl-meta" data-role="m2-meta">queued</span>
            </div>
            <div class="tl-body" id="tl-m2-body">
              <div class="tl-pagegrid" id="agents-container"></div>
              <div id="queued-skeleton" style="margin-top: 8px"></div>
            </div>
          </div>
        </div>

        <div id="run-error" style="display:none"></div>
      </div>
    `;
    document.getElementById('topbar-status').textContent = 'generating';
    const container = document.getElementById('agents-container');
    const skeletonBox = document.getElementById('queued-skeleton');
    const progressMeta = document.getElementById('progress-meta');
    const explainer = document.getElementById('phase-explainer');
    const backgroundCue = document.getElementById('wiki-background-cue');
    const backgroundLater = document.getElementById('wiki-background-later');
    const agents = new Map();                  // id → AgentCard
    let totalPages = 0, donePages = 0, errorPages = 0;
    let currentPhase = 'structure';            // 'structure' | 'pages' | 'done'
    let activeRunId = resumeRunId;
    let terminalReceived = false;
    let reconnectAttempts = 0;
    let streamAbort = null;
    const startedAt = Date.now();
    let structureStartedAt = null;
    let structureFinishedAt = null;
    let pagesStartedAt = null;
    let pagesFinishedAt = null;
    let activePageAgentId = null;
    let activePageAgentPinned = false;
    const pageEventBuffers = new Map();
    const pageRenderedIndexes = new Map();
    const completedPageIds = new Set();
    const failedPageIds = new Set();

    // ── Timeline milestone helpers ───────────────────────────
    // Flip a milestone between queued/running/done. Running and done
    // auto-expand the body; queued stays collapsed.
    function setMilestoneState(id, state, meta) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('queued', 'running', 'done', 'open');
      el.classList.add(state);
      if (state === 'running' || state === 'done') el.classList.add('open');
      if (meta) {
        const m = el.querySelector('.tl-meta');
        if (m) m.textContent = meta;
      }
    }

    // Click-to-toggle on every milestone head. Wired once, right after the
    // template is written to the DOM.
    document.querySelectorAll('.tl-milestone-head').forEach((h) => {
      h.addEventListener('click', () => {
        const ms = h.closest('.tl-milestone');
        ms.classList.toggle('open');
      });
    });

    backgroundLater?.addEventListener('click', () => {
      document.querySelector('.wiki-library-section')?.scrollIntoView({
        block: 'start',
        behavior: prefersReducedMotion() ? 'auto' : 'smooth',
      });
    });
    if (resumeRunId && backgroundCue) {
      backgroundCue.hidden = false;
      backgroundCue.classList.add('is-visible');
      progressMeta.textContent = 'resuming saved run…';
    }

    // Elapsed-time ticker — keeps the phase subtitle visibly moving so users
    // don't wonder if the whole thing has frozen.
    const tickHandle = setInterval(() => {
      if (currentPhase === 'done') { clearInterval(tickHandle); return; }
      const elapsed = Date.now() - startedAt;
      // Mutate the progress-meta too: "planning · 0m 42s"
      const phaseLabel = currentPhase === 'structure' ? 'planning' : `${donePages} / ${totalPages} pages`;
      progressMeta.textContent = `${phaseLabel} · ${formatElapsed(elapsed)}`;
    }, 1000);

    function setPhase(phase, subtitle) {
      currentPhase = phase;
      const cell1 = document.querySelector('.phase-cell[data-phase="structure"]');
      const cell2 = document.querySelector('.phase-cell[data-phase="pages"]');
      cell1.classList.remove('active', 'pending');
      cell2.classList.remove('active', 'pending');
      if (phase === 'structure') {
        cell1.classList.add('active'); cell2.classList.add('pending');
      } else if (phase === 'pages') {
        cell1.classList.add('done'); cell2.classList.add('active');
        explainer.classList.add('done');  // hide the structure explainer
      } else if (phase === 'done') {
        cell1.classList.add('done'); cell2.classList.add('done');
      }
      if (subtitle) setPhaseSub(phase, subtitle);

      // Play the active phase's ambient video; pause inactive ones to save
      // CPU. The "pages" video starts as preload="none" so the 17 MB download
      // only happens when we actually flip to the pages phase — runs that
      // bail during structure never touch it.
      const structureVid = document.querySelector('[data-role="pv-structure"]');
      const pagesVid = document.querySelector('[data-role="pv-pages"]');
      if (phase === 'structure') {
        try { structureVid?.play().catch(() => {}); } catch {}
      } else if (phase === 'pages') {
        if (pagesVid && !pagesVid.getAttribute('data-started')) {
          pagesVid.setAttribute('preload', 'auto');
          pagesVid.setAttribute('data-started', '1');
        }
        try { pagesVid?.play().catch(() => {}); } catch {}
        // Let the structure cell finish its fade-out, then pause.
        setTimeout(() => { try { structureVid?.pause(); } catch {} }, 1200);
      } else if (phase === 'done') {
        setTimeout(() => {
          try { structureVid?.pause(); } catch {}
          try { pagesVid?.pause(); } catch {}
        }, 1200);
      }
    }

    function setPhaseSub(phase, text) {
      const el = document.getElementById(phase === 'structure' ? 'phase-sub-1' : 'phase-sub-2');
      if (el && text) el.textContent = text;
    }

    function syncSettledPageCount() {
      donePages = completedPageIds.size + failedPageIds.size;
      errorPages = failedPageIds.size;
    }

    function clearTransportNotice() {
      const box = document.getElementById('run-error');
      if (!box || box.dataset.kind !== 'transport') return;
      box.style.display = 'none';
      box.dataset.kind = '';
      box.innerHTML = '';
    }

    function showTransportNotice(message) {
      const box = document.getElementById('run-error');
      if (!box) return;
      box.style.display = '';
      box.dataset.kind = 'transport';
      box.innerHTML = `
        <div class="run-recovery-banner">
          <span class="run-recovery-dot" aria-hidden="true"></span>
          <span>${escapeHtml(message)}</span>
        </div>
      `;
    }

    function attachToRunStream(delayMs = 0) {
      if (!activeRunId || terminalReceived) return false;
      reconnectAttempts++;
      const delay = Math.max(0, delayMs);
      showTransportNotice(reconnectAttempts === 1
        ? 'Connection interrupted. Generation is still tracked by the worker; reconnecting to the saved run.'
        : `Still reconnecting to the saved run. Attempt ${reconnectAttempts}.`);
      progressMeta.textContent = `reconnecting · ${formatElapsed(Date.now() - startedAt)}`;
      window.setTimeout(() => {
        if (terminalReceived || !activeRunId) return;
        streamAbort = sseGetStream(`/api/run/stream?id=${encodeURIComponent(activeRunId)}`, streamHandlers);
      }, delay);
      return true;
    }

    function setActivePageAgent(id, opts = {}) {
      const card = agents.get(id);
      if (!card || card.kind !== 'page') return;
      for (const [otherId, other] of agents) {
        if (other.kind === 'page' && otherId !== id && other.open) {
          other.setOpen(false, { silent: true });
        }
      }
      card.setOpen(true, { silent: true, inspect: true });
      activePageAgentId = id;
      activePageAgentPinned = opts.user === true;
      hydratePageAgent(card);
    }

    function handlePageAgentToggle(card, open) {
      if (open) {
        setActivePageAgent(card.id, { user: true });
      } else if (activePageAgentId === card.id) {
        activePageAgentId = null;
        activePageAgentPinned = false;
      }
    }

    function rememberPageAgentEvent(pageId, event) {
      let events = pageEventBuffers.get(pageId);
      if (!events) {
        events = [];
        pageEventBuffers.set(pageId, events);
      }
      events.push(event);
      return events.length;
    }

    function shouldReplayPageEvent(event) {
      return event?.type !== 'stream-delta'
        && event?.type !== 'stream-reasoning-delta'
        && event?.type !== 'stream-done';
    }

    function hydratePageAgent(card, endExclusive = null) {
      const events = pageEventBuffers.get(card.id) || [];
      const rendered = pageRenderedIndexes.get(card.id) || 0;
      const end = Math.min(endExclusive ?? events.length, events.length);
      if (rendered >= end) return;
      const streamReplay = { text: '', thinking: '', count: 0 };
      for (let i = rendered; i < end; i++) {
        const event = events[i];
        if (event?.type === 'text_delta') {
          streamReplay.text += event.text || '';
          streamReplay.count += 1;
          continue;
        }
        if (event?.type === 'thinking_delta') {
          streamReplay.thinking += event.text || '';
          streamReplay.count += 1;
          continue;
        }
        if (event?.type === 'thinking_start') {
          streamReplay.count += 1;
          continue;
        }
        routeAgentEvent(card, event, { replay: true });
      }
      if (streamReplay.count && typeof card.addReplayStreamSummary === 'function') {
        card.addReplayStreamSummary({
          text: streamReplay.text,
          thinking: streamReplay.thinking,
          eventCount: streamReplay.count,
        });
      }
      pageRenderedIndexes.set(card.id, end);
    }

    function routePageAgentEvent(card, event) {
      const replayable = shouldReplayPageEvent(event);
      const bufferedCount = replayable
        ? rememberPageAgentEvent(card.id, event)
        : (pageEventBuffers.get(card.id)?.length || 0);
      if (card.open && card.el?.classList.contains('inspecting')) {
        hydratePageAgent(card, replayable ? bufferedCount - 1 : bufferedCount);
        routeAgentEvent(card, event);
        if (replayable) pageRenderedIndexes.set(card.id, bufferedCount);
      } else if (replayable && typeof card.noteDeferredEvent === 'function') {
        card.noteDeferredEvent(event);
      }
    }

    function getOrCreate(id, kind, title) {
      let a = agents.get(id);
      if (!a) {
        const cardOpts = kind === 'page'
          ? {
              autoOpenOnActivity: false,
              autoOpenOnError: false,
              presentation: 'rlm',
              transcriptScrollMode: 'local',
              requiresExplicitInspect: true,
              onToggle: handlePageAgentToggle,
              onBeforeCopy: hydratePageAgent,
            }
          : kind === 'structure'
            ? {
                autoOpenOnActivity: false,
                presentation: 'rlm',
                open: true,
                transcriptScrollMode: 'local',
              }
            : {};
        cardOpts.channelId = kind === 'structure' ? structureChannelId : kind === 'page' ? pageChannelId : selectedChannelId;
        a = new AgentCard(id, kind, title, cardOpts);
        agents.set(id, a);
        container.appendChild(a.el);
        // Structure agent lives inside milestone ①, not the pages grid.
        if (kind === 'structure') {
          const m1body = document.getElementById('tl-m1-body');
          if (m1body) m1body.appendChild(a.el);
        }
      }
      return a;
    }

    function renderSkeletons(pages) {
      skeletonBox.innerHTML = pages
        .map((p) => `
          <div class="queued-page-skeleton" data-page="${escapeHtml(p.id)}">
            <span class="qp-title">${escapeHtml(p.title)}</span>
          </div>
        `)
        .join('');
    }

    function clearSkeleton(pageId) {
      const row = skeletonBox.querySelector(`[data-page="${CSS.escape(pageId)}"]`);
      if (row) row.remove();
    }

    // Flip milestone ② to done once every page has landed (success or error).
    // Triggers the ③ Save-and-render milestone to visibly light up in the
    // brief gap before the 'done' SSE event arrives.
    function maybeFinishPages() {
      if (totalPages > 0 && donePages >= totalPages && !pagesFinishedAt) {
        pagesFinishedAt = Date.now();
        const elapsed = formatElapsed(pagesFinishedAt - (pagesStartedAt || startedAt));
        setMilestoneState('tl-m2', 'done',
          `done · ${elapsed} · ${donePages} page${donePages === 1 ? '' : 's'}`
          + (errorPages ? ` · ${errorPages} err` : ''));
        // Collapse M2 now that it's complete — user can click to reopen.
        document.getElementById('tl-m2')?.classList.remove('open');
      }
    }

    const streamHandlers = {
      onEvent(ev, data) {
        clearTransportNotice();
        if (ev === 'start') {
          if (data.runId) activeRunId = data.runId;
          if (data.structureChannel) structureChannelId = channelIdOrDefault(data.structureChannel);
          if (data.pageChannel || data.channel) pageChannelId = channelIdOrDefault(data.pageChannel || data.channel);
          if (data.worker && backgroundCue) {
            backgroundCue.hidden = false;
            backgroundCue.classList.add('is-visible');
          }
          const startRepoLabel = wikiRepoListLabel(data.repos, data.owner || '', data.repo || '');
          const planner = getOrCreate('__structure__', 'structure', `Planner · ${startRepoLabel}`);
          planner.setChannel(structureChannelId);
          planner.setStatus('running');
          planner.setOpen(true, { silent: true });
          addCardProcessStatusNow(planner, 'Worker accepted wiki generation');
          setPhase('structure', 'Cloning repo…');
          structureStartedAt = Date.now();
          setMilestoneState('tl-m1', 'running', 'planning…');
        } else if (ev === 'phase') {
          if (data.phase === 'structure') {
            const structAgent = getOrCreate('__structure__', 'structure', 'Planner');
            addCardProcessStatusNow(structAgent, data.message || 'Planning wiki structure');
          }
          if (data.phase === 'pages') {
            const structAgent = agents.get('__structure__');
            if (structAgent) addCardProcessStatusNow(structAgent, data.message || 'Structure planned');
            if (structAgent && structAgent.status !== 'done') structAgent.setStatus('done');
            setPhase('pages', `Writing ${totalPages} pages in parallel`);
          }
        } else if (ev === 'structure-agent') {
          const a = getOrCreate('__structure__', 'structure', 'Planner');
          a.setChannel(structureChannelId);
          if (a.status === 'pending') a.setStatus('running');
          if (!a.open) a.setOpen(true, { silent: true });
          routeAgentEvent(a, data.event);
          const sub = friendlyStatusFor(data.event);
          if (sub) setPhaseSub('structure', sub);
        } else if (ev === 'structure-done') {
          const a = getOrCreate('__structure__', 'structure', `Planner · "${data.structure.title}"`);
          a.el.querySelector('[data-role="title"]').textContent = `Plan · "${data.structure.title}" (${data.structure.pages.length} pages, ${data.structure.sections?.length || 0} sections)`;
          addCardProcessStatusNow(a, `Planned ${data.structure.pages.length} pages`);
          a.setStatus('done');
          a.setOpen(false, { silent: true });
          totalPages = data.structure.pages.length;
          renderSkeletons(data.structure.pages);
          setPhaseSub('structure', `✓ Planned ${data.structure.pages.length} pages in ${data.structure.sections?.length || 0} sections`);
          setPhaseSub('pages', `Writing up to 5 pages at a time…`);

          // Milestone ① → done, and auto-collapse to a single line. Then
          // spin up milestone ② with the page count.
          structureFinishedAt = Date.now();
          const structElapsed = formatElapsed(structureFinishedAt - (structureStartedAt || startedAt));
          const structSteps = a.steps.length;
          setMilestoneState('tl-m1', 'done',
            `done · ${structElapsed} · ${structSteps} step${structSteps === 1 ? '' : 's'}`);
          // Collapse M1 after it's done — it's click-to-expand from here.
          document.getElementById('tl-m1')?.classList.remove('open');

          // Update M2 title to reflect the actual count and start it.
          const m2title = document.querySelector('#tl-m2 [data-role="m2-title"]');
          if (m2title) m2title.textContent = `Write ${totalPages} pages in parallel`;
          pagesStartedAt = Date.now();
          setMilestoneState('tl-m2', 'running', `0 / ${totalPages} pages`);
        } else if (ev === 'page-start') {
          clearSkeleton(data.pageId);
          const a = getOrCreate(data.pageId, 'page', data.title);
          a.setChannel(pageChannelId);
          a.el.querySelector('[data-role="title"]').textContent = data.title;
          a.setStatus('running');
          addCardProcessStatusNow(a, 'Worker is writing this page');
          setPhaseSub('pages', `${donePages} / ${totalPages} pages · writing "${data.title}"`);
        } else if (ev === 'page-agent') {
          const a = getOrCreate(data.pageId, 'page', data.pageId);
          a.setChannel(pageChannelId);
          if (a.status === 'pending') a.setStatus('running');
          routePageAgentEvent(a, data.event);
        } else if (ev === 'page-done') {
          const a = getOrCreate(data.pageId, 'page', data.pageId);
          const chars = data.contentLength ?? data.content?.length;
          addCardProcessStatusNow(a, chars ? `Page written · ${chars.toLocaleString()} chars` : 'Page written');
          a.markDone({ chars, tokens: data.tokenUsage?.totalTokens });
          if (activePageAgentId === data.pageId && !activePageAgentPinned) activePageAgentId = null;
          if (data.pageId && !completedPageIds.has(data.pageId) && !failedPageIds.has(data.pageId)) {
            completedPageIds.add(data.pageId);
            syncSettledPageCount();
          }
          setPhaseSub('pages', `${donePages} / ${totalPages} pages written` + (errorPages ? ` · ${errorPages} errors` : ''));
          setMilestoneState('tl-m2', 'running',
            `${donePages} / ${totalPages} pages` + (errorPages ? ` · ${errorPages} err` : ''));
          maybeFinishPages();
        } else if (ev === 'page-error') {
          const a = getOrCreate(data.pageId, 'page', data.pageId);
          a.markError(data.error || data.message || 'page failed', data);
          if (activePageAgentId === data.pageId && !activePageAgentPinned) activePageAgentId = null;
          if (data.pageId && !failedPageIds.has(data.pageId) && !completedPageIds.has(data.pageId)) {
            failedPageIds.add(data.pageId);
            syncSettledPageCount();
          }
          setPhaseSub('pages', `${donePages} / ${totalPages} pages written · ${errorPages} errors`);
          setMilestoneState('tl-m2', 'running',
            `${donePages} / ${totalPages} pages · ${errorPages} err`);
          maybeFinishPages();
        } else if (ev === 'done') {
          terminalReceived = true;
          setPhase('done');
          clearInterval(tickHandle);
          progressMeta.textContent = `✓ complete · ${formatElapsed(Date.now() - startedAt)}`;
          document.querySelector('.dot-pulse')?.remove();

          // Ensure M2 reads as done in case maybeFinishPages() hadn't seen
          // the final page-done yet by the time 'done' arrived.
          if (!pagesFinishedAt) {
            pagesFinishedAt = Date.now();
            const pagesElapsed = formatElapsed(pagesFinishedAt - (pagesStartedAt || startedAt));
            setMilestoneState('tl-m2', 'done',
              `done · ${pagesElapsed} · ${donePages} page${donePages === 1 ? '' : 's'}`);
            document.getElementById('tl-m2')?.classList.remove('open');
          }

          const r = data.record || data.wiki;
          const completion = data.completion || {};
          if (!r?.owner || !r?.repo) {
            const partialPrefix = completion.partial
              ? `Generation finished with ${completion.generatedPageCount || 0}/${completion.plannedPageCount || totalPages || '?'} pages, but `
              : 'Generation finished, but ';
            showRunError(`${partialPrefix}the saved wiki record was not returned. Refresh the library to open the saved wiki.`, data);
            return;
          }
          if (completion.partial) {
            setPhaseSub('done', `${completion.generatedPageCount || 0} / ${completion.plannedPageCount || totalPages || '?'} pages saved · missing pages can be regenerated`);
            progressMeta.textContent = `partial complete · ${formatElapsed(Date.now() - startedAt)}`;
          }
          setTimeout(() => {
            history.pushState(null, '', wikiRoute(r.owner, r.repo));
            render();
          }, 900);
        } else if (ev === 'error') {
          terminalReceived = true;
          showRunError(data.message, data);
          clearInterval(tickHandle);
        }
      },
      onError(err) {
        if (!terminalReceived && activeRunId && reconnectAttempts < 6) {
          attachToRunStream(Math.min(10_000, 750 * Math.max(1, reconnectAttempts + 1)));
