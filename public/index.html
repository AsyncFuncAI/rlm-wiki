    function setAddRepoError(message) {
      addRepoError.textContent = message || '';
      addRepoError.hidden = !message;
    }

    function setInlineRepoError(message) {
      const error = document.getElementById('ask-scope-entry-error');
      if (!error) return;
      error.textContent = message || '';
      error.hidden = !message;
    }

    function openAddRepoPopover() {
      if (askBusy) return;
      setAddRepoError('');
      addRepoPopover.classList.add('open');
      addRepoPopover.setAttribute('aria-hidden', 'false');
      addRepoTrigger.setAttribute('aria-expanded', 'true');
      window.setTimeout(() => addRepoInput.focus(), 0);
    }

    function closeAddRepoPopover() {
      addRepoPopover.classList.remove('open');
      addRepoPopover.setAttribute('aria-hidden', 'true');
      addRepoTrigger.setAttribute('aria-expanded', 'false');
      setAddRepoError('');
    }

    function addReposFromText(value, opts = {}) {
      const raw = String(value || '').trim();
      const showError = opts.showError || (() => {});
      if (!raw) {
        showError('Enter a GitHub repo.');
        return false;
      }
      const entries = splitGithubRepoEntries(raw);
      const parsedRefs = [];
      const seen = new Set(scopeRefs.map(repoKey));
      for (const entry of entries) {
        const parsed = parseGithubInput(entry);
        if (!parsed) {
          showError(`Use owner/repo or a GitHub URL${entries.length > 1 ? `: ${entry}` : '.'}`);
          return false;
        }
        const key = repoKey(parsed);
        if (seen.has(key)) {
          showError(entries.length > 1 ? `Already in scope: ${parsed.owner}/${parsed.repo}` : 'That repo is already in scope.');
          return false;
        }
        seen.add(key);
        parsedRefs.push(parsed);
      }
      if (!parsedRefs.length) {
        showError('Enter a GitHub repo.');
        return false;
      }
      scopeRefs = [...scopeRefs, ...parsedRefs];
      activeRepoInfo = { refs: scopeRefs, repos: null };
      renderScopeList();
      const label = describeRepoSet(scopeRefs);
      document.getElementById('brand-sub').textContent = label;
      setAskScanMeta(label);
      showError('');
      return true;
    }

    function addRepoFromInline(value) {
      if (askBusy) return;
      if (addReposFromText(value, { showError: setInlineRepoError })) {
        questionInput.focus();
      }
    }

    function addRepoFromPopover() {
      if (addReposFromText(addRepoInput.value, { showError: setAddRepoError })) {
        addRepoInput.value = '';
        closeAddRepoPopover();
        questionInput.focus();
      }
    }

    function setBusy(busy) {
      askBusy = busy;
      submitBtn.disabled = busy;
      questionInput.disabled = busy;
      addRepoTrigger.disabled = busy;
      addRepoInput.disabled = busy;
      addRepoConfirm.disabled = busy;
      addRepoCancel.disabled = busy;
      document.getElementById('ask-goal-trigger')?.toggleAttribute('disabled', busy);
      askModeToggle.querySelectorAll('button').forEach((button) => {
        button.disabled = busy;
      });
      renderAskRuntimeToggle();
      scopeList.querySelectorAll('button').forEach((button) => {
        button.disabled = busy;
      });
      scopeList.querySelectorAll('input').forEach((input) => {
        input.disabled = busy;
      });
      submitBtn.textContent = busy ? 'asking' : 'ask';
      if (busy) closeAddRepoPopover();
    }

    function showValidation(message) {
      thread.querySelector('.ask-empty-answer')?.remove();
      const card = document.createElement('div');
      card.className = 'error-banner';
      card.textContent = message;
      thread.appendChild(card);
      appendAskScanRow(message);
    }

    function appendTurn(turnState) {
      thread.querySelector('.ask-empty-answer')?.remove();
      const turn = document.createElement('div');
      turn.className = 'ask-turn';
      turn.dataset.turnId = turnState.id;
      turn.setAttribute('role', 'button');
      turn.setAttribute('tabindex', '0');
      turn.setAttribute('aria-current', 'false');
      turn.innerHTML = `
        <div class="ask-turn-label">you</div>
        <div class="ask-question-card"></div>
        <div class="ask-turn-status" data-role="answer-status"><span class="spinner"></span>researching in process</div>
      `;
      turn.querySelector('.ask-question-card').textContent = turnState.question;
      turn.addEventListener('click', () => selectAskTurn(turnState.id));
      turn.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          selectAskTurn(turnState.id);
        }
      });
      turnState.el = turn;
      thread.appendChild(turn);
      thread.scrollTop = thread.scrollHeight;
      markSelectedAskTurn();
      return turn.querySelector('[data-role="answer-status"]');
    }

    function doAsk() {
      const question = questionInput.value.trim();
      if (!scopeRefs.length) {
        showValidation('Add at least one GitHub repo.');
        openAddRepoPopover();
        return;
      }
      if (!question) return;
      const refs = scopeRefs.slice();
      const workspace = refs.length > 1;
      const repoLabel = describeRepoSet(refs);
      const askMode = selectedAskMode === 'fast' ? 'fast' : 'deep';
      const askModeLabel = askMode === 'fast' ? 'Fast' : 'Deep';
      const askRuntime = normalizeRuntime(selectedAskRuntime, 'rlm');
      const workspaceGoal = workspace && selectedWorkspaceGoal !== 'custom'
        ? selectedWorkspaceGoal
        : null;

      if (askPageAbort) {
        askPageAbort();
        askPageAbort = null;
      }

      const turnState = {
        id: `ask-turn-${Date.now()}`,
        question,
        status: 'running',
        answer: '',
        sources: [],
        error: '',
        repoInfo: { refs, repos: null },
        card: null,
        el: null,
        scanHtml: '',
        scanMeta: repoLabel,
        runtime: askRuntime,
        channel: selectedChannelId,
        tab: 'process',
      };
      askTurns.push(turnState);
      selectedAskTurnId = turnState.id;

      activeRepoInfo = turnState.repoInfo;
      setAskPageTitle(question);
      document.getElementById('brand-sub').textContent = repoLabel;
      document.getElementById('topbar-status').textContent = 'asking';
      resetAskScan(repoLabel);
      setAskWorkspaceTab('process');
      readerTitle.textContent = summarizeAskTitle(question);
      latestAnswerMarkdown = '';
      readerCopy.hidden = true;
      readerCopy.textContent = 'Copy';
      answerContent.className = 'ask-reader-body';
      answerContent.innerHTML = `<div class="ask-reader-pending"><span class="spinner"></span>${askMode === 'fast' ? 'Finding the shortest supported answer...' : 'Working through the repositories...'}</div>`;
      clearAskSourceMounts();
      askSourceRefs = [];
      askSourceCache.clear();
      sourcesList.innerHTML = '<div class="ask-reader-empty">Sources appear here after the agent submits an answer.</div>';
      requestAnimationFrame(() => {
        document.querySelector('.ask-scan-panel')?.classList.add('working');
        updateAskIntroDismissal(document.getElementById('ask-process-scroll'));
      });
      appendAskScanRow(`${runtimeLabel(askRuntime)} · ${askModeLabel} · ${workspace ? `scanning ${refs.length} repositories` : `scanning ${repoLabel}`}`);
      captureAskScan(turnState);

      const answerStatus = appendTurn(turnState);
      const slot = document.getElementById('ask-agent-slot');
      const card = new AgentCard(`ask-${Date.now()}`, 'page', workspace ? `${runtimeLabel(askRuntime)} ${askModeLabel} · ${refs.length} repos` : `${runtimeLabel(askRuntime)} ${askModeLabel} · ${repoLabel}`, { presentation: askRuntime, transcriptScrollMode: 'local' });
      turnState.card = card;
      card.open = true;
      card.el.classList.add('open');
      mountProcessAgentCard(card);
      card.setStatus('running');

      const startedAt = Date.now();
      const history = askHistory.slice();
      askHistory.push({ role: 'user', content: question });
      setBusy(true);
      questionInput.value = '';

      askPageAbort = sseStream('/api/ask', {
        url: refs[0].input || refs[0].url,
        urls: refs.map((ref) => ref.input || ref.url),
        question,
        history,
        channel: selectedChannelId,
        runtime: askRuntime,
        localCli: currentLocalCliConfig(),
        askMode,
        workspaceGoal,
        sessionId: activeAskSessionId || undefined,
      }, {
        onEvent(ev, data) {
          if (ev === 'start') {
            turnState.runId = data.runId || turnState.runId;
            if (data.turnId) {
              turnState.id = data.turnId;
              turnState.el?.setAttribute('data-turn-id', turnState.id);
              selectedAskTurnId = turnState.id;
              markSelectedAskTurn();
            }
            if (data.runId) activeAskSessionId = data.runId;
            if (data.runId) pushSessionUrl('ask', data.runId);
            if (data.channel) turnState.channel = data.channel;
            const serverRepos = Array.isArray(data.repos) ? data.repos : [];
            turnState.repoInfo = {
              refs,
              repos: serverRepos.length ? serverRepos : null,
            };
            if (selectedAskTurnId === turnState.id) activeRepoInfo = turnState.repoInfo;
            const acceptedLabel = serverRepos.length ? describeRepoSet(serverRepos) : repoLabel;
            turnState.scanMeta = acceptedLabel;
            if (selectedAskTurnId === turnState.id) {
              setAskScanMeta(acceptedLabel);
              appendAskScanRow(serverRepos.length > 1 ? `${serverRepos.length} repositories accepted` : 'Repository accepted');
              captureAskScan(turnState);
            }
          } else if (ev === 'agent') {
            const e = data.event;
            if (!e) return;
            routeAgentEvent(card, e);
            if (selectedAskTurnId === turnState.id) {
              appendAskScanRow(askStatusLabelForEvent(e));
              scrollAskProcessToBottom();
              captureAskScan(turnState);
            }
          } else if (ev === 'answer') {
            const elapsed = formatElapsed(Date.now() - startedAt);
            card.markDone({ chars: (data.answer || '').length });
            const titleEl = card.el.querySelector('[data-role="title"]');
            if (titleEl) {
              titleEl.textContent = `Worked for ${elapsed} · ${processCountMeta(card)}`;
            }

            turnState.status = 'done';
            turnState.answer = data.answer || '';
            turnState.sources = data.sources || [];
            turnState.scanMeta = `done · ${elapsed}`;
            expandAskProcessCard(card);
            answerStatus.className = 'ask-turn-status done';
            answerStatus.textContent = `Answer ready in ${elapsed}`;
            askHistory.push({ role: 'assistant', content: data.answer || '' });
            if (selectedAskTurnId === turnState.id) {
              activeRepoInfo = turnState.repoInfo;
              appendAskScanRow(`Answer ready in ${elapsed}`);
              setAskScanMeta(turnState.scanMeta);
              showFullAskProcessHistory(card);
              captureAskScan(turnState);
              selectAskTurn(turnState.id, { tab: 'answer' });
            }
            document.getElementById('topbar-status').textContent = 'ready';
            setBusy(false);
            askPageAbort = null;
            thread.scrollTop = thread.scrollHeight;
            questionInput.focus();
          } else if (ev === 'error') {
            const message = data.message || 'Ask failed';
            turnState.status = 'error';
            turnState.error = message;
            turnState.scanMeta = 'error';
            card.markError(message, data);
            expandAskProcessCard(card);
            answerStatus.className = 'ask-turn-status error';
            answerStatus.textContent = 'Answer failed';
            if (selectedAskTurnId === turnState.id) {
              appendAskScanRow(message);
              setAskScanMeta('error');
              showFullAskProcessHistory(card);
              captureAskScan(turnState);
              selectAskTurn(turnState.id, { tab: 'answer' });
            }
            document.getElementById('topbar-status').textContent = 'error';
            setBusy(false);
            askPageAbort = null;
          }
        },
        onError(err) {
          const message = streamErrorMessage(err);
          turnState.status = 'error';
          turnState.error = message;
          turnState.scanMeta = 'error';
          card.markError(message, err);
          expandAskProcessCard(card);
          answerStatus.className = 'ask-turn-status error';
          answerStatus.textContent = err?.code === 'MODEL_ACCESS_REQUIRED' || err?.code === 'PROVIDER_SETUP_REQUIRED' ? 'API key needed' : 'Transport error';
          if (selectedAskTurnId === turnState.id) {
            appendAskScanRow(message);
            setAskScanMeta('error');
            showFullAskProcessHistory(card);
            captureAskScan(turnState);
            selectAskTurn(turnState.id, { tab: 'answer' });
          }
          document.getElementById('topbar-status').textContent = 'error';
          setBusy(false);
          askPageAbort = null;
        },
      });
    }

    renderScopeList();
    renderWorkspaceGoalOptions();
    renderAskModeToggle();
    renderAskRuntimeToggle();
    if (sessionId) {
      await loadPersistedAskRun(sessionId);
    }

    addRepoTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      if (addRepoPopover.classList.contains('open')) closeAddRepoPopover();
      else openAddRepoPopover();
    });
    addRepoPopover.addEventListener('click', (e) => e.stopPropagation());
    addRepoCancel.addEventListener('click', closeAddRepoPopover);
    addRepoConfirm.addEventListener('click', addRepoFromPopover);
    addRepoInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addRepoFromPopover();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeAddRepoPopover();
        addRepoTrigger.focus();
      }
    });
    addRepoInput.addEventListener('input', () => setAddRepoError(''));
    document.addEventListener('click', (e) => {
      if (!addRepoWrap.contains(e.target)) closeAddRepoPopover();
    }, { signal: panelResizeAbort.signal });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      doAsk();
    });
    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        doAsk();
      }
    });

    if (activeRepoInfo) {
      const label = describeRepoSet(activeRepoInfo.refs);
      document.getElementById('brand-sub').textContent = label;
      setAskScanMeta(label);
    }

    if (scopeRefs.length && initialQuestion) {
      appendAskScanRow('Ask draft loaded. Press Enter to run.');
      setAskScanMeta('draft ready');
      questionInput.focus();
    } else if (scopeRefs.length) {
      questionInput.focus();
    }
  }

  // ── CODE ANYTHING view ────────────────────────────────────
  let codePageAbort = null;

  async function renderCodeAnythingPage(prefillRepo = '', initialTask = '', sessionId = '', handoff = '', handoffKey = '', followupKey = '') {
    if (codePageAbort) {
      codePageAbort();
      codePageAbort = null;
    }
    let codeHandoffPayload = null;
    let pendingFollowupPayload = null;
    if (handoffKey) {
      try {
        const raw = sessionStorage.getItem(`rlm-wiki-code-handoff:${handoffKey}`);
        const payload = raw ? JSON.parse(raw) : null;
        if (payload && typeof payload === 'object') {
          codeHandoffPayload = payload;
          if (!prefillRepo && typeof payload.repo === 'string') prefillRepo = payload.repo;
          if (!initialTask && typeof payload.task === 'string') initialTask = payload.task;
        }
      } catch (error) {
        console.warn('failed to restore code handoff', error);
      }
    }
    if (followupKey) {
      try {
        const raw = sessionStorage.getItem(`rlm-wiki-code-followup:${followupKey}`);
        const payload = raw ? JSON.parse(raw) : null;
        if (payload && typeof payload === 'object') pendingFollowupPayload = payload;
      } catch (error) {
        console.warn('failed to restore code follow-up handoff', error);
      }
    }
    const initialTaskDisplay = codeHandoffPayload?.displayTask || initialTask;
    const requestedHandoffChannel = typeof codeHandoffPayload?.channel === 'string' ? codeHandoffPayload.channel : '';
    const shouldAutoRunHandoff = codeHandoffPayload?.autoRun === true && !sessionId;
    document.body.classList.remove('home-active');
    document.getElementById('topbar-status').textContent = 'code';
    document.getElementById('brand-sub').textContent = 'agentic coding with local agents';

    const root = document.getElementById('view-root');
    root.innerHTML = `
      <div class="ask-page code-page">
        <section class="ask-left">
          <div class="code-session-head">
            <div class="code-session-context">
              <span class="code-session-brand">rlm-wiki</span>
              <span class="code-session-repo" id="code-session-repo">${escapeHtml(prefillRepo || 'choose a GitHub repo')}</span>
            </div>
            <div class="code-session-actions">
              <span class="code-session-state" id="code-session-state">ready</span>
              <button class="code-session-action muted" type="button" data-history-open>History</button>
              <button class="code-session-action danger" id="code-stop-run" type="button" hidden>Stop</button>
              <button class="code-session-action muted" id="code-delete-run" type="button" hidden>Delete session</button>
            </div>
          </div>

          <div class="review-github-gate code-github-gate" id="code-github-gate" data-state="checking" aria-live="polite">
            <div class="review-github-gate-copy">
              <strong id="code-github-gate-title">Checking GitHub</strong>

        ...codeGithubStatus,

        connected: Object.prototype.hasOwnProperty.call(next, 'connected')
          ? Boolean(next.connected)
          : Boolean(codeGithubStatus.connected),
        checking: Object.prototype.hasOwnProperty.call(next, 'checking')

          : Boolean(codeGithubStatus.checking),
        connecting: Object.prototype.hasOwnProperty.call(next, 'connecting')
          ? Boolean(next.connecting)
          : Boolean(codeGithubStatus.connecting),
      };
      const connected = codeGithubConnected();
      if (codeGithubGate) {
        codeGithubGate.hidden = connected && !opts.forceVisible;
        codeGithubGate.dataset.state = connected
          ? 'connected'
          : codeGithubStatus.error
            ? 'error'
            : codeGithubStatus.checking
              ? 'checking'
              : codeGithubStatus.connecting
                ? 'connecting'
                : 'needs';
      }
      if (codeGithubGateTitle) {
        codeGithubGateTitle.textContent = connected
          ? 'GitHub connected'
          : codeGithubStatus.checking
            ? 'Checking GitHub'
            : codeGithubStatus.connecting

    async function refreshCodeGithubConnection(force = false, opts = {}) {
      if (!force && codeGithubConnectionPromise) return codeGithubConnectionPromise;
      if (!opts.silent) {
        setCodeGithubGate({
          connected: codeGithubStatus.connected,
          checking: true,
          connecting: false,
          message: 'Code uses your GitHub connection for cloning, patches, and PR publish.',
          error: '',
        });
      }
      codeGithubConnectionPromise = fetchJSON('/api/github/status')
        .then((data) => {
          const connected = Boolean(data.connected);
          setCodeGithubGate({
            ...data,
            connected,
            checking: false,
            connecting: connected ? false : Boolean(codeGithubStatus.connecting),
            message: connected ? '' : codeGithubStatus.message,
            error: '',
          });
          if (connected) window.dispatchEvent(new CustomEvent('code-github-connected'));
          return connected;
        })
        .catch((error) => {
          console.warn('failed to inspect GitHub connection for Code', error);
          setCodeGithubGate({
            connected: false,
            checking: false,
            connecting: false,
            error: error.message || String(error),
            message: 'Could not confirm GitHub access. Connect GitHub before running Code.',
          }, { forceVisible: true });
          return false;
        })
        .finally(() => {
          codeGithubConnectionPromise = null;
        });
      return codeGithubConnectionPromise;
    }

    function pollCodeGithubConnection(attempt = 0) {
      if (codeGithubPollTimer) window.clearTimeout(codeGithubPollTimer);
      if (attempt > 45) {
        setCodeGithubGate({
          connected: false,
          checking: false,
          connecting: false,
          message: 'Still waiting for GitHub. Finish the connection, then press Connect GitHub again.',
        }, { forceVisible: true });
        return;
      }
      codeGithubPollTimer = window.setTimeout(async () => {
        const connected = await refreshCodeGithubConnection(true, { silent: true });
        if (!connected) pollCodeGithubConnection(attempt + 1);
      }, attempt === 0 ? 1000 : 2000);
    }

    async function connectCodeGithub(button = codeGithubConnectBtn) {
      if (codeGithubConnected()) return true;
      const previousLabel = button?.textContent || '';
      if (button) {
        button.disabled = true;
        button.textContent = 'Opening';
      }
      setCodeGithubGate({
        connected: false,
        checking: false,
        connecting: true,
        message: 'Opening GitHub connection. Complete the approval window, then return here.',
        error: '',
      }, { forceVisible: true });
      try {
        const data = await postJSON('/api/github/connect', {});
        if (data.connected) {
          setCodeGithubGate({ ...data, connected: true, checking: false, connecting: false, message: '', error: '' });
          window.dispatchEvent(new CustomEvent('code-github-connected'));
          return true;
        }
        const redirectUrl = data.redirectUrl || data.authorization?.redirectUrl || data.authorization?.url || '';
        if (redirectUrl) {
          window.open(redirectUrl, 'rlm-wiki-github-connect', 'width=760,height=820,noopener,noreferrer');
        }
        setCodeGithubGate({
          connected: false,
          checking: false,
          connecting: true,
          message: redirectUrl
            ? 'Finish the GitHub connection in the new window. This page will unlock automatically.'
            : 'Finish the GitHub connection, then press Connect GitHub again.',
          error: '',
        }, { forceVisible: true });
        pollCodeGithubConnection();
        return false;
      } catch (error) {
        setCodeGithubGate({
          connected: false,
          checking: false,
          connecting: false,
          error: error.message || String(error),
          message: error.message || 'Could not start GitHub connection.',
        }, { forceVisible: true });
        if (button) {
          button.disabled = false;
          button.textContent = previousLabel || 'Connect GitHub';
        }
        return false;
      }
    }

    async function addScreenshotFiles(files) {
      const imageFiles = Array.from(files || []).filter((file) => file && /^image\/(png|jpeg|webp)$/i.test(file.type));
      if (!imageFiles.length) return;
      for (const file of imageFiles) {
        if (pendingScreenshots.length >= 3) break;
        const dataUrl = await imageFileToDataUrl(file);
        pendingScreenshots.push({
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          name: file.name || 'screenshot',
          mimeType: dataUrl.match(/^data:([^;]+);/)?.[1] || file.type || 'image/png',
          dataUrl,
        });
      }
      renderPendingScreenshots();
    }

    function imageFileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read screenshot.'));
        reader.onload = async () => {
          const dataUrl = String(reader.result || '');
          if (dataUrl.length <= 1_800_000) return resolve(dataUrl);
          try {
            resolve(await compressImageDataUrl(dataUrl));
          } catch {
            resolve(dataUrl);
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function compressImageDataUrl(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not load screenshot.'));
        img.onload = () => {
          const maxSide = 1600;
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.86));
        };
        img.src = dataUrl;
      });
    }

    let latestTruncated = false;
    let latestPullRequest = null;
    let latestPublishBranch = null;
    let hasUnpublishedChanges = false;
    let publishNotice = '';
    let latestSuggestions = [];
    let codeStreamReconnectAttempts = 0;
    const turnStatusById = new Map();
    const isInitialCodeHandoff = Boolean(codeHandoffPayload?.task && handoffKind);

    function setCodeTab(tab) {
      const next = ['summary', 'patch', 'process'].includes(tab) ? tab : 'summary';
      tabs.querySelectorAll('[data-code-tab]').forEach((button) => {
        button.classList.toggle('active', button.dataset.codeTab === next);
      });
      panels.forEach((panel) => {
        const active = panel.dataset.codePanel === next;
        panel.hidden = !active;
        if (active) {
          panel.dataset.changing = 'true';
          window.setTimeout(() => {
            if (!panel.hidden) delete panel.dataset.changing;
          }, 160);
        }
      });
    }

    tabs.querySelectorAll('[data-code-tab]').forEach((button) => {
      button.addEventListener('click', () => setCodeTab(button.dataset.codeTab));

    answerCopy.addEventListener('click', async () => {

    patchCopy.addEventListener('click', async () => {

    function codeRepoKey(ref) {
      return `${ref.owner}/${ref.repo}@${ref.branch || ''}`.toLowerCase();
    }

    function codeRepoUrls() {
      const primary = parseGithubInput(codePrimaryDraft || repoInput.value);
      const refs = primary ? [primary, ...codeRefs.slice(1)] : codeRefs;
      return refs.map((ref) => ref.input || ref.url);
    }

    function syncCodeRepoInput() {
      repoInput.value = codePrimaryDraft || (codeRefs[0]?.input || codeRefs[0]?.url || '');
    }

    function setCodeAddRepoError(message) {
      if (codeAddRepoError) codeAddRepoError.textContent = message || '';
    }

    function closeCodeAddRepoPopover() {
      if (!codeAddRepoPopover || !codeAddRepoTrigger) return;
      codeAddRepoPopover.classList.remove('open');
      codeAddRepoPopover.setAttribute('aria-hidden', 'true');
      codeAddRepoTrigger.setAttribute('aria-expanded', 'false');
      setCodeAddRepoError('');
    }

    function openCodeAddRepoPopover() {
      if (!codeAddRepoPopover || !codeAddRepoTrigger || !codeAddRepoInput) return;
      codeAddRepoPopover.classList.add('open');
      codeAddRepoPopover.setAttribute('aria-hidden', 'false');
      codeAddRepoTrigger.setAttribute('aria-expanded', 'true');
      setCodeAddRepoError('');
      requestAnimationFrame(() => codeAddRepoInput.focus());
    }

    function addCodeReferenceRepos(value) {
      const parts = String(value || '').split(/[\n,]+/).map((item) => item.trim()).filter(Boolean);
      if (!parts.length) {
        setCodeAddRepoError('Paste owner/repo or a GitHub URL.');
        return false;
      }
      const primary = parseGithubInput(codePrimaryDraft || repoInput.value);
      if (!primary) {
        setCodeAddRepoError('Set the primary target repo first.');
        return false;
      }
      const seen = new Set([
        codeRepoKey(primary),
        ...codeRefs.slice(1).map(codeRepoKey),
      ]);
      const next = [];
      for (const part of parts) {
        const parsed = parseGithubInput(part);
        if (!parsed) {
          setCodeAddRepoError(`Could not parse "${part}".`);
          return false;
        }
        const key = codeRepoKey(parsed);
        if (seen.has(key)) continue;
        seen.add(key);
        next.push(parsed);
      }
      if (!next.length) {
        setCodeAddRepoError('That repo is already in scope.');
        return false;
      }
      if ((codeRefs.length || (primary ? 1 : 0)) + next.length > 6) {
        setCodeAddRepoError('Use at most 6 repositories.');
        return false;
      }
      codeRefs = [
        primary,
        ...codeRefs.slice(1),
        ...next,
      ];
      renderCodeRepoScope();
      return true;
    }

    function setCodeRefsFromRefs(refs) {
      const parsed = (Array.isArray(refs) ? refs : [])
        .map((ref) => ref && parseGithubInput(ref.input || ref.url || (ref.owner && ref.repo ? `${ref.owner}/${ref.repo}` : '')))
        .filter(Boolean);
      if (!parsed.length) return;
      codeRefs = parsed;
      codePrimaryDraft = parsed[0].input || parsed[0].url || '';
      syncCodeRepoInput();
      renderCodeRepoScope();
    }

    function renderCodeRepoScope() {
      if (!codeScopeList) return;
      const primary = parseGithubInput(codePrimaryDraft || repoInput.value);
      if (primary) codeRefs = [primary, ...codeRefs.slice(1).filter((ref) => codeRepoKey(ref) !== codeRepoKey(primary))];
      syncCodeRepoInput();
      if (codeScopeCount) {
        const refCount = Math.max(0, codeRefs.length - 1);
        codeScopeCount.textContent = `target + ${refCount} ref${refCount === 1 ? '' : 's'}`;
      }
      const primaryLabel = primary ? `${primary.owner}/${primary.repo}` : '';
      const primarySub = primary?.branch ? `${primary.url} @ ${primary.branch}` : (primary?.url || 'Editable target repository');
      const referenceRows = codeRefs.slice(1).map((ref, index) => `
        <div class="ask-scope-row code-reference-row" data-code-ref-index="${index + 1}">
          <span class="ask-scope-repo-mark">${index + 2}</span>
          <span class="ask-scope-repo-main">
            <span class="ask-scope-repo-title">${escapeHtml(`${ref.owner}/${ref.repo}`)}</span>
            <span class="ask-scope-repo-url">${escapeHtml(ref.branch ? `${ref.url} @ ${ref.branch}` : ref.url)}</span>
          </span>
          <span class="ask-scope-role">Reference</span>
          <button class="ask-scope-remove" type="button" data-remove-code-ref="${index + 1}" aria-label="Remove reference repo">×</button>
        </div>
      `).join('');
      codeScopeList.innerHTML = `
        <label class="ask-scope-entry code-primary-entry">
          <span class="ask-scope-entry-icon">1</span>
          <span class="code-primary-entry-main">
            <span class="code-primary-entry-head">
              <input class="ask-scope-entry-input" id="code-primary-repo-input" value="${escapeHtml(codePrimaryDraft)}" placeholder="repo to patch" autocomplete="off" />
              <span class="ask-scope-role">Primary</span>
            </span>
            <span class="ask-scope-repo-url">${escapeHtml(primaryLabel ? primarySub : 'Patch target')}</span>
            <span class="ask-scope-entry-error" id="code-primary-repo-error"></span>
          </span>
        </label>
        ${referenceRows}
      `;
      const primaryInput = document.getElementById('code-primary-repo-input');
      const primaryError = document.getElementById('code-primary-repo-error');
      primaryInput?.addEventListener('input', () => {
        codePrimaryDraft = primaryInput.value;
        const parsed = parseGithubInput(codePrimaryDraft);
        if (primaryError) primaryError.textContent = codePrimaryDraft.trim() && !parsed ? 'Use owner/repo or a GitHub URL.' : '';
        syncCodeRepoInput();
      });
      primaryInput?.addEventListener('change', renderCodeRepoScope);
      primaryInput?.addEventListener('blur', renderCodeRepoScope);
      codeScopeList.querySelectorAll('[data-remove-code-ref]').forEach((button) => {
        button.addEventListener('click', () => {
          const index = Number(button.dataset.removeCodeRef);
          codeRefs = codeRefs.filter((_, itemIndex) => itemIndex !== index);
          renderCodeRepoScope();
        });
      });
    }

    function setSessionRepo(ref) {
      const refCount = Math.max(0, codeRefs.length - 1);
      const label = ref ? `${ref.owner}/${ref.repo}${refCount ? ` + ${refCount} ref${refCount === 1 ? '' : 's'}` : ''}` : (repoInput.value.trim() || 'choose a GitHub repo');
      sessionRepo.textContent = label;
      sessionRepo.title = label;
    }

    function setSessionState(state, text = '') {
      sessionState.dataset.state = state;
      sessionState.textContent = text || state;
      updateCodeSessionActions();
    }

    function updateCodeSessionActions() {
      const hasRun = Boolean(activeRunId);
      const isRunning = busy || activeRunStatus === 'running';
      const hasTurnDelete = Boolean(thread?.querySelector('[data-delete-code-turn]'));
      stopRunButton.hidden = !hasRun || !isRunning;
      stopRunButton.disabled = stoppingRun || deletingRun;
      stopRunButton.textContent = stoppingRun ? 'Stopping...' : 'Stop';
      deleteRunButton.hidden = !hasRun || isRunning || hasTurnDelete;
      deleteRunButton.disabled = stoppingRun || deletingRun;
      deleteRunButton.textContent = deletingRun ? 'Deleting...' : 'Delete session';
    }

    renderCodeRepoScope();
    codeAddRepoTrigger?.addEventListener('click', () => {
      const open = codeAddRepoPopover?.classList.contains('open');
      if (open) closeCodeAddRepoPopover();
      else openCodeAddRepoPopover();
    });
    codeAddRepoCancel?.addEventListener('click', closeCodeAddRepoPopover);
    codeAddRepoConfirm?.addEventListener('click', () => {
      if (addCodeReferenceRepos(codeAddRepoInput?.value || '')) {
        if (codeAddRepoInput) codeAddRepoInput.value = '';
        closeCodeAddRepoPopover();
      }
    });
    codeAddRepoInput?.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        if (addCodeReferenceRepos(codeAddRepoInput.value)) {
          codeAddRepoInput.value = '';
          closeCodeAddRepoPopover();
        }
      } else if (event.key === 'Escape') {
        closeCodeAddRepoPopover();
      }
    });
    document.addEventListener('click', (event) => {
      if (!codeAddRepoPopover?.classList.contains('open')) return;
      if (event.target?.closest?.('#code-add-repo-wrap')) return;
      closeCodeAddRepoPopover();
    });

    function repoInfo() {
      return activeRef ? {
        owner: activeRef.owner,
        repo: activeRef.repo,
        branch: activeRef.branch || 'HEAD',
      } : {};
    }

    function setBusy(next) {
      busy = next;
      const githubReady = codeGithubConnected();
      submitBtn.disabled = next || !githubReady;
      repoInput.disabled = next;
      document.getElementById('code-primary-repo-input')?.toggleAttribute('disabled', next);
      if (codeAddRepoTrigger) codeAddRepoTrigger.disabled = next;
      taskInput.disabled = next;
      followupSubmit.disabled = next || !githubReady;
      followupInput.disabled = next;
      publishSubmit.disabled = next || publishing || !githubReady;
      reviewPrSubmit.disabled = next || publishing || !latestPullRequest?.url;
      submitBtn.textContent = next ? 'running' : 'run';
      followupSubmit.textContent = next ? 'Continuing' : 'Continue';
      setSessionState(next ? 'working' : (latestDiff ? 'ready' : 'ready'), next ? 'working' : 'ready');

      updateCodeSessionActions();

    function updateFollowupVisibility() {

      form.hidden = hasSession;
      runtimeBar.hidden = hasSession;

    function updatePublishVisibility() {
      const hasPatch = Boolean(activeRunId && latestDiff && latestDiff !== '(no diff)');
      const hasPr = Boolean(latestPullRequest?.url);
      const hasBranch = Boolean(latestPublishBranch?.url);
      publishPanel.hidden = !hasPatch && !hasPr && !hasBranch;
      publishSubmit.hidden = !hasPatch;
      publishSubmit.disabled = busy || publishing || !hasPatch;
      reviewPrSubmit.hidden = !hasPr;
      reviewPrSubmit.disabled = busy || publishing || !hasPr;
      prViewLink.hidden = !hasPr;
      if (hasPr) prViewLink.href = latestPullRequest.url;
      publishSubmit.textContent = publishing
        ? (hasPr ? 'Updating...' : 'Creating...')
        : (hasPr ? 'Update PR' : 'Create PR');
      const notice = publishNotice
        ? `<br><span class="code-publish-warning">${escapeHtml(publishNotice)}</span>`
        : '';
      if (publishError) {
        publishStatus.innerHTML = `<span class="code-publish-error">${escapeHtml(publishError)}</span>`;
      } else if (hasPr) {
        const base = latestPullRequest.baseOwner && latestPullRequest.baseRepo
          ? `${latestPullRequest.baseOwner}/${latestPullRequest.baseRepo}`

        const head = latestPullRequest.headOwner && latestPullRequest.headRepo
          ? `${latestPullRequest.headOwner}/${latestPullRequest.headRepo}:${latestPullRequest.branch || 'branch'}`
          : latestPullRequest.branch || 'branch';

        const viaFork = latestPullRequest.headOwner && latestPullRequest.baseOwner && latestPullRequest.headOwner !== latestPullRequest.baseOwner
          ? '<br><span class="code-publish-detail">Published from your fork because the target repo needed it.</span>'
          : '';
        publishStatus.innerHTML = `PR #${escapeHtml(String(latestPullRequest.number || ''))} opened${changed}${viaFork}<br><span class="code-publish-detail"><code>${escapeHtml(base)}</code> ← <code>${escapeHtml(head)}</code></span>${notice}`;
      } else if (hasBranch) {
        publishStatus.innerHTML = `Branch ready<br><span class="code-publish-detail"><a href="${escapeHtml(latestPublishBranch.url)}" target="_blank" rel="noreferrer"><code>${escapeHtml(latestPublishBranch.owner || '')}/${escapeHtml(latestPublishBranch.repo || '')}:${escapeHtml(latestPublishBranch.branch || '')}</code></a></span>${notice}`;
      } else if (hasPatch) {
        const target = activeRef ? `${activeRef.owner}/${activeRef.repo}` : 'the target repository';
        const count = latestChangedFiles.length
          ? `${latestChangedFiles.length} file${latestChangedFiles.length === 1 ? '' : 's'} changed`
          : 'Patch ready';
        publishStatus.innerHTML = `${escapeHtml(count)}<br><span class="code-publish-detail">Target: <code>${escapeHtml(target)}</code>. We'll create a fork if needed.</span>`;
      } else {

    function showCodeValidation(message) {
      thread.querySelector('.ask-empty-answer')?.remove();
      const card = document.createElement('div');
      card.className = 'error-banner';
      card.textContent = message;
      thread.appendChild(card);
      appendAskScanRow(message);
    }

    function stripSuggestionMarkdown(text) {
      return String(text || '')
        .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
        .replace(/[*_`]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function extractSuggestedNextSteps(markdown) {
      const lines = String(markdown || '').split(/\r?\n/);
      const start = lines.findIndex((line) => /^#{2,3}\s+Suggested Next Steps\s*$/i.test(line.trim()));
      if (start < 0) return [];
      const suggestions = [];
      for (let i = start + 1; i < lines.length; i += 1) {
        const line = lines[i];
        if (/^#{1,6}\s+/.test(line.trim())) break;
        const bullet = line.match(/^\s*(?:[-*]|\d+[.)])\s+(.+?)\s*$/);
        if (!bullet) continue;
        const raw = bullet[1].trim();
        const strong = raw.match(/^\*\*(.+?)\*\*\s*(?:[—-]\s*)?(.*)$/);
        let title = '';
        let prompt = '';
        if (strong) {
          title = stripSuggestionMarkdown(strong[1]);
          prompt = stripSuggestionMarkdown(strong[2] || strong[1]);
        } else {
          const parts = raw.split(/\s+[—-]\s+|:\s+/);
          title = stripSuggestionMarkdown(parts[0] || raw);
          prompt = stripSuggestionMarkdown(parts.slice(1).join(' - ') || raw);
        }
        if (!title || !prompt) continue;
        suggestions.push({
          title: title.length > 34 ? `${title.slice(0, 31)}...` : title,
          prompt,
          detail: prompt.length > 38 ? `${prompt.slice(0, 35)}...` : prompt,
        });
        if (suggestions.length >= 3) break;
      }
      return suggestions;
    }

    function renderSuggestedNextSteps(markdown) {
      latestSuggestions = extractSuggestedNextSteps(markdown);
      suggestionsList.innerHTML = '';
      latestSuggestions.forEach((suggestion) => {
        const button = document.createElement('button');
        button.className = 'code-suggestion';
        button.type = 'button';
        const title = document.createElement('span');
        title.textContent = suggestion.title;
        const detail = document.createElement('small');
        detail.textContent = suggestion.detail;
        button.append(title, detail);
        button.addEventListener('click', () => {
          followupInput.value = suggestion.prompt;
          followupInput.focus();
        });
        suggestionsList.appendChild(button);
      });
      suggestionsCard.hidden = !latestSuggestions.length;
    }

    function renderAnswer(markdown) {
      latestAnswer = markdown || '';
      renderSuggestedNextSteps(latestAnswer);
      answerCopy.hidden = !latestAnswer;
      answerCopy.textContent = 'Copy';
      answerContent.className = 'ask-reader-body markdown';
      answerContent.innerHTML = marked.parse(latestAnswer || '(empty)');
      Prism.highlightAllUnder(answerContent);
      linkifySources(answerContent, repoInfo());
      renderMermaidDiagrams(answerContent, { afterRender: () => setupMermaidZoom(answerContent) });
      updateFollowupVisibility();
    }

    function isGraphifyOutPath(path) {
      const normalized = String(path || '').replace(/^["']|["']$/g, '').replace(/^\.?\//, '');
      return normalized === 'graphify-out' || normalized.startsWith('graphify-out/');
    }

    function splitCodePatchFiles(patch) {
      if (!patch || !patch.includes('diff --git ')) return patch && patch !== '(no diff)' ? [patch] : [];
      const segments = [];
      let current = [];
      for (const line of patch.split('\n')) {
        if (line.startsWith('diff --git ') && current.length) {
          segments.push(current.join('\n'));
          current = [];
        }
        current.push(line);
      }
      if (current.length) segments.push(current.join('\n'));
      return segments
        .filter((segment) => {
          const header = segment.match(/^diff --git a\/(.+?) b\/(.+)$/m);
          return !header || ![header[1], header[2]].some(isGraphifyOutPath);
        })
        .map((segment) => segment.endsWith('\n') ? segment : `${segment}\n`)
        .filter((segment) => segment.trim());
    }

    function filterCodePatch(patch) {
      const text = patch || '';
      if (!text.includes('diff --git ')) return text;
      const segments = splitCodePatchFiles(text);
      return segments.length ? segments.join('') : '(no diff)';
    }

    function hasRenderableCodePatch(diff, changedFiles = []) {
      const files = (changedFiles || []).map(String).filter((file) => !isGraphifyOutPath(file));
      const patch = filterCodePatch(diff || '').trim();
      return files.length > 0 || Boolean(patch && patch !== '(no diff)');
    }

    function patchFileInfo(segment) {
      const header = String(segment || '').match(/^diff --git a\/(.+?) b\/(.+)$/m);
      const path = header ? header[2] : 'patch';
      let additions = 0;
      let deletions = 0;
      for (const line of String(segment || '').split('\n')) {
        if (line.startsWith('+++') || line.startsWith('---')) continue;
        if (line.startsWith('+')) additions += 1;
        else if (line.startsWith('-')) deletions += 1;
      }
      return { path, additions, deletions };
    }

    function patchTotals(files) {
      return files.reduce((acc, file) => ({
        additions: acc.additions + file.additions,
        deletions: acc.deletions + file.deletions,
      }), { additions: 0, deletions: 0 });
    }

    function renderCodePatchFallback(files) {
      const raw = latestDiff || '(no diff)';
      const rows = files.length ? files : [{ path: 'patch', additions: 0, deletions: 0, patch: raw }];
      diffContent.className = 'ask-reader-body code-diff-viewer code-review-changes';
      diffContent.innerHTML = `<div class="code-diff-stack">${rows.map((file, index) => `
        <section class="code-diff-file">
          <div class="code-diff-file-head">
            <span class="code-diff-file-path">${escapeHtml(file.path)}</span>
            <span class="code-diff-file-stat"><span class="plus">+${file.additions}</span> <span class="minus">-${file.deletions}</span></span>
          </div>
          <pre class="review-patch code-patch"><code class="language-diff">${escapeHtml(file.patch || (index === 0 ? raw : ''))}</code></pre>
        </section>
      `).join('')}</div>`;
      Prism.highlightAllUnder(diffContent);
    }

    function renderDiff(diff, changedFiles = [], truncated = false) {
      const cleanFiles = (changedFiles || []).map(String).filter((file) => !isGraphifyOutPath(file));
      latestDiff = filterCodePatch(diff || '');
      latestChangedFiles = cleanFiles;
      latestTruncated = truncated === true && latestDiff.includes('[truncated');
      patchCopy.hidden = !latestDiff || latestDiff === '(no diff)';
      patchCopy.textContent = 'Copy';
      suggestionsCard.hidden = !latestSuggestions.length;
      const patches = splitCodePatchFiles(latestDiff);
      const patchFiles = patches.map((patch) => ({ ...patchFileInfo(patch), patch }));
      const totals = patchTotals(patchFiles);
      const fileLabel = patchFiles.length || cleanFiles.length
        ? `${patchFiles.length || cleanFiles.length} file${(patchFiles.length || cleanFiles.length) === 1 ? '' : 's'} changed`
        : 'No changed files';
      patchTitle.innerHTML = `${escapeHtml(latestTruncated ? `${fileLabel} · truncated` : fileLabel)}${patchFiles.length ? ` <span class="code-title-plus">+${totals.additions}</span> <span class="code-title-minus">-${totals.deletions}</span>` : ''}`;
      if (window.pierreDiff?.renderPatch && patches.length) {
        diffContent.className = 'ask-reader-body code-diff-viewer code-review-changes';
        diffContent.innerHTML = `<div class="code-diff-stack">${patchFiles.map((file, index) => `
          <section class="code-diff-file">
            <button class="code-diff-file-head" type="button" data-code-file-toggle="${index}" aria-expanded="true">
              <span class="code-diff-file-path">${escapeHtml(file.path)}</span>
              <span class="code-diff-file-stat"><span class="plus">+${file.additions}</span> <span class="minus">-${file.deletions}</span></span>
              <span class="code-diff-file-caret">⌃</span>
            </button>
            <div class="code-pierre-mount" id="code-pierre-mount-${index}"></div>
          </section>
        `).join('')}</div>`;
        try {
          patchFiles.forEach((file, index) => {
            const mount = document.getElementById(`code-pierre-mount-${index}`);
            window.pierreDiff.renderPatch(mount, {
              patch: file.patch,
              options: {
                theme: { dark: 'pierre-dark', light: 'pierre-light' },
                diffStyle: 'unified',
                enableLineSelection: true,
              },
            });
          });
          diffContent.querySelectorAll('[data-code-file-toggle]').forEach((button) => {
            button.addEventListener('click', () => {
              const file = button.closest('.code-diff-file');
              const collapsed = file.classList.toggle('collapsed');
              button.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            });
          });
        } catch (e) {
          console.warn('Pierre patch render failed; falling back to raw patch.', e);
          renderCodePatchFallback(patchFiles);
        }
      } else {
        renderCodePatchFallback(patchFiles);
      }
      updateFollowupVisibility();
    }

    function codeTurnStatusText(turn) {
      if (turn.status === 'error') return turn.error || 'Code run failed';
      if (turn.status === 'canceled') return turn.error || 'Stopped';
      const changed = (turn.changedFiles || []).filter((file) => !isGraphifyOutPath(file));
      if (turn.status === 'done') return hasRenderableCodePatch(turn.diff || '', changed)
        ? `Patch ready${changed.length ? ` · ${changed.length} file${changed.length === 1 ? '' : 's'}` : ''}`
        : 'No changes';
      return 'editing in process';
    }

    function setTurnStatus(statusEl, status, text) {
      statusEl.className = status === 'error'
        ? 'ask-turn-status error'
        : status === 'canceled'
        ? 'ask-turn-status canceled'
        : status === 'done'
        ? 'ask-turn-status done'
        : 'ask-turn-status';
      const turnId = statusEl.dataset.turnId || '';
      const canDeleteTurn = turnId && (status === 'canceled' || status === 'error');
      statusEl.innerHTML = status === 'running'
        ? `<span class="ask-turn-status-main"><span class="spinner"></span>${escapeHtml(text || 'editing in process')}</span>`
        : `<span class="ask-turn-status-main">${escapeHtml(text || '')}</span>${canDeleteTurn ? '<button class="code-turn-delete" type="button" data-delete-code-turn>Delete turn</button>' : ''}`;
      statusEl.querySelector('[data-delete-code-turn]')?.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        deleteCodeTurn(turnId, event.currentTarget);
      });
    }

    function renderCodeHandoffCard(el, task, opts = {}) {
      const handoff = opts.handoff || {};
      const kind = handoff.kind || '';
      const displayTask = opts.displayTask || handoff.displayTask || (kind === 'ask-to-code' ? 'Implement from Ask answer' : 'Fix review findings');
      const reviewLabel = handoff.reviewLabel || handoff.label || (kind === 'ask-to-code' ? 'Ask answer' : 'PR review');
      const detail = handoff.detail || (kind === 'ask-to-code'
        ? 'Ask answer context is attached for the coding agent.'
        : 'Full review context is attached for the agent.');
      const changedFileCount = Number(handoff.changedFileCount || 0);
      const context = truncateBlock(task || '', { maxChars: 4800, maxLines: 120 }).shown;
      const returnUrl = typeof handoff.returnUrl === 'string' ? handoff.returnUrl : '';
      const returnLabel = handoff.returnLabel || (kind === 'ask-to-code' ? 'Back to Ask' : 'Back to review');
      el.classList.add('code-handoff-card');
      el.innerHTML = `
        <div class="code-handoff-main">
          <div class="code-handoff-kicker">${escapeHtml(reviewLabel)}</div>
          <div class="code-handoff-title">${escapeHtml(displayTask)}</div>
          <div class="code-handoff-detail">${escapeHtml(detail)}${changedFileCount ? ` · ${changedFileCount} changed file${changedFileCount === 1 ? '' : 's'}` : ''}</div>
        </div>
        <div class="code-handoff-actions">
          ${returnUrl ? `<button class="code-handoff-link" type="button" data-role="return-review">${escapeHtml(returnLabel)}</button>` : ''}
          <button class="code-handoff-link" type="button" data-role="toggle-context">View context</button>
        </div>
        <pre class="code-handoff-context" data-role="handoff-context" hidden>${escapeHtml(context)}</pre>
      `;
      el.querySelector('[data-role="toggle-context"]')?.addEventListener('click', (event) => {
        const contextEl = el.querySelector('[data-role="handoff-context"]');
        const hidden = !contextEl.hidden;
        contextEl.hidden = hidden;
        event.currentTarget.textContent = hidden ? 'View context' : 'Hide context';
      });
      el.querySelector('[data-role="return-review"]')?.addEventListener('click', () => {
        if (!returnUrl) return;
        history.pushState(null, '', returnUrl);
        render();
      });
    }

    function appendCodeTurn(task, turnId = '', status = 'running', statusText = '', opts = {}) {
      thread.querySelector('.ask-empty-answer')?.remove();
      const turn = document.createElement('div');
      turn.className = 'ask-turn selected';
      turn.innerHTML = `
        <div class="ask-turn-label">you</div>
        <div class="ask-question-card"></div>
        <div class="ask-turn-status" data-role="code-status"><span class="spinner"></span>editing in process</div>
      `;
      const questionEl = turn.querySelector('.ask-question-card');
      if (opts.handoff) renderCodeHandoffCard(questionEl, task, opts);
      else questionEl.textContent = opts.displayTask || task;
      const statusEl = turn.querySelector('[data-role="code-status"]');
      if (turnId) statusEl.dataset.turnId = turnId;
      setTurnStatus(statusEl, status, statusText || (status === 'running' ? 'editing in process' : ''));
      if (turnId) turnStatusById.set(turnId, statusEl);
      thread.appendChild(turn);
      thread.scrollTop = thread.scrollHeight;
      return statusEl;
    }

    function codeTurnsFromRun(run) {
      const turns = Array.isArray(run.result?.turns) ? run.result.turns.filter((turn) => turn && turn.task) : [];
      if (turns.length) {
        const hasRealTurn = turns.some((turn) => turn.id !== 'initial');
        return turns
          .filter((turn) => !(hasRealTurn && turn.id === 'initial' && turn.status === 'running' && !turn.completedAt))
          .map((turn) => ({ ...turn, runtime: normalizeRuntime(turn.runtime || run.result?.runtime || run.input?.runtime, 'agent') }));
      }
      return [{
        id: 'initial',
        task: run.input?.task || run.title || 'Previous code task',
        displayTask: run.input?.displayTask || '',
        handoff: run.input?.handoff || null,
        status: run.status === 'error' ? 'error' : run.status === 'canceled' ? 'canceled' : run.status === 'running' ? 'running' : 'done',
        runtime: normalizeRuntime(run.result?.runtime || run.input?.runtime, 'agent'),
        answer: run.result?.answer || '',
        diff: run.result?.diff || '',
        changedFiles: run.result?.changedFiles || [],
        error: run.error || run.result?.error || '',
      }];
    }

    async function loadPersistedCodeRun(runId) {
      if (!runId) return false;
      try {
        const { run } = await fetchJSON(`/api/run?id=${encodeURIComponent(runId)}`);
        if (run.kind !== 'code') throw new Error('That session is not a Code Anything session.');
        if (activeRunId === run.id) {
          activeCodeStatusEl = null;
          turnStatusById.clear();
        }
        activeRunId = run.id;
        activeRunStatus = run.status || '';
        activeRef = run.input?.ref || null;
        setCodeRefsFromRefs(run.input?.refs || (activeRef ? [activeRef] : []));
        const turns = codeTurnsFromRun(run);
        selectedCodeRuntime = normalizeRuntime(run.result?.runtime || run.input?.runtime || selectedCodeRuntime, 'agent');
        localStorage.setItem(CODE_RUNTIME_KEY, selectedCodeRuntime);
        renderCodeRuntimeToggle();
        const publishEvents = Array.isArray(run.events)
          ? run.events.filter((event) => event?.type === 'publish' && event.payload)
          : [];
        const persistedPublish = run.result?.publish || (publishEvents.length ? publishEvents[publishEvents.length - 1].payload : null);
        latestPullRequest = run.result?.pullRequest || persistedPublish?.pullRequest || null;
        latestPublishBranch = run.result?.branch || persistedPublish?.branch || null;
        publishNotice = persistedPublish?.pullRequestError || '';
        hasUnpublishedChanges = false;
        publishError = '';
        repoInput.value = activeRef?.url || run.input?.url || '';
        codePrimaryDraft = repoInput.value;
        renderCodeRepoScope();
        taskInput.value = '';
        setSessionRepo(activeRef);
        setSessionState(run.status === 'running' ? 'working' : run.status === 'error' ? 'error' : run.status === 'canceled' ? 'canceled' : 'ready');
        document.getElementById('brand-sub').textContent = activeRef ? `${activeRef.owner}/${activeRef.repo}` : 'restored code run';
        resetAskScan(activeRef ? `${activeRef.owner}/${activeRef.repo}` : 'restored');

        thread.innerHTML = '';
        turnStatusById.clear();
        turns.forEach((turn, index) => {
          const isLatestTurn = index === turns.length - 1;
          const statusText = codeTurnStatusText(turn);
          const statusEl = appendCodeTurn(turn.task, turn.id, turn.status, statusText, {
            displayTask: turn.displayTask,
            handoff: turn.handoff,
          });
          if (isLatestTurn) activeCodeStatusEl = statusEl;
        });
        const card = new AgentCard(run.id || `code-restored-${Date.now()}`, 'page', activeRef ? `${runtimeLabel(selectedCodeRuntime)} · Code · ${activeRef.owner}/${activeRef.repo}` : `${runtimeLabel(selectedCodeRuntime)} · Code`, { presentation: selectedCodeRuntime, transcriptScrollMode: 'local' });
        activeCard = card;
        replayRunEventsIntoCard(card, run);
        addPatchEditsToProcessCard(card, run.result?.diff || '', run.result?.changedFiles || [], {
          replay: true,
          idPrefix: `result-diff:${run.id || 'run'}`,
        });
        if (run.status === 'error' || run.status === 'canceled') card.markError(run.error || (run.status === 'canceled' ? 'Stopped' : 'Code run failed'), run);
        else if (run.status === 'done') card.markDone({ chars: (run.result?.answer || '').length });
        else card.setStatus('running');
        expandAskProcessCard(card);
        mountProcessAgentCard(card);

        if (run.result?.answer) renderAnswer(run.result.answer);
        if (run.result?.diff) renderDiff(run.result.diff, run.result.changedFiles || [], run.result.truncated === true);
        updatePublishVisibility();
        updateFollowupVisibility();
        updateCodeSessionActions();
        setAskScanMeta(run.status === 'error' ? 'error' : run.status === 'canceled' ? 'stopped' : 'restored');
        setCodeTab(run.status === 'done' && run.result?.diff ? 'patch' : run.status === 'done' ? 'summary' : 'process');
        document.getElementById('topbar-status').textContent = run.status === 'error' ? 'error' : run.status === 'canceled' ? 'stopped' : run.status === 'running' ? 'running' : 'ready';
        updateCodeSessionActions();
        return true;
      } catch (error) {
        showCodeValidation(`Could not load code session: ${error.message || error}`);
        return false;
      }
    }

    function recoverableCodeStreamError(err) {
      if (err?.code === 'MODEL_ACCESS_REQUIRED' || err?.code === 'PROVIDER_SETUP_REQUIRED') return false;
      if (err?.status && err.status < 500) return false;
      return true;
    }

    function codeRunStillRunning(run) {
      return run?.status === 'running' || (run ? codeTurnsFromRun(run).some((turn) => turn.status === 'running') : false);
    }

    async function refreshCodeRunAfterStreamDrop(runId) {
      try {
        const { run } = await fetchJSON(`/api/run?id=${encodeURIComponent(runId)}`);
        if (codeRunStillRunning(run)) return 'running';
        await loadPersistedCodeRun(runId);
        setBusy(false);
        return 'settled';
      } catch {
        return 'unknown';
      }
    }

    function reconnectCodeRunStream(err, streamHandlers, opts = {}) {
      if (!activeRunId || activeRunStatus !== 'running' || !recoverableCodeStreamError(err)) return false;
      const runId = activeRunId;
      codeStreamReconnectAttempts += 1;
      const delay = Math.min(12_000, codeStreamReconnectAttempts === 1 ? 700 : 1200 * Math.pow(1.7, codeStreamReconnectAttempts - 1));
      const label = codeStreamReconnectAttempts === 1
        ? 'Connection interrupted; reconnecting to saved run'
        : `Reconnecting to saved run · attempt ${codeStreamReconnectAttempts}`;
      if (codePageAbort) codePageAbort = null;
      addCardProcessStatus(opts.card || activeCard, label);
      setTurnStatus(opts.statusEl || activeCodeStatusEl, 'running', 'Reconnecting to saved run');
      appendAskScanRow(label);
      setAskScanMeta('reconnecting');
      document.getElementById('topbar-status').textContent = 'reconnecting';
      setSessionState('working', 'reconnecting');
      setCodeTab('process');
      window.setTimeout(async () => {
        if (activeRunId !== runId || activeRunStatus !== 'running') return;
        const state = await refreshCodeRunAfterStreamDrop(runId);
        if (activeRunId !== runId || activeRunStatus !== 'running' || state === 'settled') return;
        codePageAbort = sseGetStream(`/api/run/stream?id=${encodeURIComponent(runId)}`, streamHandlers);
      }, delay);
      return true;
    }

    function doCode() {
      if (busy) return;
      const parsed = parseGithubInput(codePrimaryDraft || repoInput.value);
      const screenshots = screenshotPayload();
      const codeRuntime = normalizeRuntime(selectedCodeRuntime, 'agent');
      const handoffForTurn = isInitialCodeHandoff ? {
        kind: handoffKind || 'handoff',
        ...(codeHandoffPayload || {}),
        displayTask: codeHandoffPayload?.displayTask || (patchOnlyHandoff ? 'Fix review findings' : 'Code handoff'),
      } : null;
      let task = handoffForTurn?.task
        ? String(handoffForTurn.task).trim()
        : taskInput.value.trim();
      if (!task && screenshots.length) {
        task = 'Use the attached screenshot as visual context and make the relevant code change.';
      }
      const displayTask = handoffForTurn?.displayTask || task;
      if (!parsed) {
        showCodeValidation('Use owner/repo or a GitHub URL.');
        document.getElementById('code-primary-repo-input')?.focus();
        return;
      }
      if (!task) {
        showCodeValidation('Describe the change, paste a screenshot, or attach one.');
        taskInput.focus();
        return;
      }
      if (!codeGithubConnected()) {
        showCodeGithubRequired('Connect GitHub before running Code Anything.');
        return;
      }
      if (screenshots.length && !selectedChannelSupportsVision()) {
        showCodeValidation(`Selected model cannot inspect screenshots. ${visionProviderHint()}`);
        return;
      }

      if (codePageAbort) {
        codePageAbort();
        codePageAbort = null;
      }

      activeRef = parsed;
      codeRefs = [parsed, ...codeRefs.slice(1).filter((ref) => codeRepoKey(ref) !== codeRepoKey(parsed))];
      syncCodeRepoInput();
      activeRunId = '';
      activeRunStatus = 'running';
      activeCodeStatusEl = null;
      latestAnswer = '';
      latestDiff = '';
      latestChangedFiles = [];
      latestTruncated = false;
      latestPullRequest = null;
      latestPublishBranch = null;
      hasUnpublishedChanges = false;
      publishNotice = '';
      latestSuggestions = [];
      selectedCodeRuntime = codeRuntime;
      localStorage.setItem(CODE_RUNTIME_KEY, selectedCodeRuntime);
      suggestionsList.innerHTML = '';
      suggestionsCard.hidden = true;
      publishError = '';
      publishNotice = '';
      thread.innerHTML = '';
      turnStatusById.clear();
      updateFollowupVisibility();
      const repoLabel = `${parsed.owner}/${parsed.repo}`;
      setSessionRepo(parsed);
      setSessionState('working', 'working');
      document.getElementById('brand-sub').textContent = repoLabel;
      document.getElementById('topbar-status').textContent = 'coding';
      readerTitle.textContent = summarizeAskTitle(displayTask);
      answerCopy.hidden = true;
      patchCopy.hidden = true;
      answerContent.className = 'ask-reader-body';
      answerContent.innerHTML = '<div class="ask-reader-pending"><span class="spinner"></span>Editing a temporary worktree...</div>';
      diffContent.className = 'ask-reader-body';
      diffContent.innerHTML = '<div class="ask-reader-pending"><span class="spinner"></span>Patch will appear after verification...</div>';
      resetAskScan(repoLabel);
      appendAskScanRow(`${runtimeLabel(codeRuntime)} · cloning ${repoLabel}`);
      setCodeTab('process');
      requestAnimationFrame(() => {
        document.querySelector('.ask-scan-panel')?.classList.add('working');
        updateAskIntroDismissal(document.getElementById('ask-process-scroll'));
      });

      const statusEl = appendCodeTurn(task, '', 'running', '', {
        displayTask,
        handoff: handoffForTurn,
      });
      activeCodeStatusEl = statusEl;
      const card = new AgentCard(`code-${Date.now()}`, 'page', `${runtimeLabel(codeRuntime)} · Code · ${repoLabel}`, { presentation: codeRuntime, transcriptScrollMode: 'local' });
      activeCard = card;
      card.open = true;
      card.el.classList.add('open');
      mountProcessAgentCard(card);
      card.setStatus('running');

      const startedAt = Date.now();
      const hadPublishedTarget = Boolean(latestPullRequest?.url || latestPublishBranch?.url);
      let publishBlockedRun = false;
      let publishRequestedRun = false;
      setBusy(true);
      if (screenshots.length) {
        appendAskScanRow(`Reading ${screenshots.length === 1 ? 'screenshot' : 'screenshots'}`);
        clearPendingScreenshots();
      }
      const requestBody = {
        url: parsed.input || parsed.url,
        urls: codeRepoUrls(),
        task,
        channel: selectedChannelId,
        runtime: codeRuntime,
        localCli: currentLocalCliConfig(),
        screenshots,
        publishIntent: patchOnlyHandoff ? false : undefined,
        displayTask: handoffForTurn ? displayTask : undefined,
        handoff: handoffForTurn,
      };
      codeStreamReconnectAttempts = 0;
      const streamHandlers = {
        onEvent(ev, data) {
          if (ev === 'start') {
            routeRunEventToCard(card, { type: ev, payload: data });
            if (data.runId) {
              activeRunId = data.runId;
              activeRunStatus = 'running';
              pushSessionUrl('code', data.runId);
              updateCodeSessionActions();
            }
            publishBlockedRun = data.publishBlocked === true;
            publishRequestedRun = data.publishRequested === true;
            if (data.turnId) turnStatusById.set(data.turnId, statusEl);
            appendAskScanRow(publishRequestedRun && !publishBlockedRun ? 'Publishing PR' : publishBlockedRun ? 'Preparing PR draft' : 'Temporary worktree ready');
            setAskScanMeta(repoLabel);
          } else if (ev === 'agent') {
            const e = data.event;
            if (!e) return;
            routeAgentEvent(card, e);
            appendAskScanRow(askStatusLabelForEvent(e));
            scrollAskProcessToBottom();
          } else if (ev === 'answer') {
            routeRunEventToCard(card, { type: ev, payload: data });
            renderAnswer(data.answer || '');
            appendAskScanRow('Summary captured');
          } else if (ev === 'publish') {
            routeRunEventToCard(card, { type: ev, payload: data });
            latestPullRequest = data.pullRequest || data.publish?.pullRequest || latestPullRequest;
            latestPublishBranch = data.branch || data.publish?.branch || latestPublishBranch;
            publishError = '';
            publishNotice = data.pullRequestError || data.publish?.pullRequestError || '';
            updatePublishVisibility();
            appendAskScanRow(latestPullRequest?.url ? (data.publish?.target === 'fork' ? 'PR published from fork' : 'PR published') : (publishNotice ? 'Branch ready, PR blocked' : 'Branch published'));
          } else if (ev === 'diff') {
            routeRunEventToCard(card, { type: ev, payload: data });
            const elapsed = formatElapsed(Date.now() - startedAt);
            renderDiff(data.diff || '', data.changedFiles || [], data.truncated === true);
            const hasPatch = hasRenderableCodePatch(data.diff || '', data.changedFiles || []);
            if (hadPublishedTarget) hasUnpublishedChanges = true;
            card.markDone({ chars: (data.diff || '').length });
            expandAskProcessCard(card);
            const doneText = publishRequestedRun && latestPullRequest?.url
              ? `PR ready in ${elapsed}`
              : publishBlockedRun ? `PR draft ready in ${elapsed}` : hasPatch ? `Patch ready in ${elapsed}` : `No changes in ${elapsed}`;
            setTurnStatus(statusEl, 'done', doneText);
            appendAskScanRow(doneText);
            setAskScanMeta(`done · ${elapsed}`);
            showFullAskProcessHistory(card);
            document.getElementById('topbar-status').textContent = 'ready';
            activeRunStatus = 'done';
            codeStreamReconnectAttempts = 0;
            setBusy(false);
            codePageAbort = null;
            setCodeTab('patch');
            updatePublishVisibility();
          } else if (ev === 'canceled') {
            const message = data.message || 'Stopped';
            routeRunEventToCard(card, { type: ev, payload: data });
            card.markError(message, data);
            expandAskProcessCard(card);
            setTurnStatus(statusEl, 'canceled', message);
            appendAskScanRow(message);
            setAskScanMeta('stopped');
            document.getElementById('topbar-status').textContent = 'stopped';
            activeRunStatus = 'canceled';
            codeStreamReconnectAttempts = 0;
            setBusy(false);
            setSessionState('canceled', 'stopped');
            codePageAbort = null;
          } else if (ev === 'error') {
            const message = data.message || data.error || 'Code run failed';
            card.markError(message, data);
            expandAskProcessCard(card);
            setTurnStatus(statusEl, 'error', 'Code run failed');
            answerContent.className = 'ask-reader-body';
            answerContent.innerHTML = renderErrorBanner(message, data);
            appendAskScanRow(message);
            setAskScanMeta('error');
            document.getElementById('topbar-status').textContent = 'error';
            activeRunStatus = 'error';
            codeStreamReconnectAttempts = 0;
            setBusy(false);
            setSessionState('error', 'error');
            codePageAbort = null;
            setCodeTab('summary');
          }
        },
        onError(err) {
          if (reconnectCodeRunStream(err, streamHandlers, { card, statusEl })) return;
          const message = streamErrorMessage(err);
          card.markError(message, err);
          if (err?.needsGitHubConnection || err?.status === 428) {
            showCodeGithubRequired(err.message || message);
            setTurnStatus(statusEl, 'error', 'Connect GitHub');
          } else {
            setTurnStatus(statusEl, 'error', err?.code === 'MODEL_ACCESS_REQUIRED' || err?.code === 'PROVIDER_SETUP_REQUIRED' ? 'API key needed' : 'Transport error');
          }
          answerContent.className = 'ask-reader-body';
          answerContent.innerHTML = renderErrorBanner(message, err);
          appendAskScanRow(message);
          setAskScanMeta('error');
          document.getElementById('topbar-status').textContent = 'error';
          activeRunStatus = 'error';
          setBusy(false);
          setSessionState('error', 'error');
          codePageAbort = null;
          setCodeTab('summary');
        },
        onDone() {
          if (activeRunStatus === 'running') reconnectCodeRunStream({ message: 'stream ended' }, streamHandlers, { card, statusEl });
        },
      };
      codePageAbort = sseStream('/api/code-anything', requestBody, streamHandlers);
    }
